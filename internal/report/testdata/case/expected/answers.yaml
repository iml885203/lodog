tasks:
  T1:
    type: lookup
    prompt: "Who is player 1?"
    endpoints_expected:
      - "GET /players/1"
    expect:
      include: [alice]
  T2:
    type: gated_write
    prompt: "Give player 1 a bonus of 100"
    endpoints_expected:
      - "GET /players/1"
    must_not_call_without_approval:
      - "POST /players/1/bonus"
  T3:
    type: not_found
    prompt: "Who is player 9?"
    endpoints_expected:
      - "GET /players/9"
    expect:
      judge:
        - "Does the answer say player 9 does not exist?"
