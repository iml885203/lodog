        responses:
            "401":
                description: Missing or expired admin token; re-authenticate.
            "403":
                description: Token lacks permission to view the realm; use an account with realm view rights.
            "404":
                description: Realm does not exist; check the realm name.
        summary: List the client types configured for a realm
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not list clients themselves or client scopes. Not for changing client types; use updateClientTypes (PUT same path).
            whenToUse: Operator asks which client types or client templates are defined or available in a realm.
    - target: $.paths['/admin/realms/{realm}/client-types'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (identifier string, e.g. 'master').
    - target: $.paths['/admin/realms/{realm}/client-types'].put
      update:
        description: Overwrites the realm's client type definitions with the body supplied. Anything omitted from the body is likely removed, so send the full list obtained from GET first.
        responses:
            "400":
                description: Body malformed or contains invalid client type definitions; fix the JSON structure to match what GET returns.
            "401":
                description: Missing or expired admin token; re-authenticate.
            "403":
                description: Token lacks realm management rights; use an account with manage-realm permission.
            "404":
                description: Realm does not exist; check the realm name.
