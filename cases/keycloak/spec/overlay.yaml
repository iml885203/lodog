        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Does not create a subgroup (use POST /groups/{group-id}/children). Does not rename or edit an existing group (use PUT /groups/{group-id}). Does not add users to a group.
            whenToUse: Operator asks to create a new group at the top level.
    - target: $.paths['/admin/realms/{realm}/groups'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'. Path parameter.
    - target: $.paths['/admin/realms/{realm}/groups/count'].get
      update:
        description: Returns the number of groups, as an object with a count field. With top=true only top-level groups are counted. search narrows the count to groups whose name matches.
        responses:
            "401":
                description: Missing or expired token; get a new admin token.
            "403":
                description: Token lacks permission to view groups; use an account with view-users.
            "404":
                description: Realm not found; check the realm name.
        summary: Count the groups in a realm
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not return the groups themselves (use GET /groups).
            whenToUse: Operator asks how many groups exist or how many match a name, or needs the total for paging.
    - target: $.paths['/admin/realms/{realm}/groups/count'].get.parameters[?(@.name=='search')]
      update:
        description: Text to match against group names; only matching groups are counted.
    - target: $.paths['/admin/realms/{realm}/groups/count'].get.parameters[?(@.name=='top')]
      update:
        description: true = count only top-level groups; false or omitted = count by search regardless of level.
    - target: $.paths['/admin/realms/{realm}/groups/count'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'. Path parameter.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}'].delete
      update:
        description: Permanently deletes the group, which also removes its subgroups and all user memberships in them. Users themselves are not deleted. Returns no body on success.
        responses:
            "401":
                description: Missing or expired token; get a new admin token.
            "403":
                description: Token lacks permission to manage this group (needs manage-users); use an account with it.
            "404":
                description: Group or realm not found; check the id with GET /groups or GET /groups/{group-id}.
        summary: Delete a group
        x-agent:
            needsReview: true
            risk: irreversible
            whenNotToUse: Does not remove a single user from a group, and does not rename or edit a group (use PUT /groups/{group-id}). Do not use to test whether a group exists.
            whenToUse: Operator explicitly asks to delete or remove a group.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}'].delete.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'. Path parameter.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}'].delete.parameters[?(@.name=='group-id')]
      update:
        description: Group id (a UUID), not its name. Get it from GET /groups, its children, or the Location header after creation.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}'].get
      update:
        description: Returns the group's name, path, attributes, realm and client roles, and its subgroups. Use it to read a group's current definition before changing it.
        responses:
            "401":
                description: Missing or expired token; get a new admin token.
            "403":
                description: Token lacks permission to view groups; use an account with view-users.
            "404":
                description: Group or realm not found; look up the id with GET /groups?search=...
        summary: Get one group's details
        x-agent:
            risk: read
            whenNotToUse: Does not list members (use GET /groups/{group-id}/members). Does not search by name (use GET /groups with search).
            whenToUse: Operator asks for the details, attributes or roles of a specific group whose id is known.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'. Path parameter.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}'].get.parameters[?(@.name=='group-id')]
      update:
        description: Group id (UUID) from GET /groups, GET /groups/{group-id}/children or a creation response.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}'].put
      update:
        description: Replaces the group's editable fields with those in the body. Attributes you leave out may be removed, so read the group first and send the full set. It does not move the group to a different parent.
        responses:
            "400":
                description: Body is malformed or name is empty; send valid JSON with a name.
            "401":
                description: Missing or expired token; get a new admin token.
            "403":
                description: Token lacks permission to manage this group; use an account with manage-users.
            "404":
                description: Group or realm not found; check the id.
            "409":
                description: Another group at the same level already has this name; choose a different name.
        summary: Update a group's name, attributes or description
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Does not create a group (use POST /groups or POST /groups/{group-id}/children). Does not add or remove members. Does not change fine-grained permissions (use PUT .../management/permissions).
            whenToUse: Operator asks to rename a group or change its attributes or description.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}'].put.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'. Path parameter.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}'].put.parameters[?(@.name=='group-id')]
      update:
        description: Group id (UUID) of the group to change, from GET /groups.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/children'].get
      update:
        description: Returns a page of the group's immediate child groups only, not deeper levels. Paging is controlled by first and max, and search filters by name.
        responses:
            "401":
                description: Missing or expired token; get a new admin token.
            "403":
                description: Token lacks permission to view groups; use an account with view-users.
            "404":
                description: Parent group or realm not found; check the id.
        summary: List the direct subgroups of a group
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not list members (use GET /groups/{group-id}/members). Does not list top-level groups (use GET /groups).
            whenToUse: Operator wants to see the subgroups under a given group, or find a subgroup by name.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/children'].get.parameters[?(@.name=='briefRepresentation')]
      update:
        description: true = basic fields only; false = full representation with attributes.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/children'].get.parameters[?(@.name=='exact')]
      update:
        description: true = name must match exactly; false or omitted = partial match.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/children'].get.parameters[?(@.name=='first')]
      update:
        description: Zero-based index of the first result, for paging.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/children'].get.parameters[?(@.name=='max')]
      update:
        description: Maximum number of results to return.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/children'].get.parameters[?(@.name=='search')]
      update:
        description: Text to match against child group names; partial match unless exact=true.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/children'].get.parameters[?(@.name=='subGroupsCount')]
      update:
        description: true = include subGroupCount on each child; false = omit it.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/children'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'. Path parameter.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/children'].get.parameters[?(@.name=='group-id')]
      update:
        description: Id (UUID) of the parent group, from GET /groups.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/children'].post
      update:
        description: Creates a new group as a direct child of the given parent group. If the body carries the id of an existing group, that group may be moved under the parent instead of a new one being created. The new group's id is normally in the Location header.
        responses:
            "400":
                description: Body is malformed or name is missing; send valid JSON with a name.
            "401":
                description: Missing or expired token; get a new admin token.
            "403":
                description: Token lacks permission to manage groups; use an account with manage-users.
            "404":
                description: Parent group or realm not found; check the id.
            "409":
                description: A child with this name already exists under the parent; use another name.
        summary: Create a subgroup under a group
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Does not create a top-level group (use POST /groups). Does not rename or edit a group (use PUT /groups/{group-id}).
            whenToUse: Operator asks to create a subgroup or child group under a named group.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/children'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'. Path parameter.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/children'].post.parameters[?(@.name=='group-id')]
      update:
        description: Id (UUID) of the parent group, from GET /groups or its children.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/management/permissions'].get
      update:
        description: Returns whether fine-grained permission management is switched on for the group, with the resource id and the ids of its scope permissions. Reading it changes nothing.
        responses:
            "401":
                description: Missing or expired token; get a new admin token.
            "403":
                description: Token lacks permission to view authorization settings; use an account with manage-authorization or view rights.
            "404":
                description: Group or realm not found, or fine-grained admin permissions are not available in this realm; check the id.
        summary: Check whether fine-grained permissions are enabled for a group
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not list who is in the group (use GET .../members) and does not show the group's roles (use GET /groups/{group-id}).
            whenToUse: Operator asks whether access control for managing a specific group is enabled, or needs the ids of its permission objects.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/management/permissions'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'. Path parameter.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/management/permissions'].get.parameters[?(@.name=='group-id')]
      update:
        description: Group id (UUID) from GET /groups.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/management/permissions'].put
      update:
        description: Enables or disables the permission objects that control who may manage or view this group and its members. It changes access control, so it can widen or lock out administrators. The response returns the resulting permission status.
        responses:
            "400":
                description: 'Body is malformed; send {"enabled": true} or {"enabled": false}.'
            "401":
                description: Missing or expired token; get a new admin token.
            "403":
                description: Token lacks permission to manage authorization; use an account with manage-authorization.
            "404":
                description: Group or realm not found, or the feature is not available; check the id.
        summary: Turn fine-grained management permissions on or off for a group
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Does not edit the group itself (use PUT /groups/{group-id}) and does not add users to it. For only checking the current state use GET on the same path.
            whenToUse: Operator explicitly asks to enable or disable fine-grained permissions for a group.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/management/permissions'].put.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'. Path parameter.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/management/permissions'].put.parameters[?(@.name=='group-id')]
      update:
        description: Group id (UUID) from GET /groups.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/members'].get
      update:
        description: Returns a page of users that are direct members of the group. Members of subgroups are not included. Paging is controlled by first and max.
        responses:
            "401":
                description: Missing or expired token; get a new admin token.
            "403":
                description: Token lacks permission to view users; use an account with view-users.
            "404":
                description: Group or realm not found; check the id.
        summary: List the users who belong to a group
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not add or remove members. Does not list subgroups (use GET .../children). Does not show the group's own details (use GET /groups/{group-id}).
            whenToUse: Operator asks who is in a group, or how many people a group has.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/members'].get.parameters[?(@.name=='briefRepresentation')]
      update:
        description: true = basic user fields only; false = full user representation with attributes.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/members'].get.parameters[?(@.name=='first')]
      update:
        description: Zero-based index of the first user, for paging.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/members'].get.parameters[?(@.name=='max')]
      update:
        description: Maximum number of users to return; use together with first to page through large groups.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/members'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'. Path parameter.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/members'].get.parameters[?(@.name=='group-id')]
      update:
        description: Group id (UUID) from GET /groups or GET .../children.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings'].get
      update:
        description: Returns the group's role mappings, split into realm-level roles and per-client roles. Only roles directly mapped to the group are shown; roles inherited via composites or parent groups are not expanded. Changes nothing.
        responses:
            "401":
                description: Missing or expired bearer token; obtain a new admin token and retry.
            "403":
                description: Token lacks permission to view realm groups/roles; use an account with view-users/query-groups rights.
            "404":
                description: Realm or group not found; check the realm name and group-id.
        summary: Show all realm and client roles directly assigned to a group
        x-agent:
            risk: read
            whenNotToUse: Not for the effective (composite-expanded) realm roles, use GET .../role-mappings/realm/composite. Not for roles still assignable, use GET .../role-mappings/realm/available. Not for groups inside an organization, use the organizations/{org-id} variant.
            whenToUse: What roles does this group have? Which realm and client roles are assigned to group X?
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not the id), e.g. 'master'. Must match an existing realm.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings'].get.parameters[?(@.name=='group-id')]
      update:
        description: Group UUID. Obtain it from the realm's group search/list operation.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/clients/{client-id}'].delete
      update:
        description: Removes the listed roles of one client from the group's direct mappings. Members of the group lose the access those roles gave them, unless they get it another way. Returns 204 with no body. Roles not currently mapped are ignored.
        responses:
            "400":
                description: Malformed body or role entries that do not belong to this client; send a JSON array of roles taken from this client.
            "401":
                description: Missing or expired admin token; get a new token.
            "403":
                description: The token lacks permission to manage this realm's groups/roles (manage-users or similar); use an account with that right.
            "404":
                description: Realm, group or client not found; check realm name and that group-id and client-id are UUIDs, not names.
        summary: Remove client roles from a group's role mappings.
        x-agent:
            risk: write
            whenNotToUse: Removing roles from a single user (use the user role-mappings DELETE). Adding roles (use the POST). Removing realm-level roles (a different endpoint). Removing a group's role in an organization group (use the organizations/{org-id}/groups variant).
            whenToUse: Revoke specific client roles from a group; take a client's permissions away from everyone in the group.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/clients/{client-id}'].delete.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'. This is the name, not an id.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/clients/{client-id}'].delete.parameters[?(@.name=='group-id')]
      update:
        description: Group UUID, from the realm's group list or group search.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/clients/{client-id}'].delete.parameters[?(@.name=='client-id')]
      update:
        description: Internal UUID of the client (the 'id' field), NOT the human-readable clientId string. Find it by searching clients by clientId.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/clients/{client-id}'].get
      update:
        description: Returns an array of role objects of that client assigned directly to the group. Does not include roles inherited from composite roles or parent groups.
        responses:
            "401":
                description: Missing or expired admin token; get a new token.
            "403":
                description: Token lacks permission to view this realm's groups; use an account with view rights.
            "404":
                description: Realm, group or client not found; check the names and UUIDs.
        summary: List the roles of one client that are directly mapped to a group.
        x-agent:
            risk: read
            whenNotToUse: Effective/inherited roles (use the /composite variant). Roles that could still be added (use /available). A user's roles (use the users/{user-id} variant).
            whenToUse: Check which roles of a given client a group has; get the role objects to pass into POST or DELETE.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/clients/{client-id}'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/clients/{client-id}'].get.parameters[?(@.name=='group-id')]
      update:
        description: Group UUID, from the realm's group list or search.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/clients/{client-id}'].get.parameters[?(@.name=='client-id')]
      update:
        description: Internal UUID of the client (the 'id' field), not the clientId string.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/clients/{client-id}'].post
      update:
        description: Maps the listed roles of one client to the group, so every member gains them. Returns 204 with no body. Adding a role that is already mapped is harmless.
        responses:
            "400":
                description: Malformed body or roles that do not belong to this client; send an array of roles from this client.
            "401":
                description: Missing or expired admin token; get a new token.
            "403":
                description: Token lacks permission to manage roles for this realm; use an account with that right.
            "404":
                description: Realm, group, client or a listed role not found; check the UUIDs and role ids.
        summary: Add client roles to a group's role mappings.
        x-agent:
            risk: write
            whenNotToUse: Granting roles to a single user (user role-mappings endpoint). Removing roles (use DELETE). Organization groups (use the organizations/{org-id}/groups variant).
            whenToUse: Grant a group access by giving it specific client roles.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/clients/{client-id}'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/clients/{client-id}'].post.parameters[?(@.name=='group-id')]
      update:
        description: Group UUID, from the realm's group list or search.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/clients/{client-id}'].post.parameters[?(@.name=='client-id')]
      update:
        description: Internal UUID of the client (the 'id' field), not the clientId string.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/clients/{client-id}/available'].get
      update:
        description: Returns the roles of the client that are not yet mapped to the group. Use it to pick valid roles for the POST.
        responses:
            "401":
                description: Missing or expired admin token; get a new token.
            "403":
                description: Token lacks view permission for this realm; use an account with view rights.
            "404":
                description: Realm, group or client not found; check the names and UUIDs.
        summary: List client roles that can still be added to a group.
        x-agent:
            risk: read
            whenNotToUse: Roles already assigned (use the base GET). Effective roles (use /composite).
            whenToUse: Find which roles of a client a group does not have yet; look up the role objects to assign.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/clients/{client-id}/available'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/clients/{client-id}/available'].get.parameters[?(@.name=='group-id')]
      update:
        description: Group UUID, from the realm's group list or search.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/clients/{client-id}/available'].get.parameters[?(@.name=='client-id')]
      update:
        description: Internal UUID of the client (the 'id' field), not the clientId string.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/clients/{client-id}/composite'].get
      update:
        description: Returns all roles of the client the group effectively has, including those reached through composite roles and parent groups. The result is a flattened view, not the direct mappings.
        responses:
            "401":
                description: Missing or expired admin token; get a new token.
            "403":
                description: Token lacks view permission for this realm; use an account with view rights.
            "404":
                description: Realm, group or client not found; check the names and UUIDs.
        summary: List the effective roles of one client for a group.
        x-agent:
            risk: read
            whenNotToUse: Only the directly assigned roles (use the base GET). Roles still available to add (use /available).
            whenToUse: Answer 'what can this group really do in this client' including inherited roles.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/clients/{client-id}/composite'].get.parameters[?(@.name=='briefRepresentation')]
      update:
        description: true = shorter role objects, false = full role objects including attributes. Optional; default is believed to be true.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/clients/{client-id}/composite'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/clients/{client-id}/composite'].get.parameters[?(@.name=='group-id')]
      update:
        description: Group UUID, from the realm's group list or search.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/clients/{client-id}/composite'].get.parameters[?(@.name=='client-id')]
      update:
        description: Internal UUID of the client (the 'id' field), not the clientId string.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/realm'].delete
      update:
        description: Removes the realm roles listed in the body from the group's direct role mappings; members of the group lose those permissions (unless granted another way). Roles themselves are not deleted. Send an array of role representations; id and name identify each role.
        responses:
            "400":
                description: Malformed body; send a JSON array of role objects, not a single object.
            "401":
                description: Missing or expired bearer token; get a new admin token.
            "403":
                description: Token lacks manage-users/manage-realm rights; use a privileged admin account.
            "404":
                description: Realm, group or one of the roles not found; check names and ids, and take roles from the group's current mappings.
        summary: Remove realm roles from a group
        x-agent:
            risk: write
            whenNotToUse: Not for adding roles, use POST on the same path. Not for removing client roles (a different path, not in this set). Not for deleting the role itself or the group. Not for organization groups, use the organizations/{org-id} variant.
            whenToUse: Revoke one or more realm roles from a group; take a realm role away from group X.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/realm'].delete.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/realm'].delete.parameters[?(@.name=='group-id')]
      update:
        description: Group UUID from the group search/list operation.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/realm'].get
      update:
        description: Returns the array of realm-level roles mapped directly to the group. Does not include client roles or roles gained through composite roles. Changes nothing.
        responses:
            "401":
                description: Missing or expired bearer token; get a new admin token.
            "403":
                description: Token lacks view rights on groups/roles.
            "404":
                description: Realm or group not found; check realm name and group-id.
        summary: List realm roles directly assigned to a group
        x-agent:
            risk: read
            whenNotToUse: Not for client roles or the combined view, use GET .../role-mappings. Not for effective roles including composites, use GET .../realm/composite. Not for roles that can still be added, use GET .../realm/available.
            whenToUse: Which realm roles does group X have assigned? Check whether a group already has a given realm role.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/realm'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/realm'].get.parameters[?(@.name=='group-id')]
      update:
        description: Group UUID from the group search/list operation.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/realm'].post
      update:
        description: Adds the realm roles in the body to the group's role mappings, so all group members gain those permissions. Existing mappings are kept; this does not replace them. Send an array of role representations.
        responses:
            "400":
                description: Malformed body; send a JSON array of role objects.
            "401":
                description: Missing or expired bearer token; get a new admin token.
            "403":
                description: Token lacks manage-users/manage-realm rights.
            "404":
                description: Realm, group or role not found; check ids and names against the available-roles list.
            "409":
                description: Role possibly already mapped; check current mappings first.
        summary: Assign realm roles to a group
        x-agent:
            risk: write
            whenNotToUse: Not for removing roles, use DELETE on the same path. Not for client roles. Not for assigning roles to a single user. Not for organization groups, use the organizations/{org-id} variant.
            whenToUse: Grant one or more realm roles to a group; give group X the role Y.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/realm'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/realm'].post.parameters[?(@.name=='group-id')]
      update:
        description: Group UUID from the group search/list operation.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/realm/available'].get
      update:
        description: Returns the realm roles not yet mapped to the group, i.e. candidates for assignment. Changes nothing.
        responses:
            "401":
                description: Missing or expired bearer token; get a new admin token.
            "403":
                description: Token lacks view rights on groups/roles.
            "404":
                description: Realm or group not found; check realm name and group-id.
        summary: List realm roles that can still be assigned to a group
        x-agent:
            risk: read
            whenNotToUse: Not for roles the group already has, use GET .../role-mappings/realm. Not for effective roles, use GET .../realm/composite.
            whenToUse: Which roles can I add to group X? Find the id and name of a role before assigning it.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/realm/available'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/realm/available'].get.parameters[?(@.name=='group-id')]
      update:
        description: Group UUID from the group search/list operation.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/realm/composite'].get
      update:
        description: 'Returns all realm roles the group effectively has: directly mapped roles plus roles reached through composite roles. Use briefRepresentation to shrink the response. Changes nothing.'
        responses:
            "401":
                description: Missing or expired bearer token; get a new admin token.
            "403":
                description: Token lacks view rights on groups/roles.
            "404":
                description: Realm or group not found; check realm name and group-id.
        summary: List the effective realm roles of a group, composites expanded
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Not for only the directly assigned roles, use GET .../role-mappings/realm. Not for assignable roles, use GET .../realm/available.
            whenToUse: What can members of group X actually do? Which realm roles apply to group X after composite expansion?
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/realm/composite'].get.parameters[?(@.name=='briefRepresentation')]
      update:
        description: true = return reduced role data (id, name and basics, without attributes); false = full role representation. Default is not stated in the document; Keycloak usually defaults to true.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/realm/composite'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/groups/{group-id}/role-mappings/realm/composite'].get.parameters[?(@.name=='group-id')]
      update:
        description: Group UUID from the group search/list operation.
    - target: $.paths['/admin/realms/{realm}/identity-provider/import-config'].post
      update:
        description: Takes a JSON body with the provider type and a metadata source (for example an OIDC discovery URL or a SAML descriptor) and returns the config key/values extracted from it. Nothing is created in the realm. The server may fetch the given URL itself, so it makes an outbound request.
        responses:
            "400":
                description: Body missing or malformed, unknown provider type, or the metadata URL/content could not be fetched or parsed; check providerId and the metadata source.
            "401":
                description: Missing or expired admin token; obtain a new one.
            "403":
                description: Token lacks permission to manage identity providers in this realm.
            "404":
                description: Realm does not exist; check the realm name.
        summary: Parse an external identity provider's metadata into an IdP config without saving anything.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not create or update a provider; use createIdentityProvider (POST instances) or updateIdentityProvider (PUT instances/{alias}). Does not export an existing provider's settings; use the export operation.
            whenToUse: Operator wants to prefill or preview identity provider settings from a discovery URL or SAML metadata before creating the provider.
    - target: $.paths['/admin/realms/{realm}/identity-provider/import-config'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not its id), e.g. 'master'. Use the realm the provider will belong to.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances'].get
      update:
        description: Returns the realm's identity providers, optionally filtered by search text, type or capability, and paged with first/max. With briefRepresentation=true (assumed to be the default) the config details are left out.
        responses:
            "400":
                description: A parameter has an invalid value, e.g. non-numeric first/max or a bad capability; correct it.
            "401":
                description: Missing or expired admin token.
            "403":
                description: Token lacks permission to view identity providers.
            "404":
                description: Realm does not exist.
        summary: List the identity providers configured in a realm.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: To see one provider's full settings use getIdentityProvider (GET instances/{alias}). It does not list provider mappers; use the mappers operation.
            whenToUse: Operator asks which identity providers or social/SSO logins a realm has, or needs an alias to use in other calls.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances'].get.parameters[?(@.name=='briefRepresentation')]
      update:
        description: true = return a short representation without config; false = include full config. Default is believed to be true.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances'].get.parameters[?(@.name=='capability')]
      update:
        description: Filter by capability of the provider. Likely values 'USER_LINKING' or 'ORGANIZATION'; unsure.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances'].get.parameters[?(@.name=='first')]
      update:
        description: Zero-based index of the first result, for paging.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances'].get.parameters[?(@.name=='max')]
      update:
        description: Maximum number of results to return.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances'].get.parameters[?(@.name=='realmOnly')]
      update:
        description: true = only providers not linked to an organization (assumed meaning); false or absent = all.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances'].get.parameters[?(@.name=='search')]
      update:
        description: Text to match against provider alias; wildcards likely supported.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances'].get.parameters[?(@.name=='type')]
      update:
        description: Filter by provider type, e.g. 'oidc', 'saml', 'google'.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances'].post
      update:
        description: Creates the provider from the body and returns 201 with its location on success. The alias must be unique within the realm. Once enabled, it can appear as a login option for users unless hideOnLogin is true.
        responses:
            "400":
                description: Invalid body, missing providerId or alias, or invalid config for the provider type.
            "401":
                description: Missing or expired admin token.
            "403":
                description: Token lacks permission to manage identity providers.
            "404":
                description: Realm does not exist.
            "409":
                description: A provider with this alias already exists; choose another alias or update the existing one.
        summary: Create a new identity provider (external login/SSO source) in a realm.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: To change an existing provider use updateIdentityProvider (PUT instances/{alias}). To only preview settings from metadata use import-config.
            whenToUse: Operator wants to add a new SSO or social login provider to a realm.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}'].delete
      update:
        description: Removes the provider and, most likely, its mappers and the links between it and users' accounts. Users who could only log in through it may lose access. It cannot be undone through the API.
        responses:
            "401":
                description: Missing or expired admin token.
            "403":
                description: Token lacks permission to manage identity providers.
            "404":
                description: Realm or provider alias not found; check the alias from the list operation.
        summary: Delete an identity provider from a realm.
        x-agent:
            risk: irreversible
            whenNotToUse: To stop it being used temporarily, set enabled=false via updateIdentityProvider (PUT instances/{alias}) instead of deleting.
            whenToUse: Operator explicitly asks to remove or delete an identity provider.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}'].delete.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}'].delete.parameters[?(@.name=='alias')]
      update:
        description: Alias of the provider, from the list operation (GET instances).
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}'].get
      update:
        description: Returns the provider's configuration, flows and flags. Secrets in config are normally masked.
        responses:
            "401":
                description: Missing or expired admin token.
            "403":
                description: Token lacks permission to view identity providers.
            "404":
                description: Realm or alias not found; check alias against the list.
        summary: Get the full settings of one identity provider.
        x-agent:
            risk: read
            whenNotToUse: To list all providers use GET instances. To get a downloadable descriptor use the export operation. For mappers use the mappers operation.
            whenToUse: Operator asks how a specific provider is configured, or whether it is enabled.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}'].get.parameters[?(@.name=='alias')]
      update:
        description: Alias of the provider, from the list operation (GET instances).
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}'].put
      update:
        description: Replaces the provider's configuration with the body; send the full representation, because omitted fields may be reset. Takes effect immediately for logins. Returns 204 on success.
        responses:
            "400":
                description: Invalid body or config values.
            "401":
                description: Missing or expired admin token.
            "403":
                description: Token lacks permission to manage identity providers.
            "404":
                description: Realm or alias not found.
            "409":
                description: Changing alias to one that already exists; use a unique alias.
        summary: Update the settings of an existing identity provider.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: To create a provider use POST instances. To change its mappers use the mappers operations. To change management permissions use the permissions operation.
            whenToUse: Operator wants to change, enable or disable a provider, rename its display name, or change its config or login flows.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}'].put.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}'].put.parameters[?(@.name=='alias')]
      update:
        description: Alias of the provider to update, from the list operation.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/export'].get
      update:
        description: Returns the provider's configuration rendered in the chosen format, typically SAML metadata XML, not JSON. It changes nothing.
        responses:
            "401":
                description: Missing or expired admin token.
            "403":
                description: Token lacks permission to view identity providers.
            "404":
                description: Realm or alias not found, or the format is not supported for this provider type.
        summary: Export an identity provider's configuration as a downloadable descriptor.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: To read settings as JSON use GET instances/{alias}. To parse external metadata into a config use import-config.
            whenToUse: Operator needs the provider's metadata or descriptor to give to the external system.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/export'].get.parameters[?(@.name=='format')]
      update:
        description: Export format name, for example 'saml-metadata' (assumed). Allowed values are not given; omit for the default.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/export'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/export'].get.parameters[?(@.name=='alias')]
      update:
        description: Alias of the provider, from the list operation.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/management/permissions'].get
      update:
        description: Returns the permission-management status, the resource id, and the scope permissions (such as token exchange) for the provider. Reading may be unavailable if the fine-grained permissions feature is off on the server.
        responses:
            "401":
                description: Missing or expired admin token.
            "403":
                description: Token lacks permission to manage this realm.
            "404":
                description: Realm or alias not found, or the fine-grained permissions feature is not enabled.
        summary: Show whether fine-grained permissions are enabled for an identity provider.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: For the provider's own settings use GET instances/{alias}. To change permissions use PUT on this same path.
            whenToUse: Operator asks whether fine-grained permissions or token exchange are enabled for a provider.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/management/permissions'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/management/permissions'].get.parameters[?(@.name=='alias')]
      update:
        description: Alias of the provider, from the list operation.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/management/permissions'].put
      update:
        description: Sets the enabled flag and returns the resulting permission reference, including scope permission ids. Changes who may manage or exchange tokens with this provider.
        responses:
            "400":
                description: Invalid body.
            "401":
                description: Missing or expired admin token.
            "403":
                description: Token lacks permission to manage this realm.
            "404":
                description: Realm or alias not found, or the feature is not enabled on the server.
        summary: Turn fine-grained permissions on or off for an identity provider.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: To only read the status use GET on this path. To change the provider's login settings use PUT instances/{alias}.
            whenToUse: Operator asks to enable or disable fine-grained permissions for a provider.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/management/permissions'].put.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/management/permissions'].put.parameters[?(@.name=='alias')]
      update:
        description: Alias of the provider, from the list operation.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/mapper-types'].get
      update:
        description: Returns the available mapper types for this provider's type, with id, name, category and help text. It does not list mappers that already exist.
        responses:
            "401":
                description: Missing or expired admin token.
            "403":
                description: Token lacks permission to view identity providers.
            "404":
                description: Realm or alias not found.
        summary: List the kinds of mappers a given identity provider supports.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: To see existing mappers use GET mappers. To create one use POST mappers.
            whenToUse: Operator wants to know which mapper types can be added to a provider, before creating a mapper.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/mapper-types'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/mapper-types'].get.parameters[?(@.name=='alias')]
      update:
        description: Alias of the provider, from the list operation.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/mappers'].get
      update:
        description: Returns the existing mappers that copy or transform attributes, claims or roles from the external provider onto local users. Each has an id, name, mapper type and config.
        responses:
            "401":
                description: Missing or expired admin token.
            "403":
                description: Token lacks permission to view identity providers.
            "404":
                description: Realm or alias not found.
        summary: List the mappers set up on an identity provider.
        x-agent:
            risk: read
            whenNotToUse: To see which mapper types are available use GET mapper-types. For the provider's own settings use GET instances/{alias}.
            whenToUse: Operator asks how attributes or roles from a provider are mapped to local users.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/mappers'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/mappers'].get.parameters[?(@.name=='alias')]
      update:
        description: Alias of the provider, from the list operation.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/mappers'].post
      update:
        description: Creates a mapper that maps attributes, claims or roles from the external provider to local users, and returns 201 on success. It applies to subsequent logins through this provider.
        responses:
            "400":
                description: Invalid body, unknown mapper type, or missing config keys for the type.
            "401":
                description: Missing or expired admin token.
            "403":
                description: Token lacks permission to manage identity providers.
            "404":
                description: Realm or alias not found.
            "409":
                description: A mapper with this name already exists on the provider; use another name.
        summary: Add a mapper to an identity provider.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: To list existing mappers use GET mappers. To see what types exist use GET mapper-types. To change the provider itself use PUT instances/{alias}.
            whenToUse: Operator wants to map an external claim, attribute or role onto local users for a provider.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/mappers'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/mappers'].post.parameters[?(@.name=='alias')]
      update:
        description: Alias of the provider, from the list operation.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/mappers/{id}'].delete
      update:
        description: Permanently removes one mapper (the rule that maps attributes/claims from an external identity provider to Keycloak user attributes or roles) from the given identity provider. Returns no body on success. Users who log in through that provider afterwards will no longer get the mapped attributes or roles.
        responses:
            "401":
                description: Missing or expired admin access token; obtain a new token and retry.
            "403":
                description: Token lacks permission to manage identity providers in this realm; use an account with the needed admin role.
            "404":
                description: Realm, identity provider alias or mapper id not found; check the realm name, the alias and that the id belongs to this alias.
        summary: Delete a mapper from an identity provider
        x-agent:
            risk: irreversible
            whenNotToUse: Does not change a mapper (use PUT on the same path). Does not delete the identity provider itself or a user's federated identity link. Does not list mappers or read one (use GET).
            whenToUse: Operator asks to remove, delete or drop an identity provider mapper, attribute mapping or role mapping for a specific identity provider.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/mappers/{id}'].delete.parameters[?(@.name=='id')]
      update:
        description: Internal id (UUID string) of the mapper to delete. Taken from the identity provider's mapper list or from the GET mapper response.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/mappers/{id}'].delete.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not id), e.g. 'master'. Must be an existing realm.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/mappers/{id}'].delete.parameters[?(@.name=='alias')]
      update:
        description: Alias of the identity provider that owns the mapper, e.g. 'google'. Taken from the identity provider list/instance for the realm.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/mappers/{id}'].get
      update:
        description: 'Returns a single mapper of an identity provider: its id, name, identityProviderAlias, identityProviderMapper (the mapper type) and config (type-specific settings). Changes nothing.'
        responses:
            "401":
                description: Missing or expired admin access token; obtain a new token and retry.
            "403":
                description: Token lacks permission to view identity providers in this realm.
            "404":
                description: Realm, identity provider alias or mapper id not found; check each value.
        summary: Show one identity provider mapper
        x-agent:
            risk: read
            whenNotToUse: Does not list all mappers of a provider, and does not return the identity provider's own settings or the available mapper types.
            whenToUse: Operator asks for the details or configuration of a specific identity provider mapper, or you need its current values before updating it.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/mappers/{id}'].get.parameters[?(@.name=='id')]
      update:
        description: Internal id (UUID string) of the mapper, from the provider's mapper list.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/mappers/{id}'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not id), e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/mappers/{id}'].get.parameters[?(@.name=='alias')]
      update:
        description: Alias of the identity provider that owns the mapper.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/mappers/{id}'].put
      update:
        description: Replaces the settings of an existing mapper of an identity provider with the JSON body (name, mapper type, provider alias and config). Returns no body on success. It changes how attributes and roles from the external provider are mapped at the next login.
        responses:
            "400":
                description: Body is malformed or the config is invalid for the mapper type; send the full object with a valid identityProviderMapper and config.
            "401":
                description: Missing or expired admin access token; obtain a new token and retry.
            "403":
                description: Token lacks permission to manage identity providers in this realm.
            "404":
                description: Realm, identity provider alias or mapper id not found; check each value.
            "409":
                description: Another mapper with the same name already exists for this provider; choose a different name.
        summary: Update an identity provider mapper
        x-agent:
            risk: write
            whenNotToUse: Does not create a new mapper (that is a POST on the mappers collection) and does not delete one (use DELETE). Does not edit the identity provider itself.
            whenToUse: Operator asks to change, rename, or reconfigure an existing identity provider mapper, e.g. a different claim, attribute or role.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/mappers/{id}'].put.parameters[?(@.name=='id')]
      update:
        description: Internal id (UUID string) of the mapper to update; should match the id in the body. Taken from the mapper list or GET mapper.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/mappers/{id}'].put.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not id), e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/mappers/{id}'].put.parameters[?(@.name=='alias')]
      update:
        description: Alias of the identity provider that owns the mapper.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/reload-keys'].get
      update:
        description: Despite being a GET, it triggers Keycloak to re-fetch the external identity provider's public keys (for example from its JWKS or metadata URL) and refresh the cached keys. Returns a boolean telling whether the reload succeeded. Only applies when the provider is configured to use a keys URL (e.g. 'use JWKS URL').
        responses:
            "401":
                description: Missing or expired admin access token; obtain a new token and retry.
            "403":
                description: Token lacks permission to manage identity providers in this realm.
            "404":
                description: Realm or identity provider alias not found; check both.
        summary: Reload the signing keys of an identity provider
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Does not show the keys, and does not change the provider's configuration. Not for realm keys or user credentials.
            whenToUse: Operator asks to refresh, reload or re-fetch the keys or certificates of an identity provider, e.g. after the external provider rotated its signing keys and logins fail with signature errors.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/reload-keys'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not id), e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/identity-provider/instances/{alias}/reload-keys'].get.parameters[?(@.name=='alias')]
      update:
        description: Alias of the identity provider whose keys are reloaded, e.g. 'google'.
    - target: $.paths['/admin/realms/{realm}/identity-provider/providers/{provider_id}'].get
      update:
        description: Returns information about an identity provider type available in Keycloak (for example 'oidc', 'saml', 'google'), identified by its provider type id, not about a configured instance. Changes nothing.
        responses:
            "401":
                description: Missing or expired admin access token; obtain a new token and retry.
            "403":
                description: Token lacks permission to view identity providers in this realm.
            "404":
                description: Realm not found or provider type id unknown; check the realm name and use a supported type id.
        summary: Get the identity provider type factory by id
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not return a configured identity provider in the realm (use the instances endpoint with its alias), and does not list mappers or keys.
            whenToUse: Operator asks what an identity provider type is or whether Keycloak supports a given provider type such as 'saml' or 'github'.
    - target: $.paths['/admin/realms/{realm}/identity-provider/providers/{provider_id}'].get.parameters[?(@.name=='provider_id')]
      update:
        description: Identity provider type id such as 'oidc', 'saml', 'google' or 'github'. This is the type, not the alias of a configured provider.
    - target: $.paths['/admin/realms/{realm}/identity-provider/providers/{provider_id}'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not id), e.g. 'master'.
