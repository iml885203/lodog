        description: Certificate attribute prefix, e.g. 'jwt.credential' or 'saml.signing'. Exact values are an inference.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/client-secret'].get
      update:
        description: Returns the client's current secret value (type and value). Exposes a live credential, so handle the output carefully and do not log or repeat it unnecessarily.
        responses:
            "401":
                description: Missing or expired admin token; re-authenticate.
            "403":
                description: Caller lacks permission to view client secrets.
            "404":
                description: Client or realm not found, or client has no secret (public client); check the UUID and client type.
        summary: Read a client's current secret
        x-agent:
            risk: credential
            whenNotToUse: Generating a new secret (use POST .../client-secret); reading the previous rotated secret (use GET .../client-secret/rotated).
            whenToUse: Operator asks to see or retrieve the current secret of a confidential client.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/client-secret'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not UUID).
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/client-secret'].get.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client, from GET .../clients.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/client-secret'].post
      update:
        description: Replaces the client's secret with a newly generated one and returns it. Applications using the old secret will fail to authenticate unless a rotation grace period keeps the old one valid. The previous value cannot be generated again.
        responses:
            "400":
                description: Client is not secret-based (e.g. public or bearer-only); check the client type.
            "401":
                description: Missing or expired admin token; re-authenticate.
            "403":
                description: Caller lacks manage-clients permission.
            "404":
                description: Client or realm not found; check the UUID.
        summary: Generate a new secret for a client
        x-agent:
            risk: credential
            whenNotToUse: Only viewing the secret (use GET .../client-secret); removing the old rotated secret (use DELETE .../client-secret/rotated).
            whenToUse: Operator asks to regenerate, reset, or rotate a client's secret, for example after a leak.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/client-secret'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not UUID).
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/client-secret'].post.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client, from GET .../clients.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/client-secret/rotated'].delete
      update:
        description: Removes the old secret kept after a rotation, so it can no longer authenticate. The current secret is unaffected. Applications still using the old secret will fail immediately.
        responses:
            "401":
                description: Missing or expired admin token; re-authenticate.
            "403":
                description: Caller lacks manage-clients permission.
            "404":
                description: Client or realm not found, or no rotated secret exists; check the UUID.
        summary: Invalidate a client's previous (rotated) secret
        x-agent:
            needsReview: true
            risk: credential
            whenNotToUse: Generating a new secret (use POST .../client-secret); deleting the whole client (use DELETE .../clients/{client-uuid}).
            whenToUse: Operator asks to revoke or purge the old secret after a rotation.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/client-secret/rotated'].delete.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not UUID).
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/client-secret/rotated'].delete.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client, from GET .../clients.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/client-secret/rotated'].get
      update:
        description: Returns the old secret still retained after a rotation, if any. Exposes a credential that may still be valid, so handle the output carefully.
        responses:
            "401":
                description: Missing or expired admin token; re-authenticate.
            "403":
                description: Caller lacks permission to view client secrets.
            "404":
                description: Client or realm not found, or no rotated secret exists.
        summary: Read a client's previous (rotated) secret
        x-agent:
            needsReview: true
            risk: credential
            whenNotToUse: Reading the current secret (use GET .../client-secret).
            whenToUse: Operator asks to see the previous secret kept during a rotation grace period.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/client-secret/rotated'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not UUID).
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/client-secret/rotated'].get.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client, from GET .../clients.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/default-client-scopes'].get
      update:
        description: Returns the client scopes automatically included in tokens issued to this client (id, name, protocol). Optional scopes are not listed here.
