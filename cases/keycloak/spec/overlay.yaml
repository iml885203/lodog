        responses:
            "400":
                description: Malformed body; send valid JSON with a boolean 'enabled'.
            "401":
                description: Missing or expired admin bearer token; obtain a new one.
            "403":
                description: Admin token lacks permission to manage clients or the realm lacks fine-grained permissions support.
            "404":
                description: Realm or client not found; verify realm name and client UUID.
            "501":
                description: Fine-grained admin permissions feature is not enabled on the server (guess).
        summary: Enable or disable fine-grained admin permissions for a client
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for just reading the current status (use the GET on the same path) or for editing the client's other settings.
            whenToUse: Operator asks to turn fine-grained admin permissions on or off for a client.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/management/permissions'].put.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not a UUID).
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/management/permissions'].put.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/nodes'].post
      update:
        description: Registers an application cluster node (host) with the client so the server can send it admin requests such as backchannel logout or push of not-before policies. The body is an unspecified object, probably containing the node host. Changes the client's registered node list.
        responses:
            "400":
                description: Malformed or incomplete body; send valid JSON with the node host.
            "401":
                description: Missing or expired admin bearer token; obtain a new one.
            "403":
                description: Admin token lacks permission to manage clients.
            "404":
                description: Realm or client not found; verify realm name and client UUID.
        summary: Register a cluster node with a client
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for removing a node (use DELETE on /nodes/{node}) or for creating a client.
            whenToUse: Operator asks to register or add a cluster node/host for a client.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/nodes'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not a UUID).
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/nodes'].post.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/nodes/{node}'].delete
      update:
        description: Removes the named cluster node from the client's registered nodes, so the server stops sending it admin requests. It can be re-added with the POST on /nodes.
        responses:
            "401":
                description: Missing or expired admin bearer token; obtain a new one.
            "403":
                description: Admin token lacks permission to manage clients.
            "404":
                description: Realm, client or node not found; check the node name matches a registered one.
        summary: Unregister a cluster node from a client
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for adding a node (use POST /nodes) or deleting the client itself.
            whenToUse: Operator asks to remove or unregister a node/host from a client.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/nodes/{node}'].delete.parameters[?(@.name=='node')]
      update:
        description: Host name of the registered node to remove, exactly as it was registered.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/nodes/{node}'].delete.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not a UUID).
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/nodes/{node}'].delete.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/offline-session-count'].get
      update:
        description: Returns the number of offline sessions for the client, as a small object with a count. Changes nothing.
        responses:
            "401":
                description: Missing or expired admin access token; obtain a new token and retry.
            "403":
                description: Token lacks permission to view clients in this realm (e.g. view-clients role); use an account with that role.
            "404":
                description: Realm or client-uuid not found; check the realm name and use the client's internal UUID, not its clientId.
        summary: Count offline sessions (long-lived refresh-token sessions) of one client
        x-agent:
            risk: read
            whenNotToUse: 'Does not list the sessions: use getClientOfflineSessions. Does not count normal online sessions: use the client session-count operation.'
            whenToUse: How many offline sessions or offline tokens does this client have? Is anyone still holding offline access for this app?
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/offline-session-count'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not id), e.g. 'master'. Take it from the realm the operator is working in.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/offline-session-count'].get.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client, NOT the human-readable clientId. Get it from the clients search/list operation (the 'id' field).
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/offline-sessions'].get
      update:
        description: Returns user sessions that hold offline tokens for the client, with paging via first/max. If paging is omitted the server applies its own default limit, so large result sets may be truncated. Changes nothing.
        responses:
            "401":
                description: Missing or expired admin access token; obtain a new token and retry.
            "403":
                description: Token lacks permission to view clients/sessions; use an account with the needed role.
            "404":
                description: Realm or client-uuid not found; check the realm name and use the client's internal UUID.
        summary: List offline sessions (long-lived refresh-token sessions) of one client
        x-agent:
            risk: read
            whenNotToUse: 'Only a number is needed: use the offline-session-count operation. Normal online sessions: use the client user-sessions operation.'
            whenToUse: Which users hold offline tokens for this client? Show offline sessions for an application.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/offline-sessions'].get.parameters[?(@.name=='first')]
      update:
        description: Zero-based index of the first result to return (paging offset). Integer, e.g. 0. Optional.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/offline-sessions'].get.parameters[?(@.name=='max')]
      update:
        description: Maximum number of sessions to return (page size). Integer, e.g. 100. Optional.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/offline-sessions'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/offline-sessions'].get.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client, NOT the clientId. Get it from the clients search/list operation.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/optional-client-scopes'].get
      update:
        description: Returns client scopes attached to the client as optional, meaning they are granted only when the client requests them in the scope parameter. Changes nothing.
        responses:
            "401":
                description: Missing or expired admin access token; obtain a new token and retry.
            "403":
                description: Token lacks permission to view clients; use an account with the needed role.
            "404":
                description: Realm or client-uuid not found; check both values.
        summary: List the optional client scopes assigned to a client
        x-agent:
            risk: read
            whenNotToUse: 'Default scopes (applied automatically) are a separate list: use the default-client-scopes operation. Listing all scopes defined in the realm: use the realm client-scopes operation.'
            whenToUse: Which optional scopes does this client have? Check whether a scope is already assigned before adding or removing it.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/optional-client-scopes'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/optional-client-scopes'].get.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client, NOT the clientId. Get it from the clients search/list operation.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/optional-client-scopes/{clientScopeId}'].delete
      update:
        description: Detaches the scope from the client's optional scopes so the client can no longer request it. The scope itself stays in the realm and can be re-added. Tokens issued later will not include that scope's claims or roles.
        responses:
            "401":
                description: Missing or expired admin access token; obtain a new token and retry.
            "403":
                description: Token lacks permission to manage clients; use an account with the manage-clients role.
            "404":
                description: Realm, client or scope id not found, or the scope is not assigned as optional; verify ids against the list operation.
        summary: Remove an optional client scope from a client
        x-agent:
            risk: write
            whenNotToUse: 'Adding a scope: use the PUT on the same path. Deleting the scope from the realm entirely: use the realm client-scopes delete operation. Removing a default scope: use the default-client-scopes operation.'
            whenToUse: Take an optional scope away from a client; stop a client from requesting a given scope.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/optional-client-scopes/{clientScopeId}'].delete.parameters[?(@.name=='clientScopeId')]
      update:
        description: Internal UUID of the client scope. Get it from the client's optional-client-scopes list or the realm client-scopes list (the 'id' field).
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/optional-client-scopes/{clientScopeId}'].delete.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/optional-client-scopes/{clientScopeId}'].delete.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client, NOT the clientId. Get it from the clients search/list operation.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/optional-client-scopes/{clientScopeId}'].put
      update:
        description: Assigns the scope to the client as optional, so the client may request it via the scope parameter. Does not grant it by default. Repeating the call for an already-assigned scope is expected to be harmless.
        responses:
            "401":
                description: Missing or expired admin access token; obtain a new token and retry.
            "403":
                description: Token lacks permission to manage clients; use an account with the manage-clients role.
            "404":
                description: Realm, client or scope id not found; verify ids against the list operations.
            "409":
                description: Possible conflict if the scope is already assigned as a default scope; remove it from defaults first.
        summary: Add an optional client scope to a client
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: 'Removing a scope: use the DELETE on the same path. Making a scope apply automatically: use the default-client-scopes operation. Creating a new scope: use the realm client-scopes create operation.'
            whenToUse: Allow a client to request an additional scope; attach an optional scope to an application.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/optional-client-scopes/{clientScopeId}'].put.parameters[?(@.name=='clientScopeId')]
      update:
        description: Internal UUID of the existing client scope. Get it from the realm client-scopes list (the 'id' field).
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/optional-client-scopes/{clientScopeId}'].put.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/optional-client-scopes/{clientScopeId}'].put.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client, NOT the clientId. Get it from the clients search/list operation.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/protocol-mappers/add-models'].post
      update:
        description: Creates multiple protocol mappers on the client from the array in the body. Affects the claims in tokens issued to this client afterwards. Whether it is all-or-nothing is not stated.
        responses:
            "400":
                description: A mapper in the array is invalid; fix its type or config.
            "401":
                description: Missing or expired admin token; obtain a new token.
            "403":
                description: Token lacks permission to manage clients in this realm.
            "404":
                description: Realm or client not found; check realm and client UUID.
            "409":
                description: A mapper with the same name already exists on this client; rename it.
        summary: Add several protocol mappers to a client in one call
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for adding a single mapper (use POST .../protocol-mappers/models) and not for changing an existing mapper (use PUT .../models/{id}).
            whenToUse: Attach a batch of new mappers to a client at once.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/protocol-mappers/add-models'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/protocol-mappers/add-models'].post.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client (not the human-readable clientId); taken from the realm's clients list.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/protocol-mappers/models'].get
      update:
        description: Returns every protocol mapper attached directly to the client, across all protocols. Changes nothing. Does not include mappers inherited from the client's scopes.
        responses:
            "401":
                description: Missing or expired admin token; obtain a new token.
            "403":
                description: Token lacks permission to view clients in this realm.
            "404":
                description: Realm or client not found; check the ids.
        summary: List all protocol mappers of a client
        x-agent:
            risk: read
            whenNotToUse: Not for one mapper by id (use GET .../models/{id}) and not for filtering by protocol (use GET .../protocol/{protocol}).
            whenToUse: See what claims or attributes a client's tokens are configured to carry; find a mapper's id.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/protocol-mappers/models'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/protocol-mappers/models'].get.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client (not the clientId); taken from the realm's clients list.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/protocol-mappers/models'].post
      update:
        description: Adds a single new protocol mapper to the client, changing the content of tokens issued to it afterwards. Send the mapper definition in the body.
        responses:
            "400":
                description: Mapper type or config invalid for the protocol; fix the body.
            "401":
                description: Missing or expired admin token; obtain a new token.
            "403":
                description: Token lacks permission to manage clients in this realm.
            "404":
                description: Realm or client not found; check the ids.
            "409":
                description: A mapper with this name already exists on the client; use another name.
        summary: Create one protocol mapper on a client
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for adding several at once (use add-models), and not for editing an existing mapper (use PUT .../models/{id}).
            whenToUse: Add one new claim or attribute mapper to a client.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/protocol-mappers/models'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/protocol-mappers/models'].post.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client; taken from the realm's clients list.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/protocol-mappers/models/{id}'].delete
      update:
        description: Permanently removes the mapper, so its claim no longer appears in tokens issued to this client. There is no undo; the mapper must be recreated manually.
        responses:
            "401":
                description: Missing or expired admin token; obtain a new token.
            "403":
                description: Token lacks permission to manage clients in this realm.
            "404":
                description: Realm, client or mapper not found; check the ids from the list operation.
        summary: Delete a protocol mapper from a client
        x-agent:
            needsReview: true
            risk: irreversible
            whenNotToUse: Not for changing a mapper (use PUT .../models/{id}) and not for removing a mapper from a client scope.
            whenToUse: Remove a claim or attribute mapper that a client should no longer have.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/protocol-mappers/models/{id}'].delete.parameters[?(@.name=='id')]
      update:
        description: Id of the mapper to delete; taken from GET .../protocol-mappers/models.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/protocol-mappers/models/{id}'].delete.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/protocol-mappers/models/{id}'].delete.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client; taken from the realm's clients list.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/protocol-mappers/models/{id}'].get
      update:
        description: 'Returns the full definition of a single mapper attached to the client: name, protocol, mapper type, config and consent settings. Changes nothing.'
        responses:
            "401":
                description: Missing or expired admin token; obtain a new token.
            "403":
                description: Token lacks permission to view clients in this realm.
            "404":
                description: Realm, client or mapper not found; check the ids.
        summary: Get one protocol mapper of a client
        x-agent:
            risk: read
            whenNotToUse: Not for finding a mapper id (use GET .../protocol-mappers/models to list).
            whenToUse: Inspect the settings of one known mapper before editing or deleting it.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/protocol-mappers/models/{id}'].get.parameters[?(@.name=='id')]
      update:
        description: Id of the mapper; taken from GET .../protocol-mappers/models.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/protocol-mappers/models/{id}'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/protocol-mappers/models/{id}'].get.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client; taken from the realm's clients list.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/protocol-mappers/models/{id}'].put
      update:
        description: Replaces the settings of an existing mapper on the client, altering the claims in tokens issued to it afterwards. Send the full mapper representation in the body.
        responses:
            "400":
                description: Body invalid or config not valid for the mapper type; fix the body.
            "401":
                description: Missing or expired admin token; obtain a new token.
            "403":
                description: Token lacks permission to manage clients in this realm.
            "404":
                description: Realm, client or mapper not found; check the ids.
            "409":
                description: Another mapper on this client already has that name; rename.
        summary: Update a protocol mapper on a client
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for creating a mapper (use POST .../models) and not for mappers on client scopes (use the client-templates PUT).
            whenToUse: Change the name, config, consent text or type of an existing client mapper.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/protocol-mappers/models/{id}'].put.parameters[?(@.name=='id')]
      update:
        description: Id of the mapper to update; taken from GET .../protocol-mappers/models.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/protocol-mappers/models/{id}'].put.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/protocol-mappers/models/{id}'].put.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client; taken from the realm's clients list.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/protocol-mappers/protocol/{protocol}'].get
      update:
        description: Returns the mappers attached to the client that belong to the given protocol (e.g. OpenID Connect or SAML). Changes nothing.
        responses:
            "401":
                description: Missing or expired admin token; obtain a new token.
            "403":
                description: Token lacks permission to view clients in this realm.
            "404":
                description: Realm or client not found; check the ids.
        summary: List a client's protocol mappers for one protocol
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Not for all mappers (use GET .../protocol-mappers/models) and not for a client scope's mappers (use the client-templates equivalent).
            whenToUse: See only the OIDC or only the SAML mappers of a client.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/protocol-mappers/protocol/{protocol}'].get.parameters[?(@.name=='protocol')]
      update:
        description: Protocol name, typically 'openid-connect' or 'saml'.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/protocol-mappers/protocol/{protocol}'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/protocol-mappers/protocol/{protocol}'].get.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client; taken from the realm's clients list.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/push-revocation'].post
      update:
        description: Sends the realm's current not-before revocation policy to the client's configured admin URL so the application rejects tokens issued earlier. This makes outbound calls to the client's own servers and returns the result per node. Requires the client to have an admin URL configured.
        responses:
            "400":
                description: Client has no admin URL configured, so there is nowhere to push; set the admin URL on the client first.
            "401":
                description: Missing or expired admin access token; obtain a new token and retry.
            "403":
                description: Token lacks permission to manage clients; use an account with the manage-clients role.
            "404":
                description: Realm or client-uuid not found; check both values.
        summary: Push a token revocation (not-before policy) to the client's application nodes
        x-agent:
            needsReview: true
            risk: irreversible
            whenNotToUse: 'Viewing sessions: use the session list operations. Ending a user''s sessions: use the users logout operation. Rotating client credentials: use the client-secret operation.'
            whenToUse: Force an application to drop previously issued tokens now; push revocation after a security incident or user/session cleanup.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/push-revocation'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/push-revocation'].post.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client, NOT the clientId. Get it from the clients search/list operation.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/registration-access-token'].post
      update:
        description: Creates a new registration access token for the client's dynamic registration endpoint and returns it. The previous token stops working, so any system relying on it loses access. The new token is shown in the response.
        responses:
            "401":
                description: Missing or expired admin access token; obtain a new token and retry.
            "403":
                description: Token lacks permission to manage clients; use an account with the manage-clients role.
            "404":
                description: Realm or client-uuid not found; check both values.
        summary: Generate a new registration access token for a client
        x-agent:
            risk: credential
            whenNotToUse: 'Rotating the client secret: use the client-secret generate operation. Getting an access token for API calls: use the normal token endpoint.'
            whenToUse: Rotate or reissue the token used to manage a dynamically registered client; the old token was lost or leaked.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/registration-access-token'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/registration-access-token'].post.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client, NOT the clientId. Get it from the clients search/list operation.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/roles'].get
      update:
        description: Returns the roles that belong to a single client in a realm. Supports text search and offset paging via first/max. With briefRepresentation=true (typical default) only basic role fields are returned, not attributes.
        responses:
            "401":
                description: Missing or expired admin bearer token; obtain a new token and retry.
            "403":
                description: Token lacks permission to view clients in this realm.
            "404":
                description: Realm or client-uuid not found; check realm name and that client-uuid is the internal UUID.
        summary: List the roles defined on one Keycloak client
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not list realm-level roles, and does not show which users or groups hold a role (use the role's groups operation for groups). Does not return one role's full details; use GET .../roles/{role-name}.
            whenToUse: Operator asks what roles a client has, or to find a client role by name or part of a name.
