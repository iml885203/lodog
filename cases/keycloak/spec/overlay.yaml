        responses:
            "400":
                description: Body invalid or missing fields; send identityProvider, userId and userName.
            "401":
                description: Missing or expired admin token; re-authenticate.
            "403":
                description: Token lacks permission to manage this user.
            "404":
                description: Realm, user or provider not found.
            "409":
                description: User is already linked to this provider, or that external account is linked to another user; unlink first or check the ids.
