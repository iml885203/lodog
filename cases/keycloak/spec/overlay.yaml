    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/evaluate-scopes/generate-example-access-token'].get
      update:
        description: Returns an example OAuth2 access token (decoded claims) as Keycloak would issue it for the client, using the chosen scopes, audience and user. Nothing is issued or stored; it is a dry run for checking claims and roles.
