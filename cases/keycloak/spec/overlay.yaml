        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not search by name or type (use GET /admin/realms/{realm}/components with filters). Does not list nested component types (use sub-component-types).
            whenToUse: Operator asks for the settings of a specific component whose id is known, or you need its current state before updating it.
    - target: $.paths['/admin/realms/{realm}/components/{id}'].get.parameters[?(@.name=='id')]
      update:
        description: Component id (UUID) from GET /admin/realms/{realm}/components.
    - target: $.paths['/admin/realms/{realm}/components/{id}'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/components/{id}'].put
      update:
        description: Replaces the component's definition with the supplied body, so send the full object, not only changed fields. Takes effect immediately and may change authentication or user lookup behavior in the realm. Returns 204 with no body on success.
        responses:
            "400":
                description: Invalid body or config values; fix the fields named in the error message.
            "401":
                description: Missing or expired admin token; get a new one.
            "403":
                description: Token lacks manage-realm permission; use a privileged account.
            "404":
                description: Realm or component not found; list components to find the correct id.
            "409":
                description: Name conflicts with another component; choose a different name.
        summary: Update an existing component's configuration
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Does not create a component (use POST /admin/realms/{realm}/components). Does not delete one (use DELETE).
            whenToUse: Operator asks to change settings of an existing component, such as an LDAP connection URL, priority, or key provider options.
    - target: $.paths['/admin/realms/{realm}/components/{id}'].put.parameters[?(@.name=='id')]
