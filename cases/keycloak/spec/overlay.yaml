    - target: $.paths['/admin/realms/{realm}/components'].get
      update:
        description: Returns the components of the realm as a list, optionally filtered by name, parent, provider id or type. Without filters it returns every component in the realm, which can be large. Components may include configuration values, some of which can be secrets masked by the server.
        responses:
            "401":
                description: Missing or expired admin bearer token; obtain a fresh token and retry.
            "403":
                description: Token lacks permission to view realm components (e.g. missing view-realm/manage-realm role); use an account with the needed role.
            "404":
                description: Realm does not exist; check the realm name.
        summary: List configured components (providers such as user federation, key providers, authenticators) in a realm
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not fetch one component whose id is already known (use GET /admin/realms/{realm}/components/{id}). Does not list users, clients, or roles. Does not list the component types that can be nested under a component (use the sub-component-types operation).
            whenToUse: Operator asks which user federation (LDAP/Kerberos), key providers, or other pluggable components are configured in a realm, or wants to find a component's id by name or type.
    - target: $.paths['/admin/realms/{realm}/components'].get.parameters[?(@.name=='name')]
      update:
        description: Optional. Return only components with this exact name.
    - target: $.paths['/admin/realms/{realm}/components'].get.parameters[?(@.name=='parent')]
      update:
        description: Optional. Id of the parent component (or realm id) whose children to return.
    - target: $.paths['/admin/realms/{realm}/components'].get.parameters[?(@.name=='providerId')]
      update:
        description: Optional. Provider implementation id, e.g. 'ldap', 'rsa-generated'. Exact match.
    - target: $.paths['/admin/realms/{realm}/components'].get.parameters[?(@.name=='type')]
      update:
        description: Optional. Component provider type as a full class name, e.g. 'org.keycloak.storage.UserStorageProvider' or 'org.keycloak.keys.KeyProvider'.
    - target: $.paths['/admin/realms/{realm}/components'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not the realm id), e.g. 'master'. Must be an existing realm.
    - target: $.paths['/admin/realms/{realm}/components'].post
      update:
        description: Creates a component such as an LDAP user federation or key provider from the supplied definition. Changes realm configuration immediately and may affect how users authenticate or are looked up. On success it normally returns 201 with the new component's URL in the Location header and no body.
        responses:
            "400":
                description: Invalid body, such as missing providerId/providerType or invalid config values; fix the fields named in the error message.
            "401":
                description: Missing or expired admin token; get a new one.
            "403":
                description: Token lacks manage-realm permission; use a privileged account.
            "404":
                description: Realm does not exist; check the realm name.
            "409":
                description: A component with the same name or conflicting identity already exists; use a different name or update the existing one.
        summary: Create a new component (provider configuration) in a realm
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Does not modify an existing component (use PUT /admin/realms/{realm}/components/{id}). Does not create users, clients, or roles.
            whenToUse: Operator asks to add a user federation, key provider, or other pluggable component to a realm.
    - target: $.paths['/admin/realms/{realm}/components'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'. Must exist.
    - target: $.paths['/admin/realms/{realm}/components/{id}'].delete
      update:
        description: Removes the component and its configuration; deleting some components (e.g. user federation) can also remove users or data imported through it. This cannot be undone. Returns 204 with no body on success.
        responses:
            "401":
                description: Missing or expired admin token; get a new one.
            "403":
                description: Token lacks manage-realm permission; use a privileged account.
            "404":
                description: Realm or component id not found; re-list components to get the correct id.
        summary: Delete a component from a realm
        x-agent:
            needsReview: true
            risk: irreversible
            whenNotToUse: Does not disable or edit a component (use PUT /admin/realms/{realm}/components/{id}). Do not use to inspect a component (use GET).
            whenToUse: Operator explicitly asks to remove a specific federation, key provider, or other component from a realm.
    - target: $.paths['/admin/realms/{realm}/components/{id}'].delete.parameters[?(@.name=='id')]
      update:
        description: Component id (UUID) from GET /admin/realms/{realm}/components.
    - target: $.paths['/admin/realms/{realm}/components/{id}'].delete.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/components/{id}'].get
      update:
        description: Returns the component with the given id, including name, provider, parent and config settings. Secret config values are typically masked in the response.
        responses:
            "401":
                description: Missing or expired admin token; get a new one.
            "403":
                description: Token lacks permission to view realm components; use an account with the needed role.
            "404":
                description: Realm or component not found; list components to find the correct id.
