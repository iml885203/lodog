overlay: 1.0.0
info:
    title: Keycloak Admin REST API agent overlay
    version: "1"
actions:
    - target: $.paths['/admin/realms'].get
      update:
        description: Returns the realms visible to the caller. With briefRepresentation=true it returns only basic fields per realm instead of the full configuration. No paging.
        responses:
            "401":
                description: Missing or expired admin token; obtain a new token and retry
            "403":
                description: Caller lacks permission to list realms; use an account with realm view rights
        summary: List the realms (tenants) the admin can see
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not return one realm's full settings, use GET /admin/realms/{realm}. Does not list users or clients.
            whenToUse: Operator asks which realms exist, or needs a realm name to use in other calls.
    - target: $.paths['/admin/realms'].get.parameters[?(@.name=='briefRepresentation')]
      update:
        description: true = return only basic realm fields; false = full realm configuration. Optional; the default is not stated in the document, so state it explicitly.
    - target: $.paths['/admin/realms'].post
      update:
        description: Creates a realm from a JSON realm definition sent as the body. The body may also carry users, clients and roles to import with it. The body schema is only given as a string, so send the full realm JSON text with at least the realm name.
        responses:
            "400":
                description: Body is not valid realm JSON; fix the JSON
            "401":
                description: Missing or expired admin token; obtain a new one
            "403":
                description: Caller may not create realms; needs a master-realm admin
            "409":
                description: A realm with this name already exists; choose another name
        summary: Create a new realm (tenant)
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Does not change an existing realm, use PUT /admin/realms/{realm}. Does not convert client descriptions, use client-description-converter.
            whenToUse: Operator asks to create or import a new realm.
    - target: $.paths['/admin/realms/{realm}'].delete
      update:
        description: Removes the realm along with its users, clients, roles and settings. This cannot be undone.
        responses:
            "401":
                description: Missing or expired admin token; obtain a new one
            "403":
                description: Caller lacks permission to delete this realm
            "404":
                description: Realm name does not exist; check the name with GET /admin/realms
        summary: Permanently delete a realm and everything in it
        x-agent:
            risk: irreversible
            whenNotToUse: Not for deleting events (use DELETE .../admin-events) or for disabling a realm (use PUT /admin/realms/{realm} with enabled=false). Do not use to delete a single user or client.
            whenToUse: Operator explicitly asks to delete or remove an entire realm.
    - target: $.paths['/admin/realms/{realm}'].delete.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not a numeric id), as listed by GET /admin/realms.
    - target: $.paths['/admin/realms/{realm}'].get
      update:
        description: 'Returns the realm configuration: token lifespans, themes, login flows, security headers and similar. Does not return users or clients in full.'
        responses:
            "401":
                description: Missing or expired admin token; obtain a new one
            "403":
                description: Caller lacks permission to view this realm
            "404":
                description: Realm name does not exist; check it with GET /admin/realms
        summary: Get the full settings of one realm
        x-agent:
            risk: read
            whenNotToUse: Not for listing all realms, use GET /admin/realms. Not for changing settings, use PUT /admin/realms/{realm}.
            whenToUse: Operator asks how a realm is configured, such as token lifespans or themes.
    - target: $.paths['/admin/realms/{realm}'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, as listed by GET /admin/realms.
    - target: $.paths['/admin/realms/{realm}'].put
      update:
        description: Changes realm settings using the JSON body, such as token and code lifespans (in seconds), themes, flows and attributes. Changes apply to the whole realm, for example shorter token lifespans affect every user. Fetch the current settings first and send back the full object with edits, because omitted fields may be left unchanged or reset.
        responses:
            "400":
                description: Body is invalid or has a bad value; fix the JSON or field
            "401":
                description: Missing or expired admin token; obtain a new one
            "403":
                description: Caller lacks permission to modify this realm
            "404":
                description: Realm name does not exist; check it with GET /admin/realms
        summary: Update the settings of a realm
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for creating a realm, use POST /admin/realms. Not for client policies, use the client-policies operations.
            whenToUse: Operator asks to change a realm's configuration, such as token lifespan, themes, or enabling/disabling the realm.
    - target: $.paths['/admin/realms/{realm}'].put.parameters[?(@.name=='realm')]
      update:
        description: Realm name, as listed by GET /admin/realms.
    - target: $.paths['/admin/realms/{realm}/admin-events'].delete
      update:
        description: Erases the stored log of administrative actions for the realm. This removes audit history and cannot be undone.
        responses:
            "401":
                description: Missing or expired admin token; obtain a new one
            "403":
                description: Caller lacks permission to manage events in this realm
            "404":
                description: Realm name does not exist; check it with GET /admin/realms
        summary: Delete all admin audit events of a realm
        x-agent:
            risk: irreversible
            whenNotToUse: Not for viewing events, use GET .../admin-events. Not for deleting the realm itself.
            whenToUse: Operator explicitly asks to clear or purge the admin event log of a realm.
    - target: $.paths['/admin/realms/{realm}/admin-events'].delete.parameters[?(@.name=='realm')]
      update:
        description: Realm name, as listed by GET /admin/realms.
    - target: $.paths['/admin/realms/{realm}/admin-events'].get
      update:
        description: Returns admin events (who created, updated or deleted which resource), filtered by the parameters given. Results are paged with first and max. Events exist only if adminEventsEnabled is on for the realm.
        responses:
            "401":
                description: Missing or expired admin token; obtain a new one
            "403":
                description: Caller lacks permission to view events in this realm
            "404":
                description: Realm name does not exist; check it with GET /admin/realms
        summary: Search the audit log of administrative actions in a realm
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Not for user login events. Not for deleting the log, use DELETE .../admin-events.
            whenToUse: Operator asks who changed something in the realm, or what admin actions happened in a period or on a resource.
    - target: $.paths['/admin/realms/{realm}/admin-events'].get.parameters[?(@.name=='authClient')]
      update:
        description: Filter by the client id of the admin who acted.
    - target: $.paths['/admin/realms/{realm}/admin-events'].get.parameters[?(@.name=='authIpAddress')]
      update:
        description: Filter by the IP address the admin acted from.
    - target: $.paths['/admin/realms/{realm}/admin-events'].get.parameters[?(@.name=='authRealm')]
      update:
        description: Filter by the realm of the admin who acted (often 'master').
    - target: $.paths['/admin/realms/{realm}/admin-events'].get.parameters[?(@.name=='authUser')]
      update:
        description: Filter by the id (UUID) of the admin user who acted, not the username.
    - target: $.paths['/admin/realms/{realm}/admin-events'].get.parameters[?(@.name=='dateFrom')]
      update:
        description: Earliest event date, format yyyy-MM-dd (assumed).
    - target: $.paths['/admin/realms/{realm}/admin-events'].get.parameters[?(@.name=='dateTo')]
      update:
        description: Latest event date, format yyyy-MM-dd (assumed).
    - target: $.paths['/admin/realms/{realm}/admin-events'].get.parameters[?(@.name=='direction')]
      update:
        description: Sort order by time; 'asc' or 'desc' (assumed).
    - target: $.paths['/admin/realms/{realm}/admin-events'].get.parameters[?(@.name=='first')]
      update:
        description: 'Paging offset: number of events to skip, starting at 0.'
    - target: $.paths['/admin/realms/{realm}/admin-events'].get.parameters[?(@.name=='max')]
      update:
        description: Maximum number of events to return; set it to keep the result small.
    - target: $.paths['/admin/realms/{realm}/admin-events'].get.parameters[?(@.name=='operationTypes')]
      update:
        description: 'Filter by operation, repeatable. Typical values: CREATE, UPDATE, DELETE, ACTION.'
    - target: $.paths['/admin/realms/{realm}/admin-events'].get.parameters[?(@.name=='resourcePath')]
      update:
        description: Filter by the path of the affected resource; wildcards such as * may be supported.
    - target: $.paths['/admin/realms/{realm}/admin-events'].get.parameters[?(@.name=='resourceTypes')]
      update:
        description: Filter by kind of resource, repeatable, such as USER, CLIENT, REALM_ROLE.
    - target: $.paths['/admin/realms/{realm}/admin-events'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, as listed by GET /admin/realms.
    - target: $.paths['/admin/realms/{realm}/attack-detection/brute-force/users'].delete
      update:
        description: Removes all brute-force detection records (failed-login counters and temporary lockouts) for all users in the realm, so any temporarily locked users can log in again. Affects the whole realm, not one user. The cleared failure history cannot be restored.
        responses:
            "401":
                description: Missing, invalid or expired admin bearer token; obtain a new token and retry.
            "403":
                description: Token lacks permission to manage users in this realm; use an account with the needed realm-management role.
            "404":
                description: Realm does not exist; check the realm name spelling.
        summary: Clear brute-force login lockout records for every user in a realm
        x-agent:
            risk: credential
            whenNotToUse: Does not apply to a single user's lockout; use DELETE /admin/realms/{realm}/attack-detection/brute-force/users/{userId}. Does not check lockout status; use GET /admin/realms/{realm}/attack-detection/brute-force/users/{userId}. Does not reset passwords or permanently disabled accounts.
            whenToUse: Operator asks to unlock or reset login failures for all users in a realm at once, e.g. after a mass lockout incident.
    - target: $.paths['/admin/realms/{realm}/attack-detection/brute-force/users'].delete.parameters[?(@.name=='realm')]
      update:
        description: Realm name (the realm's short name, not a display name), e.g. 'master'. Must be an existing realm.
    - target: $.paths['/admin/realms/{realm}/attack-detection/brute-force/users/{userId}'].delete
      update:
        description: Removes the failed-login counters and temporary lockout for a single user, so they can log in again immediately. Only affects that user's brute-force detection state; it does not change their password or enabled status.
        responses:
            "401":
                description: Missing, invalid or expired admin bearer token; obtain a new token and retry.
            "403":
                description: Token lacks permission to manage users in this realm; use an account with the needed role.
            "404":
                description: Realm or user not found; check the realm name and use the user's UUID, not the username.
        summary: Clear the brute-force login lockout record for one user
        x-agent:
            risk: credential
            whenNotToUse: Not for unlocking every user in the realm; use DELETE /admin/realms/{realm}/attack-detection/brute-force/users. Not for just checking whether a user is locked; use GET on the same path. Not for resetting a password or re-enabling a manually disabled account.
            whenToUse: Operator asks to unlock a user who was temporarily locked out after too many failed logins, or to reset their failed-login count.
    - target: $.paths['/admin/realms/{realm}/attack-detection/brute-force/users/{userId}'].delete.parameters[?(@.name=='userId')]
      update:
        description: Internal user id (UUID) of the user in this realm, not the username. Get it from a user search/lookup operation.
    - target: $.paths['/admin/realms/{realm}/attack-detection/brute-force/users/{userId}'].delete.parameters[?(@.name=='realm')]
      update:
        description: Realm name (short name), e.g. 'master'. Must be an existing realm containing the user.
    - target: $.paths['/admin/realms/{realm}/attack-detection/brute-force/users/{userId}'].get
      update:
        description: 'Returns the user''s brute-force status: number of recent failed logins, whether they are currently disabled by lockout, and details such as last failure time and IP. Changes nothing.'
        responses:
            "401":
                description: Missing, invalid or expired admin bearer token; obtain a new token and retry.
            "403":
                description: Token lacks permission to view users in this realm; use an account with the needed role.
            "404":
                description: Realm or user not found; check the realm name and use the user's UUID, not the username.
        summary: Check whether a user is locked out by brute-force detection and their failed-login status
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not unlock anyone; use DELETE on the same path for one user, or DELETE on /brute-force/users for all users. Does not show the user's profile, password or permanent disabled state; use a user lookup operation.
            whenToUse: Operator asks why a user cannot log in, whether an account is temporarily locked, or how many failed login attempts a user has.
    - target: $.paths['/admin/realms/{realm}/attack-detection/brute-force/users/{userId}'].get.parameters[?(@.name=='userId')]
      update:
        description: Internal user id (UUID) of the user in this realm, not the username. Get it from a user search/lookup operation.
    - target: $.paths['/admin/realms/{realm}/attack-detection/brute-force/users/{userId}'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (short name), e.g. 'master'. Must be an existing realm containing the user.
    - target: $.paths['/admin/realms/{realm}/authentication/authenticator-providers'].get
      update:
        description: Returns the registered authenticator providers (e.g. username/password form, OTP form) that can be added as executions in an authentication flow. Each entry carries a provider id and display info. Changes nothing.
        responses:
            "401":
                description: Missing or expired admin bearer token; obtain a new token and retry.
            "403":
                description: Token lacks permission to view realm authentication; use an account with the required admin role.
            "404":
                description: Realm does not exist; check the realm name.
        summary: List the authenticator types available for building login flows in a realm
        x-agent:
            risk: read
            whenNotToUse: Does not list authenticators for clients (use the client-authenticator-providers operation). Does not list the executions already in a flow or any saved configuration.
            whenToUse: Operator asks which authenticators or login steps can be added to a flow, or needs a valid provider id for a new execution.
    - target: $.paths['/admin/realms/{realm}/authentication/authenticator-providers'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (the realm's name string, not a UUID), e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/authentication/client-authenticator-providers'].get
      update:
        description: Returns the registered client authenticator providers (e.g. client secret, signed JWT) that a client can use to prove its identity to the realm. Changes nothing.
        responses:
            "401":
                description: Missing or expired admin bearer token; obtain a new token and retry.
            "403":
                description: Token lacks permission to view realm authentication; use an account with the required admin role.
            "404":
                description: Realm does not exist; check the realm name.
        summary: List the authenticator types available for authenticating clients (applications) in a realm
        x-agent:
            risk: read
            whenNotToUse: Does not list user login authenticators (use the authenticator-providers operation). Does not show which method a particular client uses.
            whenToUse: Operator asks which client authentication methods are supported in the realm.
    - target: $.paths['/admin/realms/{realm}/authentication/client-authenticator-providers'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (the realm's name string, not a UUID).
    - target: $.paths['/admin/realms/{realm}/authentication/config'].post
      update:
        description: Creates a new named configuration (alias plus key/value settings) for an authenticator. It is not attached to any execution by this call alone. Changes realm authentication settings, which can affect how users log in once the config is linked.
        responses:
            "400":
                description: Malformed body or invalid config values; check the body against the provider's config-description.
            "401":
                description: Missing or expired admin bearer token; obtain a new token and retry.
            "403":
                description: Token lacks permission to manage realm authentication; use an account with the required admin role.
            "404":
                description: Realm does not exist; check the realm name.
            "409":
                description: A config with this alias already exists; use a different alias.
        summary: Create a standalone authenticator configuration in a realm
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: To configure a specific step in a flow, use the execution config operation (POST .../executions/{executionId}/config), which also links the config to that execution. To change an existing config use PUT .../config/{id}.
            whenToUse: Operator wants to create an authenticator config record directly.
    - target: $.paths['/admin/realms/{realm}/authentication/config'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name (the realm's name string).
    - target: $.paths['/admin/realms/{realm}/authentication/config-description/{providerId}'].get
      update:
        description: Returns the list of configurable properties (name, label, type, default, help text) for an authenticator provider. Use it to know which keys to put in a config object. Changes nothing.
        responses:
            "401":
                description: Missing or expired admin bearer token; obtain a new token and retry.
            "403":
                description: Token lacks permission to view realm authentication; use an account with the required admin role.
            "404":
                description: Realm or provider id not found; check both values against the provider list.
        summary: Describe the settings an authenticator type accepts in its configuration
        x-agent:
            risk: read
            whenNotToUse: Does not return an actual saved configuration (use GET .../config/{id} or GET .../executions/{executionId}/config/{id}). Does not list providers (use authenticator-providers).
            whenToUse: Operator asks what options an authenticator supports, or you need valid config keys before creating or updating a config.
    - target: $.paths['/admin/realms/{realm}/authentication/config-description/{providerId}'].get.parameters[?(@.name=='providerId')]
      update:
        description: Authenticator provider id, taken from the authenticator-providers (or client-authenticator-providers) list.
    - target: $.paths['/admin/realms/{realm}/authentication/config-description/{providerId}'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (the realm's name string).
    - target: $.paths['/admin/realms/{realm}/authentication/config/{id}'].delete
      update:
        description: Permanently removes the saved configuration with this id. Any execution that used it loses its settings and may behave differently or fail at login. There is no undo.
        responses:
            "401":
                description: Missing or expired admin bearer token; obtain a new token and retry.
            "403":
                description: Token lacks permission to manage realm authentication; use an account with the required admin role.
            "404":
                description: Realm or config id not found; check the ids.
        summary: Delete an authenticator configuration
        x-agent:
            risk: irreversible
            whenNotToUse: To change settings instead of removing them, use PUT .../config/{id}. To remove a whole step from a flow, use DELETE .../executions/{executionId}.
            whenToUse: Operator explicitly asks to remove a specific authenticator configuration.
    - target: $.paths['/admin/realms/{realm}/authentication/config/{id}'].delete.parameters[?(@.name=='id')]
      update:
        description: Config id, from the execution's authenticatorConfig field or an earlier config response.
    - target: $.paths['/admin/realms/{realm}/authentication/config/{id}'].delete.parameters[?(@.name=='realm')]
      update:
        description: Realm name (the realm's name string).
    - target: $.paths['/admin/realms/{realm}/authentication/config/{id}'].get
      update:
        description: Returns the alias, id and key/value settings of the authenticator configuration with this id. Changes nothing. Config values may include sensitive settings.
        responses:
            "401":
                description: Missing or expired admin bearer token; obtain a new token and retry.
            "403":
                description: Token lacks permission to view realm authentication; use an account with the required admin role.
            "404":
                description: Realm or config id not found; check the ids.
        summary: Show one saved authenticator configuration
        x-agent:
            risk: read
            whenNotToUse: Does not describe which options are possible (use config-description/{providerId}). If you only have an execution id, use GET .../executions/{executionId}/config/{id} or first get the execution to find its config id.
            whenToUse: Operator asks what settings a specific authenticator config currently holds.
    - target: $.paths['/admin/realms/{realm}/authentication/config/{id}'].get.parameters[?(@.name=='id')]
      update:
        description: Config id, from an execution's authenticatorConfig field.
    - target: $.paths['/admin/realms/{realm}/authentication/config/{id}'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (the realm's name string).
    - target: $.paths['/admin/realms/{realm}/authentication/config/{id}'].put
      update:
        description: Replaces the alias and settings of the configuration with this id using the body. This changes login behavior for every execution that uses the config.
        responses:
            "400":
                description: Malformed body or invalid config values; check against config-description.
            "401":
                description: Missing or expired admin bearer token; obtain a new token and retry.
            "403":
                description: Token lacks permission to manage realm authentication; use an account with the required admin role.
            "404":
                description: Realm or config id not found; check the ids.
        summary: Update an existing authenticator configuration
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: To create a new config for a flow step, use POST .../executions/{executionId}/config. To remove a config, use DELETE .../config/{id}.
            whenToUse: Operator wants to change settings of an existing authenticator config.
    - target: $.paths['/admin/realms/{realm}/authentication/config/{id}'].put.parameters[?(@.name=='id')]
      update:
        description: Id of the config to update, from the execution's authenticatorConfig field.
    - target: $.paths['/admin/realms/{realm}/authentication/config/{id}'].put.parameters[?(@.name=='realm')]
      update:
        description: Realm name (the realm's name string).
    - target: $.paths['/admin/realms/{realm}/authentication/executions'].post
      update:
        description: Creates an execution in a flow, either a single authenticator or a sub-flow, with a requirement level and priority. This changes how users log in to the realm right away. Note that the body has both 'authenticatorFlow' and a misspelled 'autheticatorFlow' field.
        responses:
            "400":
                description: Missing or invalid fields, such as an unknown authenticator or parent flow; check the ids and requirement value.
            "401":
                description: Missing or expired admin bearer token; obtain a new token and retry.
            "403":
                description: Token lacks permission to manage realm authentication; use an account with the required admin role.
            "404":
                description: Realm or parent flow not found; check the ids.
        summary: Add a new execution (step) to an authentication flow
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Does not edit or remove an existing step (use DELETE .../executions/{executionId}). Does not set the step's settings (use POST .../executions/{executionId}/config).
            whenToUse: Operator wants to add an authenticator step to an existing flow.
    - target: $.paths['/admin/realms/{realm}/authentication/executions'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name (the realm's name string).
    - target: $.paths['/admin/realms/{realm}/authentication/executions/{executionId}'].delete
      update:
        description: Permanently deletes the execution with this id from its flow. The change takes effect for logins right away, and removing a required step can weaken or break login. There is no undo.
        responses:
            "401":
                description: Missing or expired admin bearer token; obtain a new token and retry.
            "403":
                description: Token lacks permission to manage realm authentication; use an account with the required admin role.
            "404":
                description: Realm or execution not found; check the ids.
        summary: Remove an execution (step) from an authentication flow
        x-agent:
            risk: irreversible
            whenNotToUse: To only turn a step off or change its requirement, update the execution instead (not available here). To remove just its settings, use DELETE .../config/{id}.
            whenToUse: Operator explicitly asks to remove a specific step from a login flow.
    - target: $.paths['/admin/realms/{realm}/authentication/executions/{executionId}'].delete.parameters[?(@.name=='executionId')]
      update:
        description: Execution id, from the flow's execution list or the create response.
    - target: $.paths['/admin/realms/{realm}/authentication/executions/{executionId}'].delete.parameters[?(@.name=='realm')]
      update:
        description: Realm name (the realm's name string).
    - target: $.paths['/admin/realms/{realm}/authentication/executions/{executionId}'].get
      update:
        description: 'Returns the details of an execution: authenticator, requirement, priority, parent flow and attached config id. Changes nothing.'
        responses:
            "401":
                description: Missing or expired admin bearer token; obtain a new token and retry.
            "403":
                description: Token lacks permission to view realm authentication; use an account with the required admin role.
            "404":
                description: Realm or execution not found; check the ids.
        summary: Show one execution (step) of an authentication flow
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not return the config's settings (use GET .../config/{id}). Does not list all steps of a flow.
            whenToUse: Operator asks about a specific login step, or you need its authenticatorConfig id to read its settings.
    - target: $.paths['/admin/realms/{realm}/authentication/executions/{executionId}'].get.parameters[?(@.name=='executionId')]
      update:
        description: Execution id, from a flow's execution list.
    - target: $.paths['/admin/realms/{realm}/authentication/executions/{executionId}'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (the realm's name string).
    - target: $.paths['/admin/realms/{realm}/authentication/executions/{executionId}/config'].post
      update:
        description: Creates a new authenticator config with the given alias and settings and links it to this execution. The settings apply to logins right away. This may change login behavior and may fail if the execution already has a config.
        responses:
            "400":
                description: Malformed body or invalid config values; check against config-description.
            "401":
                description: Missing or expired admin bearer token; obtain a new token and retry.
            "403":
                description: Token lacks permission to manage realm authentication; use an account with the required admin role.
            "404":
                description: Realm or execution not found; check the ids.
            "409":
                description: Alias already in use; choose a different alias.
        summary: Create and attach a configuration to an execution
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: To change a config that already exists, use PUT .../config/{id}. To only read settings, use the GET config operations.
            whenToUse: Operator wants to configure a specific login step, such as setting OTP options.
    - target: $.paths['/admin/realms/{realm}/authentication/executions/{executionId}/config'].post.parameters[?(@.name=='executionId')]
      update:
        description: Execution id, from a flow's execution list.
    - target: $.paths['/admin/realms/{realm}/authentication/executions/{executionId}/config'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name (the realm's name string).
    - target: $.paths['/admin/realms/{realm}/authentication/executions/{executionId}/config/{id}'].get
      update:
        description: Returns the alias, id and settings of the config with this id for the given execution. Changes nothing. Config values may include sensitive settings.
        responses:
            "401":
                description: Missing or expired admin bearer token; obtain a new token and retry.
            "403":
                description: Token lacks permission to view realm authentication; use an account with the required admin role.
            "404":
                description: Realm, execution or config not found; check the ids and that the config belongs to this execution.
        summary: Show the configuration attached to an execution
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: If you only need the config by id, GET .../config/{id} is simpler. It does not describe the possible options (use config-description/{providerId}).
            whenToUse: Operator asks what settings a specific login step uses and you have both the execution and config ids.
    - target: $.paths['/admin/realms/{realm}/authentication/executions/{executionId}/config/{id}'].get.parameters[?(@.name=='executionId')]
      update:
        description: Execution id, from a flow's execution list.
    - target: $.paths['/admin/realms/{realm}/authentication/executions/{executionId}/config/{id}'].get.parameters[?(@.name=='id')]
      update:
        description: Config id, from the execution's authenticatorConfig field.
    - target: $.paths['/admin/realms/{realm}/authentication/executions/{executionId}/config/{id}'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (the realm's name string).
    - target: $.paths['/admin/realms/{realm}/authentication/executions/{executionId}/lower-priority'].post
      update:
        description: Lowers the priority of one execution (step) inside an authentication flow, so it runs after the step that follows it. Changes the live login behaviour of the realm immediately. Returns no body on success.
        responses:
            "401":
                description: Missing or expired admin bearer token; get a new token and retry.
            "403":
                description: Token lacks realm-management rights for this realm (manage-realm); use an account with those rights.
            "404":
                description: Realm or execution id does not exist; check realm name and take executionId from the executions list.
        summary: Move an authentication step one position later in its login flow
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Does not move a step earlier (use raise-priority). Does not change whether a step is required/optional (use PUT .../flows/{flowAlias}/executions). Does not list steps (use GET .../flows/{flowAlias}/executions).
            whenToUse: Operator asks to make a step in a login/authentication flow run later, or to move it down in the order.
    - target: $.paths['/admin/realms/{realm}/authentication/executions/{executionId}/lower-priority'].post.parameters[?(@.name=='executionId')]
      update:
        description: Id of the execution step; take it from the 'id' field of GET /admin/realms/{realm}/authentication/flows/{flowAlias}/executions.
    - target: $.paths['/admin/realms/{realm}/authentication/executions/{executionId}/lower-priority'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not its UUID), e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/authentication/executions/{executionId}/raise-priority'].post
      update:
        description: Raises the priority of one execution (step) inside an authentication flow, so it runs before the step that precedes it. Changes the live login behaviour of the realm immediately. Returns no body on success.
        responses:
            "401":
                description: Missing or expired admin bearer token; get a new token and retry.
            "403":
                description: Token lacks realm-management rights for this realm (manage-realm); use an account with those rights.
            "404":
                description: Realm or execution id does not exist; check realm name and take executionId from the executions list.
        summary: Move an authentication step one position earlier in its login flow
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Does not move a step later (use lower-priority). Does not change whether a step is required/optional (use PUT .../flows/{flowAlias}/executions). Does not list steps (use GET .../flows/{flowAlias}/executions).
            whenToUse: Operator asks to make a step in a login/authentication flow run earlier, or to move it up in the order.
    - target: $.paths['/admin/realms/{realm}/authentication/executions/{executionId}/raise-priority'].post.parameters[?(@.name=='executionId')]
      update:
        description: Id of the execution step; take it from the 'id' field of GET /admin/realms/{realm}/authentication/flows/{flowAlias}/executions.
    - target: $.paths['/admin/realms/{realm}/authentication/executions/{executionId}/raise-priority'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not its UUID), e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/authentication/flows'].get
      update:
        description: Returns every authentication flow (login, registration, browser, direct grant, etc.), built-in and custom, with alias, id, description and whether it is top-level or built-in. Does not include the individual steps in detail.
        responses:
            "401":
                description: Missing or expired admin bearer token; get a new token and retry.
            "403":
                description: Token lacks view-realm rights for this realm; use an account with those rights.
            "404":
                description: Realm does not exist; check the realm name.
        summary: List all authentication flows of a realm
        x-agent:
            risk: read
            whenNotToUse: Does not return the steps of a flow (use GET .../flows/{flowAlias}/executions). For one flow by id use GET .../flows/{id}.
            whenToUse: Operator asks which login/authentication flows exist, or needs a flow's id or alias.
    - target: $.paths['/admin/realms/{realm}/authentication/flows'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not its UUID), e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/authentication/flows'].post
      update:
        description: Creates a custom authentication flow from the supplied definition. The new flow has no steps until executions are added. Returns no body on success; the new flow's URL is typically in the Location header.
        responses:
            "400":
                description: Invalid body or missing alias; send a JSON object with a unique alias.
            "401":
                description: Missing or expired admin bearer token; get a new token and retry.
            "403":
                description: Token lacks manage-realm rights; use an account with those rights.
            "409":
                description: A flow with this alias already exists; choose another alias.
        summary: Create a new, empty authentication flow
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: To duplicate an existing flow with its steps use POST .../flows/{flowAlias}/copy. To change an existing flow use PUT .../flows/{id}. To add steps use POST .../executions/execution or .../executions/flow.
            whenToUse: Operator asks to create a new login/authentication flow from scratch.
    - target: $.paths['/admin/realms/{realm}/authentication/flows'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not its UUID), e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/authentication/flows/{flowAlias}/copy'].post
      update:
        description: Duplicates an existing flow, including its steps, as a new custom flow. The body names the new flow. The original is unchanged.
        responses:
            "400":
                description: 'newName missing or empty; send {"newName": "<unique name>"}.'
            "401":
                description: Missing or expired admin bearer token; get a new token and retry.
            "403":
                description: Token lacks manage-realm rights; use an account with those rights.
            "404":
                description: Source flow alias not found; check it against GET .../flows.
            "409":
                description: A flow named newName already exists; choose another name.
        summary: Copy an authentication flow under a new name
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: To make an empty flow use POST .../flows. Built-in flows cannot be edited, so copy first, then edit the copy. Copying does not bind the copy to any login; that is a separate realm setting.
            whenToUse: Operator wants a customised variant of an existing flow (e.g. copy 'browser' before editing it).
    - target: $.paths['/admin/realms/{realm}/authentication/flows/{flowAlias}/copy'].post.parameters[?(@.name=='flowAlias')]
      update:
        description: Alias of the flow to copy, e.g. 'browser'; take it from GET .../flows.
    - target: $.paths['/admin/realms/{realm}/authentication/flows/{flowAlias}/copy'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not its UUID), e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/authentication/flows/{flowAlias}/executions'].get
      update:
        description: Returns the executions (authenticators and sub-flows) of one flow, in run order, with id, display name, requirement (e.g. required/alternative/disabled), level, index, priority and any config id. Use the ids returned here for the priority and update operations.
        responses:
            "401":
                description: Missing or expired admin bearer token; get a new token and retry.
            "403":
                description: Token lacks view-realm rights; use an account with those rights.
            "404":
                description: Flow alias not found in this realm; check it against GET .../flows. URL-encode aliases with spaces.
        summary: List the steps of an authentication flow in order
        x-agent:
            risk: read
            whenNotToUse: Does not list the flows themselves (use GET .../flows). Does not change anything.
            whenToUse: Operator asks what steps a login flow has, in what order, or whether a step is required, alternative or disabled; also to find an executionId.
    - target: $.paths['/admin/realms/{realm}/authentication/flows/{flowAlias}/executions'].get.parameters[?(@.name=='flowAlias')]
      update:
        description: Alias (name) of the flow, e.g. 'browser'; take it from GET .../flows. Not the flow id.
    - target: $.paths['/admin/realms/{realm}/authentication/flows/{flowAlias}/executions'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not its UUID), e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/authentication/flows/{flowAlias}/executions'].put
      update:
        description: Updates one execution inside the flow, most commonly its requirement (required, alternative, disabled, conditional). Takes effect immediately on logins in the realm, so a wrong value can lock users out. Returns no body on success.
        responses:
            "400":
                description: Invalid body or a requirement not allowed for this step; pick a value from the step's requirementChoices.
            "401":
                description: Missing or expired admin bearer token; get a new token and retry.
            "403":
                description: Token lacks manage-realm rights; use an account with those rights.
            "404":
                description: Flow alias or step id not found; re-read GET .../executions.
        summary: Update a step of an authentication flow (e.g. its requirement)
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Does not reorder steps (use raise-priority / lower-priority). Does not add a step (use POST .../executions/execution or .../executions/flow). Does not rename or edit the flow itself (use PUT .../flows/{id}).
            whenToUse: Operator asks to make a login step required, optional/alternative, disabled or conditional.
    - target: $.paths['/admin/realms/{realm}/authentication/flows/{flowAlias}/executions'].put.parameters[?(@.name=='flowAlias')]
      update:
        description: Alias of the flow containing the step; take it from GET .../flows.
    - target: $.paths['/admin/realms/{realm}/authentication/flows/{flowAlias}/executions'].put.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not its UUID), e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/authentication/flows/{flowAlias}/executions/execution'].post
      update:
        description: Adds a new execution (a single authenticator such as password or OTP form) to the end of the named flow. Takes effect immediately on logins. Returns no body on success.
        responses:
            "400":
                description: Provider missing or unknown; send a valid authenticator provider id.
            "401":
                description: Missing or expired admin bearer token; get a new token and retry.
            "403":
                description: Token lacks manage-realm rights; use an account with those rights.
            "404":
                description: Flow alias not found; check it against GET .../flows.
            "409":
                description: Flow is built-in or cannot be modified; copy it and edit the copy.
        summary: Add an authenticator step to an authentication flow
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: To add a nested sub-flow use POST .../executions/flow. To change an existing step use PUT .../executions. Built-in flows usually cannot be edited; copy them first.
            whenToUse: Operator asks to add a login step such as password, OTP or cookie check to a custom flow.
    - target: $.paths['/admin/realms/{realm}/authentication/flows/{flowAlias}/executions/execution'].post.parameters[?(@.name=='flowAlias')]
      update:
        description: Alias of the flow to add the step to; take it from GET .../flows.
    - target: $.paths['/admin/realms/{realm}/authentication/flows/{flowAlias}/executions/execution'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not its UUID), e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/authentication/flows/{flowAlias}/executions/flow'].post
      update:
        description: Creates a new sub-flow inside the named flow and appends it as a step. The sub-flow starts empty; add steps to it afterwards. Takes effect immediately on logins.
        responses:
            "400":
                description: Invalid body or missing alias; send a unique alias.
            "401":
                description: Missing or expired admin bearer token; get a new token and retry.
            "403":
                description: Token lacks manage-realm rights; use an account with those rights.
            "404":
                description: Parent flow alias not found; check it against GET .../flows.
            "409":
                description: Sub-flow alias already exists or parent is built-in; choose another alias or edit a copy.
        summary: Add a nested sub-flow to an authentication flow
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: To add a single authenticator use POST .../executions/execution. To create a top-level flow use POST .../flows.
            whenToUse: Operator asks to group steps inside a flow, e.g. a conditional OTP block, by adding a sub-flow.
    - target: $.paths['/admin/realms/{realm}/authentication/flows/{flowAlias}/executions/flow'].post.parameters[?(@.name=='flowAlias')]
      update:
        description: Alias of the parent flow; take it from GET .../flows.
    - target: $.paths['/admin/realms/{realm}/authentication/flows/{flowAlias}/executions/flow'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not its UUID), e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/authentication/flows/{id}'].delete
      update:
        description: Permanently removes a custom flow and its steps. It cannot be undone, and deleting a flow that is bound to a login (e.g. browser login) can break sign-in for the realm. Built-in flows and flows currently in use are normally refused.
        responses:
            "400":
                description: Flow is built-in or still used by a binding or client; unbind it first or choose another flow.
            "401":
                description: Missing or expired admin bearer token; get a new token and retry.
            "403":
                description: Token lacks manage-realm rights; use an account with those rights.
            "404":
                description: No flow with this id; take the id from GET .../flows.
        summary: Delete an authentication flow
        x-agent:
            needsReview: true
            risk: irreversible
            whenNotToUse: Not for removing one step from a flow, and not for disabling a step (use PUT .../executions with requirement DISABLED). Confirm the flow is no longer bound before deleting.
            whenToUse: Operator explicitly asks to delete a custom authentication flow.
    - target: $.paths['/admin/realms/{realm}/authentication/flows/{id}'].delete.parameters[?(@.name=='id')]
      update:
        description: Flow id (UUID) from the 'id' field of GET .../flows; this is the id, not the alias.
    - target: $.paths['/admin/realms/{realm}/authentication/flows/{id}'].delete.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not its UUID), e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/authentication/flows/{id}'].get
      update:
        description: 'Returns the definition of a single flow: alias, description, provider type, top-level and built-in flags. Look up by id, not alias.'
        responses:
            "401":
                description: Missing or expired admin bearer token; get a new token and retry.
            "403":
                description: Token lacks view-realm rights; use an account with those rights.
            "404":
                description: No flow with this id; take the id from GET .../flows.
        summary: Get one authentication flow by id
        x-agent:
            risk: read
            whenNotToUse: To find a flow by alias or list all use GET .../flows. To see its steps use GET .../flows/{flowAlias}/executions.
            whenToUse: Operator has a flow id and wants its details.
    - target: $.paths['/admin/realms/{realm}/authentication/flows/{id}'].get.parameters[?(@.name=='id')]
      update:
        description: Flow id (UUID) from the 'id' field of GET .../flows.
    - target: $.paths['/admin/realms/{realm}/authentication/flows/{id}'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not its UUID), e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/authentication/flows/{id}'].put
      update:
        description: Updates the flow's own properties (alias, description) from the supplied definition. It does not change the steps. Built-in flows normally cannot be modified.
        responses:
            "400":
                description: Invalid body, or flow is built-in; send a full flow object and edit only custom flows.
            "401":
                description: Missing or expired admin bearer token; get a new token and retry.
            "403":
                description: Token lacks manage-realm rights; use an account with those rights.
            "404":
                description: No flow with this id; take the id from GET .../flows.
            "409":
                description: Another flow already uses this alias; choose a different alias.
        summary: Update an authentication flow's name or description
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for changing step requirements or order (use PUT .../executions and the priority operations). Not for creating a flow (use POST .../flows).
            whenToUse: Operator asks to rename a custom flow or change its description.
    - target: $.paths['/admin/realms/{realm}/authentication/flows/{id}'].put.parameters[?(@.name=='id')]
      update:
        description: Flow id (UUID) from the 'id' field of GET .../flows.
    - target: $.paths['/admin/realms/{realm}/authentication/flows/{id}'].put.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not its UUID), e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/authentication/form-action-providers'].get
      update:
        description: Returns the form action provider types (e.g. registration steps such as user creation, password, profile validation, recaptcha) that can be added to a form-based authentication flow. It is a read-only catalogue of provider types, not the configured flows.
        responses:
            "401":
                description: Missing or expired admin bearer token; obtain a new access token and retry.
            "403":
                description: Token lacks permission to view realm authentication; use an account with realm admin/view-realm rights.
            "404":
                description: Realm does not exist; check the realm name.
        summary: List available form action providers for authentication flows in a realm
        x-agent:
            risk: read
            whenNotToUse: Not for the form providers themselves (use form-providers), not for required actions (use required-actions), and not for the flows currently configured in the realm.
            whenToUse: Operator asks which form action steps can be added to a registration or form flow in a realm.
    - target: $.paths['/admin/realms/{realm}/authentication/form-action-providers'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (the realm id/slug used in URLs, e.g. 'master'), not the display name.
    - target: $.paths['/admin/realms/{realm}/authentication/form-providers'].get
      update:
        description: Returns the form provider types (e.g. the registration form) that can be used as a form-type execution in an authentication flow. It is a read-only catalogue of provider types.
        responses:
            "401":
                description: Missing or expired admin bearer token; obtain a new access token and retry.
            "403":
                description: Token lacks permission to view realm authentication; use an account with realm admin/view-realm rights.
            "404":
                description: Realm does not exist; check the realm name.
        summary: List available form providers for authentication flows in a realm
        x-agent:
            risk: read
            whenNotToUse: Not for the steps inside a form (use form-action-providers), not for required actions (use required-actions), and not for client authenticator config descriptions (use per-client-config-description).
            whenToUse: Operator asks which form providers/types can be used when building a form-based flow in a realm.
    - target: $.paths['/admin/realms/{realm}/authentication/form-providers'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (the realm id/slug used in URLs, e.g. 'master').
    - target: $.paths['/admin/realms/{realm}/authentication/per-client-config-description'].get
      update:
        description: Returns, per client authenticator provider, the configuration properties it accepts (names, types, help text). Read-only metadata used to build per-client authenticator configuration.
        responses:
            "401":
                description: Missing or expired admin bearer token; obtain a new access token and retry.
            "403":
                description: Token lacks permission to view realm authentication; use an account with realm admin/view-realm rights.
            "404":
                description: Realm does not exist; check the realm name.
        summary: List config property descriptions for client authenticators in a realm
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Not for required action config (use required-actions/{alias}/config-description) and not for the current configured values of any authenticator.
            whenToUse: Operator asks what settings a client authenticator supports or how to configure client authentication in a realm.
    - target: $.paths['/admin/realms/{realm}/authentication/per-client-config-description'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (the realm id/slug used in URLs, e.g. 'master').
    - target: $.paths['/admin/realms/{realm}/authentication/register-required-action'].post
      update:
        description: Registers a required action provider (by its provider id and name) so it becomes available as a required action in the realm. Changes realm authentication configuration; the body is an unspecified object.
        responses:
            "400":
                description: Body invalid or providerId missing/unknown; send a valid providerId and name.
            "401":
                description: Missing or expired admin bearer token; obtain a new access token and retry.
            "403":
                description: Token lacks permission to manage realm authentication; use an account with realm admin/manage-realm rights.
            "404":
                description: Realm does not exist; check the realm name.
            "409":
                description: Required action already registered; use PUT required-actions/{alias} to modify it.
        summary: Register a new required action provider in a realm
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for changing an already registered required action (use PUT required-actions/{alias}) and not for listing them (use GET required-actions).
            whenToUse: Operator wants to add or enable a new required action type (e.g. a custom or unregistered one) in a realm.
    - target: $.paths['/admin/realms/{realm}/authentication/register-required-action'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name (the realm id/slug used in URLs, e.g. 'master').
    - target: $.paths['/admin/realms/{realm}/authentication/required-actions'].get
      update:
        description: Returns all registered required actions (e.g. verify email, update password, configure OTP) with alias, name, enabled, default-action flag and priority. Read-only.
        responses:
            "401":
                description: Missing or expired admin bearer token; obtain a new access token and retry.
            "403":
                description: Token lacks permission to view realm authentication; use an account with realm admin/view-realm rights.
            "404":
                description: Realm does not exist; check the realm name.
        summary: List the required actions configured in a realm
        x-agent:
            risk: read
            whenNotToUse: Not for a single action's details (use GET required-actions/{alias}), not for its settings (use .../config), and not for assigning a required action to a user.
            whenToUse: Operator asks which required actions exist, which are enabled or set as default, or what their order is in a realm.
    - target: $.paths['/admin/realms/{realm}/authentication/required-actions'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (the realm id/slug used in URLs, e.g. 'master').
    - target: $.paths['/admin/realms/{realm}/authentication/required-actions/{alias}'].delete
      update:
        description: Removes the registered required action with this alias from the realm. Users or flows that relied on it will no longer be prompted for it, and the deletion cannot be undone except by registering it again.
        responses:
            "401":
                description: Missing or expired admin bearer token; obtain a new access token and retry.
            "403":
                description: Token lacks permission to manage realm authentication; use an account with realm admin/manage-realm rights.
            "404":
                description: Realm or alias not found; check both against GET required-actions.
        summary: Delete a required action from a realm
        x-agent:
            risk: irreversible
            whenNotToUse: Not for temporarily turning it off (use PUT required-actions/{alias} with enabled=false) and not for removing only its config (use DELETE .../config).
            whenToUse: Operator explicitly asks to remove or unregister a required action from a realm.
    - target: $.paths['/admin/realms/{realm}/authentication/required-actions/{alias}'].delete.parameters[?(@.name=='alias')]
      update:
        description: Alias of the required action, from GET required-actions (e.g. 'VERIFY_EMAIL').
    - target: $.paths['/admin/realms/{realm}/authentication/required-actions/{alias}'].delete.parameters[?(@.name=='realm')]
      update:
        description: Realm name (the realm id/slug used in URLs, e.g. 'master').
    - target: $.paths['/admin/realms/{realm}/authentication/required-actions/{alias}'].get
      update:
        description: 'Returns the required action with this alias: name, provider id, enabled, default-action flag, priority and config. Read-only.'
        responses:
            "401":
                description: Missing or expired admin bearer token; obtain a new access token and retry.
            "403":
                description: Token lacks permission to view realm authentication; use an account with realm admin/view-realm rights.
            "404":
