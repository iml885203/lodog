    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/default-client-scopes/{clientScopeId}'].delete.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not UUID).
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/default-client-scopes/{clientScopeId}'].delete.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client, from GET .../clients.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/default-client-scopes/{clientScopeId}'].put
      update:
        description: Assigns the scope as a default for the client, so its claims and roles are included in new tokens. Takes no body and is safe to repeat. Returns 204 on success.
        responses:
            "401":
                description: Missing or expired admin token; re-authenticate.
