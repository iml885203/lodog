        x-agent:
            risk: read
            whenNotToUse: Does not fetch a single scope by id (use GET /admin/realms/{realm}/client-scopes/{client-scope-id}). Does not list clients or users.
            whenToUse: Operator asks which client scopes exist in a realm, or needs the id of a scope by its name.
    - target: $.paths['/admin/realms/{realm}/client-scopes'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not a UUID), e.g. 'master'. Must be an existing realm.
    - target: $.paths['/admin/realms/{realm}/client-scopes'].post
      update:
        description: Creates a client scope from the JSON body, optionally with attributes and protocol mappers. Returns no body on success; the new scope's URL is in the Location header, which contains its id. The name must be unique within the realm.
        responses:
            "400":
                description: Body is malformed or invalid (e.g. unknown protocol); fix the JSON.
            "401":
                description: Missing or expired admin token; get a new one.
            "403":
                description: Token lacks permission to manage clients in this realm.
            "404":
                description: Realm does not exist; check the realm name.
            "409":
                description: A client scope with this name already exists; choose another name.
