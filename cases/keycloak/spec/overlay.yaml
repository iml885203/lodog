    - target: $.paths['/admin/realms/{realm}/events'].delete
      update:
        description: Permanently clears every stored login/user event for the realm. This cannot be undone and removes the audit trail. It takes no filters, so everything is deleted.
        responses:
            "401":
                description: Missing or expired admin token; obtain a new one.
            "403":
                description: Admin lacks permission to manage events; use an account with realm-management rights.
            "404":
                description: Realm not found; check realm name.
        summary: Delete all stored user events of a realm
        x-agent:
            needsReview: true
            risk: irreversible
            whenNotToUse: Not for viewing events (use GET /admin/realms/{realm}/events) and not for changing event settings (use PUT /admin/realms/{realm}/events/config). Does not delete admin events selectively.
            whenToUse: Operator explicitly asks to purge or clear all user event history of a realm.
    - target: $.paths['/admin/realms/{realm}/events'].delete.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not id), e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/events'].get
      update:
        description: Returns stored user events, optionally filtered by client, user, type, IP and date range, with offset paging via first/max. Only works if event storage is enabled for the realm; otherwise the list is empty.
        responses:
            "400":
                description: Bad date format or parameter value; use yyyy-MM-dd and integer first/max.
            "401":
                description: Missing or expired admin token; obtain a new one.
            "403":
                description: Admin lacks permission to view events.
            "404":
                description: Realm not found; check realm name.
        summary: List user events (logins, logouts, failures) of a realm
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Not for event settings (use GET /admin/realms/{realm}/events/config). Not for admin/configuration change audit events.
            whenToUse: 'Operator asks what happened for a user or client: login attempts, failed logins, registrations, token errors, within a period.'
    - target: $.paths['/admin/realms/{realm}/events'].get.parameters[?(@.name=='client')]
      update:
        description: Client id (the clientId string, e.g. 'account') to filter by.
    - target: $.paths['/admin/realms/{realm}/events'].get.parameters[?(@.name=='dateFrom')]
      update:
        description: Earliest event date, format yyyy-MM-dd.
    - target: $.paths['/admin/realms/{realm}/events'].get.parameters[?(@.name=='dateTo')]
      update:
        description: Latest event date, format yyyy-MM-dd.
    - target: $.paths['/admin/realms/{realm}/events'].get.parameters[?(@.name=='direction')]
      update:
        description: Sort order by time; 'asc' or 'desc' (default newest first).
    - target: $.paths['/admin/realms/{realm}/events'].get.parameters[?(@.name=='first')]
      update:
        description: Offset of first result for paging, starting at 0.
    - target: $.paths['/admin/realms/{realm}/events'].get.parameters[?(@.name=='ipAddress')]
      update:
        description: Client IP address to filter by.
    - target: $.paths['/admin/realms/{realm}/events'].get.parameters[?(@.name=='max')]
      update:
        description: Maximum number of events to return (page size); send it to avoid a huge result.
    - target: $.paths['/admin/realms/{realm}/events'].get.parameters[?(@.name=='type')]
      update:
        description: Event types to filter by, repeatable, e.g. LOGIN, LOGIN_ERROR, LOGOUT, REGISTER, UPDATE_PASSWORD.
    - target: $.paths['/admin/realms/{realm}/events'].get.parameters[?(@.name=='user')]
      update:
        description: User id (UUID) to filter by, not the username.
    - target: $.paths['/admin/realms/{realm}/events'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not id), e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/events/config'].get
      update:
        description: Returns whether user events and admin events are recorded, which event types are enabled, retention time and event listeners. Changes nothing.
        responses:
            "401":
                description: Missing or expired admin token; obtain a new one.
            "403":
                description: Admin lacks permission to view realm settings.
            "404":
                description: Realm not found; check realm name.
        summary: Show event logging settings of a realm
        x-agent:
            risk: read
            whenNotToUse: Not for the events themselves (use GET /admin/realms/{realm}/events). Not for changing settings (use PUT on the same path).
            whenToUse: Operator asks whether event logging is on, how long events are kept, or which types are recorded.
    - target: $.paths['/admin/realms/{realm}/events/config'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not id), e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/events/config'].put
      update:
        description: 'Replaces the realm''s event configuration: turns user and admin event recording on or off, sets enabled event types, retention and listeners. Send the full object, since omitted fields may be reset. Turning events off or shortening expiration can stop recording or lead to old events being dropped.'
        responses:
            "400":
                description: Invalid body or unknown event type/listener; send valid JSON with known values.
            "401":
                description: Missing or expired admin token; obtain a new one.
            "403":
                description: Admin lacks permission to manage realm settings.
            "404":
                description: Realm not found; check realm name.
        summary: Change event logging settings of a realm
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for reading settings (use GET on the same path) and not for deleting stored events (use DELETE /admin/realms/{realm}/events).
            whenToUse: Operator asks to enable or disable event logging, change retention, or change which event types or listeners are active.
    - target: $.paths['/admin/realms/{realm}/events/config'].put.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not id), e.g. 'master'.
