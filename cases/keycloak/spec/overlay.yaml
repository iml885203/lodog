    - target: $.paths['/admin/realms/{realm}/authentication/required-actions/{alias}/lower-priority'].post
      update:
        description: Changes the priority of one required action (e.g. VERIFY_EMAIL, UPDATE_PASSWORD) in the realm by moving it one position down, which changes the order in which users are asked to complete required actions at login. Takes no request body and returns no content on success. It changes realm configuration immediately and affects all users of the realm.
