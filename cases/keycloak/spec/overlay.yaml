    - target: $.paths['/admin/realms/{realm}/client-scopes'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/client-scopes/{client-scope-id}'].delete
      update:
        description: Permanently removes the scope and its protocol mappers. Clients that had the scope assigned lose it, which can change the claims in their tokens. Cannot be undone.
        responses:
            "400":
                description: Scope cannot be deleted (e.g. it is a protected built-in or realm default); pick a different scope.
            "401":
                description: Missing or expired admin token; get a new one.
            "403":
                description: Token lacks permission to manage clients in this realm.
            "404":
                description: Realm or scope id not found; look the id up in the list first.
