            "400":
                description: A profile is invalid or is still used by a policy; fix the body
            "401":
                description: Missing or expired admin token; obtain a new one
            "403":
                description: Caller lacks permission to manage realm profiles
            "404":
                description: Realm name does not exist
        summary: Replace the client policy profiles of a realm
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for the policies themselves, use PUT .../client-policies/policies. Not for reading, use GET.
            whenToUse: Operator asks to add, change or remove a client policy profile.
    - target: $.paths['/admin/realms/{realm}/client-policies/profiles'].put.parameters[?(@.name=='realm')]
      update:
        description: Realm name, as listed by GET /admin/realms.
    - target: $.paths['/admin/realms/{realm}/client-registration-policy/providers'].get
      update:
        description: Returns the policy provider types (for example, allowed client scopes, trusted hosts, max clients) that can be used when creating client registration policies in the realm. It lists available provider types and their configuration properties, not the policies actually configured. Changes nothing.
        responses:
            "401":
                description: Missing, invalid or expired admin access token; obtain a fresh token and retry.
