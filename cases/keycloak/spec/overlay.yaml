      update:
        description: Realm name (not a UUID), as it appears in the Keycloak URL, e.g. 'master'. Must be an existing realm the caller has admin access to.
    - target: $.paths['/admin/realms/{realm}/client-scopes'].get
      update:
        description: Returns every client scope in the realm, each with its id, name, description, protocol, attributes and protocol mappers. No paging or filtering is available. Does not show which clients use a scope.
        responses:
            "401":
                description: Missing or expired admin bearer token; obtain a new token and retry.
            "403":
                description: Token lacks permission to view clients in this realm; use an account with the right realm-management role.
            "404":
                description: Realm does not exist; check the realm name.
