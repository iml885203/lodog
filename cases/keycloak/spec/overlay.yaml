    - target: $.paths['/admin/realms/{realm}/client-policies/profiles'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, as listed by GET /admin/realms.
    - target: $.paths['/admin/realms/{realm}/client-policies/profiles'].put
      update:
        description: Overwrites the realm's client policy profiles with the ones in the body. Profiles left out are likely removed, and removing a profile still used by a policy may be rejected, so read the current ones first and send the full set.
