      update:
        description: Full group path, such as 'Sales/EMEA' (parent groups separated by '/'); URL-encode it.
    - target: $.paths['/admin/realms/{realm}/group-by-path/{path}'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not id), e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/groups'].get
      update:
        description: Returns a page of top-level groups, each with its subgroup tree unless briefRepresentation is true. With search, it matches group names at any depth and, by default, returns the matches inside their parent hierarchy. Paging is controlled by first and max.
        responses:
            "401":
                description: Missing, invalid or expired bearer token; get a new admin access token.
            "403":
                description: Token lacks permission to view groups in this realm (needs view-users or query-groups role); use an account with it.
            "404":
                description: Realm not found; check the realm name.
        summary: List or search the realm's top-level groups
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not list members (use GET /groups/{group-id}/members). Does not list subgroups of one group (use GET /groups/{group-id}/children). Does not just count groups (use GET /groups/count).
            whenToUse: Operator wants to see all groups, find a group by name, find groups by attribute, or look up a group id from its name.
    - target: $.paths['/admin/realms/{realm}/groups'].get.parameters[?(@.name=='briefRepresentation')]
      update:
        description: true = return only basic fields (id, name, path), without attributes and roles; false = return full representation.
    - target: $.paths['/admin/realms/{realm}/groups'].get.parameters[?(@.name=='exact')]
      update:
        description: true = search must match the name exactly; false or omitted = partial match.
    - target: $.paths['/admin/realms/{realm}/groups'].get.parameters[?(@.name=='first')]
      update:
        description: Zero-based index of the first result, for paging.
    - target: $.paths['/admin/realms/{realm}/groups'].get.parameters[?(@.name=='max')]
      update:
        description: Maximum number of results to return, for paging.
    - target: $.paths['/admin/realms/{realm}/groups'].get.parameters[?(@.name=='populateHierarchy')]
      update:
        description: true = a search result includes the parent groups of each match so the tree is visible; false = return only the matches.
    - target: $.paths['/admin/realms/{realm}/groups'].get.parameters[?(@.name=='q')]
      update:
        description: Attribute filter, format 'key:value', several pairs separated by spaces. Only groups with those attributes are returned.
    - target: $.paths['/admin/realms/{realm}/groups'].get.parameters[?(@.name=='search')]
      update:
        description: Text to match against group names. Partial match unless exact=true.
    - target: $.paths['/admin/realms/{realm}/groups'].get.parameters[?(@.name=='subGroupsCount')]
      update:
        description: true = include subGroupCount on each group; false = omit it.
    - target: $.paths['/admin/realms/{realm}/groups'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not an id), e.g. 'master'. Path parameter.
    - target: $.paths['/admin/realms/{realm}/groups'].post
      update:
        description: Creates a group at the top level of the realm from the supplied body; name is the essential field. The new group's id is normally returned in the Location header, not in the body. A top-level group with the same name already existing is rejected.
        responses:
            "400":
                description: Body is malformed or name is missing or empty; send valid JSON with a name.
            "401":
                description: Missing or expired token; get a new admin token.
            "403":
                description: Token lacks permission to manage groups (needs manage-users); use an account with it.
            "404":
                description: Realm not found; check the realm name.
            "409":
                description: A top-level group with this name already exists; choose another name or use the existing group.
