        description: Optional. Client id (human-readable clientId) used for the link and redirect.
    - target: $.paths['/admin/realms/{realm}/users/{user-id}/send-verify-email'].put.parameters[?(@.name=='lifespan')]
      update:
        description: Optional. How long the link stays valid, as an integer; unit assumed to be seconds.
    - target: $.paths['/admin/realms/{realm}/users/{user-id}/send-verify-email'].put.parameters[?(@.name=='redirect_uri')]
      update:
        description: Optional. URL the user is sent to after verifying; must be a valid redirect URI of the client and needs client_id.
    - target: $.paths['/admin/realms/{realm}/users/{user-id}/send-verify-email'].put.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not id) that contains the user.
    - target: $.paths['/admin/realms/{realm}/users/{user-id}/send-verify-email'].put.parameters[?(@.name=='user-id')]
      update:
        description: Keycloak user UUID, from a user search/list operation.
    - target: $.paths['/admin/realms/{realm}/users/{user-id}/sessions'].get
      update:
        description: Returns the user's current active sessions in the realm, with details such as clients and timing. Read-only.
        responses:
            "401":
                description: Missing or expired admin token; obtain a new one.
            "403":
                description: Token lacks permission to view this user.
            "404":
                description: Realm or user not found; check the realm and user id.
        summary: List a user's active login sessions
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Not for offline/persistent sessions (use offline-sessions). It does not end sessions; use logout for that.
            whenToUse: Operator asks where or whether a user is currently logged in, or to see their active sessions.
    - target: $.paths['/admin/realms/{realm}/users/{user-id}/sessions'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not id) that contains the user.
    - target: $.paths['/admin/realms/{realm}/users/{user-id}/sessions'].get.parameters[?(@.name=='user-id')]
      update:
        description: Keycloak user UUID, from a user search/list operation.
    - target: $.paths['/admin/realms/{realm}/users/{user-id}/unmanagedAttributes'].get
      update:
        description: Returns the user's attributes that are not declared in the realm's user profile configuration. Read-only.
        responses:
            "401":
                description: Missing or expired admin token; obtain a new one.
            "403":
                description: Token lacks permission to view this user.
            "404":
                description: Realm or user not found; check the realm and user id.
        summary: List a user's custom attributes not defined in the user profile
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Not for standard profile fields such as name or email; use the user detail operation for those.
            whenToUse: Operator asks for extra or custom attributes stored on a user that the user profile does not manage.
    - target: $.paths['/admin/realms/{realm}/users/{user-id}/unmanagedAttributes'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not id) that contains the user.
    - target: $.paths['/admin/realms/{realm}/users/{user-id}/unmanagedAttributes'].get.parameters[?(@.name=='user-id')]
      update:
        description: Keycloak user UUID, from a user search/list operation.
    - target: $.paths['/admin/realms/{realm}/workflows'].get
      update:
        description: Returns the workflow definitions of the realm, optionally filtered by a search string and paged with first/max. Changes nothing.
        responses:
            "401":
                description: Missing or expired admin token; obtain a new token and retry.
            "403":
                description: Token lacks permission to view realm workflows (likely needs a realm management role); use an account with sufficient rights.
            "404":
                description: Realm does not exist; check the realm name.
        summary: List the workflows defined in a realm
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not show the details of one known workflow (use GET /admin/realms/{realm}/workflows/{id}) or which workflow is scheduled for a given user/client (use GET /admin/realms/{realm}/workflows/scheduled/{resource-id}).
            whenToUse: Operator asks which workflows exist in a realm, or to find a workflow by name and get its id.
    - target: $.paths['/admin/realms/{realm}/workflows'].get.parameters[?(@.name=='exact')]
      update:
        description: true = search must match the name exactly; false or omitted = partial match. Only meaningful together with search.
    - target: $.paths['/admin/realms/{realm}/workflows'].get.parameters[?(@.name=='first')]
      update:
        description: Zero-based index of the first result, for paging (int32).
    - target: $.paths['/admin/realms/{realm}/workflows'].get.parameters[?(@.name=='max')]
      update:
        description: Maximum number of results to return (int32).
    - target: $.paths['/admin/realms/{realm}/workflows'].get.parameters[?(@.name=='search')]
      update:
        description: Text to look for in workflow names. Matching is partial unless exact=true.
    - target: $.paths['/admin/realms/{realm}/workflows'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not id), e.g. 'master'. Required.
    - target: $.paths['/admin/realms/{realm}/workflows'].post
      update:
        description: Creates a workflow definition from the JSON body (name, trigger 'on', conditional 'if', steps, schedule, concurrency settings, enabled flag). An enabled workflow may start acting on resources automatically once created, so its steps can have real effects later.
        responses:
            "400":
                description: Body invalid, for example malformed steps, unknown step type or bad expression; fix the body.
            "401":
                description: Missing or expired admin token; get a new one.
            "403":
                description: Token lacks permission to manage workflows.
            "404":
                description: Realm does not exist; check the name.
            "409":
                description: A workflow with the same name or id already exists; choose another name or update the existing one.
        summary: Create a new workflow in a realm
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Does not change an existing workflow (use PUT /admin/realms/{realm}/workflows/{id}), and does not start a workflow on a specific user/client (use the activate operation).
            whenToUse: Operator asks to define or add a new automated workflow in a realm.
    - target: $.paths['/admin/realms/{realm}/workflows'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name. Required.
    - target: $.paths['/admin/realms/{realm}/workflows/migrate'].post
      update:
        description: Runs a migration over the realm's workflows using the from and to values. What exactly is migrated (workflow ids, provider or version) is not stated, so it may rewrite many workflows at once.
        responses:
            "400":
                description: from or to missing or not a recognised value; correct them.
            "401":
                description: Missing or expired admin token.
            "403":
                description: Token lacks permission to manage workflows.
            "404":
                description: Realm does not exist.
        summary: Migrate workflows from one value to another in a realm
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for editing one workflow (use PUT /admin/realms/{realm}/workflows/{id}) or for creating one (use POST /admin/realms/{realm}/workflows).
            whenToUse: Operator explicitly asks to migrate workflows between the 'from' and 'to' values, for example after an upgrade.
    - target: $.paths['/admin/realms/{realm}/workflows/migrate'].post.parameters[?(@.name=='from')]
      update:
        description: Source value to migrate from; format and allowed values not documented.
    - target: $.paths['/admin/realms/{realm}/workflows/migrate'].post.parameters[?(@.name=='to')]
      update:
        description: Target value to migrate to; format and allowed values not documented.
    - target: $.paths['/admin/realms/{realm}/workflows/migrate'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name. Required.
    - target: $.paths['/admin/realms/{realm}/workflows/scheduled/{resource-id}'].get
      update:
        description: Returns the workflows that are currently scheduled or activated for the resource (for example a user or client) with the given id. Changes nothing.
        responses:
            "401":
                description: Missing or expired admin token.
            "403":
                description: Token lacks permission to view workflows.
            "404":
                description: Realm or resource not found; check the realm name and resource-id.
        summary: Show workflows scheduled for a given resource
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not list all workflows in the realm (use GET /admin/realms/{realm}/workflows) and does not schedule anything (use the activate operation).
            whenToUse: Operator asks which workflows are pending or scheduled for a particular user or other resource.
    - target: $.paths['/admin/realms/{realm}/workflows/scheduled/{resource-id}'].get.parameters[?(@.name=='resource-id')]
      update:
        description: Id of the resource (likely a user id or client id) whose scheduled workflows you want. Obtain it from the corresponding user or client lookup.
    - target: $.paths['/admin/realms/{realm}/workflows/scheduled/{resource-id}'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name. Required.
    - target: $.paths['/admin/realms/{realm}/workflows/{id}'].delete
      update:
        description: Permanently removes the workflow with the given id from the realm. Scheduled or running instances of it may also stop or be removed.
        responses:
            "401":
                description: Missing or expired admin token.
            "403":
                description: Token lacks permission to manage workflows.
            "404":
                description: Workflow or realm not found; check the id from the list operation.
        summary: Delete a workflow definition
        x-agent:
            needsReview: true
            risk: irreversible
            whenNotToUse: Not for pausing a workflow (set enabled=false with PUT /admin/realms/{realm}/workflows/{id}) or for stopping it on one resource only (use the deactivate operation).
            whenToUse: Operator explicitly asks to delete or remove a workflow.
    - target: $.paths['/admin/realms/{realm}/workflows/{id}'].delete.parameters[?(@.name=='realm')]
      update:
        description: Realm name. Required.
    - target: $.paths['/admin/realms/{realm}/workflows/{id}'].delete.parameters[?(@.name=='id')]
      update:
        description: Workflow id, from GET /admin/realms/{realm}/workflows. Required.
    - target: $.paths['/admin/realms/{realm}/workflows/{id}'].get
      update:
        description: Returns the full definition of the workflow with the given id. Set includeId to also get the workflow id in the result. Changes nothing.
        responses:
            "401":
                description: Missing or expired admin token.
            "403":
                description: Token lacks permission to view workflows.
            "404":
                description: Workflow or realm not found; check the id.
        summary: Get one workflow definition
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Not for finding workflows by name (use GET /admin/realms/{realm}/workflows with search) or for checking what is scheduled for a resource (use GET .../workflows/scheduled/{resource-id}).
            whenToUse: Operator asks to see how a specific workflow is configured (trigger, steps, schedule, enabled).
    - target: $.paths['/admin/realms/{realm}/workflows/{id}'].get.parameters[?(@.name=='includeId')]
      update:
        description: true = include the workflow id in the returned definition; false or omitted = leave it out (likely default).
    - target: $.paths['/admin/realms/{realm}/workflows/{id}'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name. Required.
    - target: $.paths['/admin/realms/{realm}/workflows/{id}'].get.parameters[?(@.name=='id')]
      update:
        description: Workflow id, from GET /admin/realms/{realm}/workflows. Required.
    - target: $.paths['/admin/realms/{realm}/workflows/{id}'].put
      update:
        description: Updates the workflow with the given id using the JSON body, including its enabled flag, trigger, steps and schedule. The change likely applies to future runs and may affect instances already scheduled.
        responses:
            "400":
                description: Body invalid, for example malformed steps or expression; fix the body.
            "401":
                description: Missing or expired admin token.
            "403":
                description: Token lacks permission to manage workflows.
            "404":
                description: Workflow or realm not found; check the id.
            "409":
                description: Name conflicts with another workflow; use a unique name.
        summary: Replace the definition of an existing workflow
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for creating a workflow (use POST /admin/realms/{realm}/workflows) or for deleting it (use DELETE).
            whenToUse: Operator asks to edit, enable, or disable an existing workflow.
    - target: $.paths['/admin/realms/{realm}/workflows/{id}'].put.parameters[?(@.name=='realm')]
      update:
        description: Realm name. Required.
    - target: $.paths['/admin/realms/{realm}/workflows/{id}'].put.parameters[?(@.name=='id')]
      update:
        description: Id of the workflow to update, from GET /admin/realms/{realm}/workflows. Required.
    - target: $.paths['/admin/realms/{realm}/workflows/{id}/activate/{type}/{resourceId}'].post
      update:
        description: Activates the workflow for the resource of the given type and id, so its steps will run for that resource, optionally not before the notBefore time. The steps may have real effects on the resource (for example notifying, disabling, or deleting a user), and they are not reversible by deactivating.
        responses:
            "400":
                description: type or notBefore invalid, or the workflow does not apply to this resource type; correct the values.
            "401":
                description: Missing or expired admin token.
            "403":
                description: Token lacks permission to manage workflows.
            "404":
                description: Workflow, realm or resource not found; check the ids.
        summary: Start a workflow for one specific resource
        x-agent:
            needsReview: true
            risk: irreversible
            whenNotToUse: Not for creating the workflow itself (use POST /admin/realms/{realm}/workflows) and not for stopping it on a resource (use the deactivate operation).
            whenToUse: Operator asks to run or schedule a workflow for a particular user or other resource, now or from a later time.
    - target: $.paths['/admin/realms/{realm}/workflows/{id}/activate/{type}/{resourceId}'].post.parameters[?(@.name=='resourceId')]
      update:
        description: Id of the resource, for example a user id from a user lookup. Required.
    - target: $.paths['/admin/realms/{realm}/workflows/{id}/activate/{type}/{resourceId}'].post.parameters[?(@.name=='type')]
      update:
        description: Kind of resource the workflow runs on (for example user); allowed values not documented, so take them from the workflow's 'on' definition or ask the operator.
    - target: $.paths['/admin/realms/{realm}/workflows/{id}/activate/{type}/{resourceId}'].post.parameters[?(@.name=='notBefore')]
      update:
        description: Earliest time the workflow may start; format not documented, probably an ISO-8601 timestamp or a duration. Omit to start immediately.
    - target: $.paths['/admin/realms/{realm}/workflows/{id}/activate/{type}/{resourceId}'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name. Required.
    - target: $.paths['/admin/realms/{realm}/workflows/{id}/activate/{type}/{resourceId}'].post.parameters[?(@.name=='id')]
      update:
        description: Workflow id, from GET /admin/realms/{realm}/workflows. Required.
    - target: $.paths['/admin/realms/{realm}/workflows/{id}/deactivate/{type}/{resourceId}'].post
      update:
        description: Deactivates the workflow for the resource of the given type and id, cancelling its scheduled or pending run for that resource. Steps that already ran are not undone.
        responses:
            "400":
                description: type invalid or the workflow is not active for this resource; correct the values.
            "401":
                description: Missing or expired admin token.
            "403":
                description: Token lacks permission to manage workflows.
            "404":
                description: Workflow, realm or resource not found; check the ids.
        summary: Stop a workflow for one specific resource
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for deleting the workflow definition (use DELETE) or disabling it for everyone (use PUT with enabled=false). Not for starting it (use the activate operation).
            whenToUse: Operator asks to cancel or stop a workflow that is scheduled or running for a particular user or other resource.
    - target: $.paths['/admin/realms/{realm}/workflows/{id}/deactivate/{type}/{resourceId}'].post.parameters[?(@.name=='resourceId')]
      update:
        description: Id of the resource, for example a user id from a user lookup. Required.
    - target: $.paths['/admin/realms/{realm}/workflows/{id}/deactivate/{type}/{resourceId}'].post.parameters[?(@.name=='type')]
      update:
        description: Kind of resource the workflow runs on (for example user); allowed values not documented, use the same value that was used to activate it.
    - target: $.paths['/admin/realms/{realm}/workflows/{id}/deactivate/{type}/{resourceId}'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name. Required.
    - target: $.paths['/admin/realms/{realm}/workflows/{id}/deactivate/{type}/{resourceId}'].post.parameters[?(@.name=='id')]
      update:
        description: Workflow id, from GET /admin/realms/{realm}/workflows. Required.
