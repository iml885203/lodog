    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/default-client-scopes/{clientScopeId}'].delete
      update:
        description: Detaches the scope from the client's default scopes, so its claims and roles stop being included in new tokens. The scope itself is not deleted and can be re-added. Returns 204 on success.
        responses:
            "401":
                description: Missing or expired admin token; re-authenticate.
