        description: User's internal id (UUID) from a user search.
    - target: $.paths['/admin/realms/{realm}/users/{user-id}/federated-identity/{provider}'].delete
      update:
        description: Removes the link between the user and the given identity provider, so they can no longer log in through it unless relinked. Does not delete the user.
