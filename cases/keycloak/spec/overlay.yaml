        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Does not make an action run later (use the lower-priority operation). Does not enable, disable or configure a required action, and does not list actions (use the required-actions listing or unregistered-required-actions). Does not assign a required action to a specific user.
