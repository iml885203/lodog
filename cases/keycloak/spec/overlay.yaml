        x-agent:
            needsReview: true
            risk: irreversible
            whenNotToUse: Does not detach a scope from one client only, and is not for editing a scope (use PUT). Do not use to inspect a scope (use GET).
            whenToUse: Operator explicitly asks to delete a specific client scope.
    - target: $.paths['/admin/realms/{realm}/client-scopes/{client-scope-id}'].delete.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/client-scopes/{client-scope-id}'].delete.parameters[?(@.name=='client-scope-id')]
      update:
        description: Internal id (UUID) of the scope, from GET /admin/realms/{realm}/client-scopes. Not the scope name.
    - target: $.paths['/admin/realms/{realm}/client-scopes/{client-scope-id}'].get
      update:
        description: Returns the scope's name, description, protocol, attributes and protocol mappers. Read-only.
        responses:
            "401":
                description: Missing or expired admin token; get a new one.
            "403":
                description: Token lacks permission to view clients in this realm.
            "404":
                description: Realm or scope id not found; look the id up in the list first.
        summary: Get the details of one client scope
        x-agent:
            risk: read
            whenNotToUse: Does not search by name or list all scopes (use GET /admin/realms/{realm}/client-scopes). Does not show which clients use the scope.
            whenToUse: Operator asks what a specific client scope contains or how it is configured.
    - target: $.paths['/admin/realms/{realm}/client-scopes/{client-scope-id}'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/client-scopes/{client-scope-id}'].get.parameters[?(@.name=='client-scope-id')]
      update:
        description: Internal id (UUID) of the scope, from GET /admin/realms/{realm}/client-scopes.
    - target: $.paths['/admin/realms/{realm}/client-scopes/{client-scope-id}'].put
      update:
        description: Overwrites the scope's settings with the JSON body (name, description, protocol, attributes, protocol mappers). Send the complete desired state, since omitted fields may be cleared. Changes affect tokens issued to every client using the scope.
        responses:
            "400":
                description: Body is malformed or invalid; fix the JSON.
            "401":
                description: Missing or expired admin token; get a new one.
            "403":
                description: Token lacks permission to manage clients in this realm.
            "404":
                description: Realm or scope id not found; look the id up in the list first.
            "409":
                description: Another scope already has this name; choose a different name.
        summary: Update an existing client scope
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Does not create a scope (use POST /admin/realms/{realm}/client-scopes). Does not delete one.
            whenToUse: Operator wants to rename a scope or change its description, attributes or mappers.
    - target: $.paths['/admin/realms/{realm}/client-scopes/{client-scope-id}'].put.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/client-scopes/{client-scope-id}'].put.parameters[?(@.name=='client-scope-id')]
      update:
        description: Internal id (UUID) of the scope, from GET /admin/realms/{realm}/client-scopes.
    - target: $.paths['/admin/realms/{realm}/client-scopes/{client-scope-id}/protocol-mappers/add-models'].post
      update:
        description: Creates each mapper in the request array on the given client scope. A protocol mapper controls which claims or attributes are put into tokens issued for clients using the scope. Changes token content for every client that uses the scope.
        responses:
            "400":
                description: Malformed body, or a mapper has an invalid protocol or protocolMapper type; fix the mapper objects.
            "401":
                description: Missing or expired admin token; obtain a new one.
            "403":
                description: Token lacks manage-clients permission in this realm.
            "404":
                description: Realm or client scope not found; check realm name and scope UUID.
            "409":
                description: A mapper with the same name already exists on the scope; rename or update the existing one.
        summary: Add several protocol mappers to a client scope in one call
        x-agent:
            needsReview: true
            risk: write
