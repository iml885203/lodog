        description: Realm name (identifier string).
    - target: $.paths['/admin/realms/{realm}/clients'].get
      update:
        description: Returns the client (application) configurations in the realm, optionally filtered by clientId or attribute query, with offset paging via first/max. Does not return client secrets. Without max the server applies its own default page size, so large realms may be truncated.
        responses:
            "401":
                description: Missing or expired admin bearer token; obtain a new token and retry.
            "403":
                description: Caller lacks the view-clients permission in this realm; use an account with it.
            "404":
                description: Realm does not exist; check the realm name.
        summary: List or search OAuth/OIDC clients registered in a realm
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Getting one client's full details when the UUID is known (use GET /admin/realms/{realm}/clients/{client-uuid}); reading a client's secret (use GET .../client-secret).
            whenToUse: Find a client's internal UUID from its clientId; list the applications registered in a realm; search clients by attribute.
    - target: $.paths['/admin/realms/{realm}/clients'].get.parameters[?(@.name=='clientId')]
      update:
        description: Client's clientId string (the public identifier, not the UUID). Exact match unless search=true.
    - target: $.paths['/admin/realms/{realm}/clients'].get.parameters[?(@.name=='first')]
      update:
        description: Offset of the first result for paging, 0-based integer.
    - target: $.paths['/admin/realms/{realm}/clients'].get.parameters[?(@.name=='max')]
      update:
        description: Maximum number of results to return, integer.
    - target: $.paths['/admin/realms/{realm}/clients'].get.parameters[?(@.name=='q')]
      update:
        description: Attribute search in 'key:value' form, multiple pairs space-separated. Format is a guess.
    - target: $.paths['/admin/realms/{realm}/clients'].get.parameters[?(@.name=='search')]
      update:
        description: true = clientId is matched as a partial (substring) search; false or omitted = exact match.
    - target: $.paths['/admin/realms/{realm}/clients'].get.parameters[?(@.name=='viewableOnly')]
      update:
        description: true = only clients the caller is allowed to view/manage in the admin console; false or omitted = all.
    - target: $.paths['/admin/realms/{realm}/clients'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not UUID), e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/clients'].post
      update:
        description: Creates a client from the JSON body; clientId is the key field and must be unique in the realm. Returns 201 with a Location header holding the new client's UUID, usually with no body. Settings such as enabled, redirect URIs, and flows are taken from the body, and omitted fields get defaults.
        responses:
            "400":
                description: Invalid body; fix the JSON fields.
            "401":
                description: Missing or expired admin token; re-authenticate.
            "403":
                description: Caller lacks manage-clients permission.
            "404":
                description: Realm does not exist; check the name.
            "409":
                description: A client with that clientId already exists; choose another clientId or update the existing one.
        summary: Register a new client (application) in a realm
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Changing an existing client (use PUT .../clients/{client-uuid}); checking whether a client already exists (use GET .../clients with clientId).
            whenToUse: Operator asks to create, register, or onboard a new application/client in a realm.
    - target: $.paths['/admin/realms/{realm}/clients'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not UUID).
    - target: $.paths['/admin/realms/{realm}/clients-initial-access'].get
      update:
        description: Returns the existing client initial access tokens of the realm, with their id, creation time, expiration, total count allowed and remaining count. The token secret value is not returned here; it is only shown once when the token is created. Changes nothing.
        responses:
            "401":
                description: Missing, invalid or expired admin bearer token; obtain a fresh token and retry.
            "403":
                description: Caller lacks realm management permissions for this realm; use an account with the needed admin role.
            "404":
                description: Realm does not exist; check the realm name spelling.
        summary: List the initial access tokens issued for registering new clients in a Keycloak realm.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not list clients or client secrets, and does not create tokens (use POST /admin/realms/{realm}/clients-initial-access to create one). Does not remove tokens (use DELETE /admin/realms/{realm}/clients-initial-access/{id}).
            whenToUse: Operator asks which client registration (initial access) tokens exist in a realm, when they expire, or how many registrations they have left.
    - target: $.paths['/admin/realms/{realm}/clients-initial-access'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not a display name), e.g. 'master'. Path parameter, required. Must be an existing realm.
    - target: $.paths['/admin/realms/{realm}/clients-initial-access'].post
      update:
        description: Creates a client initial access token and returns it, including the token value, which is shown only in this response and cannot be retrieved later. The token lets its holder register a limited number of clients via dynamic client registration until it expires. Each call creates a new token; calling twice makes two tokens.
        responses:
            "400":
                description: Body is malformed or a field has the wrong type; send JSON with integer count and expiration and an array of strings for webOrigins.
            "401":
                description: Missing, invalid or expired admin bearer token; obtain a fresh token and retry.
            "403":
                description: Caller lacks permission to manage clients/realm; use an account with the needed admin role.
            "404":
                description: Realm does not exist; check the realm name spelling.
        summary: Create a new initial access token that allows registering clients in a realm.
        x-agent:
            needsReview: true
            risk: credential
            whenNotToUse: Does not create a client itself (use the client creation operation) and does not list existing tokens (use GET /admin/realms/{realm}/clients-initial-access). Not for user passwords or user access tokens.
            whenToUse: Operator wants to issue a registration token so an application or developer can self-register OAuth/OIDC clients in a realm.
    - target: $.paths['/admin/realms/{realm}/clients-initial-access'].post.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'. Path parameter, required. Must be an existing realm.
    - target: $.paths['/admin/realms/{realm}/clients-initial-access/{id}'].delete
      update:
        description: Permanently deletes the specified initial access token from the realm. Any holder of that token can no longer register clients with it. Clients already registered with it are believed to be unaffected. The deletion cannot be undone; a new token must be created instead.
        responses:
            "401":
                description: Missing, invalid or expired admin bearer token; obtain a fresh token and retry.
            "403":
                description: Caller lacks permission to manage this realm; use an account with the needed admin role.
            "404":
                description: Realm or token id not found (may already be deleted or expired); re-list the tokens to check the id.
        summary: Revoke a client initial access token so it can no longer be used to register clients.
        x-agent:
            needsReview: true
            risk: irreversible
            whenNotToUse: Does not delete registered clients or user accounts, and does not list tokens (use GET /admin/realms/{realm}/clients-initial-access to find the id first). Not for changing a token's expiry; create a new one instead.
            whenToUse: Operator wants to revoke or remove a client registration token, e.g. because it leaked or is no longer needed.
    - target: $.paths['/admin/realms/{realm}/clients-initial-access/{id}'].delete.parameters[?(@.name=='id')]
      update:
        description: Id of the initial access token, taken from the GET /admin/realms/{realm}/clients-initial-access list. Path parameter, required. Not the token secret string.
    - target: $.paths['/admin/realms/{realm}/clients-initial-access/{id}'].delete.parameters[?(@.name=='realm')]
      update:
        description: Realm name, e.g. 'master'. Path parameter, required. Must be an existing realm.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}'].delete
      update:
        description: Removes the client and its configuration, including its secret, scope assignments, and roles. Applications using this client will immediately fail to authenticate. Returns 204 on success.
        responses:
            "401":
                description: Missing or expired admin token; re-authenticate.
            "403":
                description: Caller lacks manage-clients permission.
            "404":
                description: Client or realm not found; check the UUID, e.g. look it up by clientId via GET .../clients.
        summary: Permanently delete a client (application) from a realm
        x-agent:
            risk: irreversible
            whenNotToUse: Temporarily blocking a client (use PUT .../clients/{client-uuid} with enabled=false); only changing the secret (use POST .../client-secret).
            whenToUse: Operator explicitly asks to remove or decommission a client.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}'].delete.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not UUID).
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}'].delete.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client (the 'id' field), from GET .../clients; not the clientId string.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}'].get
      update:
        description: 'Returns the client representation: clientId, enabled flag, redirect URIs, flows, attributes and related settings. Does not include the secret value.'
        responses:
            "401":
                description: Missing or expired admin token; re-authenticate.
            "403":
                description: Caller lacks view-clients permission.
            "404":
                description: Client or realm not found; check the UUID and realm.
        summary: Get the full configuration of one client
        x-agent:
            risk: read
            whenNotToUse: Finding a client by clientId (use GET .../clients with clientId); reading the secret (use GET .../client-secret).
            whenToUse: Inspect a client's settings when its UUID is known.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not UUID).
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}'].get.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client, from GET .../clients (the 'id' field), not the clientId.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}'].put
      update:
        description: Overwrites the client's settings with the JSON body; fetch the current representation first and send it back with your changes to avoid resetting fields. Can disable the client (enabled=false), change redirect URIs, flows and attributes. Returns 204 on success.
        responses:
            "400":
                description: Invalid body; fix the JSON.
            "401":
                description: Missing or expired admin token; re-authenticate.
            "403":
                description: Caller lacks manage-clients permission.
            "404":
                description: Client or realm not found; check the UUID.
            "409":
                description: The new clientId conflicts with another client; choose a different one.
        summary: Update the configuration of an existing client
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Creating a client (use POST .../clients); regenerating the secret (use POST .../client-secret); deleting (use DELETE).
            whenToUse: Operator asks to change, enable, disable, or reconfigure an existing client.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}'].put.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not UUID).
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}'].put.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client, from GET .../clients.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/authz/resource-server'].get
      update:
        description: 'Returns the resource server configuration of one client: policy enforcement mode, decision strategy, remote resource management flag and identifiers. Does not list the individual resources, scopes or policies in full.'
        responses:
            "401":
                description: Missing or expired admin token; obtain a new token and retry.
            "403":
                description: Token lacks permission to view clients in this realm; use an account with the needed realm-management role.
            "404":
                description: Realm or client-uuid not found, or the client has authorization services disabled; check both values (client-uuid must be the internal UUID).
        summary: Show a client's authorization (resource server) settings
        x-agent:
            risk: read
            whenNotToUse: Does not list policies (use GET .../resource-server/policy) or permissions (use GET .../resource-server/permission).
            whenToUse: Operator asks how authorization is configured for a client, e.g. whether enforcement is ENFORCING, PERMISSIVE or DISABLED, or what the decision strategy is.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/authz/resource-server'].get.parameters[?(@.name=='realm')]
      update:
        description: Realm name (not UUID), e.g. 'master'.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/authz/resource-server'].get.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client (the 'id' field of the client, not its clientId string). Authorization services must be enabled on that client.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/authz/resource-server'].put
      update:
        description: Overwrites the resource server settings of the client, such as enforcement mode, decision strategy and remote resource management. Takes effect immediately and changes how access decisions are made for the client.
        responses:
            "400":
                description: Invalid body, e.g. a bad enum value; use one of the listed values.
            "401":
                description: Missing or expired admin token.
            "403":
                description: Token lacks permission to manage clients/authorization.
            "404":
                description: Realm or client-uuid not found, or authorization services not enabled.
        summary: Update a client's authorization (resource server) settings
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for adding or changing individual policies, permissions or resources (use the policy/permission operations), and not for bulk loading a full configuration (use POST .../resource-server/import).
            whenToUse: Operator asks to change a client's policy enforcement mode, decision strategy or allow/deny remote resource management.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/authz/resource-server'].put.parameters[?(@.name=='realm')]
      update:
        description: Realm name.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/authz/resource-server'].put.parameters[?(@.name=='client-uuid')]
      update:
        description: Internal UUID of the client.
    - target: $.paths['/admin/realms/{realm}/clients/{client-uuid}/authz/resource-server/import'].post
      update:
        description: Loads resources, scopes, policies and settings from the given JSON into the client's resource server. Existing entries with the same names may be overwritten, and many items can change in one call.
        responses:
            "400":
                description: Malformed or inconsistent import JSON, e.g. a policy refers to a resource or scope that is not defined; fix the references and enum values.
            "401":
                description: Missing or expired admin token.
            "403":
                description: Token lacks permission to manage clients/authorization.
            "404":
                description: Realm or client-uuid not found, or authorization services not enabled.
