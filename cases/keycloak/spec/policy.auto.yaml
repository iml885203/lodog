# Drafted by `lodog policy draft` from cases/keycloak/spec/openapi.json; model claude-opus-5-5.
# 415 operations: 281 decided by heuristics, 134 by the model, 32 need review.
# A draft for an ops or risk owner to review before it is used (docs/policy.md):
# check the irreversible, money and credential rules and every "needs review" line.
# Each operation has its own rule; an operation the document did not have
# when this was drafted falls to the default, which needs approval.

# Risk levels:
#   irreversible approval cannot be undone or leaves the system: deletes, payouts, settled money, messages
#   money        approval moves money or value
#   credential   hide     passwords, OTPs, unlocks, tokens
#   write        approval changes ordinary records
#   internal     hide     service-to-service, no operator calls it
#   test         hide     test or debug endpoints
#   read         allow    looks things up
risks:
  credential: hide
  internal: hide
  irreversible: approval
  money: approval
  read: allow
  test: hide
  write: approval
