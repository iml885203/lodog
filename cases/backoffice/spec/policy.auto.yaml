# Drafted by `lodog policy draft` from cases/backoffice/spec/openapi.json; model claude-opus-5-5.
# 232 operations: 136 decided by heuristics, 96 by the model, 31 need review.
# A draft for an ops or risk owner to review before it is used (docs/policy.md):
# check the rules of the risks listed first and every "needs review" line.
# Each operation has its own rule; an operation the document did not have
# when this was drafted falls to the default, which needs approval.

# Risk levels:
#   irreversible approval, never auto-approved cannot be undone once it runs: deletes or purges records, pays out or settles money, approves or completes a transaction, sends something outside the system
#   money        approval                     moves money or value: payments, deposits, withdrawals, transfers, credits, refunds, balances
#   credential   hide                         passwords, OTPs, account unlocks, tokens or keys
#   write        approval                     creates or edits ordinary records in a way a later edit can undo
#   internal     hide                         a service-to-service endpoint no human operator calls
#   test         hide                         a test or debug endpoint left in the API
#   read         allow                        looks things up
risks:
  credential: hide
  internal: hide
  irreversible:
    action: approval
    never_auto_approve: true
  money: approval
  read: allow
  test: hide
  write: approval
