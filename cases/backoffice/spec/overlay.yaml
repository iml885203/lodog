overlay: 1.0.0
info:
    title: Backoffice agent overlay
    version: "1"
actions:
    - target: $.paths['/api/banners'].get
      update:
        description: Returns banners newest first (by id), with name, type, CTA, start/end time, allowed currencies, positions and default image. Every filter is optional and omitting all of them returns all banners. The SQL stored procedure decides how startTime/endTime match; the code only converts them.
        responses:
            "400":
                description: A parameter has the wrong type (e.g. a non-numeric position or currency); send integers from the listed enums and timestamps in milliseconds.
            "401":
                description: Missing or invalid backoffice login; authenticate first.
            "403":
                description: Operator lacks the ViewBanner permission.
        summary: List banners in a compact form (no images per language, no detail links, no display order).
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not return per-currency/language images, linked promotions or display order. For those use GET /api/banners/{id} (one banner) or GET /api/banners/details (many).
            whenToUse: Operator asks which banners exist, which banners are on a page or position, which banners are available for a currency, or which are active in a time window. Also use it to find a banner id by name.
    - target: $.paths['/api/banners'].get.parameters[?(@.name=='position')]
      update:
        description: Optional. Placement filter. 1 = PromotionPage, 2 = LandingPage, 3 = GameLobbyPromotion, 4 = CasinoLobbyPromotion.
    - target: $.paths['/api/banners'].get.parameters[?(@.name=='currency')]
      update:
        description: Optional. Filter by allowed currency, an ISO 4217 numeric code (e.g. 840 = USD, 156 = CNY, 764 = THB, 702 = SGD). 0 is the unknown value. Use a code from the listed enum.
    - target: $.paths['/api/banners'].get.parameters[?(@.name=='startTime')]
      update:
        description: Optional. Unix epoch time in MILLISECONDS (int64), start of the time window.
    - target: $.paths['/api/banners'].get.parameters[?(@.name=='endTime')]
      update:
        description: Optional. Unix epoch time in MILLISECONDS (int64), end of the time window.
    - target: $.paths['/api/banners'].get.parameters[?(@.name=='search')]
      update:
        description: Optional. Free-text search; matched by the stored procedure, probably against the banner name.
    - target: $.paths['/api/banners'].post
      update:
        description: Creates the banner with its positions, allowed currencies, per-currency/language images, linked promotions and initial display order. If any detailInfos item (detailType+detailValue) is already linked to an existing banner, creation is refused with error code 1501. Changes what customers see once the time window is active.
        responses:
            "400":
                description: Request body failed validation (name empty or over 50 characters, empty allowedCurrencies or positions, missing required field, defaultImagePath over 250 characters); fix the field and resend.
            "401":
                description: Missing or invalid backoffice login.
            "403":
                description: Operator lacks the AddBanner permission.
            "409":
                description: 'Error code 1501: a detailInfos promotion is already linked to another banner; remove it or edit the banner that owns it. It may come back as a normal response with an error code rather than an HTTP 409.'
        summary: Create a new banner and return its id.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for editing an existing banner (use PATCH /api/banners/{id}) or reordering banners (use PATCH /api/banners/orders).
            whenToUse: Operator wants to add a new promotion banner to one or more positions.
    - target: $.paths['/api/banners/details'].get
      update:
        description: Returns banners newest first (by id) with everything the list operation returns plus detailInfos, resources and per-position/per-currency display orders. All filters are optional. Heavier than GET /api/banners.
        responses:
            "400":
                description: A parameter has the wrong type; send integers from the listed enums and timestamps in milliseconds.
            "401":
                description: Missing or invalid backoffice login.
            "403":
                description: Operator lacks the ViewBanner permission.
        summary: 'List banners with full detail: images per currency/language, linked promotions and display order.'
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: For just names, positions or dates use GET /api/banners. For one banner use GET /api/banners/{id}.
            whenToUse: Operator needs the images, linked promotions or display order of several banners, for example to check a position's current order before reordering.
    - target: $.paths['/api/banners/details'].get.parameters[?(@.name=='position')]
      update:
        description: Optional. 1 = PromotionPage, 2 = LandingPage, 3 = GameLobbyPromotion, 4 = CasinoLobbyPromotion.
    - target: $.paths['/api/banners/details'].get.parameters[?(@.name=='currency')]
      update:
        description: Optional. ISO 4217 numeric currency code (e.g. 840 = USD, 156 = CNY, 764 = THB). Filters by allowed currency.
    - target: $.paths['/api/banners/details'].get.parameters[?(@.name=='startTime')]
      update:
        description: Optional. Unix epoch time in MILLISECONDS (int64), start of the time window.
    - target: $.paths['/api/banners/details'].get.parameters[?(@.name=='endTime')]
      update:
        description: Optional. Unix epoch time in MILLISECONDS (int64), end of the time window.
    - target: $.paths['/api/banners/details'].get.parameters[?(@.name=='search')]
      update:
        description: Optional. Free-text search handled by the stored procedure, probably on the banner name.
    - target: $.paths['/api/banners/orders'].patch
      update:
        description: For the given position, writes the order number of each listed banner for each currency, replacing the previous order values. Send every banner you want ordered for each currency, since the code only forwards the list to a stored procedure. Takes effect immediately on the customer-facing site.
        responses:
            "400":
                description: Missing position or orders, orders empty, or a currency's bannerOrder empty; fix the body and resend.
            "401":
                description: Missing or invalid backoffice login.
            "403":
                description: Operator lacks the ManageBannerOrder permission.
        summary: Set the display order of banners within one position, per currency.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for changing banner content, dates or positions (use PATCH /api/banners/{id}). To read the current order use GET /api/banners/details.
            whenToUse: Operator wants to move banners up or down, or reorder them, on a position for a currency.
    - target: $.paths['/api/banners/{id}'].delete
      update:
        description: Calls a stored procedure that removes the banner, with the operator's login recorded as the modifier. No undo operation exists in this API. If position is given the delete may apply only to that position, but that is not clear from the code.
        responses:
            "400":
                description: id is not an integer or position is not one of 1 to 4.
            "401":
                description: Missing or invalid backoffice login.
            "403":
                description: Operator lacks the DeleteBanner permission.
        summary: Delete a banner, optionally only from one position.
        x-agent:
            needsReview: true
            risk: irreversible
            whenNotToUse: Not for hiding a banner temporarily or changing its dates or currencies (use PATCH /api/banners/{id}). Do not call it without the operator's explicit confirmation of the banner id.
            whenToUse: Operator explicitly asks to delete or remove a banner by id.
    - target: $.paths['/api/banners/{id}'].delete.parameters[?(@.name=='id')]
      update:
        description: Required, path. Banner id (int) from GET /api/banners or GET /api/banners/details.
    - target: $.paths['/api/banners/{id}'].delete.parameters[?(@.name=='position')]
      update:
        description: Optional. 1 = PromotionPage, 2 = LandingPage, 3 = GameLobbyPromotion, 4 = CasinoLobbyPromotion. Probably limits the delete to that position; if omitted the whole banner is probably deleted.
    - target: $.paths['/api/banners/{id}'].get
      update:
        description: Returns the banner's name, type, CTA, dates, allowed currencies, positions, default image, per-currency/language images, linked promotions and display orders. Image paths are returned with the CDN prefix from the Global/CDN feature setting. If the id does not exist the code throws, so expect a server error rather than a 404.
        responses:
            "401":
                description: Missing or invalid backoffice login.
            "403":
                description: Operator lacks the ViewBanner permission.
            "500":
                description: The id does not exist (the code throws NullReferenceException); look up valid ids with GET /api/banners.
        summary: Get one banner with all its detail by id.
        x-agent:
            risk: read
            whenNotToUse: To find a banner by name, position or date use GET /api/banners or GET /api/banners/details.
            whenToUse: Operator asks for the settings of a specific banner, or you need its current values before editing it with PATCH.
    - target: $.paths['/api/banners/{id}'].get.parameters[?(@.name=='id')]
      update:
        description: Required, path. Banner id (int) from GET /api/banners or GET /api/banners/details.
    - target: $.paths['/api/banners/{id}'].patch
      update:
        description: Sends the full banner definition (same body as create) and replaces the stored values, including positions, currencies, images and linked promotions. Send every field with its final value, not only the changed ones. Changes what customers see right away if the banner is active.
        responses:
            "400":
                description: Body failed validation (name empty or over 50 characters, empty allowedCurrencies or positions, missing required field); fix the field and resend.
            "401":
                description: Missing or invalid backoffice login.
            "403":
                description: Operator lacks the EditBanner permission.
        summary: Update an existing banner's settings.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for creating a banner (POST /api/banners), reordering (PATCH /api/banners/orders) or deleting (DELETE /api/banners/{id}).
            whenToUse: Operator wants to change a banner's name, dates, CTA, currencies, positions, images or linked promotions.
    - target: $.paths['/api/banners/{id}'].patch.parameters[?(@.name=='id')]
      update:
        description: Required, path. Banner id (int) from GET /api/banners. Read the current values with GET /api/banners/{id} first.
    - target: $.paths['/api/content'].get
      update:
        description: Returns every content item of the given type, each with id, contentType, productType, title, default description and body, the language/currency variant keys, hasLinkers and createdBy. CampaignName is a case-insensitive title match. There is no paging, so all matches come back in one response.
        responses:
            "400":
                description: ContentType missing or not one of 0-4; send an integer from 0 to 4.
            "401":
                description: Backoffice session expired; log in again.
            "403":
                description: Operator lacks all of the ViewCms, ViewManageBonus and ViewRebate permissions [unsure of exact status].
        summary: List CMS content items (bonus, rebate, voucher, referral descriptions) with their default text and variant keys.
        x-agent:
            risk: read
            whenNotToUse: Do not use it to fetch one item's full variant bodies or currencies (use GET /api/content/{id}). Do not use it for a light id and name picker (use GET /api/content/list). It does not say which promotions are linked (use GET /api/content/Linker/{id}).
            whenToUse: Operator asks which bonus, rebate, voucher or referral content exists, wants to find content by title, or needs the default text or whether the content is linked to a promotion.
    - target: $.paths['/api/content'].get.parameters[?(@.name=='CampaignName')]
      update:
        description: Optional. Text matched against the content title, case-insensitive. It is passed to MongoDB as a regex without escaping, so characters such as . * ( are treated as regex syntax. Omit it for no title filter.
    - target: $.paths['/api/content'].get.parameters[?(@.name=='ContentType')]
      update:
        description: Required. 0 = Unknown (no type filter, returns all types), 1 = Bonus, 2 = Rebate, 3 = Voucher, 4 = Referral.
    - target: $.paths['/api/content'].post
      update:
        description: Inserts a content item into the content store and returns the new content id as a string (a date-prefixed sequence such as yyyyMMdd0001). The item starts with no linked promotions. The creating operator is recorded as CreatedBy.
        responses:
            "400":
                description: 'Validation failed: contentType is 0 or invalid, productType is not 0-3, title empty, currencies empty, defaultContentDetail missing, or variant (language, currency) pairs duplicated. Fix the body.'
            "401":
                description: Backoffice session expired; log in again.
            "403":
                description: Operator lacks the AddCms permission [unsure of exact status].
        summary: Create a new CMS content item with default text and optional language/currency variants.
        x-agent:
            risk: write
            whenNotToUse: Do not use it to change existing content (use PATCH /api/content/{id}). It does not link content to a promotion.
            whenToUse: Operator wants to add new bonus, rebate, voucher or referral description content before attaching it to a promotion.
    - target: $.paths['/api/content/Linker/{id}'].get
      update:
        description: Returns the promotions (or vouchers/referrals) that use this content, with id, name, code, status, who linked it and when (unix timestamp). It returns an empty list when nothing is linked.
        responses:
            "401":
                description: Backoffice session expired; log in again.
            "403":
                description: Operator lacks the ViewCms permission [unsure of exact status].
            "500":
                description: No content with this id exists (the lookup throws instead of returning 404); take the id from GET /api/content.
        summary: Show which promotions or vouchers are linked to a content item.
        x-agent:
            risk: read
            whenNotToUse: Do not use it to read the content text (use GET /api/content/{id}). To only learn whether anything is linked, GET /api/content already returns hasLinkers.
            whenToUse: Operator asks where a content item is used, or why it cannot be deleted.
    - target: $.paths['/api/content/Linker/{id}'].get.parameters[?(@.name=='id')]
      update:
        description: Content id string, from the id field of GET /api/content, GET /api/content/list or POST /api/content.
    - target: $.paths['/api/content/list'].get
      update:
        description: Same filtering as GET /api/content, but each item returns only name, id and the list of language/currency variants. No bodies, descriptions or linked state. There is no paging.
        responses:
            "400":
                description: ContentType missing or not one of 0-4; send an integer from 0 to 4.
            "401":
                description: Backoffice session expired; log in again.
            "403":
                description: Operator lacks all of the ViewCms, ViewManageBonus and ViewRebate permissions [unsure of exact status].
        summary: Get a compact list of content ids and names with their language/currency variants, for picking content.
        x-agent:
            risk: read
            whenNotToUse: Do not use it when the default text, productType, hasLinkers or createdBy are needed (use GET /api/content).
            whenToUse: Operator needs to choose a content item by name, or needs id-to-name lookups and which languages and currencies each item covers.
    - target: $.paths['/api/content/list'].get.parameters[?(@.name=='CampaignName')]
      update:
        description: Optional. Text matched against the content title, case-insensitive. It is passed to MongoDB as a regex without escaping. Omit it for no title filter.
    - target: $.paths['/api/content/list'].get.parameters[?(@.name=='ContentType')]
      update:
        description: Required. 0 = Unknown (no type filter, returns all types), 1 = Bonus, 2 = Rebate, 3 = Voucher, 4 = Referral.
    - target: $.paths['/api/content/{id}'].delete
      update:
        description: Hard-deletes the content item from the content store, with no soft delete or undo. It is refused when the item still has linked promotions or vouchers. The refusal comes back as an error body with code 1402 ("Content with linked promotion cannot be deleted").
        responses:
            "401":
                description: Backoffice session expired; log in again.
            "403":
                description: Operator lacks the DeleteCms permission [unsure of exact status].
            "500":
                description: No content with this id exists (the lookup throws); take the id from the list operations.
        summary: Permanently delete a content item that no promotion uses.
        x-agent:
            needsReview: true
            risk: irreversible
            whenNotToUse: Do not use it to hide or retire content that is still linked; unlink it first. To edit text use PATCH. Check GET /api/content/Linker/{id} first if unsure.
            whenToUse: Operator explicitly asks to remove unused content.
    - target: $.paths['/api/content/{id}'].delete.parameters[?(@.name=='id')]
      update:
        description: Content id string, from GET /api/content, GET /api/content/list or POST /api/content.
    - target: $.paths['/api/content/{id}'].get
      update:
        description: Returns id, contentType, productType, currencies, title, default content detail, all variant details (description, body, language, currency) and createdBy. It reads straight from the content store and changes nothing.
        responses:
            "401":
                description: Backoffice session expired; log in again.
            "403":
                description: Operator lacks all of the ViewCms, ViewManageBonus and ViewRebate permissions [unsure of exact status].
            "500":
                description: No content with this id exists (the lookup throws instead of returning 404); take the id from the list operations.
        summary: Get the full details of one content item for viewing or editing.
        x-agent:
            risk: read
            whenNotToUse: Do not use it to search by title or type (use GET /api/content). It does not show linked promotions (use GET /api/content/Linker/{id}). For a rendered preview use GET /api/content/{id}/preview.
            whenToUse: Operator wants the complete text, variants or currencies of a known content item, or the current values before editing.
    - target: $.paths['/api/content/{id}'].get.parameters[?(@.name=='id')]
      update:
        description: Content id string, from GET /api/content, GET /api/content/list or POST /api/content.
    - target: $.paths['/api/content/{id}'].patch
      update:
        description: Replaces all editable fields of the item (the body is the full object, not a partial patch) and saves it, then updates the description on the linked bonus, rebate, referral or voucher. The change reaches customer-facing promotions immediately. Existing links are kept.
        responses:
            "400":
                description: 'Validation failed: contentType 0 or invalid, productType not 0-3, empty title, empty currencies, missing defaultContentDetail, or duplicate variant pairs. Fix the body.'
            "401":
                description: Backoffice session expired; log in again.
            "403":
                description: Operator lacks the EditCms permission [unsure of exact status].
            "500":
                description: No content with this id exists (the lookup throws); take the id from the list operations.
        summary: Edit an existing content item and push the new text to the promotion, referral or voucher that uses it.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Do not use it to create new content (use POST /api/content) or to remove content (use DELETE). It does not link or unlink promotions.
            whenToUse: Operator wants to change the title, text, currencies, product type or variants of existing content.
    - target: $.paths['/api/content/{id}'].patch.parameters[?(@.name=='id')]
      update:
        description: Content id string, from GET /api/content, GET /api/content/list or POST /api/content.
    - target: $.paths['/api/content/{id}/preview'].get
      update:
        description: Returns the default body and description plus, for each language/currency variant, its description only. It does not include variant bodies. It reads from the content store and changes nothing.
        responses:
            "401":
                description: Backoffice session expired; log in again.
            "403":
                description: Operator lacks all of the ViewCms, ViewManageBonus and ViewRebate permissions [unsure of exact status].
            "500":
                description: No content with this id exists (the lookup throws instead of returning 404); take the id from the list operations.
        summary: 'Preview how a content item reads: default text and each variant''s description.'
        x-agent:
            risk: read
            whenNotToUse: Do not use it to get variant bodies, currencies, productType or the full record (use GET /api/content/{id}). It does not list linked promotions.
            whenToUse: Operator wants a quick look at the text a customer would see, or to check variant descriptions by language and currency.
    - target: $.paths['/api/content/{id}/preview'].get.parameters[?(@.name=='id')]
      update:
        description: Content id string, from GET /api/content, GET /api/content/list or POST /api/content.
    - target: $.paths['/api/currencies'].get
      update:
        description: Returns the base currency code and, for every configured currency, its exchange rate against the base currency, status (0 = Disabled, 1 = Enabled), and who last modified it and when (UTC). It has no parameters and returns the full list, with no paging. The data is read from the UAT or production table depending on the environment the API runs in.
        responses:
            "401":
                description: Not authenticated; send a valid operator session or token.
            "403":
                description: The operator lacks the ViewCurrencies permission; use an operator that has it.
        summary: List the platform's fiat currencies with their exchange rates and enabled/disabled status.
        x-agent:
            risk: read
            whenNotToUse: 'Does not return exchange-rate history by month. Does not change anything: to add a currency use POST /api/currencies, to change a rate or status use PATCH /api/currencies.'
            whenToUse: Look up the current exchange rate of a currency; check which currencies are enabled or disabled; see who last changed a rate; check whether a currency already exists before adding or editing it.
    - target: $.paths['/api/currencies'].patch
      update:
        description: Updates the rate and status of the given currency through a stored procedure, and records the calling operator as the modifier. It overwrites both rate and status, so send the current value for any field you do not want to change. It acts on the UAT or production data depending on the environment, and returns no data on success.
        responses:
            "400":
                description: Body is missing currency, exchangeRate or status; currency is not a valid enum value; status is not 0 or 1; or currency is 0 (Unknown). Fix the body.
            "401":
                description: Not authenticated; send a valid operator session or token.
            "403":
                description: The operator lacks the AddOrEditCurrency permission; use an operator that has it.
        summary: Change the exchange rate and/or enabled status of an existing currency.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: 'Not for adding a currency that is not yet configured: use POST /api/currencies. Not for reading rates: use GET /api/currencies.'
            whenToUse: Update a currency's exchange rate; enable or disable an existing currency.
    - target: $.paths['/api/currencies'].post
      update:
        description: Creates the currency record with the given rate and status through a stored procedure, and records the calling operator as the creator. It acts on the UAT or production data depending on the environment, and returns no data on success. The endpoint does not check for duplicates itself, so check GET /api/currencies first.
        responses:
            "400":
                description: Body is missing currency, exchangeRate or status; currency is not a valid enum value; status is not 0 or 1; or currency is 0 (Unknown). Fix the body.
            "401":
                description: Not authenticated; send a valid operator session or token.
            "403":
                description: The operator lacks the AddOrEditCurrency permission; use an operator that has it.
        summary: Add a new currency with its exchange rate and status to the platform.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: 'Not for changing a currency that already exists: use PATCH /api/currencies. Not for reading rates: use GET /api/currencies.'
            whenToUse: Configure a currency that is not yet in the currency list, with its initial rate and enabled/disabled status.
    - target: $.paths['/api/customer/bet/{customerId}/bet/{betId}'].get
      update:
        description: Asks the game provider service for the detail of one bet and returns either a URL or an HTML snippet (IsHtml says which). The operator's IP address is forwarded to the provider. Requires permission ViewPlayerProfile.
        responses:
            "400":
                description: WinlostDateOffset missing or not a valid date-time; send an ISO 8601 value copied from the bet list.
            "403":
                description: The operator lacks permission ViewPlayerProfile.
            "404":
                description: Likely when the provider has no such bet for this customer (unconfirmed); re-check betId, customerId and WinlostDateOffset against the list.
        summary: Fetch the provider's bet detail (receipt) for one game bet of a customer.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: 'Listing a customer''s bets: use gameBetList, casinoBetList or sportsBetList. Casino bets from the casino list are not confirmed to work here (unsure).'
            whenToUse: Operator wants to see the round or bet receipt of a single game bet, e.g. 'show me bet X of customer 123'.
    - target: $.paths['/api/customer/bet/{customerId}/bet/{betId}'].get.parameters[?(@.name=='betId')]
      update:
        description: Bet id string, taken from the BetId field of the gameBetList response.
    - target: $.paths['/api/customer/bet/{customerId}/bet/{betId}'].get.parameters[?(@.name=='customerId')]
      update:
        description: Customer id, integer. Must be the owner of the bet.
    - target: $.paths['/api/customer/bet/{customerId}/bet/{betId}'].get.parameters[?(@.name=='WinlostDateOffset')]
      update:
        description: Date-time (ISO 8601) of the bet's win/lost date. Copy the WinlostDateOffset field of the same bet from gameBetList. The provider uses it to find the bet.
    - target: $.paths['/api/customer/bet/{customerId}/casinoBetList'].get
      update:
        description: Loads the customer's casino transactions for Start to End, then filters by status, provider and wallet currency in memory. It returns TotalCount, IsOverLimit and BetList. BetList is capped at the BackofficeBetListLimit feature value (default 2000), and IsOverLimit=true means rows were cut off, so narrow the window. Winlost is net of stake (payout minus stake).
        responses:
            "400":
                description: Required parameter missing (Start, End, Status or BrandProviderIds), a date that cannot be parsed, or WalletCurrencies invalid (more than 20 codes, or a code longer than 10 characters or not alphanumeric); fix the values.
            "403":
                description: The operator lacks permission ViewPlayerProfile.
        summary: List a customer's casino bets in a time window, newest first.
        x-agent:
            risk: read
            whenNotToUse: 'Slot or other game provider bets: use gameBetList. Sports bets: use sportsBetList. A downloadable spreadsheet: use casinoBetListFile. A single bet receipt: use the bet detail operation.'
            whenToUse: Operator wants a customer's casino bets, or their casino win/loss, over a date range, optionally for one status, provider or wallet currency.
    - target: $.paths['/api/customer/bet/{customerId}/casinoBetList'].get.parameters[?(@.name=='customerId')]
      update:
        description: Customer id, integer.
    - target: $.paths['/api/customer/bet/{customerId}/casinoBetList'].get.parameters[?(@.name=='Start')]
      update:
        description: Window start, date-time with offset (ISO 8601). Converted to UTC.
    - target: $.paths['/api/customer/bet/{customerId}/casinoBetList'].get.parameters[?(@.name=='End')]
      update:
        description: Window end, date-time with offset (ISO 8601). Converted to UTC.
    - target: $.paths['/api/customer/bet/{customerId}/casinoBetList'].get.parameters[?(@.name=='Status')]
      update:
        description: 'Bet status name, case-insensitive. Known names: Running, Waiting, Won, Lost, Draw, Void, Cancelled, Rejected, Reversed, Amended, Gifted. Any value that is not a valid name (for example ''All'') returns every status. The parameter itself is required.'
    - target: $.paths['/api/customer/bet/{customerId}/casinoBetList'].get.parameters[?(@.name=='BrandProviderIds')]
      update:
        description: Casino brand provider ids, repeat the parameter per id (BrandProviderIds=1&BrandProviderIds=2). An empty list means all providers, but the parameter is still required. There is no lookup operation in this API for these ids.
    - target: $.paths['/api/customer/bet/{customerId}/casinoBetList'].get.parameters[?(@.name=='WalletCurrencies')]
      update:
        description: Optional wallet currency codes to keep (e.g. BTC, USDT), repeated per code, case-insensitive. At most 20 codes, each 1-10 letters or digits. Omit for all.
    - target: $.paths['/api/customer/bet/{customerId}/casinoBetListFile'].get
      update:
        description: Same filters as casinoBetList, but returns an .xlsx file (spreadsheet content type) holding every matching row, with no row cap. When crypto wallets are enabled, the file adds a base-currency win/lost column using current exchange rates, and the column is left empty if rates are unavailable.
        responses:
            "400":
                description: Required parameter missing, a date that cannot be parsed, or invalid WalletCurrencies; fix the values.
            "403":
                description: The operator lacks permission ViewPlayerProfile.
            "404":
                description: The casino service returned no bet list (null); try again or check the window.
        summary: Download a customer's casino bets for a time window as an Excel file.
        x-agent:
            risk: read
            whenNotToUse: 'Viewing or analysing rows on screen: use casinoBetList, which returns JSON. Game bets: gameBetListFile. Sports bets: sportsBetListFile.'
            whenToUse: Operator wants an export or spreadsheet of a customer's casino bets.
    - target: $.paths['/api/customer/bet/{customerId}/casinoBetListFile'].get.parameters[?(@.name=='customerId')]
      update:
        description: Customer id, integer.
    - target: $.paths['/api/customer/bet/{customerId}/casinoBetListFile'].get.parameters[?(@.name=='Start')]
      update:
        description: Window start, date-time with offset (ISO 8601).
    - target: $.paths['/api/customer/bet/{customerId}/casinoBetListFile'].get.parameters[?(@.name=='End')]
      update:
        description: Window end, date-time with offset (ISO 8601).
    - target: $.paths['/api/customer/bet/{customerId}/casinoBetListFile'].get.parameters[?(@.name=='Status')]
      update:
        description: 'Bet status name, case-insensitive. Known names: Running, Waiting, Won, Lost, Draw, Void, Cancelled, Rejected, Reversed, Amended, Gifted. An unrecognised value means all statuses. The parameter is required.'
    - target: $.paths['/api/customer/bet/{customerId}/casinoBetListFile'].get.parameters[?(@.name=='BrandProviderIds')]
      update:
        description: Casino brand provider ids, repeated per id. Empty list means all providers; the parameter is still required.
    - target: $.paths['/api/customer/bet/{customerId}/casinoBetListFile'].get.parameters[?(@.name=='WalletCurrencies')]
      update:
        description: Optional wallet currency codes (e.g. BTC, USDT), repeated per code. At most 20 codes, each 1-10 alphanumeric characters.
    - target: $.paths['/api/customer/bet/{customerId}/gameBetList'].get
      update:
        description: Fetches the customer's bets from the game provider service for Start to End, filtered by status, brand provider and wallet currency. It returns TotalCount, IsOverLimit and BetList. IsOverLimit=true means the list was cut at the batch limit, so narrow the window. Each bet has a WinlostDateOffset that the bet detail operation needs.
        responses:
            "400":
                description: Required parameter missing, a date that cannot be parsed, or invalid WalletCurrencies; fix the values.
            "403":
                description: The operator lacks permission ViewPlayerProfile.
        summary: List a customer's game (non-sports, non-casino-list) bets in a time window, newest first.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: 'Casino bets: use casinoBetList. Sports bets: use sportsBetList. A spreadsheet: use gameBetListFile.'
            whenToUse: Operator wants a customer's game bets or game win/loss over a date range, or needs the BetId and WinlostDateOffset for a bet detail lookup.
    - target: $.paths['/api/customer/bet/{customerId}/gameBetList'].get.parameters[?(@.name=='customerId')]
      update:
        description: Customer id, integer.
    - target: $.paths['/api/customer/bet/{customerId}/gameBetList'].get.parameters[?(@.name=='Start')]
      update:
        description: Window start, date-time with offset (ISO 8601). Converted to UTC.
    - target: $.paths['/api/customer/bet/{customerId}/gameBetList'].get.parameters[?(@.name=='End')]
      update:
        description: Window end, date-time with offset (ISO 8601). Converted to UTC.
    - target: $.paths['/api/customer/bet/{customerId}/gameBetList'].get.parameters[?(@.name=='Status')]
      update:
        description: 'Bet status name, case-insensitive. Known names: Running, Waiting, Won, Lost, Draw, Void, Cancelled, Rejected, Reversed, Amended, Gifted. An unrecognised value means all statuses. The parameter is required.'
    - target: $.paths['/api/customer/bet/{customerId}/gameBetList'].get.parameters[?(@.name=='BrandProviderIds')]
      update:
        description: Brand provider ids, repeated per id. Required; whether an empty list means all providers is decided by the game service (unsure).
    - target: $.paths['/api/customer/bet/{customerId}/gameBetList'].get.parameters[?(@.name=='WalletCurrencies')]
      update:
        description: Optional wallet currency codes (e.g. BTC, USDT), repeated per code. At most 20 codes, each 1-10 alphanumeric characters.
    - target: $.paths['/api/customer/bet/{customerId}/gameBetListFile'].get
      update:
        description: Same filters as gameBetList, but returns an .xlsx file built by the game bet file service. Whether the batch limit is lifted for the export is not confirmed. Requires permission ViewPlayerProfile.
        responses:
            "400":
                description: Required parameter missing, a date that cannot be parsed, or invalid WalletCurrencies; fix the values.
            "403":
                description: The operator lacks permission ViewPlayerProfile.
        summary: Download a customer's game bets for a time window as an Excel file.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: 'Seeing the rows as JSON: use gameBetList. Casino bets: casinoBetListFile. Sports bets: sportsBetListFile.'
            whenToUse: Operator wants an export or spreadsheet of a customer's game bets.
    - target: $.paths['/api/customer/bet/{customerId}/gameBetListFile'].get.parameters[?(@.name=='customerId')]
      update:
        description: Customer id, integer.
    - target: $.paths['/api/customer/bet/{customerId}/gameBetListFile'].get.parameters[?(@.name=='Start')]
      update:
        description: Window start, date-time with offset (ISO 8601).
    - target: $.paths['/api/customer/bet/{customerId}/gameBetListFile'].get.parameters[?(@.name=='End')]
      update:
        description: Window end, date-time with offset (ISO 8601).
    - target: $.paths['/api/customer/bet/{customerId}/gameBetListFile'].get.parameters[?(@.name=='Status')]
      update:
        description: 'Bet status name, case-insensitive. Known names: Running, Waiting, Won, Lost, Draw, Void, Cancelled, Rejected, Reversed, Amended, Gifted. An unrecognised value means all statuses. The parameter is required.'
    - target: $.paths['/api/customer/bet/{customerId}/gameBetListFile'].get.parameters[?(@.name=='BrandProviderIds')]
      update:
        description: Brand provider ids, repeated per id. Required.
    - target: $.paths['/api/customer/bet/{customerId}/gameBetListFile'].get.parameters[?(@.name=='WalletCurrencies')]
      update:
        description: Optional wallet currency codes, repeated per code. At most 20 codes, each 1-10 alphanumeric characters.
    - target: $.paths['/api/customer/bet/{customerId}/sportsBetList'].get
      update:
        description: Fetches the customer's sports bets from the sportsbook service for Start to End, filtered by status and wallet currency. It returns TotalCount, IsOverLimit and BetList. Bet text is localised by Language (default EnUs).
        responses:
            "400":
                description: Required parameter missing, a date that cannot be parsed, a Language number outside the enum, or invalid WalletCurrencies; fix the values.
            "403":
                description: The operator lacks permission ViewPlayerProfile.
        summary: List a customer's sportsbook bets in a time window.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: 'Casino bets: casinoBetList. Other game bets: gameBetList. A spreadsheet: sportsBetListFile.'
            whenToUse: Operator wants a customer's sports bets, stakes or win/loss over a date range.
    - target: $.paths['/api/customer/bet/{customerId}/sportsBetList'].get.parameters[?(@.name=='customerId')]
      update:
        description: Customer id, integer.
    - target: $.paths['/api/customer/bet/{customerId}/sportsBetList'].get.parameters[?(@.name=='Start')]
      update:
        description: Window start, date-time with offset (ISO 8601).
    - target: $.paths['/api/customer/bet/{customerId}/sportsBetList'].get.parameters[?(@.name=='End')]
      update:
        description: Window end, date-time with offset (ISO 8601).
    - target: $.paths['/api/customer/bet/{customerId}/sportsBetList'].get.parameters[?(@.name=='Status')]
      update:
        description: 'Bet status name, case-insensitive. Known names: Running, Waiting, Won, Lost, Draw, Void, Cancelled, Rejected, Reversed, Amended, Gifted. An unrecognised value means all statuses. The parameter is required.'
    - target: $.paths['/api/customer/bet/{customerId}/sportsBetList'].get.parameters[?(@.name=='Language')]
      update:
        description: 'Optional LanguageCode number for the bet text. Default 0 (EnUs). Values: 0 EnUs, 1 EnGb, 2 EnAu, 3 EnCa, 4 EnSg, 5 EnPh, 10 FrFr, 11 FrCa, 12 FrBe, 20 DeDe, 21 DeAt, 22 DeCh, 30 EsEs, 31 EsMx, 32 EsAr, 40 PtPt, 41 PtBr, 50 NlNl, 51 NlBe, 60 ItIt, 70 RuRu, 80 ZhCn, 81 ZhTw, 82 ZhHk, 83 ZhSg, 90 JaJp, 100 KoKr, 110 ArSa, 111 ArEg, 120 HiIn, 130 TlPh, 140 IdId, 150 ThTh, 160 ViVn, 170 KmKh, 180 MsMy, 190 LoLa, 200 TrTr, 210 PlPl, 220 UkUa, 230 ElGr, 240 CsCz, 250 SvSe, 260 DaDk, 270 FiFi, 280 NoNo, 290 HeIl, 300 RoRo, 310 HuHu, 320 MyMm, 330 BnBd, 340 TaIn; the list continues to 410 but the remaining names are not in the spec, so use 0 unless sure.'
    - target: $.paths['/api/customer/bet/{customerId}/sportsBetList'].get.parameters[?(@.name=='WalletCurrencies')]
      update:
        description: Optional wallet currency codes (e.g. BTC, USDT), repeated per code. At most 20 codes, each 1-10 alphanumeric characters.
    - target: $.paths['/api/customer/bet/{customerId}/sportsBetListFile'].get
      update:
        description: Same filters as sportsBetList, but returns an .xlsx file with the matching sports bets. The file is built straight from the sportsbook response with no separate size handling in this endpoint.
        responses:
            "400":
                description: Required parameter missing, a date that cannot be parsed, a Language number outside the enum, or invalid WalletCurrencies; fix the values.
            "403":
                description: The operator lacks permission ViewPlayerProfile.
        summary: Download a customer's sportsbook bets for a time window as an Excel file.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: 'Seeing the rows as JSON: sportsBetList. Casino or game bets: casinoBetListFile or gameBetListFile.'
            whenToUse: Operator wants an export or spreadsheet of a customer's sports bets.
    - target: $.paths['/api/customer/bet/{customerId}/sportsBetListFile'].get.parameters[?(@.name=='customerId')]
      update:
        description: Customer id, integer.
    - target: $.paths['/api/customer/bet/{customerId}/sportsBetListFile'].get.parameters[?(@.name=='Start')]
      update:
        description: Window start, date-time with offset (ISO 8601).
    - target: $.paths['/api/customer/bet/{customerId}/sportsBetListFile'].get.parameters[?(@.name=='End')]
      update:
        description: Window end, date-time with offset (ISO 8601).
    - target: $.paths['/api/customer/bet/{customerId}/sportsBetListFile'].get.parameters[?(@.name=='Status')]
      update:
        description: 'Bet status name, case-insensitive. Known names: Running, Waiting, Won, Lost, Draw, Void, Cancelled, Rejected, Reversed, Amended, Gifted. An unrecognised value means all statuses. The parameter is required.'
    - target: $.paths['/api/customer/bet/{customerId}/sportsBetListFile'].get.parameters[?(@.name=='Language')]
      update:
        description: 'Optional LanguageCode number for bet text. Default 0 (EnUs). Common values: 0 EnUs, 1 EnGb, 10 FrFr, 20 DeDe, 30 EsEs, 40 PtPt, 70 RuRu, 80 ZhCn, 81 ZhTw, 90 JaJp, 100 KoKr, 150 ThTh, 160 ViVn; the full list is the same as in sportsBetList.'
    - target: $.paths['/api/customer/bet/{customerId}/sportsBetListFile'].get.parameters[?(@.name=='WalletCurrencies')]
      update:
        description: Optional wallet currency codes, repeated per code. At most 20 codes, each 1-10 alphanumeric characters.
    - target: $.paths['/api/customer/crmlogs'].get
      update:
        description: Returns each log with id, username, product, issue type, channel, issue description, response, remark, language, and created/modified who and when. start and end are both required, and the stored procedure only returns logs inside that window. issueType is applied afterwards in memory, so it only narrows the result.
        responses:
            "400":
                description: customerId, start or end is missing, or a value cannot be parsed (bad date format or issueType outside 1-10); resend all three required params with valid values.
            "403":
                description: The operator lacks the ViewPlayerProfile permission.
        summary: List the customer-service (CRM) contact logs recorded for one customer in a date range.
        x-agent:
            risk: read
            whenNotToUse: Does not list logs across all customers (customerId is required). Does not show bets, transactions or notifications; use the customer bet or transaction operations for those.
            whenToUse: Operator asks what support contacts, calls or chats a customer has had, or asks to find a CRM log id before editing it.
    - target: $.paths['/api/customer/crmlogs'].get.parameters[?(@.name=='customerId')]
      update:
        description: Customer id (integer) whose logs to list.
    - target: $.paths['/api/customer/crmlogs'].get.parameters[?(@.name=='start')]
      update:
        description: Start of the window, ISO 8601 date-time with offset, e.g. 2026-10-01T00:00:00+08:00. Required.
    - target: $.paths['/api/customer/crmlogs'].get.parameters[?(@.name=='end')]
      update:
        description: End of the window, ISO 8601 date-time with offset. Required.
    - target: $.paths['/api/customer/crmlogs'].get.parameters[?(@.name=='issueType')]
      update:
        description: 'Optional filter: 1 = MemberAccountRegistration, 2 = Deposit, 3 = Promotion, 4 = Withdraw, 5 = AccountInfo, 6 = BetSettlement, 7 = MemberSiteFeatures, 8 = Report, 9 = Verification, 10 = Others. Omit to get all types.'
    - target: $.paths['/api/customer/crmlogs'].post
      update:
        description: Creates one CRM log row for the customer. The operator's login name is stored as the creator. It returns only success and not the new log id, so call the list operation to find it.
        responses:
            "400":
                description: A required field is missing, an enum value is not in the allowed list, customerId < 1, or issueDescription/response is over 500 characters or remark over 200; fix the body and resend.
            "403":
                description: The operator lacks the EditPlayerProfile permission.
        summary: Record a new customer-service contact log for a customer.
        x-agent:
            risk: write
            whenNotToUse: Does not change an existing log; use the PATCH operation for that. Does not message the customer or change their account.
            whenToUse: Operator wants to log a support contact (call, chat, email, etc.) against a customer.
    - target: $.paths['/api/customer/crmlogs/{logId}'].patch
      update:
        description: 'Overwrites the log''s product, issue type, channel, description, response, remark and language with the body values and records the operator as modifier. Despite PATCH, it is a full replace: every field is required. customerId is required in the body but is not saved, so a log cannot be moved to another customer.'
        responses:
            "400":
                description: A field is missing (all are required, so read the current log first and resend unchanged values), an enum value is invalid, or a text field is too long; fix the body.
            "403":
                description: The operator lacks the EditPlayerProfile permission.
        summary: Edit an existing customer-service contact log.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Does not create a log; use POST. Does not reassign a log to a different customer, and it does not delete logs.
            whenToUse: Operator wants to correct or add to a CRM log that was already recorded.
    - target: $.paths['/api/customer/crmlogs/{logId}'].patch.parameters[?(@.name=='logId')]
      update:
        description: Id of the CRM log (path, integer), taken from the id field of the GET /api/customer/crmlogs result.
    - target: $.paths['/api/customer/forceUpdateCustomerVerification'].post
      update:
        description: Sets the player's email-verified and phone-verified flags to the values sent, with no OTP and no check that the contact data exists. It does not verify the phone number itself and does not check that the customer exists. Requires the ModifySensitiveInfo permission.
        responses:
            "401":
                description: Not logged in as a back-office operator; log in again.
            "403":
                description: Operator lacks the ModifySensitiveInfo permission; use an operator that has it.
        summary: Force a player's email and/or phone verification flags to chosen values.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for binding a specific phone number to a player (use POST /api/customer/verifyPhoneNumber). Not for editing the email or phone value (use POST /api/customer/{customerId}/edit). Not for KYC (that is the KycVerified status, set via POST /api/customer/status).
            whenToUse: An operator wants to mark a player's email or phone as verified (or unverified) without the player completing verification.
    - target: $.paths['/api/customer/notification/announcements'].get
      update:
        description: Returns a page of announcements, each with its per-language and per-currency resources, plus the total count. All filters are optional. Timestamps are Unix epoch in milliseconds, not seconds.
        responses:
            "401":
                description: Missing or invalid backoffice login; authenticate first.
            "403":
                description: The operator lacks the ViewAnnouncement permission; use an account that has it.
        summary: List the site-wide announcements shown to customers, with paging.
        x-agent:
            risk: read
            whenNotToUse: Does not list personal (one-to-one) messages; use the list personal messages operation. Does not tell you which customers read an announcement. To get one announcement by id, use the get-announcement operation.
            whenToUse: The operator wants to browse, search or count announcements, or find an announcement's id by type or by date range.
    - target: $.paths['/api/customer/notification/announcements'].get.parameters[?(@.name=='PageNumber')]
      update:
        description: Page index, starting at 1. Send it together with PageSize.
    - target: $.paths['/api/customer/notification/announcements'].get.parameters[?(@.name=='PageSize')]
      update:
        description: Items per page. Send it together with PageNumber.
    - target: $.paths['/api/customer/notification/announcements'].get.parameters[?(@.name=='type')]
      update:
        description: 'Optional announcement type filter: 0 = General, 1 = Games, 2 = Casino, 3 = VirtualSports, 4 = Sports. Omit for all types.'
    - target: $.paths['/api/customer/notification/announcements'].get.parameters[?(@.name=='startTimestamp')]
      update:
        description: Optional start of the created-time range, Unix epoch in milliseconds (int64). Omit for no lower bound.
    - target: $.paths['/api/customer/notification/announcements'].get.parameters[?(@.name=='endTimestamp')]
      update:
        description: Optional end of the created-time range, Unix epoch in milliseconds (int64). Omit for no upper bound.
    - target: $.paths['/api/customer/notification/announcements'].post
      update:
        description: Creates an announcement with a default subject and content, plus optional per-language and per-currency versions. If recipientsCurrencies is empty or omitted, the announcement is not limited to particular currencies. Customers can see it afterwards, so it is not safely undoable by the agent.
        responses:
            "400":
                description: A required field is missing, subject or content is empty or too long, or an enum value is invalid. Fix the body and resend.
            "401":
                description: Missing or invalid backoffice login.
            "403":
                description: The operator lacks the SendAnnouncement permission.
        summary: Publish a new announcement to customers.
        x-agent:
            needsReview: true
            risk: irreversible
            whenNotToUse: Does not message specific customers; use the create personal message operation. Does not change an existing announcement; use the update-announcement operation with its id.
            whenToUse: The operator wants to create or send a new site-wide announcement, for example a maintenance notice.
    - target: $.paths['/api/customer/notification/announcements/{id}'].delete
      update:
        description: Deletes the announcement by id and records the operator as the one who deleted it. The code does not say whether this is a soft or a hard delete, and there is no restore operation. It returns success even if the id does not exist, as far as the code shows.
        responses:
            "401":
                description: Missing or invalid backoffice login.
            "403":
                description: The operator lacks the DeleteAnnouncement permission.
        summary: Delete an announcement so customers no longer see it.
        x-agent:
            needsReview: true
            risk: irreversible
            whenNotToUse: To correct the text, use the update-announcement operation instead. Does not delete personal messages; use the delete personal message operation.
            whenToUse: The operator wants to remove or withdraw an announcement.
    - target: $.paths['/api/customer/notification/announcements/{id}'].delete.parameters[?(@.name=='id')]
      update:
        description: Announcement id (integer) from the list-announcements or get-announcement operation.
    - target: $.paths['/api/customer/notification/announcements/{id}'].get
      update:
        description: Returns the announcement and its per-language and per-currency resources. If the id does not exist, the call still succeeds and the data is null rather than a 404.
        responses:
            "401":
                description: Missing or invalid backoffice login.
            "403":
                description: The operator lacks the ViewAnnouncement permission.
        summary: Get one announcement with all its translated versions.
        x-agent:
            risk: read
            whenNotToUse: To search or list announcements, use the list-announcements operation. Does not show who read it.
            whenToUse: The operator wants the full text of a particular announcement, or the agent needs current values before an update.
    - target: $.paths['/api/customer/notification/announcements/{id}'].get.parameters[?(@.name=='id')]
      update:
        description: Announcement id (integer) from the list-announcements operation.
    - target: $.paths['/api/customer/notification/announcements/{id}'].patch
      update:
        description: Replaces the announcement's type, caution flag, subject, content, recipient currencies and translated resources with the values sent. It takes the same full body as create, so send every field, not only the changed ones. Customers will see the new text.
        responses:
            "400":
                description: A required field is missing or too long, or an enum value is invalid. Fix the body and resend.
            "401":
                description: Missing or invalid backoffice login.
            "403":
                description: The operator lacks the EditAnnouncement permission.
        summary: Edit an existing announcement.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: To create a new announcement, use the create operation. To remove one, use the delete operation. Does not edit personal messages.
            whenToUse: The operator wants to fix or change an announcement that already exists.
    - target: $.paths['/api/customer/notification/announcements/{id}'].patch.parameters[?(@.name=='id')]
      update:
        description: Announcement id (integer) from the list-announcements operation.
    - target: $.paths['/api/customer/notification/checkUsers'].post
      update:
        description: Takes a list of usernames and returns, for each one, its customerId, currency and a status. The status is NotExist (0) if no such customer, otherwise Available (1). Matching ignores upper and lower case. This is a POST but changes nothing.
        responses:
            "400":
                description: The usernames list is missing or empty; send at least one username.
            "401":
                description: Missing or invalid backoffice login.
            "403":
                description: The operator lacks the ViewPersonalMessage permission.
        summary: Check whether usernames exist before sending them a personal message.
        x-agent:
            risk: read
            whenNotToUse: Does not send anything; use the create personal message operation for that. Not a general customer search.
            whenToUse: The operator wants to validate recipient usernames, or find out the currency of customers, before creating a personal message.
    - target: $.paths['/api/customer/notification/personalMessages'].get
      update:
        description: Returns a page of messages, each with its recipients and whether each recipient opened it, plus the total count. Filters are optional. Timestamps are Unix epoch in milliseconds.
        responses:
            "401":
                description: Missing or invalid backoffice login.
            "403":
                description: The operator lacks the ViewPersonalMessage permission.
        summary: List personal messages sent to individual customers, with paging.
        x-agent:
            risk: read
            whenNotToUse: Does not list site-wide announcements; use the list-announcements operation. Does not search by recipient username.
            whenToUse: The operator wants to see which personal messages were sent, find one by subject, or check who opened a message.
    - target: $.paths['/api/customer/notification/personalMessages'].get.parameters[?(@.name=='PageNumber')]
      update:
        description: Page index, starting at 1. Send it together with PageSize.
    - target: $.paths['/api/customer/notification/personalMessages'].get.parameters[?(@.name=='PageSize')]
      update:
        description: Items per page. Send it together with PageNumber.
    - target: $.paths['/api/customer/notification/personalMessages'].get.parameters[?(@.name=='type')]
      update:
        description: 'Optional message type: 0 = General, 1 = Promotion. Omit for all.'
    - target: $.paths['/api/customer/notification/personalMessages'].get.parameters[?(@.name=='search')]
      update:
        description: Optional text matched against the message subject.
    - target: $.paths['/api/customer/notification/personalMessages'].get.parameters[?(@.name=='startTimestamp')]
      update:
        description: Optional start of the time range, Unix epoch in milliseconds (int64).
    - target: $.paths['/api/customer/notification/personalMessages'].get.parameters[?(@.name=='endTimestamp')]
      update:
        description: Optional end of the time range, Unix epoch in milliseconds (int64).
    - target: $.paths['/api/customer/notification/personalMessages'].post
      update:
        description: Creates one message and delivers it to every recipient username that exists. It returns SuccessCount, FailedCount and FailedUsers, and unknown usernames are skipped rather than rejected. Customers receive the message, so it cannot be recalled by the agent.
        responses:
            "400":
                description: A required field is missing, recipients is empty, subject or content is empty or too long, or an enum value is invalid. Fix the body and resend.
            "401":
                description: Missing or invalid backoffice login.
            "403":
                description: The operator lacks the SendPersonalMessage permission.
        summary: Send a personal message to one or more customers by username.
        x-agent:
            risk: irreversible
            whenNotToUse: Does not publish to all customers; use the create announcement operation. To validate usernames first, use check users. To fix a message already sent, use the update-personal-message operation.
            whenToUse: The operator wants to message or notify specific customers, for example a promotion or an account notice.
    - target: $.paths['/api/customer/notification/personalMessages/{id}'].delete
      update:
        description: Deletes the message by id and records the operator who did it. The code does not say whether this is a soft or a hard delete, and there is no restore operation. It probably removes the message for all of its recipients.
        responses:
            "401":
                description: Missing or invalid backoffice login.
            "403":
                description: The operator lacks the DeletePersonalMessage permission.
        summary: Delete a personal message so recipients no longer see it.
        x-agent:
            needsReview: true
            risk: irreversible
            whenNotToUse: To correct the text, use the update-personal-message operation. Does not delete announcements; use the delete-announcement operation.
            whenToUse: The operator wants to withdraw or remove a personal message that was sent.
    - target: $.paths['/api/customer/notification/personalMessages/{id}'].delete.parameters[?(@.name=='id')]
      update:
        description: Personal message id (integer) from the list personal messages operation.
    - target: $.paths['/api/customer/notification/personalMessages/{id}'].get
      update:
        description: Returns the message type, call-to-action type, subject, content, who created it and when, and each recipient with whether they opened it. If the id does not exist, the call still succeeds and the data is null rather than a 404.
        responses:
            "401":
                description: Missing or invalid backoffice login.
            "403":
                description: The operator lacks the ViewPersonalMessage permission.
        summary: Get one personal message with its recipients and read status.
        x-agent:
            risk: read
            whenNotToUse: To search or list messages, use the list personal messages operation. Does not read announcements.
            whenToUse: The operator wants the full content or the recipient list of a particular personal message, or the agent needs current values before an update.
    - target: $.paths['/api/customer/notification/personalMessages/{id}'].get.parameters[?(@.name=='id')]
      update:
        description: Personal message id (integer) from the list personal messages operation.
    - target: $.paths['/api/customer/notification/personalMessages/{id}'].patch
      update:
        description: Replaces the type, ctaType, subject and content of the message, so send all four fields. It does not change the recipients and does not send the message again. Recipients will probably see the edited text.
        responses:
            "400":
                description: A required field is missing or too long, or an enum value is invalid. Fix the body and resend.
            "401":
                description: Missing or invalid backoffice login.
            "403":
                description: The operator lacks the SendPersonalMessage permission, which this operation requires instead of a separate edit permission.
        summary: Edit the text, type or call-to-action of a personal message already sent.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Cannot add or remove recipients; send a new message with the create operation instead. Does not edit announcements.
            whenToUse: The operator wants to correct a personal message that was already created.
    - target: $.paths['/api/customer/notification/personalMessages/{id}'].patch.parameters[?(@.name=='id')]
      update:
        description: Personal message id (integer) from the list personal messages operation.
    - target: $.paths['/api/customer/promotion/{customerId}/bonus'].get
      update:
        description: Returns the customer's deposit bonuses whose status is Activated (2) or Pending (1). Finished bonuses are not included. Not paged and takes no filters.
        responses:
            "403":
                description: The operator lacks the ViewPlayerProfile permission; use an account that has it.
        summary: List a customer's current deposit bonuses that are still running or waiting.
        x-agent:
            risk: read
            whenNotToUse: 'Past or finished bonuses (expired, canceled, completed, disqualified): use GET /api/customer/promotion/{customerId}/bonus/history. Rebates: use the rebate history operation. Referrals: use the referral history operation.'
            whenToUse: Which bonuses does this customer have right now? Is there an active bonus on this account? Finding the promotionId to cancel.
    - target: $.paths['/api/customer/promotion/{customerId}/bonus'].get.parameters[?(@.name=='customerId')]
      update:
        description: Customer's integer id (int32). Take it from the player search or profile in the back office.
    - target: $.paths['/api/customer/promotion/{customerId}/bonus/enrollableTransaction'].get
      update:
        description: Returns at most 3 completed deposits, newest first, that started from 2 days ago (UTC midnight) up to the end of today (UTC). Deposits that already have a deposit bonus in Activated, Canceled, Completed or Disqualified status are left out. Each row has the deposit time (Unix milliseconds), the reference number and the actual amount.
        responses:
            "403":
                description: The operator lacks the ManualEnrollBonus permission.
        summary: List the customer's recent deposits that could still be manually enrolled into a deposit bonus.
        x-agent:
            risk: read
            whenNotToUse: 'The full deposit history or any deposit older than 2 days: this only looks at a short recent window. To see which bonuses fit one deposit, use bonus/manualEnrollable. To enroll, use bonus/manual-enroll.'
            whenToUse: The operator wants to give a customer a bonus they missed on a deposit and needs to know which deposits qualify. Run it first to get the transactionId for manual-enroll or manualEnrollable.
    - target: $.paths['/api/customer/promotion/{customerId}/bonus/enrollableTransaction'].get.parameters[?(@.name=='customerId')]
      update:
        description: Customer's integer id (int32).
    - target: $.paths['/api/customer/promotion/{customerId}/bonus/history'].get
      update:
        description: 'Returns a paged list of the customer''s bonuses with reward date in StartDate (inclusive) to EndDate (exclusive), newest first. Only finished bonuses are returned: Expired, Canceled, Completed and Disqualified. Active and pending bonuses are never in this list. Deposit bonuses and manual bonuses are merged into one list.'
        responses:
            "400":
                description: StartDate or EndDate is missing or not a valid date-time, or a number parameter is not an integer; send valid values.
            "403":
                description: The operator lacks the ViewPlayerProfile permission.
        summary: Search a customer's finished bonus history (deposit bonuses and manual bonuses) within a date range.
        x-agent:
            risk: read
            whenNotToUse: 'Bonuses running now: use GET /api/customer/promotion/{customerId}/bonus. Rebate or referral rewards: use the rebate or referral history operations.'
            whenToUse: What bonuses has this customer received and how did they end? Looking up a bonus by code or name in a period.
    - target: $.paths['/api/customer/promotion/{customerId}/bonus/history'].get.parameters[?(@.name=='StartDate')]
      update:
        description: Start of range, ISO 8601 date-time such as 2026-10-01T00:00:00Z. Required. Compared with the bonus reward date.
    - target: $.paths['/api/customer/promotion/{customerId}/bonus/history'].get.parameters[?(@.name=='EndDate')]
      update:
        description: End of range, ISO 8601 date-time. Required. Exclusive.
    - target: $.paths['/api/customer/promotion/{customerId}/bonus/history'].get.parameters[?(@.name=='Search')]
      update:
        description: Optional text. Case-insensitive match on promotion code or promotion name (plain text, not a pattern).
    - target: $.paths['/api/customer/promotion/{customerId}/bonus/history'].get.parameters[?(@.name=='Status')]
      update:
        description: Optional filter. Only 3 = Expired, 4 = Canceled, 5 = Disqualified, 6 = Completed have an effect. Any other value (0 Unknown, 1 Pending, 2 Activated, 7 Excluded, 8 WaitingForApproval, 9 TransferFailed) or no value returns all four finished statuses.
    - target: $.paths['/api/customer/promotion/{customerId}/bonus/history'].get.parameters[?(@.name=='PageSize')]
      update:
        description: Optional rows per page. Default 15.
    - target: $.paths['/api/customer/promotion/{customerId}/bonus/history'].get.parameters[?(@.name=='PageNumber')]
      update:
        description: Optional page number, starting at 1. Default 1.
    - target: $.paths['/api/customer/promotion/{customerId}/bonus/history'].get.parameters[?(@.name=='customerId')]
      update:
        description: Customer's integer id (int32).
    - target: $.paths['/api/customer/promotion/{customerId}/bonus/manual-enroll'].post
      update:
        description: Enrolls the customer in the given promotion using one completed deposit. It then deducts the deposit's actual amount from the main wallet, marks that deposit as handled, and signals that the manual enroll is done. The wallet deduction cannot be undone by this API; the bonus can only be cancelled with the DELETE bonus operation.
        responses:
            "400":
                description: Body is missing promotionCode or transactionId; send both.
            "403":
                description: The operator lacks the ManualEnrollBonus permission.
            "422":
                description: A business rule failed (arrives as HTTP 200 with an errorCode in the body, not as 422). The deposit is not found, is not Completed, is not a Deposit, belongs to another customer, the main wallet balance is lower than the deposit amount, the promotion's enroll rules reject it, or the wallet transfer failed. Check the message and pick a different deposit or promotion.
        summary: Manually give a customer a deposit bonus for a past deposit, paid for by taking the deposit amount out of their main wallet.
        x-agent:
            risk: money
            whenNotToUse: 'Only checking eligibility: use bonus/manualEnrollable. Looking for deposits to use: use bonus/enrollableTransaction. Cancelling a bonus: use DELETE bonus/{promotionId}.'
            whenToUse: The operator says to add the missed deposit bonus for a customer's deposit, after checking the promotion is eligible.
    - target: $.paths['/api/customer/promotion/{customerId}/bonus/manual-enroll'].post.parameters[?(@.name=='customerId')]
      update:
        description: Customer's integer id (int32). Must be the owner of the deposit.
    - target: $.paths['/api/customer/promotion/{customerId}/bonus/manualEnrollable'].get
      update:
        description: Takes the details of one deposit and returns the active deposit bonuses, in the customer's currency, that pass the manual-enroll checks for it. Each result has a promotion code and name. It changes nothing.
        responses:
            "400":
                description: TransactionId, DepositAmount or DepositDate is missing or malformed; send all three.
            "403":
                description: The operator lacks the ManualEnrollBonus permission.
        summary: List the deposit bonuses a given deposit would qualify for if enrolled manually.
        x-agent:
            risk: read
            whenNotToUse: 'Finding which deposits are candidates: use bonus/enrollableTransaction. Actually enrolling: use bonus/manual-enroll.'
            whenToUse: Which bonus can I give this customer for this deposit? Getting a valid promotionCode before manual-enroll.
    - target: $.paths['/api/customer/promotion/{customerId}/bonus/manualEnrollable'].get.parameters[?(@.name=='customerId')]
      update:
        description: Customer's integer id (int32).
    - target: $.paths['/api/customer/promotion/{customerId}/bonus/manualEnrollable'].get.parameters[?(@.name=='TransactionId')]
      update:
        description: Required. Reference number of the deposit, from bonus/enrollableTransaction.
    - target: $.paths['/api/customer/promotion/{customerId}/bonus/manualEnrollable'].get.parameters[?(@.name=='DepositAmount')]
      update:
        description: Required. Deposit amount as a decimal number, in the customer's currency; use the ActualAmount from bonus/enrollableTransaction.
    - target: $.paths['/api/customer/promotion/{customerId}/bonus/manualEnrollable'].get.parameters[?(@.name=='DepositDate')]
      update:
        description: Required. Deposit time, ISO 8601 date-time; use the deposit's start time from bonus/enrollableTransaction (it is returned in Unix milliseconds, so convert it).
    - target: $.paths['/api/customer/promotion/{customerId}/bonus/{promotionId}'].delete
      update:
        description: Cancels the customer's active deposit bonus. It closes the bonus wallet, moves the remaining balance (less any forfeit amount) back, and records the operator and the reason. It fails if the bonus is not active or cannot be cancelled, for example when the customer has running bets that block it.
        responses:
            "400":
                description: reason is missing; send it.
            "403":
                description: The operator lacks the EditPlayerProfile permission.
            "422":
                description: The active bonus was not found for this customer and promotionId, or it cannot be cancelled now (for example running bets), or closing the wallet failed. Check the id with GET bonus; retry later if bets are running.
        summary: Cancel a customer's active deposit bonus and close its bonus wallet.
        x-agent:
            needsReview: true
            risk: irreversible
            whenNotToUse: 'Viewing bonuses: use GET bonus or bonus/history. Cancelling a rebate or referral reward: not available here.'
            whenToUse: The operator asks to cancel, remove or forfeit a customer's running bonus.
    - target: $.paths['/api/customer/promotion/{customerId}/bonus/{promotionId}'].delete.parameters[?(@.name=='customerId')]
      update:
        description: Customer's integer id (int32).
    - target: $.paths['/api/customer/promotion/{customerId}/bonus/{promotionId}'].delete.parameters[?(@.name=='promotionId')]
      update:
        description: Id of the customer's active bonus; take it from GET /api/customer/promotion/{customerId}/bonus.
    - target: $.paths['/api/customer/promotion/{customerId}/bonus/{promotionId}'].delete.parameters[?(@.name=='reason')]
      update:
        description: Required text. Why the bonus is cancelled; it is saved with the cancellation.
    - target: $.paths['/api/customer/promotion/{customerId}/rebate/history'].get
      update:
        description: Returns a paged list of the customer's rebate records between StartDate and EndDate, which may be at most 31 days apart. It can be filtered by status.
        responses:
            "400":
                description: StartDate or EndDate is missing or malformed; send valid values.
            "403":
                description: The operator lacks the ViewPlayerProfile permission.
            "422":
                description: The range is longer than 31 days (message 'The date range cannot exceed 1 month.'); shorten it or split it into several calls.
        summary: List a customer's rebate rewards within a date range.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: 'Deposit or manual bonuses: use bonus/history. Referral rewards: use referral/history.'
            whenToUse: What rebates did this customer get in a period, and what state are they in?
    - target: $.paths['/api/customer/promotion/{customerId}/rebate/history'].get.parameters[?(@.name=='StartDate')]
      update:
        description: Start of range, ISO 8601 date-time. Required.
    - target: $.paths['/api/customer/promotion/{customerId}/rebate/history'].get.parameters[?(@.name=='EndDate')]
      update:
        description: End of range, ISO 8601 date-time. Required. No more than 31 days after StartDate.
    - target: $.paths['/api/customer/promotion/{customerId}/rebate/history'].get.parameters[?(@.name=='Status')]
      update:
        description: Optional. 0 = Unknown, 1 = Pending, 2 = Activated, 3 = Expired, 4 = Canceled, 5 = Disqualified, 6 = Completed, 7 = Excluded, 8 = WaitingForApproval, 9 = TransferFailed.
    - target: $.paths['/api/customer/promotion/{customerId}/rebate/history'].get.parameters[?(@.name=='PageSize')]
      update:
        description: Optional rows per page. Default 15.
    - target: $.paths['/api/customer/promotion/{customerId}/rebate/history'].get.parameters[?(@.name=='PageNumber')]
      update:
        description: Optional page number, starting at 1. Default 1.
    - target: $.paths['/api/customer/promotion/{customerId}/rebate/history'].get.parameters[?(@.name=='customerId')]
      update:
        description: Customer's integer id (int32).
    - target: $.paths['/api/customer/promotion/{customerId}/referral/history'].get
      update:
        description: Returns a paged list of the customer's referral records between StartDate and EndDate, which may be at most 31 days apart. It can be filtered by status.
        responses:
            "400":
                description: StartDate or EndDate is missing or malformed; send valid values.
            "403":
                description: The operator lacks the ViewPlayerProfile permission.
            "422":
                description: The range is longer than 31 days (message 'The date range cannot exceed 1 month.'); shorten it or split it into several calls.
        summary: List a customer's referral rewards within a date range.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: 'Deposit or manual bonuses: use bonus/history. Rebates: use rebate/history.'
            whenToUse: What referral rewards did this customer get in a period, and what state are they in?
    - target: $.paths['/api/customer/promotion/{customerId}/referral/history'].get.parameters[?(@.name=='StartDate')]
      update:
        description: Start of range, ISO 8601 date-time. Required.
    - target: $.paths['/api/customer/promotion/{customerId}/referral/history'].get.parameters[?(@.name=='EndDate')]
      update:
        description: End of range, ISO 8601 date-time. Required. No more than 31 days after StartDate.
    - target: $.paths['/api/customer/promotion/{customerId}/referral/history'].get.parameters[?(@.name=='Status')]
      update:
        description: Optional. 0 = Unknown, 1 = Pending, 2 = Activated, 3 = Expired, 4 = Canceled, 5 = Disqualified, 6 = Completed, 7 = Excluded, 8 = WaitingForApproval, 9 = TransferFailed.
    - target: $.paths['/api/customer/promotion/{customerId}/referral/history'].get.parameters[?(@.name=='PageSize')]
      update:
        description: Optional rows per page. Default 15.
    - target: $.paths['/api/customer/promotion/{customerId}/referral/history'].get.parameters[?(@.name=='PageNumber')]
      update:
        description: Optional page number, starting at 1. Default 1.
    - target: $.paths['/api/customer/promotion/{customerId}/referral/history'].get.parameters[?(@.name=='customerId')]
      update:
        description: Customer's integer id (int32).
    - target: $.paths['/api/customer/searchPlayerProfile'].get
      update:
        description: Returns a page of matching player profiles plus the total count; each row includes the player's status ids. PageNumber and PageSize fall back to server defaults when omitted. IncludeTestAccount defaults to true, so test accounts appear unless you send false.
        responses:
            "400":
                description: A parameter is malformed, e.g. a non-integer Status or Currency, or a bad date format; fix the value.
            "401":
                description: Not logged in as a back-office operator; log in again.
            "403":
                description: Operator lacks the ViewPlayerProfile permission.
        summary: Search players by username, phone, status, currency or date range, with paging.
        x-agent:
            risk: read
            whenNotToUse: Not for the full detail of one known player (use GET /api/customer/{customerId}). Not for balances (use GET /api/customer/{customerId}/wallets/v2). There is no email filter, so it cannot find a player by email.
            whenToUse: Find a player or list players, for example by username, phone number, status, wallet currency or registration window. This is how to get a customerId.
    - target: $.paths['/api/customer/searchPlayerProfile'].get.parameters[?(@.name=='Username')]
      update:
        description: Username to search for. Partial match (contains), so ench_al finds bench_alice.
    - target: $.paths['/api/customer/searchPlayerProfile'].get.parameters[?(@.name=='Status')]
      update:
        description: 'Player status filter, one value only: 1 = Active, 2 = Suspended, 4 = Closed, 8 = TestMode, 16 = KycVerified, 32 = CustomizedUsername.'
    - target: $.paths['/api/customer/searchPlayerProfile'].get.parameters[?(@.name=='Phone')]
      update:
        description: Phone number without country code. The server converts it to an internal mobile phone.
    - target: $.paths['/api/customer/searchPlayerProfile'].get.parameters[?(@.name=='PhoneCountryCode')]
      update:
        description: Phone country code. Declared, but the code that builds the search model never reads it; do not rely on it.
    - target: $.paths['/api/customer/searchPlayerProfile'].get.parameters[?(@.name=='StartDate')]
      update:
        description: Start of the registration-time range, ISO 8601 date-time (exclusive, a player registered exactly at this time is not returned).
    - target: $.paths['/api/customer/searchPlayerProfile'].get.parameters[?(@.name=='EndDate')]
      update:
        description: End of the registration-time range, ISO 8601 date-time (exclusive).
    - target: $.paths['/api/customer/searchPlayerProfile'].get.parameters[?(@.name=='PageNumber')]
      update:
        description: Page number, starting at 1; 0 is rejected. Server default if omitted.
    - target: $.paths['/api/customer/searchPlayerProfile'].get.parameters[?(@.name=='PageSize')]
      update:
        description: Rows per page. Server default if omitted.
    - target: $.paths['/api/customer/searchPlayerProfile'].get.parameters[?(@.name=='Currency')]
      update:
        description: Wallet currency filter. Integer code from the FiatCurrency enum (numeric ISO 4217 style, e.g. 840 = USD, 156 = CNY, 702 = SGD). It is sent to the database as the enum name.
    - target: $.paths['/api/customer/searchPlayerProfile'].get.parameters[?(@.name=='IncludeTestAccount')]
      update:
        description: true (default when omitted) = include test accounts, false = exclude them.
    - target: $.paths['/api/customer/searchPlayerProfile'].get.parameters[?(@.name=='FairExchangeId')]
      update:
        description: Filter by the player's FairExchangeId, the string profile rows return as fairExchangeId.
    - target: $.paths['/api/customer/searchPlayerProfile'].get.parameters[?(@.name=='IsFairExchangeOnly')]
      update:
        description: true = return only fair-exchange players, false or omitted = no such restriction.
    - target: $.paths['/api/customer/status'].delete
      update:
        description: Deletes the listed status ids from the player. Only the body is read (customerId, statusIds). Requires the ChangePlayerStatus permission.
        responses:
            "401":
                description: Not logged in as a back-office operator.
            "403":
                description: Operator lacks the ChangePlayerStatus permission.
        summary: Remove one or more statuses from a player.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for checking whether a player has a status (GET /api/customer/status). Not for adding a status (POST /api/customer/status). Not for changing many profile fields at once (POST /api/customer/{customerId}/edit).
            whenToUse: Take a status off a player, such as lifting Suspended or removing KycVerified.
    - target: $.paths['/api/customer/status'].get
      update:
        description: Returns a single true or false for the customerId and statusIds sent in a request body (a GET with a body). It changes nothing. Status id 3 is rejected with a 500 asking to upgrade Example.Core.
        responses:
            "401":
                description: Not logged in as a back-office operator.
            "403":
                description: Operator lacks the ViewPlayerProfile permission.
            "500":
                description: statusIds contains 3 (legacy value); remove it.
        summary: Check whether a player has the given status(es).
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Not for listing a player's statuses (use GET /api/customer/{customerId} or GET /api/customer/searchPlayerProfile, which return status ids). Not for changing a status (POST or DELETE /api/customer/status).
            whenToUse: Check whether a player currently has a status, such as Suspended or KycVerified.
    - target: $.paths['/api/customer/status'].post
      update:
        description: Adds the listed status ids to the player, for example suspending or closing the account, or marking it KYC-verified. Adding KycVerified (16) also needs the VerifyKyc permission. Requires the ChangePlayerStatus permission.
        responses:
            "401":
                description: Not logged in as a back-office operator.
            "403":
                description: Operator lacks the ChangePlayerStatus permission.
            "500":
                description: Adding KycVerified without the VerifyKyc permission ('Not allowed to verify kyc'), or the database insert failed; use an operator with VerifyKyc, or read the message in the body.
        summary: Add one or more statuses to a player.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for removing a status (DELETE /api/customer/status). Not for checking one (GET /api/customer/status).
            whenToUse: Give a player a status, such as Suspended, Closed, TestMode or KycVerified.
    - target: $.paths['/api/customer/transaction/{customerId}'].get
      update:
        description: Returns a chronological list of the customer's fund movements, each with category, transaction id, details, amount, remark, event and reference number. The date range must be 35 days or less. Whatever FundType you pick, the opening-balance entries are added to the result. Game, Sports and Casino rows come from daily settlement data, so they are aggregated per day and not per bet.
        responses:
            "400":
                description: StartDate, EndDate or FundType is missing, or is not a valid date-time or enum integer, or customerId is not an integer. Send all three query values in the right format.
            "401":
                description: Not logged in to the back office. Authenticate and retry.
            "403":
                description: The operator lacks the ViewPlayerProfile permission. Use an account that has it.
            "500":
                description: FundType=9 (VirtualSports) has no registered handler and most likely fails with a server error. Use another FundType, or 0 for All.
        summary: List one customer's fund transactions (deposits, withdrawals, bonuses, rebates, bets and so on) over a date range.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Not for ranges longer than 35 days; split them into several calls. Not for individual bet or round details; use the bet or casino bet list operations instead. Not for the customer's current balance, and not for the account a withdraw pays out to.
            whenToUse: Operator asks for a customer's account statement or transaction history for a period. Also fits questions like what deposits, withdrawals, bonuses or rebates a customer had last week, or why their balance moved.
    - target: $.paths['/api/customer/transaction/{customerId}'].get.parameters[?(@.name=='StartDate')]
      update:
        description: Start of the range, ISO 8601 date-time with offset, e.g. 2026-10-01T00:00:00+08:00. Required.
    - target: $.paths['/api/customer/transaction/{customerId}'].get.parameters[?(@.name=='EndDate')]
      update:
        description: End of the range, ISO 8601 date-time with offset. Required. EndDate minus StartDate must be at most 35 days.
    - target: $.paths['/api/customer/transaction/{customerId}'].get.parameters[?(@.name=='FundType')]
      update:
        description: Category filter, required. 0 = All, 1 = OpeningBalance, 2 = Deposit, 3 = Withdraw, 4 = Bonus, 5 = Rebate, 6 = ManualTransfer, 7 = Game, 8 = Sports, 9 = VirtualSports, 10 = Casino, 11 = WalletTransfer, 12 = Referral. Use 0 for everything. Do not use 9 (VirtualSports); it has no handler.
    - target: $.paths['/api/customer/transaction/{customerId}'].get.parameters[?(@.name=='customerId')]
      update:
        description: Customer's integer id (int32), from the customer search or list operation. Goes in the path.
    - target: $.paths['/api/customer/verifyPhoneNumber'].post
      update:
        description: Checks that no other player has already verified this number, validates the number format, then sets it as the player's verified phone. Requires the ModifySensitiveInfo permission.
        responses:
            "400":
                description: Phone number fails validation (wrong format or length for the country code); fix countryCode or phoneNumber.
            "401":
                description: Not logged in as a back-office operator.
            "403":
                description: Operator lacks the ModifySensitiveInfo permission.
            "409":
                description: Phone number is already verified by a different player; use another number. This arrives as a BaseResponse error code, so check the response body.
        summary: Mark a given phone number as verified for a player without an OTP.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for just flipping the verified flag (POST /api/customer/forceUpdateCustomerVerification). Not for editing profile fields (POST /api/customer/{customerId}/edit). Not for clearing the OTP attempt limit (POST /api/customer/{customerId}/resetOtp).
            whenToUse: An operator needs to bind and verify a phone number for a player manually, such as after identity checks off-platform.
    - target: $.paths['/api/customer/{customerId}'].get
      update:
        description: Returns the player's profile (identity, contact details, statuses, verification state) plus the current operator's permissions and the player's wallet currency. Returns a CustomerNotFound error if the id does not exist.
        responses:
            "401":
                description: Not logged in as a back-office operator.
            "403":
                description: Operator lacks the ViewPlayerProfile permission.
            "404":
                description: Player does not exist (CustomerNotFound); check the customerId. The live API answers HTTP 200 with errorCode 1011 "Customer not found" and data null, so check errorCode, not the HTTP status.

        summary: Get one player's full profile.
        x-agent:
            risk: read
            whenNotToUse: Not for finding a player by name or phone (use GET /api/customer/searchPlayerProfile). Not for balances (use GET /api/customer/{customerId}/wallets/v2).
            whenToUse: Look at one known player's details before editing or acting on them.
    - target: $.paths['/api/customer/{customerId}'].get.parameters[?(@.name=='customerId')]
      update:
        description: Player id (int) from GET /api/customer/searchPlayerProfile.
    - target: $.paths['/api/customer/{customerId}/edit'].post
      update:
        description: 'Overwrites the player''s profile fields with the values sent and makes the status set match the ''status'' array: missing Active, Suspended or Closed are removed and new ones are added. Changing email or phone needs the ModifySensitiveInfo permission. In UAT and production the TestMode status cannot be changed.'
        responses:
            "400":
                description: Phone fails validation, a verified phone is being cleared, TestMode is being changed in UAT or production, or the operator lacks ModifySensitiveInfo while changing email or phone; the message is in the response body.
            "401":
                description: Not logged in as a back-office operator.
            "403":
                description: Operator lacks the EditPlayerProfile permission.
            "404":
                description: Player does not exist (CustomerNotFound).
        summary: Edit a player's profile fields and statuses.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for adding or removing a single status (use POST or DELETE /api/customer/status). Not for forcing verification (use /forceUpdateCustomerVerification or /verifyPhoneNumber). Not for passwords or OTP.
            whenToUse: Correct a player's name, address, date of birth, email, phone or remark, or change the player's statuses in one call.
    - target: $.paths['/api/customer/{customerId}/edit'].post.parameters[?(@.name=='customerId')]
      update:
        description: Player id (int) from GET /api/customer/searchPlayerProfile.
    - target: $.paths['/api/customer/{customerId}/resetOtp'].post
      update:
        description: Zeroes the used-count of the player's OTP, which clears the OTP throttling limit. It does not send an OTP and does not change the password. For the ExampleBrand brand it uses the player's email, otherwise the player's mobile phone. Requires the ResetOtp permission.
        responses:
            "400":
                description: 'ExampleBrand brand only: the player has no email (EmailNotFound); set one via POST /api/customer/{customerId}/edit.'
            "401":
                description: Not logged in as a back-office operator.
            "403":
                description: Operator lacks the ResetOtp permission, or the player has no mobile phone set (MobilePhoneNotSet).
            "404":
                description: Player does not exist (CustomerNotFound). Live check - a business error is HTTP 200 with the error code in the body (e.g. errorCode 1011 Customer not found), not an HTTP error status.
        summary: Reset a player's OTP attempt counter so they can request OTPs again.
        x-agent:
            risk: credential
            whenNotToUse: Not for resetting a password (use GET /api/customer/{customerId}/resetPassword). Not for verifying a phone (use POST /api/customer/verifyPhoneNumber).
            whenToUse: A player is locked out because they hit the OTP request limit and an operator needs to let them try again.
    - target: $.paths['/api/customer/{customerId}/resetOtp'].post.parameters[?(@.name=='customerId')]
      update:
        description: Player id (int) from GET /api/customer/searchPlayerProfile.
    - target: $.paths['/api/customer/{customerId}/resetPassword'].get
      update:
        description: Creates a reset session and returns a reset URL (member site address plus a token) and its expiry, about 5 minutes ahead. Despite being a GET it writes a session record each time it is called. It does not change the password itself, and the operator passes the link to the player.
        responses:
            "401":
                description: Not logged in as a back-office operator.
            "403":
                description: Operator lacks the ResetPassword permission.
            "404":
                description: Player does not exist (CustomerNotFound).
        summary: Create a one-time password-reset link for a player.
        x-agent:
            risk: credential
            whenNotToUse: Not for OTP lockouts (use POST /api/customer/{customerId}/resetOtp). Not for operator accounts (a separate /api/operator/resetPassword route exists).
            whenToUse: A player forgot their password and an operator needs to give them a reset link.
    - target: $.paths['/api/customer/{customerId}/resetPassword'].get.parameters[?(@.name=='customerId')]
      update:
        description: Player id (int) from GET /api/customer/searchPlayerProfile.
    - target: $.paths['/api/customer/{customerId}/wallets'].get
      update:
        description: Returns the player's wallet info from the wallet service together with the amount still to be rolled over before withdrawal. Returns a CustomerNotFound error for an unknown id and a WalletNotFound error if the wallet service has no data. Superseded by the v2 route for multi-currency players.
        responses:
            "401":
                description: Not logged in as a back-office operator.
            "403":
                description: Operator lacks the ViewPlayerProfile permission.
            "404":
                description: Player does not exist (CustomerNotFound) or has no wallet (WalletNotFound).
        summary: Get a player's wallet balances (legacy single-wallet view) with the unrolled amount.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: For per-currency main wallet balances use GET /api/customer/{customerId}/wallets/v2 instead. Not for transaction history.
            whenToUse: Only if a caller needs the legacy wallet response shape.
    - target: $.paths['/api/customer/{customerId}/wallets'].get.parameters[?(@.name=='customerId')]
      update:
        description: Player id (int) from GET /api/customer/searchPlayerProfile.
    - target: $.paths['/api/customer/{customerId}/wallets/v2'].get
      update:
        description: Returns one entry for each of the player's main wallets (one per currency), each with its balance and the rollover amount still required for that currency. Returns a CustomerNotFound error for an unknown id and a WalletNotFound error if the wallet service has no data. Sub-wallets that are not main wallets are left out.
        responses:
            "401":
                description: Not logged in as a back-office operator.
            "403":
                description: Operator lacks the ViewPlayerProfile permission.
            "404":
                description: Player does not exist (CustomerNotFound) or has no wallet (WalletNotFound).
        summary: Get a player's main wallet per currency, with balances and unrolled (turnover-required) amount.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Not for finding the player (use GET /api/customer/searchPlayerProfile). Not for transaction history. For the legacy response shape use GET /api/customer/{customerId}/wallets.
            whenToUse: Check a player's balance per currency or how much turnover remains before they can withdraw.
    - target: $.paths['/api/customer/{customerId}/wallets/v2'].get.parameters[?(@.name=='customerId')]
      update:
        description: Player id (int) from GET /api/customer/searchPlayerProfile.
    - target: $.paths['/api/exchange-rate'].get
      update:
        description: Returns the base currency (targetCurrency), a list of {currency, rate} pairs and updatedAt as Unix milliseconds. Each rate is the worth of one unit of that currency in the base currency. The data is fetched live from the Venus service, which serves it from a cache; the call changes nothing.
        responses:
            "401":
                description: Missing or invalid backoffice authorization token; log in and send the bearer token.
            "500":
                description: 'Rates could not be loaded: every Venus rate provider failed, or Venus returned no rates for the base currency. Retry later; the call itself cannot be fixed.'
        summary: Show the current exchange rates of every supported currency into the platform's base currency.
        x-agent:
            risk: read
            whenNotToUse: Does not convert a specific amount, return rates between two arbitrary currencies, or return historical rates. It also does not list the currencies configured for the platform; use the currency operation under the Currency tag for that.
            whenToUse: The operator asks for the current exchange rate or conversion rate of a currency, which currencies are priced, or when the rates were last refreshed.
    - target: $.paths['/api/game'].get
      update:
        description: Returns a paged list (GameCode, GameName, DisplayName, BrandProviderName/Id, Category tags, Status) with the total count. Paging is 1-based, with offset = (PageNumber-1)*PageSize. It always reads fresh data (force refresh) and applies no filter, so it cannot search by name, provider or status. Needs the ViewGameSetting permission.
        responses:
            "400":
                description: A required query parameter is missing or invalid; send LanguageCode, PageSize and PageNumber, all integers.
            "401":
                description: Not signed in as an operator; sign in first.
            "403":
                description: The operator lacks the ViewGameSetting permission; use an account that has it.
        summary: List games for game settings, one page at a time, with name, provider, tags and status.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Do not use it to get all games in one call or per-currency display order (use GET /api/game/all). Do not use it to list providers (use GET /api/game/providerList). It cannot filter by name or provider.
            whenToUse: Browse the game catalogue page by page; find a gameCode to use in the game update operations; see a game's current status.
    - target: $.paths['/api/game'].get.parameters[?(@.name=='LanguageCode')]
      update:
        description: 'Language for the display names. Integer enum: 0=EnUs, 1=EnGb, 2=EnAu, 3=EnCa, 4=EnSg, 5=EnPh, 10=FrFr, 11=FrCa, 12=FrBe, 20=DeDe, 21=DeAt, 22=DeCh, 30=EsEs, 31=EsMx, 32=EsAr, 40=PtPt, 41=PtBr, 50=NlNl, 51=NlBe, 60=ItIt, 70=RuRu, 80=ZhCn, 81=ZhTw, 82=ZhHk, 83=ZhSg, 90=JaJp, 100=KoKr, 110=ArSa, 111=ArEg, 120=HiIn, 130=TlPh, 140=IdId, 150=ThTh, 160=ViVn, 170=KmKh, 180=MsMy, 190=LoLa, 200=TrTr, 210=PlPl, 220=UkUa, 230=ElGr, 240=CsCz, 250=SvSe, 260=DaDk, 270=FiFi, 280=NoNo, 290=HeIl, 300=RoRo, 310=HuHu, 320=MyMm, 330=BnBd, 340=TaIn; the remaining values (341..410) are further locales, so check the schema. Use 0 (EnUs) if unsure.'
    - target: $.paths['/api/game'].get.parameters[?(@.name=='PageSize')]
      update:
        description: Number of rows per page, a positive integer.
    - target: $.paths['/api/game'].get.parameters[?(@.name=='PageNumber')]
      update:
        description: Page number starting at 1. Do not send 0, because it gives a negative offset.
    - target: $.paths['/api/game'].put
      update:
        description: Sets the status of the single game identified by gameCode, via the GameInfo service, and records the operator's login as the modifier. It takes effect on the live game catalogue for players. Needs the EditGameSettingsAndTags permission.
        responses:
            "400":
                description: Body invalid or gameCode missing; send JSON with gameCode and a gameStatus from 1 to 4.
            "401":
                description: Not signed in as an operator.
            "403":
                description: The operator lacks the EditGameSettingsAndTags permission.
        summary: Change the status of one game.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Do not use it to change many games at once (use PUT /api/game/status). Do not use it to change a whole provider (use PATCH /api/game/provider). It does not change display order (use PATCH /api/game/order) and it does not edit tags, even though the permission name mentions them.
            whenToUse: Enable, suspend or otherwise change the status of one specific game.
    - target: $.paths['/api/game/all'].get
      update:
        description: Returns all games unpaged (icon, code, names, provider id and name, tags, status), plus GameOrders for each currency. GameOrder holds the order for the requested currency, or 2147483647 when the game has no order there. It always reads fresh data and needs the ViewGameSetting permission.
        responses:
            "400":
                description: language or currency missing or not in the allowed list; send both, using values from the schema enum.
            "401":
                description: Not signed in as an operator.
            "403":
                description: The operator lacks the ViewGameSetting permission.
        summary: List every game in one call, with its display order per currency.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Do not use it for a quick paged browse of games (use GET /api/game). Do not use it to list providers (use GET /api/game/providerList).
            whenToUse: Get the full game list for ordering screens; see which position each game has for a given currency.
    - target: $.paths['/api/game/all'].get.parameters[?(@.name=='language')]
      update:
        description: Language of the display names. Same integer enum as LanguageCode in GET /api/game (0=EnUs, 1=EnGb, 4=EnSg, 5=EnPh, 80=ZhCn, 81=ZhTw, and so on). Required.
    - target: $.paths['/api/game/all'].get.parameters[?(@.name=='currency')]
      update:
        description: Fiat currency as ISO 4217 numeric code, an integer from the schema enum (for example 608=PHP, 840=USD, 156=CNY, 702=SGD, 826=GBP, 978=EUR if present in the schema). It selects which currency's order goes into GameOrder. Required.
    - target: $.paths['/api/game/bet-limit'].get
      update:
        description: 'Returns one row per currency that has a limit: currency, MaxWinlostPerRound and who last modified it and when. The data is read from the Bali service. It takes no parameters and needs the ViewGameSetting permission.'
        responses:
            "401":
                description: Not signed in as an operator.
            "403":
                description: The operator lacks the ViewGameSetting permission.
            "500":
                description: The Bali service could not be reached or returned an error; retry later.
        summary: Show the maximum win/loss per round set for each currency.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: 'Do not use it to change a limit (use POST /api/game/bet-limit/{currency}). Do not confuse it with sports bet limits: Backoffice has a separate sports bet-limit route under /api/sports/bet-limit, which this one does not return.'
            whenToUse: Check the current per-round maximum win/loss limits before or after changing one.
    - target: $.paths['/api/game/bet-limit/{currency}'].post
      update:
        description: Upserts one currency's limit in the Bali service and records the operator's login as the modifier. It overwrites any existing limit for that currency. Needs the EditGameSettingsAndTags permission.
        responses:
            "400":
                description: Body invalid; send JSON with a numeric maxWinlostPerRound.
            "401":
                description: Not signed in as an operator.
            "403":
                description: The operator lacks the EditGameSettingsAndTags permission.
            "500":
                description: An unknown currency code or a Bali service failure; check the code against GET /api/game/bet-limit.
        summary: Set or replace the maximum win/loss per round for one currency.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Do not use it to read limits (use GET /api/game/bet-limit). It does not change sports limits (that is a separate sports route) and it does not touch a player's balance.
            whenToUse: Set or change the per-round max win/loss cap for a currency, for example PHP.
    - target: $.paths['/api/game/bet-limit/{currency}'].post.parameters[?(@.name=='currency')]
      update:
        description: Currency code in the path as a string, for example PHP or BTC. It is normalised to the canonical uppercase code by the server. Take valid codes from the currency column of GET /api/game/bet-limit.
    - target: $.paths['/api/game/display-financial-provider-list'].get
      update:
        description: Returns the provider list used for the game GGR report filters, in the requested language. The code carries a TODO saying the response is not yet backed by real financial provider data. Needs the ViewGameGgrReports permission, not the game setting one.
        responses:
            "400":
                description: language missing or not in the allowed list.
            "401":
                description: Not signed in as an operator.
            "403":
                description: The operator lacks the ViewGameGgrReports permission.
        summary: List the providers shown in financial/GGR reports.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Do not use it to manage providers or see their status or maintenance windows (use GET /api/game/providerList).
            whenToUse: Fill the provider filter of a game GGR / financial report.
    - target: $.paths['/api/game/display-financial-provider-list'].get.parameters[?(@.name=='language')]
      update:
        description: Language of the names. Same integer enum as LanguageCode in GET /api/game (0=EnUs, 4=EnSg, 5=EnPh, 80=ZhCn, 81=ZhTw, and so on). Required.
    - target: $.paths['/api/game/order'].patch
      update:
        description: Takes a list of entries and saves each game's order position for a currency. It changes only the display order, and it does not touch status. Needs the ManageGamesOrder permission.
        responses:
            "400":
                description: A required field is missing or the currency is not in the allowed list; send gameCode, order and currency for every entry.
            "401":
                description: Not signed in as an operator.
            "403":
                description: The operator lacks the ManageGamesOrder permission.
        summary: Set the display order of games per currency.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Do not use it to reorder providers (use POST /api/game/provider/order) or to change a game's status (use PUT /api/game or PUT /api/game/status).
            whenToUse: Reorder games in the lobby for a currency.
    - target: $.paths['/api/game/provider'].patch
      update:
        description: Updates the status of the provider identified by providerMapping, and optionally its planned close and open times, and records the operator's login. The Spica job CheckAndUpdateProviderUnderMaintain later suspends Normal providers automatically when the current time falls inside the window. Needs the EditGameSettingsAndTags permission.
        responses:
            "400":
                description: providerMapping missing or body invalid; send providerMapping and a status from 1 to 4.
            "401":
                description: Not signed in as an operator.
            "403":
                description: The operator lacks the EditGameSettingsAndTags permission.
        summary: Change a provider's status and its planned maintenance window.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Do not use it to change a single game (use PUT /api/game) or a list of games (use PUT /api/game/status). It does not reorder providers (use POST /api/game/provider/order).
            whenToUse: Suspend or reopen a game provider, or schedule its maintenance window.
    - target: $.paths['/api/game/provider/order'].post
      update:
        description: Takes provider ids in the order they should appear and saves the position of each one (the first gets 0). The country is hard coded to PH in the code, with a TODO. Needs the ManageGamesOrder permission.
        responses:
            "400":
                description: Body is not an array of integers.
            "401":
                description: Not signed in as an operator.
            "403":
                description: The operator lacks the ManageGamesOrder permission.
        summary: Set the display order of providers.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Do not use it to reorder games (use PATCH /api/game/order). It cannot set an order for any country other than PH.
            whenToUse: Reorder the provider list in the lobby for the Philippines.
    - target: $.paths['/api/game/providerList'].get
      update:
        description: Returns every provider in the requested language, always read fresh (force refresh). It is the source of the provider ids used by the provider update operations. Needs the ViewGameSetting permission.
        responses:
            "400":
                description: language missing or not in the allowed list.
            "401":
                description: Not signed in as an operator.
            "403":
                description: The operator lacks the ViewGameSetting permission.
        summary: List game providers with their status and maintenance windows.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Do not use it for report filters (use GET /api/game/display-financial-provider-list) or for the games themselves (use GET /api/game).
            whenToUse: See providers and their status; find the brand and integration provider ids for PATCH /api/game/provider or POST /api/game/provider/order.
    - target: $.paths['/api/game/providerList'].get.parameters[?(@.name=='language')]
      update:
        description: Language of the names. Same integer enum as LanguageCode in GET /api/game (0=EnUs, 4=EnSg, 5=EnPh, 80=ZhCn, 81=ZhTw, and so on). Required.
    - target: $.paths['/api/game/status'].put
      update:
        description: Sets the same status on every game whose code is in the games list, via the GameInfo service, and records the operator's login. The change applies to the live catalogue for players. Needs the ChangeGameStatus permission.
        responses:
            "400":
                description: games or gameStatus missing; send both, with games as an array of integers.
            "401":
                description: Not signed in as an operator.
            "403":
                description: The operator lacks the ChangeGameStatus permission.
        summary: Change the status of many games at once.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Do not use it for one game with the edit permission (use PUT /api/game) or for a whole provider (use PATCH /api/game/provider). It does not reorder games.
            whenToUse: Suspend or enable several games together, for example all games of a studio that are listed by gameCode.
    - target: $.paths['/api/images'].get
      update:
        description: Returns the object keys (file paths) in the image bucket whose key starts with `path`. Folder placeholder keys ending in '/' are left out. It reads every page of the bucket listing, so a broad prefix returns a large list.
        responses:
            "400":
                description: '`path` is missing; send it as a query parameter. May also come from the model-validation filter.'
            "500":
                description: The storage backend (R2/GCP bucket) failed or is unreachable; retry later.
        summary: List the stored image files under a storage folder prefix.
        x-agent:
            risk: read
            whenNotToUse: Does not return image bytes (use GET /api/images/Get). Does not upload (use POST /api/images). Does not list banner records or their settings.
            whenToUse: Operator wants to see which banner, game icon or VIP images exist in a folder, or needs the exact stored file name before fetching one.
    - target: $.paths['/api/images'].get.parameters[?(@.name=='path')]
      update:
        description: Folder prefix to list, matched as a plain string prefix on the storage key. Folders used by the upload operation are 'platform/banner' (banner), 'game/icon/games' (game icon) and 'platform/vip' (VIP). No leading slash.
    - target: $.paths['/api/images'].post
      update:
        description: Stores the uploaded file in the folder for its `type` and returns the generated `FilePath`. The stored name is the name, lowercased with spaces turned into '-', or a random one if `name` is empty, followed by '-' and a Unix timestamp in seconds and the original extension. Re-uploading never overwrites an earlier file because the timestamp differs.
        responses:
            "400":
                description: File is missing, not .png/.jpg/.jpeg, over 1 MB, or `name` is longer than 30 characters; fix the form fields and resend as multipart/form-data.
            "500":
                description: The storage backend failed; retry later.
        summary: Upload a new banner, game icon or VIP image to storage.
        x-agent:
            risk: write
            whenNotToUse: Does not attach the image to a banner or game record; the returned FilePath must be used in that record's own create or update operation. Cannot replace or delete an existing file.
            whenToUse: Operator wants to add a new banner, game icon or VIP image and get the path to use elsewhere.
    - target: $.paths['/api/images/Get'].get
      update:
        description: 'Reads the object at `path`/`name` from storage and returns its raw bytes as a file download. The content type comes from the extension of `name`: jpg/jpeg, png, gif and webp are recognised, anything else is application/octet-stream.'
        responses:
            "400":
                description: '`path` or `name` is missing; send both.'
            "404":
                description: No file at path/name; list the folder first and copy the exact name. The storage SDK may surface this as 500 instead.
            "500":
                description: The storage backend failed or the key does not exist and the SDK exception is not mapped; check the spelling with GET /api/images.
        summary: Download one stored image file.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not list files (use GET /api/images to find names). Does not return JSON metadata or a URL.
            whenToUse: Operator or agent wants to view or fetch a specific image whose folder and file name are already known.
    - target: $.paths['/api/images/Get'].get.parameters[?(@.name=='path')]
      update:
        description: Folder part of the storage key, for example 'platform/banner'. Take it from a file path returned by the list or upload operation. No trailing slash, because the code joins it as path/name.
    - target: $.paths['/api/images/Get'].get.parameters[?(@.name=='name')]
      update:
        description: File name including its extension, for example 'summer-1718000000.png'. Take it from the last segment of a path returned by the list or upload operation.
    - target: $.paths['/api/images/TestDelete'].get
      update:
        description: Deletes the object 'platform/banner/{name}' from the image bucket. It is a GET that changes state, and the folder is hard-coded to the banner folder. It returns success even if the file did not exist, since S3-style deletes are idempotent.
        responses:
            "400":
                description: '`name` is missing; send it as a query parameter.'
            "500":
                description: The storage backend failed; retry later.
        summary: Delete a banner image file from storage by name.
        x-agent:
            risk: irreversible
            whenNotToUse: Does not delete game icon or VIP images (the folder is fixed to platform/banner). Does not delete or disable a banner record; use the banner operations for that. Do not call it to check whether a file exists.
            whenToUse: Only when an operator explicitly asks to permanently remove a specific uploaded banner image file.
    - target: $.paths['/api/images/TestDelete'].get.parameters[?(@.name=='name')]
      update:
        description: File name inside platform/banner, including the extension and timestamp, for example 'summer-1718000000.png'. Take it from the list operation (GET /api/images with path 'platform/banner') or from an upload response.
    - target: $.paths['/api/internalSystem/{customerId}'].get
      update:
        description: Returns the customer's identity and wallet currency. It also returns IsTestMode and the last login country and IP, which can be null. Responses are cached for 10 minutes per customerId, so recent changes such as a currency switch or a new login may not show up straight away.
        responses:
            "404":
                description: The customerId is not an integer, so the route does not match; send a plain int32. An unknown customerId returns a 'Customer not found' error (code 1011) instead of a profile; check the id with a player search. The HTTP status of that error body is unconfirmed because the BaseResponse conversion is not in this repo.
        summary: 'Look up one player''s basic platform profile by customerId: username, license, wallet currency, test-mode flag and last login country and IP.'
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not return balances, KYC or account status, bets, transactions or contact details. It cannot search by username, phone or email, so you need the customerId first. For fuller player management data, use the Backoffice player search or player detail operations.
            whenToUse: Use when the operator has a numeric customerId and wants to know who the player is, which wallet currency they use (e.g. PHP, USDT), whether the account is a test account, or where they last logged in from.
    - target: $.paths['/api/internalSystem/{customerId}'].get.parameters[?(@.name=='customerId')]
      update:
        description: Path parameter, required. The player's numeric customer id (int32), not the username. It must come from the operator or from another Backoffice player search or list operation.
    - target: $.paths['/api/marketing/tracking-tags'].get
      update:
        description: Returns every tracking tag with its referralId, code, name, type, creator, creation time, Registrations and FirstDepositUsers. StartDate and EndDate are both required, and the counts appear to be limited to that window. The result is not paged.
        responses:
            "400":
                description: StartDate or EndDate missing or not a valid date-time; send both in ISO 8601 format.
            "401":
                description: Operator not authenticated.
            "403":
                description: Operator lacks the ViewTrackingTags permission.
        summary: List marketing tracking tags (referral codes) with registration and first-deposit counts for a date range.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not give per-day figures (use the daily-breakdown operation), a per-user list (use the user-detail operation), or a shareable URL (use the link operation). For one tag by numeric id use GET /api/marketing/tracking-tags/{referralId}.
            whenToUse: Operator asks which tracking tags or referral codes exist, how many sign-ups or first-time depositors each brought in over a period, or needs a tag's referralId or code.
    - target: $.paths['/api/marketing/tracking-tags'].get.parameters[?(@.name=='SearchText')]
      update:
        description: Optional free-text filter on tags. The stored procedure applies it; whether it matches code, name or both is not visible in the code.
    - target: $.paths['/api/marketing/tracking-tags'].get.parameters[?(@.name=='StartDate')]
      update:
        description: Start of the reporting window, ISO 8601 date-time with offset, e.g. 2026-10-01T00:00:00+08:00. Converted to UTC. Required.
    - target: $.paths['/api/marketing/tracking-tags'].get.parameters[?(@.name=='EndDate')]
      update:
        description: End of the reporting window, ISO 8601 date-time with offset. Required, should be later than StartDate.
    - target: $.paths['/api/marketing/tracking-tags'].post
      update:
        description: Inserts a new tag with the given code and name, with type Operator and the calling operator recorded as creator. The code may contain only letters, digits and underscores, and must not already exist. Business failures come back as an error code in the response body.
        responses:
            "400":
                description: Body missing code or name; send both.
            "401":
                description: Operator not authenticated.
            "403":
                description: Operator lacks the ManageTrackingTags permission.
        summary: Create a new operator tracking tag (referral code) for marketing campaigns.
        x-agent:
            risk: write
            whenNotToUse: Does not rename an existing tag (use PATCH /api/marketing/tracking-tags/{referralId}) and does not return a link (use GET /api/marketing/tracking-tags/link after creating). Check the list operation first if unsure the code exists.
            whenToUse: Operator wants to create or register a new tracking code or campaign link tag.
    - target: $.paths['/api/marketing/tracking-tags/link'].get
      update:
        description: Returns the configured member site URL with ?referralCode={code} appended. It does not check that the code exists as a tag, and it changes nothing.
        responses:
            "400":
                description: code query parameter missing; send it.
            "401":
                description: Operator not authenticated.
            "403":
                description: Operator lacks the ViewTrackingTags permission.
        summary: Build the member-site sign-up URL that carries a tracking tag's referral code.
        x-agent:
            risk: read
            whenNotToUse: Does not show stats or validate the code; use the stats or list operation for that.
            whenToUse: Operator asks for the link, URL or landing page to share for a tracking code.
    - target: $.paths['/api/marketing/tracking-tags/link'].get.parameters[?(@.name=='code')]
      update:
        description: Tracking tag code, as in the 'code' field from the list operation. Required.
    - target: $.paths['/api/marketing/tracking-tags/{code}/daily-breakdown'].get
      update:
        description: Returns a paged list of daily rows for the tag with Date, Registrations, FtdUsers, DepositAmount and Conversion. Paging is 1-based and the response carries the total count. It has no date filter; the whole history is paged.
        responses:
            "401":
                description: Operator not authenticated.
            "403":
                description: Operator lacks the ViewTrackingTags permission.
        summary: 'Show one tracking tag''s performance per day: registrations, first-deposit users, deposit amount and conversion.'
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not give totals for the whole tag (use the stats operation), a list of the individual players (use the user-detail operation), or a comparison of all tags (use the list operation).
            whenToUse: Operator asks for day-by-day or trend figures for one tracking code, or how a campaign performed on a given day.
    - target: $.paths['/api/marketing/tracking-tags/{code}/daily-breakdown'].get.parameters[?(@.name=='code')]
      update:
        description: Tracking tag code (the 'code' field, not referralId), from the list operation.
    - target: $.paths['/api/marketing/tracking-tags/{code}/daily-breakdown'].get.parameters[?(@.name=='PageSize')]
      update:
        description: Rows per page, integer. Required in practice; if left out it defaults to 0 and the result is likely empty.
    - target: $.paths['/api/marketing/tracking-tags/{code}/daily-breakdown'].get.parameters[?(@.name=='PageNumber')]
      update:
        description: Page index starting at 1. Required in practice; if left out it defaults to 0.
    - target: $.paths['/api/marketing/tracking-tags/{code}/stats'].get
      update:
        description: Returns referralId, code, name, Registrations, FtdUsers and DepositAmount for the tag. It has no date window. Unknown codes give a not-found error.
        responses:
            "401":
                description: Operator not authenticated.
            "403":
                description: Operator lacks the ViewTrackingTags permission.
        summary: 'Show lifetime totals for one tracking tag: registrations, first-deposit users and deposit amount.'
        x-agent:
            risk: read
            whenNotToUse: Does not break the figures down by day (use daily-breakdown) or list players (use user-detail). For a date-bounded comparison of many tags use the list operation.
            whenToUse: Operator asks for the headline numbers of one tracking code, such as how many users signed up, how many made a first deposit, or how much they deposited.
    - target: $.paths['/api/marketing/tracking-tags/{code}/stats'].get.parameters[?(@.name=='code')]
      update:
        description: Tracking tag code (not referralId), from the list operation.
    - target: $.paths['/api/marketing/tracking-tags/{code}/user-detail'].get
      update:
        description: Returns a paged list with Username, FullName, Currency, Mobile, RegisteredOn, IsInitialDeposit, LastDepositTime and LastLoginTime (times are Unix milliseconds). Mobile is masked unless the operator has the ViewSensitiveInfo permission. With ExcludeInitialDeposit=true it loads all matching users, drops those flagged IsInitialDeposit, and pages the rest in memory, which may be slow for big tags.
        responses:
            "400":
                description: A date is not a valid ISO 8601 date-time, or ExcludeInitialDeposit is not true or false.
            "401":
                description: Operator not authenticated.
            "403":
                description: Operator needs ViewTrackingTags or ViewPlayerProfile permission.
        summary: List the players who registered through a tracking tag, with first-deposit flag, last deposit and last login.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not give aggregate totals (use stats) or per-day figures (use daily-breakdown). It is not a general player search; for a player's profile use the member operations.
            whenToUse: Operator wants to see or find the individual players brought in by a tracking code, find players who registered but never made a first deposit, or look up one username within a tag.
    - target: $.paths['/api/marketing/tracking-tags/{code}/user-detail'].get.parameters[?(@.name=='code')]
      update:
        description: Tracking tag code (not referralId), from the list operation.
    - target: $.paths['/api/marketing/tracking-tags/{code}/user-detail'].get.parameters[?(@.name=='Username')]
      update:
        description: Optional username filter within the tag; exact versus partial matching is decided in the stored procedure.
    - target: $.paths['/api/marketing/tracking-tags/{code}/user-detail'].get.parameters[?(@.name=='StartDate')]
      update:
        description: Optional start of the registration window, ISO 8601 date-time. Defaults to the earliest possible date.
    - target: $.paths['/api/marketing/tracking-tags/{code}/user-detail'].get.parameters[?(@.name=='EndDate')]
      update:
        description: Optional end of the registration window, ISO 8601 date-time. Defaults to the latest possible date.
    - target: $.paths['/api/marketing/tracking-tags/{code}/user-detail'].get.parameters[?(@.name=='ExcludeInitialDeposit')]
      update:
        description: Optional. true = leave out players whose initial deposit has already been made, so only non-depositors remain; false or omitted = everyone.
    - target: $.paths['/api/marketing/tracking-tags/{code}/user-detail'].get.parameters[?(@.name=='PageSize')]
      update:
        description: Rows per page, integer. Required in practice; if left out it defaults to 0 and the result is likely empty.
    - target: $.paths['/api/marketing/tracking-tags/{code}/user-detail'].get.parameters[?(@.name=='PageNumber')]
      update:
        description: Page index starting at 1. Required in practice; if left out it defaults to 0.
    - target: $.paths['/api/marketing/tracking-tags/{referralId}'].get
      update:
        description: Returns referralId, code, name, type, creation time and creator, plus the Registrations and FirstDepositUsers counts. Unknown ids give a not-found error.
        responses:
            "400":
                description: referralId is not an integer.
            "401":
                description: Operator not authenticated.
            "403":
                description: Operator lacks the ViewTrackingTags permission.
        summary: Fetch one tracking tag's record by its numeric id.
        x-agent:
            risk: read
            whenNotToUse: Does not take a code. To find a tag by code or name, or to see counts for a date range, use the list operation. It does not return the player list or daily figures.
            whenToUse: Operator or agent has a referralId and needs the matching code or name, or wants to check a tag exists before renaming it.
    - target: $.paths['/api/marketing/tracking-tags/{referralId}'].get.parameters[?(@.name=='referralId')]
      update:
        description: Numeric tag id (integer), the 'referralId' field from the list operation.
    - target: $.paths['/api/marketing/tracking-tags/{referralId}'].patch
      update:
        description: Changes the tag's display name and records the calling operator as the modifier. The code cannot be changed. It does not check that the referralId exists, so a wrong id still reports success.
        responses:
            "400":
                description: 'referralId is not an integer, or the body lacks name; send {"name": "..."}.'
            "401":
                description: Operator not authenticated.
            "403":
                description: Operator lacks the ManageTrackingTags permission.
        summary: Rename an existing tracking tag.
        x-agent:
            risk: write
            whenNotToUse: Does not change the code, and does not create tags (use POST /api/marketing/tracking-tags). It does not delete tags.
            whenToUse: Operator wants to rename or relabel a tracking tag.
    - target: $.paths['/api/marketing/tracking-tags/{referralId}'].patch.parameters[?(@.name=='referralId')]
      update:
        description: Numeric tag id (integer), the 'referralId' field from the list operation, not the code.
    - target: $.paths['/api/operator'].get
      update:
        description: Returns the list of back-office operators (staff accounts, not players) matching the optional filters. All filters are optional and there is no paging. Needs permission ViewUser (8001).
        responses:
            "401":
                description: No valid operator session; call POST /api/operator/login first.
            "403":
                description: Logged-in operator lacks permission ViewUser (8001).
        summary: List back-office operator accounts, optionally filtered.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Not for the full profile and custom permissions of one operator (use GET /api/operator/{id}). Not for the identity or permissions of the currently logged-in operator (use POST /api/operator). Not for player accounts.
            whenToUse: Find operators by login name, list active or locked/deactivated operators, list operators holding a role, or look up an operator id by login name.
    - target: $.paths['/api/operator'].get.parameters[?(@.name=='LoginName')]
      update:
        description: Optional operator login name filter. The code only passes it to the repository, so whether it is exact or partial match is unconfirmed.
    - target: $.paths['/api/operator'].get.parameters[?(@.name=='IsActive')]
      update:
        description: Optional. true = only active operators, false = only inactive operators (deactivated or locked after 5 failed logins). Omit for both.
    - target: $.paths['/api/operator'].get.parameters[?(@.name=='RoleId')]
      update:
        description: Optional integer role id. Only operators with this role are returned. The list-roles operation is the likely source of role ids but was not checked.
    - target: $.paths['/api/operator'].post
      update:
        description: 'Despite being a POST, it only reads: it returns the session operator''s id, login name and permission ids. It takes no body or parameters and needs any valid session.'
        responses:
            "401":
                description: No valid operator session; call POST /api/operator/login first.
        summary: Get the currently logged-in operator's id, login name and permission list.
        x-agent:
            risk: read
            whenNotToUse: Not for creating an operator (use POST /api/operator/create). Not for listing operators (use GET /api/operator). Not for another operator's details (use GET /api/operator/{id}).
            whenToUse: Check who the session is logged in as, or which permissions it has, before attempting an action.
    - target: $.paths['/api/operator/create'].post
      update:
        description: Creates an operator with the given login name, role and optional extra permissions, and stores the password hashed. Fails if the login name already exists. Needs permission AddUser (8002).
        responses:
            "400":
                description: Body is missing or invalid, for example loginName or password absent; send a full JSON body.
            "401":
                description: No valid operator session; log in first.
            "403":
                description: Logged-in operator lacks permission AddUser (8002).
            "409":
                description: Login name already exists (error code 101); pick a different loginName. The HTTP status for this business error is inferred, not confirmed.
        summary: Create a new back-office operator account with a role and password.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for changing an existing operator (use PUT /api/operator/{id}). Not for resetting a password (use POST /api/operator/resetPassword). Not for creating player accounts.
            whenToUse: Operator asks to add a new staff or back-office user.
    - target: $.paths['/api/operator/login'].post
      update:
        description: Verifies login name and password and, on success, stores the operator session (cookie-based). Five wrong passwords in a row deactivate the account, and it must be unlocked with POST /api/operator/unlock. The response only says whether the operator is active.
        responses:
            "401":
                description: Wrong password (error code 103); retry with the right one, but the 5th consecutive failure locks the account.
            "403":
                description: Operator is inactive or locked (error code 102); an operator with ChangeUserStatus must unlock it.
            "404":
                description: No operator with this login name (error code 100); check loginName. The HTTP status for this business error is inferred, not confirmed.
        summary: Log a back-office operator in and start a session.
        x-agent:
            needsReview: true
            risk: credential
            whenNotToUse: Not for unlocking a locked account (use POST /api/operator/unlock). Not for changing a password (use POST /api/operator/resetPassword). Not for player login.
            whenToUse: Start an authenticated session before calling other operations.
    - target: $.paths['/api/operator/logout'].post
      update:
        description: Removes the operator session and expires the session cookie. It takes no body and always returns success, even if no session exists.
        summary: End the current operator session.
        x-agent:
            risk: write
            whenNotToUse: Not for deactivating or locking another operator (use PUT /api/operator/{id} with isActive=false).
            whenToUse: Operator asks to log out or switch accounts.
    - target: $.paths['/api/operator/resetPassword'].post
      update:
        description: Overwrites the password of the named operator with the supplied one, stored hashed. The old password is not needed. Needs permission EditUserPermissions (8003).
        responses:
            "400":
                description: Body is missing or invalid; send loginName and password.
            "401":
                description: No valid operator session; log in first.
            "403":
                description: Logged-in operator lacks permission EditUserPermissions (8003).
            "404":
                description: No operator with this login name (error code 100); check loginName. The HTTP status for this business error is inferred, not confirmed.
        summary: Set a new password for an operator by login name.
        x-agent:
            needsReview: true
            risk: credential
            whenNotToUse: Not for unlocking a locked account (use POST /api/operator/unlock, which does not change the password). Not for resetting player passwords. Not for editing other operator fields (use PUT /api/operator/{id}).
            whenToUse: Operator forgot their password, or an admin must force a new one.
    - target: $.paths['/api/operator/testPermission'].get
      update:
        description: Returns plain success and does nothing else. It is guarded by permission CancelVoucher (4004), so a success means the session is logged in and holds that permission.
        responses:
            "401":
                description: No valid operator session; log in first.
            "403":
                description: Logged-in operator lacks permission CancelVoucher (4004).
        summary: Probe whether the session holds the CancelVoucher permission.
        x-agent:
            risk: read
            whenNotToUse: Not for listing the session's permissions (use POST /api/operator). Not for any operator management.
            whenToUse: Only to check that the session can cancel vouchers.
    - target: $.paths['/api/operator/unlock'].post
      update:
        description: Sets the named operator to active, which is how an account locked by 5 failed logins is released. It does not change the password. Needs permission ChangeUserStatus (8004).
        responses:
            "400":
                description: Body is missing or invalid; send loginName.
            "401":
                description: No valid operator session; log in first.
            "403":
                description: Logged-in operator lacks permission ChangeUserStatus (8004).
            "404":
                description: No operator with this login name (error code 100); check loginName. The HTTP status for this business error is inferred, not confirmed.
        summary: Reactivate a deactivated or locked operator account.
        x-agent:
            needsReview: true
            risk: credential
            whenNotToUse: Not for setting a new password (use POST /api/operator/resetPassword). Not for deactivating an operator (use PUT /api/operator/{id} with isActive=false). Not for unlocking player accounts.
            whenToUse: Operator reports they are locked out or deactivated and the account should be re-enabled.
    - target: $.paths['/api/operator/{id}'].get
      update:
        description: Returns login name, names, email, phone, active flag, role id and the operator's custom permission ids. Needs permission ViewUser (8001).
        responses:
            "401":
                description: No valid operator session; log in first.
            "403":
                description: Logged-in operator lacks permission ViewUser (8001).
            "404":
                description: No operator with this id (error code 100); take the id from GET /api/operator. The HTTP status for this business error is inferred, not confirmed.
        summary: Get one operator's profile, role and custom permissions.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Not for searching or listing operators (use GET /api/operator). Not for the logged-in operator's own permissions (use POST /api/operator).
            whenToUse: Open or inspect a specific operator, or read current values before editing with PUT /api/operator/{id}.
    - target: $.paths['/api/operator/{id}'].get.parameters[?(@.name=='id')]
      update:
        description: Integer operator id, taken from the id field of GET /api/operator results.
    - target: $.paths['/api/operator/{id}'].put
      update:
        description: Replaces the operator's fields with the body values and clears the permission cache. A non-empty password is hashed and replaces the old one, and an empty or missing password keeps it. Allowed with permission EditUserPermissions (8003) or ChangeUserStatus (8004), and it is not checked which fields each permission may change.
        responses:
            "400":
                description: Body is invalid, e.g. customizePermissions missing; send the full object.
            "401":
                description: No valid operator session; log in first.
            "403":
                description: Logged-in operator holds neither EditUserPermissions (8003) nor ChangeUserStatus (8004).
            "404":
                description: No operator with this id (error code 100); take the id from GET /api/operator. The HTTP status for this business error is inferred, not confirmed.
        summary: Edit an operator's profile, role, active status, custom permissions or password.
        x-agent:
            needsReview: true
            risk: credential
            whenNotToUse: Not for creating an operator (use POST /api/operator/create). Not for resetting only a password (use POST /api/operator/resetPassword). Not for unlocking only (use POST /api/operator/unlock).
            whenToUse: Change an operator's role, permissions, contact details or active flag, or set a new password while editing.
    - target: $.paths['/api/operator/{id}'].put.parameters[?(@.name=='id')]
      update:
        description: Integer operator id, from GET /api/operator.
    - target: $.paths['/api/payment/payment-account/e-wallet/{id}'].get
      update:
        description: Returns the account id, e-wallet name (payment method), account number and an IsDeleted flag. Deleted accounts are still returned, with IsDeleted=true. Changes nothing.
        responses:
            "404":
                description: No e-wallet account with this id (PaymentAccountNotFound, code 3001); check the id.
            "500":
                description: Any other payment failure.
        summary: Look up a customer's saved e-wallet payment account by id.
        x-agent:
            risk: read
            whenNotToUse: Not for where a withdrawal is paid out when the account may be a crypto address; use GET /api/payment/payment-account/withdraw/{id}. Not for listing transactions; use GET /api/payment/transactions.
            whenToUse: The operator needs the e-wallet account number or name behind a payment account id, for example to see which e-wallet account a transaction used.
    - target: $.paths['/api/payment/payment-account/e-wallet/{id}'].get.parameters[?(@.name=='id')]
      update:
        description: Customer payment account id (int32). It is the payment account id stored on a transaction; this should be the CustomerPaymentAccountId of the transaction from the transactions query.
    - target: $.paths['/api/payment/payment-account/withdraw/{id}'].get
      update:
        description: Returns only AccountNumber, which is the e-wallet account number or the crypto address. Changes nothing.
        responses:
            "404":
                description: No withdraw account with this id (code 3001); check the id.
            "500":
                description: Any other payment failure.
        summary: 'Look up where a withdrawal is paid out: the e-wallet account number or crypto address of a payment account.'
        x-agent:
            risk: read
            whenNotToUse: Not for e-wallet name, IsDeleted or other e-wallet details; use GET /api/payment/payment-account/e-wallet/{id}. Not for the company's own payout accounts; those come from GET /api/payment/payment-methods/{transactionType}.
            whenToUse: The operator asks which account or address a withdraw transaction will be paid to.
    - target: $.paths['/api/payment/payment-account/withdraw/{id}'].get.parameters[?(@.name=='id')]
      update:
        description: Customer payment account id (int32), the CustomerPaymentAccountId of a withdraw transaction.
    - target: $.paths['/api/payment/payment-method'].patch
      update:
        description: Pushes the new status and amount limits to the payment gateway, then saves the remark locally (insert or update). It takes effect for customers immediately. Requires the EditPaymentSetting permission.
        responses:
            "400":
                description: Required string field missing or null; send all of currency, serviceProvider, transactionType, paymentMethod, remark.
            "403":
                description: The operator lacks the EditPaymentSetting permission.
            "500":
                description: transactionType is not Deposit, Withdraw or Unknown, or the gateway rejected the update.
        summary: Change the status, min/max amount and remark of one payment method of a service provider for one currency and transaction type.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for switching a whole provider on or off; use PATCH /api/payment/service-provider. Not for a customer's own limits; use PATCH /api/payment/payment-setting/limit.
            whenToUse: The operator wants to enable, disable or set under maintenance a single payment method (for example one bank or e-wallet of a provider), or change its min/max amount or its remark.
    - target: $.paths['/api/payment/payment-methods/{transactionType}'].get
      update:
        description: 'Returns all service providers with the deposit or withdraw settings: provider status and remark, each method''s status, min/max amount and limits, and last modifier and time. When a direct-pay provider exists it also lists the company bank accounts for this transaction type. Times are shifted to the customer time zone.'
        responses:
            "403":
                description: The operator has none of ViewManagePayment, ViewDeposit, ViewWithdrawal.
            "500":
                description: transactionType is not a valid name or number; use Deposit or Withdraw.
        summary: List every payment service provider with its status, payment methods, amount limits, remarks and, for direct pay, company accounts.
        x-agent:
            risk: read
            whenNotToUse: Not for a customer's saved account; use the payment-account operations. Not for transactions; use GET /api/payment/transactions. Not for per-currency withdraw count limits; use GET /api/payment/payment-setting/limit.
            whenToUse: The operator asks what payment methods or providers exist, which are enabled or disabled, their limits or remarks, or which company accounts direct pay uses.
    - target: $.paths['/api/payment/payment-methods/{transactionType}'].get.parameters[?(@.name=='transactionType')]
      update:
        description: Deposit or Withdraw (case-insensitive). 1 and 2 also parse as Deposit and Withdraw. Unknown/0 parses but is meaningless here.
    - target: $.paths['/api/payment/payment-setting/limit'].get
      update:
        description: Returns one row per currency with WithdrawMaxCount, IsWithdrawMaxCountUnlimited, ModifiedOn (unix timestamp) and ModifiedBy. Currency is the FiatCurrency enum number. Changes nothing.
        responses:
            "403":
                description: The operator has none of ViewManagePayment, ViewDeposit, ViewWithdrawal.
        summary: List the withdraw count limit of each currency.
        x-agent:
            risk: read
            whenNotToUse: Not for min/max amount of a payment method; use GET /api/payment/payment-methods/{transactionType}. Not to change the limit; use PATCH /api/payment/payment-setting/limit.
            whenToUse: The operator asks how many withdrawals a customer may make per currency, or who last changed the limit.
    - target: $.paths['/api/payment/payment-setting/limit'].patch
      update:
        description: Upserts the withdraw count limit of the currency on the payment gateway; it applies to customers at once. If IsWithdrawMaxCountUnlimited is false, WithdrawMaxCount must be at least 1. When unlimited, the count is stored as 0. Requires EditPaymentSetting.
        responses:
            "400":
                description: IsWithdrawMaxCountUnlimited is false and WithdrawMaxCount is null or below 1 (InvalidInput); send a count of at least 1 or set unlimited to true. An unknown currency number also fails to bind.
            "403":
                description: The operator lacks EditPaymentSetting.
        summary: Set the maximum number of withdrawals allowed for one currency, or make it unlimited.
        x-agent:
            risk: write
            whenNotToUse: Not for amount limits or status of a payment method; use PATCH /api/payment/payment-method. Not for just reading; use GET /api/payment/payment-setting/limit.
            whenToUse: The operator wants to raise, lower or remove the withdraw count limit of a currency.
    - target: $.paths['/api/payment/payment-unit-account'].post
      update:
        description: Inserts a new company payment account for a payment method, provider and currency. It is created with the database default status. All text fields are limited to 50 characters. Requires EditPaymentSetting.
        responses:
            "400":
                description: A required field is missing, longer than 50 characters, transactionType is not 1 or 2, or currency is not a valid FiatCurrency name.
            "403":
                description: The operator lacks EditPaymentSetting.
        summary: Add a company bank account used by the direct-pay provider for deposits or withdrawals.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not to change or disable an existing account; use PATCH /api/payment/payment-unit-account/{id}. Not for a customer's own account.
            whenToUse: The operator wants to register a new company receiving account (deposit) or payout account (withdraw) for direct pay.
    - target: $.paths['/api/payment/payment-unit-account/{id}'].delete
      update:
        description: Removes the payment unit account through a stored procedure, recording the operator. It may be a soft delete, but the API offers no restore. Requires EditPaymentSetting.
        responses:
            "403":
                description: The operator lacks EditPaymentSetting.
            "404":
                description: No account with this id (PaymentUnitAccountNotFound, code 3016); the HTTP status of this BaseResponse error was not confirmed.
        summary: Delete a company direct-pay payment account.
        x-agent:
            needsReview: true
            risk: irreversible
            whenNotToUse: Not to temporarily stop using an account; set its status to disabled with PATCH /api/payment/payment-unit-account/{id}.
            whenToUse: The operator asks to remove a company deposit or withdraw account for good.
    - target: $.paths['/api/payment/payment-unit-account/{id}'].delete.parameters[?(@.name=='id')]
      update:
        description: Payment unit account id (int32). Ids come from the Accounts listed under direct-pay methods in GET /api/payment/payment-methods/{transactionType}.
    - target: $.paths['/api/payment/payment-unit-account/{id}'].patch
      update:
        description: Overwrites accountProviderName, accountNumber, alias and status of the account; all four are required, so send current values for the fields you do not change. Requires EditPaymentSetting.
        responses:
            "400":
                description: A required field is missing or longer than 50 characters, or status is not 0, 1 or 2.
            "403":
                description: The operator lacks EditPaymentSetting.
            "404":
                description: No account with this id (code 3016); the HTTP status of this BaseResponse error was not confirmed.
        summary: Edit a company direct-pay account's name, number, alias or status.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not to add an account; use POST /api/payment/payment-unit-account. Not to remove it; use DELETE. Currency, payment method and transaction type cannot be changed here.
            whenToUse: The operator wants to rename, correct the number of, enable or disable a company direct-pay account.
    - target: $.paths['/api/payment/payment-unit-account/{id}'].patch.parameters[?(@.name=='id')]
      update:
        description: Payment unit account id (int32), from the accounts in GET /api/payment/payment-methods/{transactionType}.
    - target: $.paths['/api/payment/service-provider'].patch
      update:
        description: Upserts the provider-level status and remark for the transaction type; it applies to all methods of the provider for customers at once. Requires EditPaymentSetting.
        responses:
            "400":
                description: A required field is missing.
            "403":
                description: The operator lacks EditPaymentSetting.
            "500":
                description: transactionType is not a valid name.
        summary: Turn a whole payment service provider on or off for deposits or withdrawals.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for a single method or its amount limits; use PATCH /api/payment/payment-method.
            whenToUse: The operator wants to enable, disable or set under maintenance a whole provider, such as when a provider is down.
    - target: $.paths['/api/payment/transaction/deposit/complete'].post
      update:
        description: Sets the deposit to Completed with the given actual amount, remark, provider and method. For a deposit in Started, Expired or Rejected status it transfers the amount plus the computed bonus to the customer and publishes a deposit-done message. For a direct-pay deposit it also needs the payer info. Requires EditDeposit.
        responses:
            "400":
                description: A required field is missing.
            "403":
                description: The operator lacks EditDeposit.
            "500":
                description: refNo not found; direct pay info missing (code 3018); provider changed to or from direct pay (code 3019); or the credit transfer failed. Fix the data and resend.
        summary: Manually mark a deposit as successful, crediting the customer's wallet and any deposit bonus.
        x-agent:
            needsReview: true
            risk: money
            whenNotToUse: Not to refuse a deposit; use POST /api/payment/transaction/deposit/reject. Not to undo a completed deposit; use POST /api/payment/transaction/deposit/rollback. Not for withdrawals; use the withdraw complete or process operations.
            whenToUse: The operator confirms that the money arrived and wants to credit a pending, expired or rejected deposit.
    - target: $.paths['/api/payment/transaction/deposit/reject'].post
      update:
        description: Sets the transaction to Rejected and saves the remark. If the deposit was Completed, the credit is reversed in the customer's wallet first. It does not check that the transaction is a deposit. Requires EditDeposit.
        responses:
            "400":
                description: refNo missing.
            "403":
                description: The operator lacks EditDeposit.
            "500":
                description: refNo not found, or the reversal of a completed deposit failed.
        summary: Reject a deposit; if it was already completed, take the credited money back.
        x-agent:
            needsReview: true
            risk: money
            whenNotToUse: Not to put a completed deposit back to pending so it can be completed again; use POST /api/payment/transaction/deposit/rollback. Not to accept a deposit; use POST /api/payment/transaction/deposit/complete.
            whenToUse: The operator wants to refuse a pending deposit, or cancel one that was completed and reverse the credit.
    - target: $.paths['/api/payment/transaction/deposit/rollback'].post
      update:
        description: Reverses the accounting transfer for the deposit (the deposit-complete credit and any bonus the rollback logic reverses), sets the transaction status back to 1 (Started), overwrites the operation remark, and sends a DepositRollbackDone Kafka message. The Kafka failure is swallowed, so the call can succeed without the message being sent. The handler does not check the transaction type or status, so a refNo that is not a completed deposit is still reset to Started.
        responses:
            "401":
                description: Not logged in as an operator; log in again.
            "403":
                description: 'Operator lacks the RevertDepositTransactions permission; use an account that has it.'
            "404":
                description: Reached only when a PaymentAccountNotFound PaymentException is raised; not expected for this operation.
            "500":
                description: Accounting rollback or database update failed (PaymentException or other exception); check that refNo exists and is a completed deposit, then retry or escalate.
        summary: 'Undo a completed deposit: take the credited money back from the player''s wallet and reopen the transaction.'
        x-agent:
            risk: money
            whenNotToUse: Not for declining a deposit that was never completed (use POST /api/payment/transaction/deposit/reject, if exposed). Not for withdrawals (use POST /api/payment/transaction/withdraw/rollback). Not for only changing the note (use POST /api/payment/transaction/remark/save).
            whenToUse: Operator wants to revert a deposit that was marked completed, for example credited by mistake or the bank never received the money.
    - target: $.paths['/api/payment/transaction/remark/save'].post
      update:
        description: Overwrites the operation remark of the transaction and sets ModifiedBy to the calling operator. It does not change the status or move any money. It works on both deposits and withdrawals.
        responses:
            "401":
                description: Not logged in as an operator; log in again.
            "403":
                description: 'Operator has none of EditDeposit, RevertDepositTransactions, EditWithdrawal, RevertWithdrawalTransactions.'
            "500":
                description: Unexpected failure, e.g. refNo not found; check refNo against GET /api/payment/transactions.
        summary: Save or replace the operator's note on a payment transaction.
        x-agent:
            risk: write
            whenNotToUse: Not for completing, rejecting, processing or rolling back a transaction. Those operations take their own remark and change the status.
            whenToUse: Operator wants to add or correct a note on a deposit or withdrawal without changing its state.
    - target: $.paths['/api/payment/transaction/withdraw/complete'].post
      update:
        description: Sets status to 3 (Completed) and stores actualAmount, serviceProvider, paymentMethod, remark and optional directPayInfo. If the withdrawal is still 1 (Started), it also debits the player's main wallet by actualAmount, and fails if actualAmount exceeds the player's withdrawable amount. If it was already 2 (Processing), the wallet was debited earlier and only the status and details are updated. It does not contact the payment gateway.
        responses:
            "401":
                description: Not logged in as an operator; log in again.
            "403":
                description: 'Operator lacks the EditWithdrawal permission.'
            "500":
                description: Withdrawable amount could not be read, actualAmount exceeds the player's withdrawable amount (lower actualAmount), or an unexpected failure such as an unknown refNo.
        summary: Mark a withdrawal as completed (money paid out), debiting the player's wallet if it was not already debited.
        x-agent:
            risk: money
            whenNotToUse: Not for sending the payout through the payment gateway (use POST /api/payment/transaction/withdraw/process). Not for declining (use POST /api/payment/transaction/withdraw/reject, if exposed). Not for undoing (use POST /api/payment/transaction/withdraw/rollback).
            whenToUse: Operator paid the withdrawal manually or outside the system and records it as done, or confirms a Processing withdrawal as finished.
    - target: $.paths['/api/payment/transaction/withdraw/process'].post
      update:
        description: 'Only works on a withdrawal in status 1 (Started). It checks that the player''s withdraw account and payee full name exist, debits actualAmount from the main wallet (failing if above the withdrawable amount), sets status to 2 (Processing) and sends the payout request to the payment provider. This is an outward payment: the gateway request cannot be recalled by this API.'
        responses:
            "401":
                description: Not logged in as an operator; log in again.
            "403":
                description: 'Operator lacks the EditWithdrawal permission.'
            "404":
                description: The player's withdraw payment account was not found; the player must have a valid withdraw account before processing.
            "500":
                description: Transaction is not a Started withdrawal (re-check status), payee full name is required but missing, actualAmount exceeds the withdrawable amount, or the gateway or accounting call failed.
        summary: 'Start paying out a withdrawal: debit the player''s wallet and send the payout request to the payment gateway.'
        x-agent:
            risk: irreversible
            whenNotToUse: Not when the payout was already made manually (use POST /api/payment/transaction/withdraw/complete). Not for declining (use POST /api/payment/transaction/withdraw/reject, if exposed). Not for deposits.
            whenToUse: Operator approves a pending withdrawal to be paid automatically through the provider.
    - target: $.paths['/api/payment/transaction/withdraw/reject'].post
      update:
        description: Sets status to 4 (Rejected) and stores the remark. If the withdrawal was already 2 (Processing) or 3 (Completed), the wallet debit is first reversed through an accounting rollback. A Started withdrawal is rejected without any money movement.
        responses:
            "401":
                description: Not logged in as an operator; log in again.
            "403":
                description: 'Operator lacks the EditWithdrawal permission.'
            "500":
                description: Accounting rollback or database update failed, or the refNo does not exist; verify the refNo and status and retry.
        summary: Reject a withdrawal request and refund the wallet if money was already taken.
        x-agent:
            risk: money
            whenNotToUse: Not to reopen a withdrawal for another attempt (use POST /api/payment/transaction/withdraw/rollback, which sets it back to Started). Not for deposits.
            whenToUse: Operator declines a withdrawal for good, for example failed verification or fraud suspicion.
    - target: $.paths['/api/payment/transaction/withdraw/rollback'].post
      update:
        description: For a withdrawal in status 2 (Processing) or 3 (Completed), reverses the wallet debit through an accounting rollback, then sets status back to 1 (Started) and replaces the operation remark. The handler does not check the transaction type, so a deposit refNo is reset to Started too (without a wallet reversal unless it is a completed deposit). A payout already sent to the provider is not recalled.
        responses:
            "401":
                description: Not logged in as an operator; log in again.
            "403":
                description: 'Operator lacks the RevertWithdrawalTransactions permission.'
            "500":
                description: Accounting rollback or database update failed, or the refNo does not exist; verify the refNo and retry.
        summary: 'Undo a processing or completed withdrawal: refund the player''s wallet and reopen the transaction.'
        x-agent:
            risk: money
            whenNotToUse: Not for permanently declining (use POST /api/payment/transaction/withdraw/reject, if exposed). Not for deposits (use POST /api/payment/transaction/deposit/rollback). Not for only editing the note (use POST /api/payment/transaction/remark/save).
            whenToUse: Operator wants to cancel a withdrawal already in Processing or Completed and give the money back so it can be handled again.
    - target: $.paths['/api/payment/transactions'].get
      update:
        description: Returns one page of payment transactions plus the total count, each with its refNo, type, status and payout details. All filters are optional and combine. The operator needs the view permission for the requested type (deposit, withdrawal, or either when TransactionType is 0 or omitted).
        responses:
            "400":
                description: PageSize or PageNumber missing or not an integer; send both.
            "401":
                description: Not logged in as an operator; log in again.
            "500":
                description: 'Operator lacks the view permission for the requested TransactionType (ViewDeposit or ViewDepositTransactions for 1, ViewWithdrawal or ViewWithdrawalTransactions for 2, any of them for 0). The API answers HTTP 500 with errorCode 107 (UnAuthorized), not 403; change TransactionType to one the operator may see.'
        summary: List deposit and withdrawal transactions, paged, with optional filters.
        x-agent:
            risk: read
            whenNotToUse: Not for changing a transaction (use the POST operations). Not for a player's wallet balance or general ledger history.
            whenToUse: Operator wants to find, check or list deposits or withdrawals, for example pending withdrawals, one player's transactions, or the refNo to use in the other payment operations.
    - target: $.paths['/api/payment/transactions'].get.parameters[?(@.name=='PageSize')]
      update:
        description: Items per page. Required; send together with PageNumber.
    - target: $.paths['/api/payment/transactions'].get.parameters[?(@.name=='PageNumber')]
      update:
        description: Page index, starting from 1. Required.
    - target: $.paths['/api/payment/transactions'].get.parameters[?(@.name=='TransactionStartDateFrom')]
      update:
        description: Start of the transaction-start-time range, ISO 8601 with offset, e.g. 2026-10-01T00:00:00+08:00. Optional.
    - target: $.paths['/api/payment/transactions'].get.parameters[?(@.name=='TransactionStartDateEnd')]
      update:
        description: End of the transaction-start-time range, ISO 8601 date-time. Optional.
    - target: $.paths['/api/payment/transactions'].get.parameters[?(@.name=='FuzzySearch')]
      update:
        description: Text matched against the refNo or the player's username. Optional.
    - target: $.paths['/api/payment/transactions'].get.parameters[?(@.name=='TransactionType')]
      update:
        description: 0 = all types, 1 = deposit, 2 = withdraw. Any other number is treated as 0. Omitted = all.
    - target: $.paths['/api/payment/transactions'].get.parameters[?(@.name=='ServiceProvider')]
      update:
        description: Payment provider name to filter on. Optional.
    - target: $.paths['/api/payment/transactions'].get.parameters[?(@.name=='Status')]
      update:
        description: 'Comma-separated numbers: 1 = started, 2 = processing, 3 = completed, 4 = rejected, 5 = expired, e.g. ''1,2''. Any other value maps to unknown (0) and may match nothing. Omitted = all statuses.'
    - target: $.paths['/api/permissions'].get
      update:
        description: Returns the full permission catalogue as a list of groups, one per category. Each group holds its permissions with id, name, subCategory and category. It takes no parameters and is not paged.
        responses:
            "500":
                description: Database or stored procedure failure; retry later or report it.
        summary: List every permission that can be granted to back-office roles, grouped by category.
        x-agent:
            risk: read
            whenNotToUse: Does not show which permissions a given role has; use the role operations (e.g. the role-permission listing in the role endpoints) for that. Does not list operators.
            whenToUse: Operator asks what permissions exist, which permission ids belong to a category, or needs a permission id before editing or deleting it.
    - target: $.paths['/api/permissions'].post
      update:
        description: Inserts a permission row (id, name, category, subCategory) through a stored procedure. The id is supplied by the caller, not generated. Granting it to roles is a separate step.
        responses:
            "400":
                description: Body is missing name or subCategory, or category is not a valid value; send all four fields.
            "500":
                description: Stored procedure failed, likely a duplicate id or database error; pick an unused id from GET /api/permissions.
        summary: Create a new back-office permission with a caller-chosen id.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Does not assign the permission to a role or operator. Does not edit an existing permission; use PUT /api/permissions/{id}.
            whenToUse: Operator wants to register a new permission in the catalogue.
    - target: $.paths['/api/permissions/{id}'].delete
      update:
        description: Removes the permission with the given id through a stored procedure and returns success. It does not check beforehand that the id exists. Roles that hold this permission may lose it or the delete may fail; the stored procedure is not in this repo.
        responses:
            "400":
                description: id is not an integer; send a number.
            "500":
                description: Stored procedure failed, e.g. id unknown or still in use by roles; check the id and role assignments.
        summary: Delete a permission from the catalogue.
        x-agent:
            needsReview: true
            risk: irreversible
            whenNotToUse: Does not remove a permission from one role only; use the role update operations for that. Does not rename it; use PUT /api/permissions/{id}.
            whenToUse: Operator wants to permanently remove an obsolete permission.
    - target: $.paths['/api/permissions/{id}'].delete.parameters[?(@.name=='id')]
      update:
        description: Integer permission id from GET /api/permissions.
    - target: $.paths['/api/permissions/{id}'].put
      update:
        description: Overwrites name, category and subCategory of the permission with the given id through a stored procedure. The id itself cannot change. All three body fields are written, so send the current values for fields you do not want to change.
        responses:
            "400":
                description: Body is missing name or subCategory, or id or category is invalid; send all fields.
            "500":
                description: Stored procedure failed, e.g. unknown id; check the id with GET /api/permissions.
        summary: Change the name, category or subCategory of an existing permission.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Does not create a permission; use POST /api/permissions. Does not change which roles hold it.
            whenToUse: Operator wants to rename a permission or move it to another category or subCategory.
    - target: $.paths['/api/permissions/{id}'].put.parameters[?(@.name=='id')]
      update:
        description: Integer permission id from GET /api/permissions.
    - target: $.paths['/api/promotion/allPromotions'].get
      update:
        description: Returns active manual bonuses plus active deposit bonuses (initial deposit and re-deposit) as one list. Each item carries a flag for whether a banner is linked to it. Inactive and expired promotions are left out.
        responses:
            "401":
                description: Not logged in; authenticate to the back office first
            "403":
                description: Operator lacks a banner permission (ViewBanner, AddBanner or EditBanner); use an account that has one
        summary: List all active promotions (deposit bonuses and manual bonuses) with a flag showing whether a banner already links to each.
        x-agent:
            risk: read
            whenNotToUse: 'Not for filtering by name, type or status or for viewing expired/inactive promotions: use GET /api/promotion/manageBonus. Not for full deposit bonus settings: use GET /api/promotion/depositBonus/{promotionId}.'
            whenToUse: Operator wants a pick-list of promotion names/ids, e.g. to link a banner to a promotion, or to see which active promotions already have a banner.
    - target: $.paths['/api/promotion/depositBonus'].get
      update:
        description: Returns deposit bonus setups matching the optional filters; with no filters it returns all of them. With no promotionType given it returns only InitialDeposit and ReDeposit bonuses (rebate is excluded).
        responses:
            "400":
                description: A value is not a valid integer/enum (e.g. status=7 or text); send the listed numbers
            "401":
                description: Not logged in
            "403":
                description: Operator lacks ViewManageBonus permission
        summary: Search deposit bonus promotions (initial deposit / re-deposit) by name, type and status.
        x-agent:
            risk: read
            whenNotToUse: 'Not for manual bonuses: use GET /api/promotion/manualBonus or /manageBonus. Not for one bonus''s full detail when you have its id: use GET /api/promotion/depositBonus/{promotionId}. Not for a mixed deposit+manual list: use GET /api/promotion/manageBonus.'
            whenToUse: Operator wants to find or list deposit bonus configurations, e.g. all active re-deposit bonuses, or bonuses whose name contains some text.
    - target: $.paths['/api/promotion/depositBonus'].get.parameters[?(@.name=='promotionName')]
      update:
        description: Optional. Case-insensitive partial match on the promotion's default display name.
    - target: $.paths['/api/promotion/depositBonus'].get.parameters[?(@.name=='promotionType')]
      update:
        description: Optional. 1 = InitialDeposit, 2 = ReDeposit, 3 = Rebate, 4 = ManualBonus, 5 = Referral. Only 1 and 2 are meaningful for deposit bonuses; other values will most likely return an empty list.
    - target: $.paths['/api/promotion/depositBonus'].get.parameters[?(@.name=='status')]
      update:
        description: Optional. 0 = Active, 1 = Inactive, 2 = Expired.
    - target: $.paths['/api/promotion/depositBonus'].post
      update:
        description: Creates the promotion setup and links the chosen content to it. The start date cannot be before today in the customer time zone, and the promotionCode must be unique. Enabling an Active promotion makes it available to players once it is live.
        responses:
            "400":
                description: Request body missing a required field or has a bad enum value; fix the body
            "401":
                description: Not logged in
            "403":
                description: Operator lacks AddBonus permission
        summary: Create a new deposit bonus promotion (initial deposit or re-deposit).
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: 'Not for changing an existing bonus: use PUT /api/promotion/depositBonus. Not for manual (operator-issued) bonuses: use POST /api/promotion/manualBonus. Not for paying a bonus to players: use POST /api/promotion/manualBonus/issue.'
            whenToUse: Operator wants to set up a new first-deposit or re-deposit bonus.
    - target: $.paths['/api/promotion/depositBonus'].put
      update:
        description: Overwrites the settings of the deposit bonus identified by id and refreshes its linked content. Unlike create, it does not check the start date or code uniqueness. The endpoint always answers success even if the wallet-type lookup fails, so check the result afterwards.
        responses:
            "400":
                description: Request body missing a required field or has a bad enum value; fix the body
            "401":
                description: Not logged in
            "403":
                description: Operator lacks EditBonusOrder permission
        summary: Update an existing deposit bonus promotion.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: 'Not for creating: use POST /api/promotion/depositBonus. Not for editing a manual bonus: use PATCH /api/promotion/manualBonus. Not for re-ordering: use POST /api/promotion/depositBonus/order.'
            whenToUse: Operator wants to edit, activate, deactivate or expire a deposit bonus.
    - target: $.paths['/api/promotion/depositBonus/order'].post
      update:
        description: Body is the list of promotion ids in the desired order; the order is saved as given. Affects how promotions are listed to players.
        responses:
            "400":
                description: Body is not a JSON array of strings
            "401":
                description: Not logged in
            "403":
                description: Operator lacks EditBonusOrder permission
        summary: Set the display order of deposit bonus promotions.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: 'Not for editing promotion settings: use PUT /api/promotion/depositBonus.'
            whenToUse: Operator drags promotions into a new order.
    - target: $.paths['/api/promotion/depositBonus/{promotionId}'].get
      update:
        description: Returns one deposit bonus setup including display info, rules, dates, eligible products and status. Fails with a business error if the id does not exist.
        responses:
            "401":
                description: Not logged in
            "403":
                description: Operator lacks ViewManageBonus permission
        summary: Get the full settings of one deposit bonus promotion.
        x-agent:
            risk: read
            whenNotToUse: 'Not for searching by name or status: use GET /api/promotion/depositBonus. Not for a manual bonus: its detail endpoint is GET /api/promotion/manualBonus/{promotionId} (not in this list).'
            whenToUse: Operator asks for the details of a specific deposit bonus whose id is known.
    - target: $.paths['/api/promotion/depositBonus/{promotionId}'].get.parameters[?(@.name=='promotionId')]
      update:
        description: Required. Promotion id string from GET /api/promotion/depositBonus or /manageBonus.
    - target: $.paths['/api/promotion/manageBonus'].get
      update:
        description: Returns deposit bonuses and manual bonuses, filtered by optional name, type and status, sorted by creation time descending. With no promotionType it merges both kinds; with 1, 2 or 4 only that kind. Types 3 (Rebate) and 5 (Referral) return an error.
        responses:
            "400":
                description: A value is not a valid integer/enum; send the listed numbers
            "401":
                description: Not logged in
            "403":
                description: Operator lacks ViewManageBonus (or ViewBanner/AddBanner/EditBanner) permission
        summary: Search deposit and manual bonuses together in one list, newest first.
        x-agent:
            risk: read
            whenNotToUse: 'Not for deposit bonus detail: use GET /api/promotion/depositBonus/{promotionId}. Not for rebate or referral promotions (not supported here). Not for just names to link to banners: use GET /api/promotion/allPromotions.'
            whenToUse: Operator wants one combined list of bonuses to manage, optionally filtered by name/status.
    - target: $.paths['/api/promotion/manageBonus'].get.parameters[?(@.name=='PromotionName')]
      update:
        description: Optional. Case-insensitive partial match on the promotion's default display name.
    - target: $.paths['/api/promotion/manageBonus'].get.parameters[?(@.name=='PromotionType')]
      update:
        description: Optional. 1 = InitialDeposit, 2 = ReDeposit, 4 = ManualBonus. 3 = Rebate and 5 = Referral are rejected with an error.
    - target: $.paths['/api/promotion/manageBonus'].get.parameters[?(@.name=='Status')]
      update:
        description: Optional. 0 = Active, 1 = Inactive, 2 = Expired.
    - target: $.paths['/api/promotion/manualBonus'].get
      update:
        description: Returns id, code and name of every manual bonus whose status is Active. Inactive and expired ones are excluded.
        responses:
            "401":
                description: Not logged in
            "403":
                description: Operator lacks ViewIssueBonus permission
        summary: List the active manual bonus promotions that can be issued to players.
        x-agent:
            risk: read
            whenNotToUse: 'Not for history of what was already issued: use GET /api/promotion/manualBonus/issue. Not for inactive/expired manual bonuses: use GET /api/promotion/manageBonus with PromotionType=4.'
            whenToUse: Operator wants to pick which manual bonus to issue, or see which manual bonuses are available.
    - target: $.paths['/api/promotion/manualBonus'].patch
      update:
        description: Updates the manual bonus identified by promotionId and re-links its content. Setting status to 1 or 2 stops it from appearing in the issuable list. Fails with a business error if promotionId does not exist.
        responses:
            "400":
                description: Request body missing a required field or has a bad enum value; fix the body
            "401":
                description: Not logged in
            "403":
                description: Operator lacks EditBonusOrder permission
        summary: Edit an existing manual bonus promotion's code, status and display info.
        x-agent:
            risk: write
            whenNotToUse: 'Not for creating: use POST /api/promotion/manualBonus. Not for deposit bonuses: use PUT /api/promotion/depositBonus. Not for paying players: use POST /api/promotion/manualBonus/issue.'
            whenToUse: Operator wants to rename, activate, deactivate or change the content of a manual bonus.
    - target: $.paths['/api/promotion/manualBonus'].post
      update:
        description: Creates the manual bonus definition and links its content; it returns the new promotion id. It does not pay anyone; actual payout happens only through the issue operation.
        responses:
            "400":
                description: Request body missing a required field or has a bad enum value; fix the body
            "401":
                description: Not logged in
            "403":
                description: Operator lacks AddBonus permission
        summary: Create a new manual bonus promotion that operators can later issue to players.
        x-agent:
            risk: write
            whenNotToUse: 'Not for paying players: use POST /api/promotion/manualBonus/issue. Not for deposit bonuses: use POST /api/promotion/depositBonus.'
            whenToUse: Operator wants to define a new manual bonus type.
    - target: $.paths['/api/promotion/manualBonus/issue'].get
      update:
        description: Returns the issuance batches, each with issue id, promotion code/name, total amount per currency, player count, sender and send time. All filters are optional; the date filter applies only when both startTime and endTime are given.
        responses:
            "400":
                description: currency is not a supported number or a time is not a valid date-time; fix the format
            "401":
                description: Not logged in
            "403":
                description: Operator lacks ViewIssueBonus permission
        summary: List past manual bonus issuances (who sent what, total per currency, number of players).
        x-agent:
            risk: read
            whenNotToUse: 'Not for the list of issuable bonuses: use GET /api/promotion/manualBonus. Not for issuing: use POST /api/promotion/manualBonus/issue. Not for one player''s bonus history (a customer bonus endpoint).'
            whenToUse: Operator wants to check what manual bonuses were already issued, by promotion text, currency or time range.
    - target: $.paths['/api/promotion/manualBonus/issue'].get.parameters[?(@.name=='promotionCode')]
      update:
        description: Optional. Case-insensitive partial text matched against promotion code, promotion name and issue id.
    - target: $.paths['/api/promotion/manualBonus/issue'].get.parameters[?(@.name=='currency')]
      update:
        description: Optional. Numeric ISO 4217 currency code, e.g. 840 = USD, 156 = CNY, 702 = SGD; only batches containing a payout in this currency are returned. 0 is Unknown.
    - target: $.paths['/api/promotion/manualBonus/issue'].get.parameters[?(@.name=='startTime')]
      update:
        description: Optional. ISO 8601 date-time with offset, e.g. 2026-10-01T00:00:00+08:00. Used only together with endTime.
    - target: $.paths['/api/promotion/manualBonus/issue'].get.parameters[?(@.name=='endTime')]
      update:
        description: Optional. ISO 8601 date-time with offset. Used only together with startTime; range is inclusive on createdOn.
    - target: $.paths['/api/promotion/manualBonus/issue'].post
      update:
        description: Records an issuance batch and then credits each recipient's bonus in the given currency and amount. Returns the success count and the usernames that failed; partial success is possible. This moves real bonus funds and cannot be undone by this API.
        responses:
            "400":
                description: Request body missing a required field or has a bad currency number; fix the body
            "401":
                description: Not logged in
            "403":
                description: Operator lacks InjectBonus permission
        summary: Pay a manual bonus amount to a list of players.
        x-agent:
            risk: money
            whenNotToUse: 'Not for creating a new manual bonus definition: use POST /api/promotion/manualBonus. Not for viewing past issuances: use GET /api/promotion/manualBonus/issue. Not for deposit bonuses, which are claimed by players.'
            whenToUse: Operator wants to hand out a manual bonus to specific players with specific amounts.
    - target: $.paths['/api/promotion/manualBonus/playerCheck'].post
      update:
        description: Looks up each username and returns customerId, isExist, isValid (whether transfers to the account are allowed) and the account currency. Usernames that do not exist are still returned, with isExist=false, customerId=0 and currency Unknown. Changes nothing, even though it is a POST.
        responses:
            "400":
                description: Body missing or usernames absent; send {"usernames":[...]}.
        summary: Check whether a list of usernames can receive a manual bonus.
        x-agent:
            risk: read
            whenNotToUse: Does not issue a bonus (use POST /api/promotion/manualBonus/issue, which is not in this set). Does not list manual bonus promotions (use GET /api/promotion/manualBonus).
            whenToUse: Validating a pasted list of usernames before issuing a manual bonus. Finding a player's customerId and currency by username.
    - target: $.paths['/api/promotion/manualBonus/{promotionId}'].get
      update:
        description: Returns the manual bonus promotion's settings, including its code, status and display content. The response is output-cached and is evicted only when the same promotion is edited through the Backoffice edit endpoint. A change made elsewhere may therefore not show up immediately.
        responses:
            "403":
                description: The operator lacks the ViewManageBonus permission.
            "404":
                description: Promotion not found; check the promotionId against the list.
        summary: Get the full configuration of one manual bonus promotion.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not list promotions (use GET /api/promotion/manualBonus). Does not show issued bonuses (use GET /api/promotion/manualBonus/issue). Does not apply to rebates (use GET /api/promotion/rebate).
            whenToUse: Opening the details of one known manual bonus promotion.
    - target: $.paths['/api/promotion/manualBonus/{promotionId}'].get.parameters[?(@.name=='promotionId')]
      update:
        description: Path id of the manual bonus promotion, as returned by the manual bonus list (GET /api/promotion/manualBonus, field promotionId).
    - target: $.paths['/api/promotion/rebate'].get
      update:
        description: Returns every rebate setting that matches the optional filters, ordered by creation time descending. Settings that are both Inactive and soft-deleted are always hidden. Not paged.
        responses:
            "400":
                description: status or interval is not one of the allowed numbers; send 0-3 and 1-2 respectively.
            "403":
                description: The operator has none of the ViewRebate, ViewBanner, AddBanner or EditBanner permissions.
        summary: List rebate promotion settings, newest first.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not show rebate payout batches or the customers in them (use the rebate/batch operations). Does not apply to manual bonuses.
            whenToUse: Finding rebate promotions by name, status or interval. Getting a rebate id for edit or delete.
    - target: $.paths['/api/promotion/rebate'].get.parameters[?(@.name=='promotionName')]
      update:
        description: Optional name filter. Whether it is an exact or partial match was not verified.
    - target: $.paths['/api/promotion/rebate'].get.parameters[?(@.name=='status')]
      update:
        description: Optional. 0 = Active, 1 = ActiveWithDelete, 2 = Inactive, 3 = Expired. When omitted, the default comes from the repository.
    - target: $.paths['/api/promotion/rebate'].get.parameters[?(@.name=='interval')]
      update:
        description: Optional. 1 = Daily, 2 = Weekly.
    - target: $.paths['/api/promotion/rebate'].post
      update:
        description: Creates a rebate setting for the given event period, interval, eligible products and per-currency details. It then links the supplied content to the new rebate. Returns the new rebate id.
        responses:
            "400":
                description: A required field is missing or interval is invalid.
            "403":
                description: The operator lacks the AddRebate permission.
            "409":
                description: Possible rebate settings conflict or invalid rebate rate. Fix the dates, products or rates.
        summary: Create a new rebate promotion.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Does not change an existing rebate (use PUT /api/promotion/rebate/{id}). Does not pay rebates out (use POST /api/promotion/rebate/batch/approve).
            whenToUse: Setting up a new daily or weekly rebate promotion.
    - target: $.paths['/api/promotion/rebate/batch/approve'].post
      update:
        description: Approves the whole batch, except customers listed in excludedCustomers. The remark is stored with the approval and the operator is recorded as approver. Concurrent calls to this route are serialized by a lock, and the call always fails on UAT.
        responses:
            "400":
                description: batchId missing.
            "403":
                description: The operator lacks the ApproveExcludeRebateRequests permission.
            "404":
                description: The batchId is invalid or no longer waiting. Fetch the current batch id from the waiting list.
            "500":
                description: The environment is UAT, which throws 'UAT is not allowed to approve rebate'. Run it on a non-UAT environment.
        summary: Approve a waiting rebate batch so the rebates are paid to players.
        x-agent:
            needsReview: true
            risk: money
            whenNotToUse: Does not list or inspect batches (use GET /api/promotion/rebate/batch/waiting, /batch/{batchId} and /batch/{batchId}/customers first). Does not apply to completed batches.
            whenToUse: After reviewing a waiting batch, to release its payouts.
    - target: $.paths['/api/promotion/rebate/batch/completed'].get
      update:
        description: Returns a paged list of completed batches, with request counts, approved and excluded counts, currency, remark and total amount. start and end are optional and the id filters a single batch.
        responses:
            "400":
                description: pageSize or page missing; send both.
            "403":
                description: The operator lacks the ViewRebateHistory permission.
        summary: List rebate batches that are already approved and paid.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not show batches waiting for approval (use GET /api/promotion/rebate/batch/waiting). Does not list the customers in a batch (use /batch/completed/{batchId}/customers).
            whenToUse: Looking up past rebate payouts, or one batch's totals by id.
    - target: $.paths['/api/promotion/rebate/batch/completed'].get.parameters[?(@.name=='pageSize')]
      update:
        description: Required. Rows per page.
    - target: $.paths['/api/promotion/rebate/batch/completed'].get.parameters[?(@.name=='page')]
      update:
        description: Required. Page number; the base (0 or 1) was not verified.
    - target: $.paths['/api/promotion/rebate/batch/completed'].get.parameters[?(@.name=='start')]
      update:
        description: Optional ISO date-time. Lower bound of the date filter.
    - target: $.paths['/api/promotion/rebate/batch/completed'].get.parameters[?(@.name=='end')]
      update:
        description: Optional ISO date-time. Upper bound of the date filter.
    - target: $.paths['/api/promotion/rebate/batch/completed'].get.parameters[?(@.name=='id')]
      update:
        description: Optional batch id to find one batch.
    - target: $.paths['/api/promotion/rebate/batch/completed/{batchId}/customers'].get
      update:
        description: Returns a paged list per customer with username, currency, status and sports, casino, game and total rebate. Without a status filter it shows only Completed, Disqualified and Excluded customers. A userName that matches no customer returns an empty page.
        responses:
            "400":
                description: pageSize or page missing, or status is not 0-9.
            "403":
                description: The operator lacks the ViewRebateHistory permission.
        summary: List the customers and rebate amounts of one completed batch.
        x-agent:
            risk: read
            whenNotToUse: Does not show customers of a batch still waiting for approval (use /rebate/batch/{batchId}/customers). Does not list the batches themselves (use /rebate/batch/completed).
            whenToUse: Seeing who was paid, disqualified or excluded in a finished batch, or checking one player's rebate in it.
    - target: $.paths['/api/promotion/rebate/batch/completed/{batchId}/customers'].get.parameters[?(@.name=='batchId')]
      update:
        description: Path id of a completed batch, from GET /api/promotion/rebate/batch/completed.
    - target: $.paths['/api/promotion/rebate/batch/completed/{batchId}/customers'].get.parameters[?(@.name=='pageSize')]
      update:
        description: Required. Rows per page.
    - target: $.paths['/api/promotion/rebate/batch/completed/{batchId}/customers'].get.parameters[?(@.name=='page')]
      update:
        description: Required. Page number.
    - target: $.paths['/api/promotion/rebate/batch/completed/{batchId}/customers'].get.parameters[?(@.name=='userName')]
      update:
        description: Optional username filter. Unknown names give an empty result.
    - target: $.paths['/api/promotion/rebate/batch/completed/{batchId}/customers'].get.parameters[?(@.name=='status')]
      update:
        description: Optional. 0 = Unknown, 1 = Pending, 2 = Activated, 3 = Expired, 4 = Canceled, 5 = Disqualified, 6 = Completed, 7 = Excluded, 8 = WaitingForApproval, 9 = TransferFailed. Only 5, 6 and 7 are expected on completed batches.
    - target: $.paths['/api/promotion/rebate/batch/waiting'].get
      update:
        description: Returns a paged list of batches awaiting approval, with start and end dates, request count, rebate name and interval. The date filter applies only when both startDate and endDate are sent. Page and pageSize are optional and use defaults.
        responses:
            "403":
                description: The operator lacks the ViewRebateRequests permission.
        summary: List rebate batches waiting for approval.
        x-agent:
            risk: read
            whenNotToUse: Does not show finished batches (use GET /api/promotion/rebate/batch/completed). Does not approve (use POST /api/promotion/rebate/batch/approve).
            whenToUse: Finding rebate batches that need an approve decision, or searching one by batch id or rebate name.
    - target: $.paths['/api/promotion/rebate/batch/waiting'].get.parameters[?(@.name=='batchIdOrRebateName')]
      update:
        description: Optional text matched against batch id or rebate name.
    - target: $.paths['/api/promotion/rebate/batch/waiting'].get.parameters[?(@.name=='startDate')]
      update:
        description: Optional ISO date-time. Ignored unless endDate is also sent.
    - target: $.paths['/api/promotion/rebate/batch/waiting'].get.parameters[?(@.name=='endDate')]
      update:
        description: Optional ISO date-time. Ignored unless startDate is also sent.
    - target: $.paths['/api/promotion/rebate/batch/waiting'].get.parameters[?(@.name=='page')]
      update:
        description: Optional page number. Default comes from Constant.DefaultPageNumber.
    - target: $.paths['/api/promotion/rebate/batch/waiting'].get.parameters[?(@.name=='pageSize')]
      update:
        description: Optional rows per page. Default comes from Constant.DefaultPageSize.
    - target: $.paths['/api/promotion/rebate/batch/{batchId}'].get
      update:
        description: Returns the batch's date range, rebate name and interval, and counts of total, qualified, below-minimum-payout, approved and excluded requests. It also returns the total rebate amount.
        responses:
            "403":
                description: The operator lacks the ViewRebateRequests permission.
            "404":
                description: The batchId is invalid; take it from the waiting list.
        summary: Get the summary of one rebate batch.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Does not list customers (use /rebate/batch/{batchId}/customers). Does not list batches (use /rebate/batch/waiting or /rebate/batch/completed).
            whenToUse: Reviewing one waiting batch's totals before deciding to approve it.
    - target: $.paths['/api/promotion/rebate/batch/{batchId}'].get.parameters[?(@.name=='batchId')]
      update:
        description: Path id of the batch, from GET /api/promotion/rebate/batch/waiting.
    - target: $.paths['/api/promotion/rebate/batch/{batchId}/customers'].get
      update:
        description: Returns a paged list of customers with their rebate amounts for sports, casino, game and total, plus an IsApprove flag. Only customers in WaitingForApproval status of a Waiting batch are returned. userName filters by username, and an unknown name gives an empty result.
        responses:
            "400":
                description: pageSize or page missing; send both.
            "403":
                description: The operator lacks the ViewRebateRequests permission.
            "404":
                description: The batchId is invalid.
        summary: List the customers awaiting approval in a waiting rebate batch.
        x-agent:
            risk: read
            whenNotToUse: Does not show customers of a finished batch (use /rebate/batch/completed/{batchId}/customers). Does not give batch totals (use /rebate/batch/{batchId}).
            whenToUse: Choosing which customers to exclude before approving a batch, or checking one player's pending rebate.
    - target: $.paths['/api/promotion/rebate/batch/{batchId}/customers'].get.parameters[?(@.name=='batchId')]
      update:
        description: Path id of a waiting batch, from GET /api/promotion/rebate/batch/waiting.
    - target: $.paths['/api/promotion/rebate/batch/{batchId}/customers'].get.parameters[?(@.name=='pageSize')]
      update:
        description: Required. Rows per page.
    - target: $.paths['/api/promotion/rebate/batch/{batchId}/customers'].get.parameters[?(@.name=='page')]
      update:
        description: Required. Page number.
    - target: $.paths['/api/promotion/rebate/batch/{batchId}/customers'].get.parameters[?(@.name=='userName')]
      update:
        description: Optional username filter.
    - target: $.paths['/api/promotion/rebate/{id}'].delete
      update:
        description: Deletes the rebate with the given id and records the operator as the modifier. The setting may be rejected if it cannot be deleted. The list endpoint hides inactive rebates that are soft-deleted, which suggests deletion is a soft delete.
        responses:
            "403":
                description: The operator lacks the DeleteRebate permission.
            "404":
                description: The rebate id was not found; take it from the rebate list.
            "409":
                description: Rebate Promotion can not be deleted (RebateSettingCannotDelete). It may be active or in use; check its status first.
        summary: Delete a rebate promotion setting.
        x-agent:
            needsReview: true
            risk: irreversible
            whenNotToUse: Does not edit a rebate (use PUT /api/promotion/rebate/{id}). Does not cancel a payout batch.
            whenToUse: Removing a rebate promotion the operator no longer wants.
    - target: $.paths['/api/promotion/rebate/{id}'].delete.parameters[?(@.name=='id')]
      update:
        description: Path id of the rebate, from GET /api/promotion/rebate.
    - target: $.paths['/api/promotion/rebate/{id}'].put
      update:
        description: Updates the rebate's display info, linked content and the sports, casino and game configs. Event dates, interval, eligible products and details cannot be changed here. The change is written to the action log with old and new values.
        responses:
            "400":
                description: Body invalid or a required field missing.
            "403":
                description: The operator lacks the EditRebate permission.
            "404":
                description: Rebate not found (RebateSettingNotFound); take the id from the rebate list.
            "409":
                description: Possible invalid rebate rate or settings conflict; fix the config values.
        summary: Edit the display and rate settings of an existing rebate promotion.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Does not change dates or interval, so create a new rebate for that (POST /api/promotion/rebate). Does not delete (use DELETE /api/promotion/rebate/{id}).
            whenToUse: Changing a rebate's text, content or rates after creation.
    - target: $.paths['/api/promotion/rebate/{id}'].put.parameters[?(@.name=='id')]
      update:
        description: Path id of the rebate, from GET /api/promotion/rebate.
    - target: $.paths['/api/referrals'].get
      update:
        description: Returns referral campaign configurations, newest first. Without Status, it returns every campaign except those that are Inactive and soft-deleted. Name is a case-insensitive regex match on the campaign display name.
        responses:
            "400":
                description: Status or IncentiveType is not a valid enum number; send one of the listed values.
            "403":
                description: Operator lacks a Referral or Banner view permission (ViewReferral, ViewBanner, AddBanner or EditBanner); use an account with one.
        summary: List referral campaign settings, optionally filtered by name, status or incentive type.
        x-agent:
            risk: read
            whenNotToUse: Does not return batches or payouts; use /api/referrals/batch/waiting or /api/referrals/batch/completed. Does not return a campaign's batch schedule (GET /api/referrals/{referralId}/batch-period).
            whenToUse: Operator asks which referral campaigns exist, which are active, expired or inactive, or wants to find a campaign by name. Also use it to look up a campaign's settings.
    - target: $.paths['/api/referrals'].get.parameters[?(@.name=='Name')]
      update:
        description: Part of the campaign name, case-insensitive. Optional. Treated as a regex, so avoid special characters.
    - target: $.paths['/api/referrals'].get.parameters[?(@.name=='Status')]
      update:
        description: Optional. 0 = Active (not deleted), 1 = ActiveWithDelete (active but soft-deleted), 2 = Inactive, 3 = Expired. Omit for all except Inactive+soft-deleted.
    - target: $.paths['/api/referrals'].get.parameters[?(@.name=='IncentiveType')]
      update:
        description: Optional. 0 = TurnoverBase (commission from referee turnover), 1 = Fixed (flat amount).
    - target: $.paths['/api/referrals'].post
      update:
        description: Creates the campaign and links the given content (banner/page) to it. It fails if the campaign dates overlap an active referral, commissions are not above 0, or a Weekly campaign's length is not a multiple of 7 days. Returns the new referral id.
        responses:
            "400":
                description: A required field is missing or the body is malformed; send every required field.
            "403":
                description: Operator lacks the AddReferral permission.
        summary: Create a new referral campaign.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for editing or deleting a campaign (PUT/DELETE /api/referrals/{id}). Not for approving payouts (POST /api/referrals/batch/approve).
            whenToUse: Operator asks to set up or launch a new referral campaign.
    - target: $.paths['/api/referrals/batch/approve'].post
      update:
        description: Looks up the Waiting batch, excludes the listed customers and any Suspended or Closed customers, then publishes a Kafka message so approved customers get paid. Payouts cannot be recalled once published. Blocked in UAT, and runs under a lock keyed by the request path, so concurrent approvals are serialized.
        responses:
            "400":
                description: batchId missing or the body is malformed.
            "403":
                description: Operator lacks the ApproveExcludeReferralsRequest permission.
        summary: Approve a waiting referral batch and trigger payout of referral commissions.
        x-agent:
            needsReview: true
            risk: money
            whenNotToUse: Not for just viewing a batch (GET /api/referrals/batch/{batchId} or /batch/waiting). Not for creating campaigns.
            whenToUse: Operator asks to approve or pay out a referral batch, optionally excluding some customers.
    - target: $.paths['/api/referrals/batch/completed'].get
      update:
        description: Paged list of completed batches with request counts, approved and excluded counts, total payout amount, currencies, remark and referral name. Dates are returned as unix timestamps. The date filter only applies when both StartDate and EndDate are sent.
        responses:
            "400":
                description: A date is not a valid date-time, or Page or PageSize is not an integer.
            "403":
                description: Operator lacks the ViewReferralHistory permission.
        summary: List referral batches that have finished processing (payout history).
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Batches awaiting approval are in GET /api/referrals/batch/waiting. For the customers in one completed batch use /batch/completed/{batchId}/customers.
            whenToUse: Operator asks for past referral payouts, referral history, or to find a finished batch id.
    - target: $.paths['/api/referrals/batch/completed'].get.parameters[?(@.name=='PageSize')]
      update:
        description: Optional rows per page; a server default is used if omitted.
    - target: $.paths['/api/referrals/batch/completed'].get.parameters[?(@.name=='Page')]
      update:
        description: Optional page number; a server default is used if omitted. Assumed 1-based.
    - target: $.paths['/api/referrals/batch/completed'].get.parameters[?(@.name=='StartDate')]
      update:
        description: Optional ISO 8601 date-time. Ignored unless EndDate is also given.
    - target: $.paths['/api/referrals/batch/completed'].get.parameters[?(@.name=='EndDate')]
      update:
        description: Optional ISO 8601 date-time. Ignored unless StartDate is also given.
    - target: $.paths['/api/referrals/batch/completed'].get.parameters[?(@.name=='Search')]
      update:
        description: Optional text matching batch id or referral name.
    - target: $.paths['/api/referrals/batch/completed/{batchId}/customers'].get
      update:
        description: Paged referrers of a completed batch with username, currency, status, total referrals, accumulated turnover and payout amount. The UserName filter is a fuzzy search when it has at least the configured minimum length, and an exact lookup when shorter. Unknown names return an empty page.
        responses:
            "400":
                description: Status is not a valid number 0-9 or paging values are not integers.
            "403":
                description: Operator lacks the ViewReferralHistory permission.
        summary: List the referrers paid, or not paid, in one completed batch, with payout amounts.
        x-agent:
            risk: read
            whenNotToUse: For batch totals use GET /api/referrals/batch/completed. For batches still waiting use /api/referrals/batch/{batchId}/customers. For a spreadsheet use /batch/completed/{batchId}/download.
            whenToUse: Operator asks who was paid in a given past batch, or how much a given customer received.
    - target: $.paths['/api/referrals/batch/completed/{batchId}/customers'].get.parameters[?(@.name=='batchId')]
      update:
        description: Required. Batch id from GET /api/referrals/batch/completed.
    - target: $.paths['/api/referrals/batch/completed/{batchId}/customers'].get.parameters[?(@.name=='PageSize')]
      update:
        description: Optional rows per page.
    - target: $.paths['/api/referrals/batch/completed/{batchId}/customers'].get.parameters[?(@.name=='Page')]
      update:
        description: Optional page number.
    - target: $.paths['/api/referrals/batch/completed/{batchId}/customers'].get.parameters[?(@.name=='UserName')]
      update:
        description: Optional referrer username. Fuzzy search at or above the minimum length, exact match below it.
    - target: $.paths['/api/referrals/batch/completed/{batchId}/customers'].get.parameters[?(@.name=='Status')]
      update:
        description: Optional customer referral status. 0 = Unknown, 1 = Pending, 2 = Activated, 3 = Expired, 4 = Canceled, 5 = Disqualified, 6 = Completed, 7 = Excluded, 8 = WaitingForApproval, 9 = TransferFailed.
    - target: $.paths['/api/referrals/batch/completed/{batchId}/customers'].get.parameters[?(@.name=='Currency')]
      update:
        description: Optional currency code, for example the code shown in the batch's Currency column.
    - target: $.paths['/api/referrals/batch/completed/{batchId}/download'].get
      update:
        description: Returns an .xlsx stream with every referrer of the batch, not paged. The turnover column is dropped for non-TurnoverBase batches. If the batch has no data, it returns an error body with HTTP 200 instead of a file.
        responses:
            "403":
                description: Operator lacks the DownloadReferralHistoryDetail permission.
        summary: Download an Excel file of the customers in a completed referral batch.
        x-agent:
            risk: read
            whenNotToUse: For on-screen paged data use /batch/completed/{batchId}/customers. For a waiting batch's request list use /batch/{batchId}/download.
            whenToUse: Operator asks to export or download the history of a completed referral batch.
    - target: $.paths['/api/referrals/batch/completed/{batchId}/download'].get.parameters[?(@.name=='batchId')]
      update:
        description: Required. Batch id from GET /api/referrals/batch/completed.
    - target: $.paths['/api/referrals/batch/waiting'].get
      update:
        description: Paged list of batches in Waiting status, with request counts and referral name. The date filter only applies when both StartDate and EndDate are sent.
        responses:
            "400":
                description: A date is not a valid date-time, or paging values are not integers.
            "403":
                description: Operator lacks the ViewReferralRequest permission.
        summary: List referral batches waiting for operator approval.
        x-agent:
            risk: read
            whenNotToUse: Finished batches are in GET /api/referrals/batch/completed. To approve, use POST /api/referrals/batch/approve.
            whenToUse: Operator asks what referral batches need approval, or needs a batch id to review or approve.
    - target: $.paths['/api/referrals/batch/waiting'].get.parameters[?(@.name=='BatchIdOrReferralName')]
      update:
        description: Optional text matching batch id or referral name.
    - target: $.paths['/api/referrals/batch/waiting'].get.parameters[?(@.name=='StartDate')]
      update:
        description: Optional ISO 8601 date-time. Ignored unless EndDate is also given.
    - target: $.paths['/api/referrals/batch/waiting'].get.parameters[?(@.name=='EndDate')]
      update:
        description: Optional ISO 8601 date-time. Ignored unless StartDate is also given.
    - target: $.paths['/api/referrals/batch/waiting'].get.parameters[?(@.name=='Page')]
      update:
        description: Optional page number.
    - target: $.paths['/api/referrals/batch/waiting'].get.parameters[?(@.name=='PageSize')]
      update:
        description: Optional rows per page.
    - target: $.paths['/api/referrals/batch/{batchId}'].get
      update:
        description: Returns batch dates (unix timestamps), referral name, interval, incentive type, minimum active players, request counts (total, qualified, approve, exclude, below minimum payout) and total payout amount. Only the summary is returned, not the individual customers.
        responses:
            "403":
                description: Operator lacks the ViewReferralRequest permission.
        summary: Show the summary of one referral batch.
        x-agent:
            risk: read
            whenNotToUse: For the customers in the batch use /batch/{batchId}/customers, /active-referer or /pending-qualifications.
            whenToUse: Operator asks for the details or totals of a specific referral batch before approving it.
    - target: $.paths['/api/referrals/batch/{batchId}'].get.parameters[?(@.name=='batchId')]
      update:
        description: Required. Batch id from GET /api/referrals/batch/waiting or /batch/completed.
    - target: $.paths['/api/referrals/batch/{batchId}/active-referer'].get
      update:
        description: Paged active customer-referral records for the Referral Request Detail page of a TurnoverBase batch. UserName is fuzzy-matched at or above the minimum length and exact below it; unknown names return an empty page.
        responses:
            "400":
                description: Paging values are not integers.
            "403":
                description: Operator lacks the ViewReferralRequest permission.
        summary: List active referrers of a TurnoverBase batch awaiting approval.
        x-agent:
            risk: read
            whenNotToUse: For Fixed batches use /batch/{batchId}/customers. For referrers not yet qualified use /batch/{batchId}/pending-qualifications.
            whenToUse: Operator reviews who is active in a TurnoverBase batch before approval.
    - target: $.paths['/api/referrals/batch/{batchId}/active-referer'].get.parameters[?(@.name=='batchId')]
      update:
        description: Required. Batch id from GET /api/referrals/batch/waiting.
    - target: $.paths['/api/referrals/batch/{batchId}/active-referer'].get.parameters[?(@.name=='PageSize')]
      update:
        description: Optional rows per page.
    - target: $.paths['/api/referrals/batch/{batchId}/active-referer'].get.parameters[?(@.name=='Page')]
      update:
        description: Optional page number.
    - target: $.paths['/api/referrals/batch/{batchId}/active-referer'].get.parameters[?(@.name=='UserName')]
      update:
        description: Optional referrer username filter.
    - target: $.paths['/api/referrals/batch/{batchId}/customers'].get
      update:
        description: Paged waitingForApproval customer-referral records for the Referral Request Detail page of Fixed referrals. UserName is fuzzy-matched at or above the minimum length and exact below it; unknown names return an empty page.
        responses:
            "400":
                description: Paging values are not integers.
            "403":
                description: Operator lacks the ViewReferralRequest permission.
        summary: List referrers waiting for approval in a Fixed-incentive batch.
        x-agent:
            risk: read
            whenNotToUse: For TurnoverBase batches use /batch/{batchId}/active-referer and /pending-qualifications. For finished batches use /batch/completed/{batchId}/customers.
            whenToUse: Operator reviews the customers in a Fixed batch before approving or excluding some.
    - target: $.paths['/api/referrals/batch/{batchId}/customers'].get.parameters[?(@.name=='batchId')]
      update:
        description: Required. Batch id from GET /api/referrals/batch/waiting.
    - target: $.paths['/api/referrals/batch/{batchId}/customers'].get.parameters[?(@.name=='PageSize')]
      update:
        description: Optional rows per page.
    - target: $.paths['/api/referrals/batch/{batchId}/customers'].get.parameters[?(@.name=='Page')]
      update:
        description: Optional page number.
    - target: $.paths['/api/referrals/batch/{batchId}/customers'].get.parameters[?(@.name=='UserName')]
      update:
        description: Optional referrer username filter.
    - target: $.paths['/api/referrals/batch/{batchId}/download'].get
      update:
        description: Returns an .xlsx stream, not paged. For TurnoverBase batches it has two sheets, Active Referrers and Pending Qualifications. For Fixed batches it has one sheet. If the batch is missing or has no data, it returns an error body with HTTP 200 instead of a file.
        responses:
            "403":
                description: Operator lacks the ViewReferralRequest permission.
        summary: Download an Excel file of the referral requests in a waiting batch.
        x-agent:
            risk: read
            whenNotToUse: For completed-batch history use /batch/completed/{batchId}/download.
            whenToUse: Operator asks to export or download a batch's referral request list for review.
    - target: $.paths['/api/referrals/batch/{batchId}/download'].get.parameters[?(@.name=='batchId')]
      update:
        description: Required. Batch id from GET /api/referrals/batch/waiting.
    - target: $.paths['/api/referrals/batch/{batchId}/pending-qualifications'].get
      update:
        description: 'Returns every pending-qualification customer-referral record of the batch as a plain list. It is not paged: Page and PageSize are accepted but ignored. UserName is fuzzy-matched at or above the minimum length and exact below it.'
        responses:
            "403":
                description: Operator lacks the ViewReferralRequest permission.
        summary: List referrers in a TurnoverBase batch who have not yet qualified.
        x-agent:
            risk: read
            whenNotToUse: For qualified, active referrers use /batch/{batchId}/active-referer. For Fixed batches use /batch/{batchId}/customers.
            whenToUse: Operator asks who is still pending qualification in a TurnoverBase batch.
    - target: $.paths['/api/referrals/batch/{batchId}/pending-qualifications'].get.parameters[?(@.name=='batchId')]
      update:
        description: Required. Batch id from GET /api/referrals/batch/waiting.
    - target: $.paths['/api/referrals/batch/{batchId}/pending-qualifications'].get.parameters[?(@.name=='PageSize')]
      update:
        description: Accepted but ignored; the full list is always returned.
    - target: $.paths['/api/referrals/batch/{batchId}/pending-qualifications'].get.parameters[?(@.name=='Page')]
      update:
        description: Accepted but ignored; the full list is always returned.
    - target: $.paths['/api/referrals/batch/{batchId}/pending-qualifications'].get.parameters[?(@.name=='UserName')]
      update:
        description: Optional referrer username filter.
    - target: $.paths['/api/referrals/{id}'].delete
      update:
        description: Marks the campaign as deleted but keeps the record. If the campaign is Active, its end date is cut to the end date of its latest pending or active batch, so the open batch can still finish and pay out. If it is Inactive, it is deleted at once. Expired campaigns cannot be deleted.
        responses:
            "401":
                description: Missing or invalid operator session; log in again.
            "403":
                description: Operator lacks the DeleteReferral permission; use an account that has it.
        summary: Delete a referral campaign (soft delete); an active campaign keeps running until its current batch ends.
        x-agent:
            needsReview: true
            risk: irreversible
            whenNotToUse: Changing campaign dates, commissions or content (use PUT /api/referrals/{id}). Looking at campaigns or batch timing (use GET /api/referrals or GET /api/referrals/{referralId}/batch-period). Deleting an Expired campaign (not allowed).
            whenToUse: The operator wants to remove or retire a referral campaign that is Active or Inactive.
    - target: $.paths['/api/referrals/{id}'].delete.parameters[?(@.name=='id')]
      update:
        description: Referral campaign id (string), taken from the id field of the GET /api/referrals list.
    - target: $.paths['/api/referrals/{id}'].put
      update:
        description: Overwrites the whole campaign with the body, so send every field, not just the ones that change. It rejects the change if another referral campaign with the same incentive type and any of the same currencies overlaps the new dates. For a Weekly campaign that has an end date, the duration must be a whole number of 7-day weeks.
        responses:
            "400":
                description: Body is missing a required field or has a wrong type (for example a commission of 0 or less on sportsConfig); fix the body and resend.
            "401":
                description: Missing or invalid operator session; log in again.
            "403":
                description: Operator lacks the EditReferral permission.
        summary: Replace the settings of an existing referral campaign (dates, incentive, commissions, payout limits, content).
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Creating a campaign (use POST /api/referrals). Deleting one (use DELETE /api/referrals/{id}). Only checking batch timing (use GET /api/referrals/{referralId}/batch-period).
            whenToUse: 'The operator wants to edit a referral campaign: dates, interval, incentive type, commissions, min/max payout, deposit minimums, display info or content.'
    - target: $.paths['/api/referrals/{id}'].put.parameters[?(@.name=='id')]
      update:
        description: Referral campaign id (string), from the id field of GET /api/referrals.
    - target: $.paths['/api/referrals/{referralId}/batch-period'].get
      update:
        description: Returns the start and end of the campaign's current pending or active batch, and the start of the next batch. All three dates are Unix timestamps; a value of 0 means there is no such batch (for example no open batch, or an unknown referralId). Changes nothing.
        responses:
            "401":
                description: Missing or invalid operator session; log in again.
            "403":
                description: Operator lacks the ViewReferral permission.
        summary: Show the current and next payout batch dates of one referral campaign.
        x-agent:
            risk: read
            whenNotToUse: Listing campaigns or finding a referralId (use GET /api/referrals). Listing waiting, completed or per-customer batch results (use the /api/referrals/batch/... operations). Editing the campaign (use PUT /api/referrals/{id}).
            whenToUse: The operator asks when the current referral batch ends or when the next one starts for a given campaign.
    - target: $.paths['/api/referrals/{referralId}/batch-period'].get.parameters[?(@.name=='referralId')]
      update:
        description: Referral campaign id (string), from the id field of GET /api/referrals.
    - target: $.paths['/api/report/company'].get
      update:
        description: Splits the range into calendar months, gathers betting, payment and bonus data per month, and merges the months into one row per currency. It appends a final total row that converts all currencies using exchange rates. It can be slow on long ranges because it queries each month.
        responses:
            "400":
                description: StartDate or EndDate missing or not a valid date-time; send both in ISO 8601.
            "401":
                description: Not logged in as a back-office operator; log in first.
            "403":
                description: Operator lacks the ViewCompanyReports permission; use an account that has it.
        summary: Company-wide business report for a date range, one row per currency plus a total row.
        x-agent:
            risk: read
            whenNotToUse: Not for per-game or per-casino GGR by provider (use POST /api/report/performance/game or /performance/casino). Not for promotion or bonus cost (use the marketing promotion reports). Not for voucher cost (use GET /api/report/test-voucher).
            whenToUse: Operator asks for the overall company report, company-level GGR, turnover or revenue summary over a period.
    - target: $.paths['/api/report/company'].get.parameters[?(@.name=='StartDate')]
      update:
        description: Start of the period, ISO 8601 date-time with offset, e.g. 2025-06-01T00:00:00+08:00. The first month is cut at this instant.
    - target: $.paths['/api/report/company'].get.parameters[?(@.name=='EndDate')]
      update:
        description: End of the period, ISO 8601 date-time with offset. Must not be before StartDate. The last month is cut at this instant.
    - target: $.paths['/api/report/marketing/memberPromotion'].get
      update:
        description: Returns one row per member promotion (deposit bonuses and manual bonuses), newest start date first, with paging. The reward date range cannot exceed 31 days. A Username filter is a fuzzy match, and if no member matches, the result is empty.
        responses:
            "400":
                description: A required parameter (RewardDateStart, RewardDateEnd, ExcludeTestAccounts, PageSize, PageNumber) is missing or malformed; send all of them.
            "401":
                description: Not logged in as an operator.
            "403":
                description: Operator lacks the ViewMemberPromotionsReports permission.
        summary: Paged list of promotion/bonus rewards given to members in a reward-date window.
        x-agent:
            risk: read
            whenNotToUse: Not for totals per promotion (use GET /api/report/marketing/promotionStatistics). Not for a downloadable file (use .../memberPromotion/export). Not for windows longer than 31 days; split them into several calls.
            whenToUse: Operator asks which members received which promotions or bonuses, who got promotion X, or the status of a member's promotion in a short period.
    - target: $.paths['/api/report/marketing/memberPromotion'].get.parameters[?(@.name=='Username')]
      update:
        description: Optional. Fuzzy match on the member's username. If it matches nobody, the result is empty.
    - target: $.paths['/api/report/marketing/memberPromotion'].get.parameters[?(@.name=='Status')]
      update:
        description: 'Optional. Status of the member''s promotion: 0 = Unknown, 1 = Pending, 2 = Activated, 3 = Expired, 4 = Canceled, 5 = Disqualified, 6 = Completed, 7 = Excluded, 8 = WaitingForApproval, 9 = TransferFailed.'
    - target: $.paths['/api/report/marketing/memberPromotion'].get.parameters[?(@.name=='PromotionType')]
      update:
        description: Optional. 1 = InitialDeposit, 2 = ReDeposit, 3 = Rebate, 4 = ManualBonus, 5 = Referral. 1 and 2 query deposit bonuses only; 4 queries manual bonuses only.
    - target: $.paths['/api/report/marketing/memberPromotion'].get.parameters[?(@.name=='PromotionCode')]
      update:
        description: Optional. Exact promotion code, as shown in promotion setup or in the promotionStatistics report.
    - target: $.paths['/api/report/marketing/memberPromotion'].get.parameters[?(@.name=='Currency')]
      update:
        description: Optional. Fiat currency as an ISO 4217 numeric code, e.g. 840 = USD, 702 = SGD, 608 = PHP. 0 = unspecified.
    - target: $.paths['/api/report/marketing/memberPromotion'].get.parameters[?(@.name=='RewardDateStart')]
      update:
        description: Required. Start of the reward window, ISO 8601 date-time with offset.
    - target: $.paths['/api/report/marketing/memberPromotion'].get.parameters[?(@.name=='RewardDateEnd')]
      update:
        description: Required. End of the reward window, ISO 8601 date-time. At most 31 days after RewardDateStart.
    - target: $.paths['/api/report/marketing/memberPromotion'].get.parameters[?(@.name=='ExcludeTestAccounts')]
      update:
        description: Required. true = leave out test-mode accounts, false = include them.
    - target: $.paths['/api/report/marketing/memberPromotion'].get.parameters[?(@.name=='PageSize')]
      update:
        description: Required. Rows per page.
    - target: $.paths['/api/report/marketing/memberPromotion'].get.parameters[?(@.name=='PageNumber')]
      update:
        description: Required. Page number, starting at 1.
    - target: $.paths['/api/report/marketing/memberPromotion/export'].get
      update:
        description: Same filters and ordering as the memberPromotion list, but returns every matching row in one .xlsx file with no paging. The reward date range cannot exceed 31 days. The response is a file, not JSON.
        responses:
            "400":
                description: RewardDateStart, RewardDateEnd or ExcludeTestAccounts missing or malformed; send all three.
            "401":
                description: Not logged in as an operator.
            "403":
                description: Operator lacks the ViewMemberPromotionsReports permission.
        summary: Download the member-promotion report as an Excel (.xlsx) file.
        x-agent:
            risk: read
            whenNotToUse: Not for reading rows in the chat (use GET /api/report/marketing/memberPromotion). Not for per-promotion totals (use promotionStatistics/export).
            whenToUse: Operator asks to export or download the member promotion report to Excel.
    - target: $.paths['/api/report/marketing/memberPromotion/export'].get.parameters[?(@.name=='Username')]
      update:
        description: Optional. Fuzzy match on the member's username.
    - target: $.paths['/api/report/marketing/memberPromotion/export'].get.parameters[?(@.name=='Status')]
      update:
        description: Optional. 0 = Unknown, 1 = Pending, 2 = Activated, 3 = Expired, 4 = Canceled, 5 = Disqualified, 6 = Completed, 7 = Excluded, 8 = WaitingForApproval, 9 = TransferFailed.
    - target: $.paths['/api/report/marketing/memberPromotion/export'].get.parameters[?(@.name=='PromotionType')]
      update:
        description: Optional. 1 = InitialDeposit, 2 = ReDeposit, 3 = Rebate, 4 = ManualBonus, 5 = Referral.
    - target: $.paths['/api/report/marketing/memberPromotion/export'].get.parameters[?(@.name=='PromotionCode')]
      update:
        description: Optional. Exact promotion code.
    - target: $.paths['/api/report/marketing/memberPromotion/export'].get.parameters[?(@.name=='Currency')]
      update:
        description: Optional. Fiat currency as an ISO 4217 numeric code, e.g. 840 = USD, 702 = SGD, 608 = PHP.
    - target: $.paths['/api/report/marketing/memberPromotion/export'].get.parameters[?(@.name=='RewardDateStart')]
      update:
        description: Required. Start of the reward window, ISO 8601 date-time with offset.
    - target: $.paths['/api/report/marketing/memberPromotion/export'].get.parameters[?(@.name=='RewardDateEnd')]
      update:
        description: Required. End of the reward window, ISO 8601 date-time. At most 31 days after RewardDateStart.
    - target: $.paths['/api/report/marketing/memberPromotion/export'].get.parameters[?(@.name=='ExcludeTestAccounts')]
      update:
        description: Required. true = leave out test-mode accounts, false = include them.
    - target: $.paths['/api/report/marketing/promotionStatistics'].get
      update:
        description: Aggregates deposit and manual bonuses granted in the reward window into one row per promotion code and currency, sorted by code then currency. The reward date range cannot exceed 365 days. Status filters on the promotion's current setup status, not on the members' reward status.
        responses:
            "400":
                description: A required parameter (RewardDateStart, RewardDateEnd, ExcludeTestAccounts, PageSize, PageNumber) is missing or malformed; send all of them.
            "401":
                description: Not logged in as an operator.
            "403":
                description: Operator lacks the ViewMemberPromotionsReports permission.
        summary: 'Paged totals per promotion code and currency: players, deposits, bonus paid and cancelled bonus.'
        x-agent:
            risk: read
            whenNotToUse: Not for which individual members got a promotion (use GET /api/report/marketing/memberPromotion). Not for a file (use .../promotionStatistics/export). Not for voucher cost (use GET /api/report/test-voucher).
            whenToUse: 'Operator asks how a promotion performed: number of players, total deposit, total bonus cost or cancelled bonus per promotion.'
    - target: $.paths['/api/report/marketing/promotionStatistics'].get.parameters[?(@.name=='PromotionCode')]
      update:
        description: Optional. Exact promotion code.
    - target: $.paths['/api/report/marketing/promotionStatistics'].get.parameters[?(@.name=='Currency')]
      update:
        description: Optional. Fiat currency as an ISO 4217 numeric code, e.g. 840 = USD, 702 = SGD, 608 = PHP.
    - target: $.paths['/api/report/marketing/promotionStatistics'].get.parameters[?(@.name=='Status')]
      update:
        description: 'Optional. Current status of the promotion itself: 0 = Active, 1 = Inactive, 2 = Expired. Different enum from memberPromotion Status.'
    - target: $.paths['/api/report/marketing/promotionStatistics'].get.parameters[?(@.name=='RewardDateStart')]
      update:
        description: Required. Start of the reward window, ISO 8601 date-time with offset.
    - target: $.paths['/api/report/marketing/promotionStatistics'].get.parameters[?(@.name=='RewardDateEnd')]
      update:
        description: Required. End of the reward window, ISO 8601 date-time. At most 365 days after RewardDateStart.
    - target: $.paths['/api/report/marketing/promotionStatistics'].get.parameters[?(@.name=='ExcludeTestAccounts')]
      update:
        description: Required. true = leave out test-mode accounts, false = include them.
    - target: $.paths['/api/report/marketing/promotionStatistics'].get.parameters[?(@.name=='PageSize')]
      update:
        description: Required. Rows per page.
    - target: $.paths['/api/report/marketing/promotionStatistics'].get.parameters[?(@.name=='PageNumber')]
      update:
        description: Required. Page number, starting at 1.
    - target: $.paths['/api/report/marketing/promotionStatistics/export'].get
      update:
        description: Same filters as promotionStatistics but returns all rows in one .xlsx file with no paging. The reward date range cannot exceed 365 days. The response is a file, not JSON.
        responses:
            "400":
                description: RewardDateStart, RewardDateEnd or ExcludeTestAccounts missing or malformed; send all three.
            "401":
                description: Not logged in as an operator.
            "403":
                description: Operator lacks the ViewMemberPromotionsReports permission.
        summary: Download the promotion statistics report as an Excel (.xlsx) file.
        x-agent:
            risk: read
            whenNotToUse: Not for reading rows in the chat (use GET /api/report/marketing/promotionStatistics). Not for individual member rewards (use memberPromotion/export).
            whenToUse: Operator asks to export or download promotion statistics to Excel.
    - target: $.paths['/api/report/marketing/promotionStatistics/export'].get.parameters[?(@.name=='PromotionCode')]
      update:
        description: Optional. Exact promotion code.
    - target: $.paths['/api/report/marketing/promotionStatistics/export'].get.parameters[?(@.name=='Currency')]
      update:
        description: Optional. Fiat currency as an ISO 4217 numeric code, e.g. 840 = USD, 702 = SGD, 608 = PHP.
    - target: $.paths['/api/report/marketing/promotionStatistics/export'].get.parameters[?(@.name=='Status')]
      update:
        description: 'Optional. Current status of the promotion: 0 = Active, 1 = Inactive, 2 = Expired.'
    - target: $.paths['/api/report/marketing/promotionStatistics/export'].get.parameters[?(@.name=='RewardDateStart')]
      update:
        description: Required. Start of the reward window, ISO 8601 date-time with offset.
    - target: $.paths['/api/report/marketing/promotionStatistics/export'].get.parameters[?(@.name=='RewardDateEnd')]
      update:
        description: Required. End of the reward window, ISO 8601 date-time. At most 365 days after RewardDateStart.
    - target: $.paths['/api/report/marketing/promotionStatistics/export'].get.parameters[?(@.name=='ExcludeTestAccounts')]
      update:
        description: Required. true = leave out test-mode accounts, false = include them.
    - target: $.paths['/api/report/performance/casino'].post
      update:
        description: Returns a list of GGR rows for the casino product. The body must carry a date range and the provider mapping to report on. It is a POST but only reads data.
        responses:
            "400":
                description: Body missing or malformed, or required dateRange / financialProviderMapping missing; send the full JSON body.
            "401":
                description: Not logged in as an operator.
            "403":
                description: Operator lacks the ViewCasinoGgrReports permission.
        summary: Casino GGR (gross gaming revenue) report for a date range, split by the given financial providers.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Not for sports/game GGR (use POST /api/report/performance/game). Not for network prize figures (use POST /api/report/performance/casino/network-prize). Not for the whole-company summary (use GET /api/report/company).
            whenToUse: Operator asks for casino GGR, casino turnover or win/loss by provider over a period.
    - target: $.paths['/api/report/performance/casino/network-prize'].post
      update:
        description: Returns the network prize figures for the casino product. It takes the same body as the casino GGR report. It is a POST but only reads data.
        responses:
            "400":
                description: Body missing or malformed; send the full JSON body.
            "401":
                description: Not logged in as an operator.
            "403":
                description: Operator lacks the ViewGameGgrReports permission.
        summary: Casino network-prize (jackpot/prize pool) report for a date range and providers.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Not for plain casino GGR (use POST /api/report/performance/casino). Not for game network prize (use POST /api/report/performance/game/network-prize).
            whenToUse: Operator asks for casino network prize or jackpot contribution figures over a period.
    - target: $.paths['/api/report/performance/game'].post
      update:
        description: Returns a list of GGR rows for the game product. The body must carry a date range and the provider mapping to report on. It is a POST but only reads data.
        responses:
            "400":
                description: Body missing or malformed; send the full JSON body.
            "401":
                description: Not logged in as an operator.
            "403":
                description: Operator lacks the ViewGameGgrReports permission.
        summary: Game (sports/game product) GGR report for a date range, split by the given financial providers.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Not for casino GGR (use POST /api/report/performance/casino). Not for network prize (use POST /api/report/performance/game/network-prize). Not for the whole-company summary (use GET /api/report/company).
            whenToUse: Operator asks for game or sports GGR, turnover or win/loss by provider over a period.
    - target: $.paths['/api/report/performance/game/network-prize'].post
      update:
        description: Returns the network prize figures for the game product. It takes the same body as the game GGR report. It is a POST but only reads data.
        responses:
            "400":
                description: Body missing or malformed; send the full JSON body.
            "401":
                description: Not logged in as an operator.
            "403":
                description: Operator lacks the ViewGameGgrReports permission.
        summary: Game network-prize report for a date range and providers.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Not for plain game GGR (use POST /api/report/performance/game). Not for casino network prize (use POST /api/report/performance/casino/network-prize).
            whenToUse: Operator asks for game network prize figures over a period.
    - target: $.paths['/api/report/test-voucher'].get
      update:
        description: Returns a list of voucher costs for the period, combining voucher win/loss from the game-info service and the sports-bet service. Unlike the other report endpoints it returns the bare list, not the usual BaseResponse wrapper.
        responses:
            "400":
                description: StartDate or EndDate missing or not a valid date-time; send both.
            "401":
                description: Not logged in; log in first.
        summary: Voucher cost (win/loss paid out through vouchers) for a date range.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Not for promotion or bonus cost (use the marketing promotion reports). Not for the whole-company summary (use GET /api/report/company).
            whenToUse: Operator asks how much vouchers cost in a period, or voucher win/loss.
    - target: $.paths['/api/report/test-voucher'].get.parameters[?(@.name=='StartDate')]
      update:
        description: Start of the period, ISO 8601 date-time with offset. Converted to UTC for the game-info query.
    - target: $.paths['/api/report/test-voucher'].get.parameters[?(@.name=='EndDate')]
      update:
        description: End of the period, ISO 8601 date-time with offset.
    - target: $.paths['/api/role'].post
      update:
        description: Creates an active role with the given name, description and permission ids, and records the calling operator as creator. The name must be unique among all existing roles (exact match). Returns no data on success, so look up the new role's id with GET /api/role/roles.
        responses:
            "400":
                description: Body is missing name or permissions, or is malformed JSON; send both required fields.
            "401":
                description: Not logged in; authenticate first.
            "403":
                description: Caller lacks the AddRole permission (8006).
        summary: Create a new back-office role with a chosen set of permissions.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Changing an existing role (use PUT /api/role/{id}). Assigning a role to a user is not done here.
            whenToUse: Operator asks to add or create a new role or permission group for back-office staff.
    - target: $.paths['/api/role/permissions'].get
      update:
        description: Returns the permission catalogue as categories, each with its sub-permissions, with a few unimplemented permissions (rebate history detail download, action log view) left out. Takes no parameters and changes nothing.
        responses:
            "401":
                description: Not logged in; authenticate first.
            "403":
                description: Caller needs ViewRole (8005) or ViewUser (8001).
        summary: List every assignable permission, grouped by category.
        x-agent:
            risk: read
            whenNotToUse: Which permissions a given role currently has (use GET /api/role/{id}). Permissions of all roles at once (use GET /api/role/rolePermissions).
            whenToUse: Operator asks which permissions exist, or you need permission ids before creating or editing a role.
    - target: $.paths['/api/role/rolePermissions'].get
      update:
        description: Returns one entry per role with roleId, roleName and its permission details. It is not paged or filtered. Takes no parameters and changes nothing.
        responses:
            "401":
                description: Not logged in; authenticate first.
            "403":
                description: Caller needs ViewRole (8005) or ViewUser (8001).
        summary: List all roles together with the permissions each one holds.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Only the role names, descriptions and user counts (use GET /api/role/roles). One role in detail (use GET /api/role/{id}). The catalogue of all possible permissions (use GET /api/role/permissions).
            whenToUse: Operator wants an overview or comparison of what every role is allowed to do.
    - target: $.paths['/api/role/roles'].get
      update:
        description: Returns every matching role, newest created first, with id, name, description, number of active users, last updated by and last updated time (Unix timestamp). It is not paged. RoleStatus is accepted but ignored by the handler, so it filters nothing.
        responses:
            "400":
                description: RoleStatus is not 0 or 1, or is not an integer; fix the value or omit it.
            "401":
                description: Not logged in; authenticate first.
            "403":
                description: Caller needs ViewRole (8005) or ViewUser (8001).
        summary: List back-office roles with their active-user counts, optionally filtered by name.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: A role's permissions (use GET /api/role/{id} for one role, GET /api/role/rolePermissions for all). Do not rely on RoleStatus to filter active or inactive roles.
            whenToUse: Operator asks to see, search or find roles, or needs a role id.
    - target: $.paths['/api/role/roles'].get.parameters[?(@.name=='RoleName')]
      update:
        description: Optional name filter, passed to the stored procedure. Whether it is an exact or partial match is not visible in the code; omit it to list all roles.
    - target: $.paths['/api/role/roles'].get.parameters[?(@.name=='RoleStatus')]
      update:
        description: 'Optional, 0 = Active, 1 = Inactive. Currently has no effect: the endpoint never passes it to the query.'
    - target: $.paths['/api/role/{id}'].delete
      update:
        description: Refuses to delete a role that still has active users. Otherwise it unlinks the role from operators, deletes it through a stored procedure, and clears the permission cache for operators who had it. There is no restore operation in this API.
        responses:
            "401":
                description: Not logged in; authenticate first.
            "403":
                description: Caller lacks the DeleteRole permission (8008).
            "404":
                description: Route did not match, for example id is not an integer.
        summary: Delete a back-office role.
        x-agent:
            needsReview: true
            risk: irreversible
            whenNotToUse: Renaming or changing a role's permissions (use PUT /api/role/{id}). Do not call it to check whether a role exists (use GET /api/role/{id}).
            whenToUse: Operator explicitly asks to remove or delete a role that no active user holds.
    - target: $.paths['/api/role/{id}'].delete.parameters[?(@.name=='id')]
      update:
        description: Role id (integer) from GET /api/role/roles.
    - target: $.paths['/api/role/{id}'].get
      update:
        description: Returns the role's id, name, description, number of active users and a flat list of its permissions. Changes nothing.
        responses:
            "401":
                description: Not logged in; authenticate first.
            "403":
                description: Caller lacks the ViewRole permission (8005).
            "404":
                description: Route did not match, for example id is not an integer.
        summary: Show one role with its description, active-user count and full permission list.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Finding a role by name or listing roles (use GET /api/role/roles). Comparing all roles (use GET /api/role/rolePermissions).
            whenToUse: Operator asks what a specific role can do, or you need its current data before editing it.
    - target: $.paths['/api/role/{id}'].get.parameters[?(@.name=='id')]
      update:
        description: Role id (integer) from GET /api/role/roles.
    - target: $.paths['/api/role/{id}'].put
      update:
        description: Overwrites the role's name, description and permission set with the values sent (the permissions list is the full new set, not a delta). The name must not belong to another role. Permission caches of all operators with this role are cleared, so the change takes effect for them immediately.
        responses:
            "400":
                description: Body is missing name or permissions, or is malformed JSON; send both required fields.
            "401":
                description: Not logged in; authenticate first.
            "403":
                description: Caller lacks the EditRole permission (8007).
        summary: Rename a role and replace its permissions.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Creating a new role (use POST /api/role). Deleting a role (use DELETE /api/role/{id}). Do not send a partial permission list unless you want the others removed.
            whenToUse: Operator asks to rename a role, change its description, or add or remove permissions on it.
    - target: $.paths['/api/role/{id}'].put.parameters[?(@.name=='id')]
      update:
        description: Role id (integer) from GET /api/role/roles.
    - target: $.paths['/api/settings/availability'].get
      update:
        description: Returns the base currency, every currency with its enabled/disabled status, and the languages enabled for the member site. Currency codes are mapped to the FiatCurrency enum, and a code that is not in the enum comes back as Unknown, so crypto currencies are not described properly. Currencies are read through the UAT flag of the environment config.
        responses:
            "500":
                description: A downstream service (currency exchange or feature service) failed; retry later.
        summary: List the currencies, base currency and member-site languages the platform supports (legacy shape).
        x-agent:
            risk: read
            whenNotToUse: Do not use for crypto currencies or the crypto wallet rule; use /api/settings/availability/v2. Do not use for provider lists or frontend feature switches (see /api/settings/providers/* and /api/settings/config).
            whenToUse: Operator asks which currencies or languages are available, what the base currency is, or whether a fiat currency is enabled.
    - target: $.paths['/api/settings/availability/v2'].get
      update:
        description: 'Same as the v1 availability call, but the currency is returned as a full Currency object instead of a FiatCurrency enum, so unknown and crypto currencies are not collapsed to Unknown. It also returns CryptoWalletRule. Each currency has a status: 0 = Disabled, 1 = Enabled.'
        responses:
            "500":
                description: A downstream service (currency exchange or feature service) failed; retry later.
        summary: List the currencies (fiat and crypto), base currency, member-site languages and crypto wallet rule.
        x-agent:
            risk: read
            whenNotToUse: Do not use for provider lists or frontend feature flags; use /api/settings/providers/* or /api/settings/config. Prefer this over /api/settings/availability unless the old response shape is needed.
            whenToUse: Operator asks which currencies (including crypto) are enabled, what the base currency is, which member-site languages are on, or what the crypto wallet rule is.
    - target: $.paths['/api/settings/config'].get
      update:
        description: 'Reads all feature settings in the "Polaris" scope and returns 11 booleans: IsBonusEnabled, IsRewardEnabled, IsRebateEnabled, IsReferralEnabled, IsCreativeEnabled, IsNetworkPromotionEnabled, IsTelemarketingPerformanceEnabled, IsDirectPaySlipEnabled, IsFairExchangeIdVisible, IsAddressVisibleInPlayerProfile and IsResetPasswordVisible. A flag that is missing or cannot be parsed is returned as false, so false does not prove the flag was set.'
        responses:
            "500":
                description: The feature service failed; retry later.
        summary: Show which optional backoffice frontend (Polaris) features are switched on.
        x-agent:
            risk: read
            whenNotToUse: Do not use to change a flag; this call only reads. Do not use for the supported currencies or languages (use /api/settings/availability/v2) or for provider lists.
            whenToUse: Operator asks whether a backoffice feature (bonus, reward, rebate, referral, reset password button, etc.) is enabled or visible.
    - target: $.paths['/api/settings/providers/casino'].get
      update:
        description: Calls the casino backoffice service and returns each brand provider whose status is not Closed as BrandProviderId and Name. The numeric values of ProviderStatus come from an external package and were not inspected.
        responses:
            "500":
                description: The casino backoffice service failed; retry later.
        summary: List the casino brand providers that are not closed, as id and name.
        x-agent:
            risk: read
            whenNotToUse: Do not use for sports/game providers (use /api/settings/providers/game). Do not use when the financial provider under each brand is needed or closed providers must be included (use /api/settings/providers/casino/all, although it also does not return status).
            whenToUse: Operator needs casino provider ids or names, for example to fill a provider filter in a casino report.
    - target: $.paths['/api/settings/providers/casino/all'].get
      update:
        description: Returns one row per brand provider and financial provider pair, each with BrandProvider, IntegrationProvider and FinancialProvider as id and name. IntegrationProvider is filled with the same id and name as BrandProvider. A brand provider with no financial providers produces no rows, so it does not appear.
        responses:
            "500":
                description: The casino backoffice service failed; retry later.
        summary: List every casino brand provider with its financial providers, without filtering by status.
        x-agent:
            risk: read
            whenNotToUse: Do not use for a plain provider list for filters (use /api/settings/providers/casino, which hides closed ones). Do not use for game providers (use /api/settings/providers/game).
            whenToUse: Operator needs the mapping from casino brand provider to financial provider, or ids of providers that may be closed.
    - target: $.paths['/api/settings/providers/game'].get
      update:
        description: Asks the GameInfo service for providers with the en-US language and drops those whose provider status is Off. Returns BrandProviderId and Name, where Name is the English display name.
        responses:
            "500":
                description: The GameInfo service failed; retry later.
        summary: List the game providers that are not switched off, as id and name.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Do not use for casino brand providers or their financial providers (use /api/settings/providers/casino or /api/settings/providers/casino/all).
            whenToUse: Operator needs game provider ids or names, for example to filter game or bet lists by provider.
    - target: $.paths['/api/sports/bet-limit'].get
      update:
        description: 'Returns one entry per currency: currency, minBet, maxBet, maxBetPerMatch, modifiedBy and modifiedOn (ISO datetime). Takes no parameters and no paging. Needs the ViewSportSetting permission.'
        responses:
            "401":
                description: No valid operator login; authenticate first.
            "403":
                description: Operator lacks the ViewSportSetting permission.
        summary: List the sports bet limits (min bet, max bet, max bet per match) configured for each currency.
        x-agent:
            risk: read
            whenNotToUse: 'Changing a limit: use POST /api/sports/bet-limit/{currency}. Spread/margin or product on/off state: use GET /api/sports/product-setting or GET /api/sports/status. Casino bet limits are a different endpoint (/api/game/bet-limit) and are not covered here.'
            whenToUse: What are the sports betting limits? What is the max bet or max bet per match for a currency? Who last changed a limit and when?
    - target: $.paths['/api/sports/bet-limit/{currency}'].post
      update:
        description: Overwrites all three limits for the given currency in the sports settings and records the calling operator as modifiedBy. All three body fields are required on every call, even to change only one. Takes effect on member sports betting for that currency. Needs the EditSportSetting permission.
        responses:
            "400":
                description: currency is not a valid FiatCurrency number, a body field is missing, or validation failed (minBet <= 0, maxBet <= 0, minBet >= maxBet, maxBetPerMatch <= 0). Fix the values and resend all three fields.
            "401":
                description: No valid operator login; authenticate first.
            "403":
                description: Operator lacks the EditSportSetting permission.
        summary: Set the sports min bet, max bet and max bet per match for one currency.
        x-agent:
            risk: write
            whenNotToUse: 'Just reading limits: use GET /api/sports/bet-limit. Changing spread: use POST /api/sports/spread. Turning sports on/off: use POST /api/sports/status.'
            whenToUse: Raise or lower the sports betting limits for a currency, e.g. 'set the USD max bet to 5000'.
    - target: $.paths['/api/sports/bet-limit/{currency}'].post.parameters[?(@.name=='currency')]
      update:
        description: Path. Currency numeric code (ISO 4217, int32), e.g. 840 = USD, 978 = EUR, 826 = GBP, 392 = JPY, 156 = CNY, 702 = SGD. Must be one of the values in the FiatCurrency enum from the spec. Use the currencies returned by GET /api/sports/bet-limit.
    - target: $.paths['/api/sports/product-setting'].get
      update:
        description: Returns productStatus, totalSpread, modifiedBy and modifiedOn (unix seconds). Takes no parameters. Needs the ViewSportSetting permission.
        responses:
            "401":
                description: No valid operator login; authenticate first.
            "403":
                description: Operator lacks the ViewSportSetting permission.
        summary: 'Show the sports product''s overall setting: status, total spread, and who last changed it.'
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: 'Only the status: GET /api/sports/status is lighter. Bet limits: GET /api/sports/bet-limit. Under-maintenance schedule: GET /api/sports/um-schedule.'
            whenToUse: What is the current sports spread/margin? Is sports on or in maintenance, and who last changed the settings?
    - target: $.paths['/api/sports/spread'].post
      update:
        description: Overwrites the single sports spread value and records the calling operator as modifiedBy. The value applies to the whole sports product, not per currency or per match. Needs the EditSportSetting permission.
        responses:
            "400":
                description: 'Body missing or spread absent or not a number; send {"spread": <number>}.'
            "401":
                description: No valid operator login; authenticate first.
            "403":
                description: Operator lacks the EditSportSetting permission.
        summary: Set the total spread (margin) applied to the sports product.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: 'Reading the current spread: GET /api/sports/product-setting. Bet limits: POST /api/sports/bet-limit/{currency}. Turning sports on/off: POST /api/sports/status.'
            whenToUse: Change the sports spread/margin, e.g. 'set the spread to 0.05'.
    - target: $.paths['/api/sports/status'].get
      update:
        description: Returns a single productStatus value from the sports settings. Takes no parameters. Needs the ViewSportSetting permission.
        responses:
            "401":
                description: No valid operator login; authenticate first.
            "403":
                description: Operator lacks the ViewSportSetting permission.
        summary: Get whether the sports product is currently available to members or under maintenance.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: 'Spread or who changed it: GET /api/sports/product-setting. Scheduled maintenance window: GET /api/sports/um-schedule.'
            whenToUse: Is sports up or down? What is the current sports status?
    - target: $.paths['/api/sports/status'].post
      update:
        description: Overwrites the stored sports product status and records the calling operator as modifiedBy. This can switch sports on or off for members immediately. Needs the ChangeSportsStatus permission, which is separate from EditSportSetting.
        responses:
            "400":
                description: 'Body missing or productStatus not 0, 1 or 2; send {"productStatus": <0|1|2>}.'
            "401":
                description: No valid operator login; authenticate first.
            "403":
                description: Operator lacks the ChangeSportsStatus permission.
        summary: Set the sports product status (e.g. put sports into maintenance or bring it back).
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: 'Planning maintenance for a time window: POST /api/sports/um-schedule. Changing spread or limits: POST /api/sports/spread or POST /api/sports/bet-limit/{currency}.'
            whenToUse: Take sports down for maintenance or bring it back up right now.
    - target: $.paths['/api/sports/um-schedule'].get
      update:
        description: Returns schedule {startTime, plannedEndTime} as unix milliseconds, or null when no window is set, plus modifiedBy and modifiedOn (unix seconds). Takes no parameters. Needs the ViewSportSetting permission.
        responses:
            "401":
                description: No valid operator login; authenticate first.
            "403":
                description: Operator lacks the ViewSportSetting permission.
        summary: Show the planned sports maintenance (UM) window, if one is scheduled.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: 'Current on/off status: GET /api/sports/status. Spread: GET /api/sports/product-setting.'
            whenToUse: When is the next sports maintenance? Is a maintenance window scheduled, and who set it?
    - target: $.paths['/api/sports/um-schedule'].post
      update:
        description: Replaces the stored maintenance schedule with the given start and planned end, or with none when schedule is null, and records the calling operator as modifiedBy. The request sends times as ISO 8601 datetimes with offset, while the GET returns unix milliseconds. Needs the EditSportSetting permission.
        responses:
            "400":
                description: Body is not valid JSON or a datetime is malformed; use ISO 8601 with offset.
            "401":
                description: No valid operator login; authenticate first.
            "403":
                description: Operator lacks the EditSportSetting permission.
        summary: Set or clear the planned sports maintenance window.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: 'Switching sports off or on right now: POST /api/sports/status. Reading the schedule: GET /api/sports/um-schedule.'
            whenToUse: Schedule an upcoming sports maintenance window, or cancel the scheduled one.
    - target: $.paths['/api/telemarketing/lead/{id}'].get
      update:
        description: Returns the lead, the linked customer record if there is one, and its activity log, newest first. The log always ends with a synthetic 'Created' entry built from the lead's creation time. Needs the ViewTelemarketing permission.
        responses:
            "403":
                description: Operator lacks the ViewTelemarketing permission.
            "404":
                description: Lead not found; check the id against GET /api/telemarketing/leads (the error body is 'Lead not found').
        summary: Show one telemarketing lead with its linked customer and full activity history.
        x-agent:
            risk: read
            whenNotToUse: 'Searching or browsing leads by status, type or assignee: use GET /api/telemarketing/leads. Refreshing a lead''s deposit/bet status: use POST /api/telemarketing/lead/{id}/check-status.'
            whenToUse: Operator asks for the details, history, remarks or call log of a specific lead.
    - target: $.paths['/api/telemarketing/lead/{id}'].get.parameters[?(@.name=='id')]
      update:
        description: Lead id (int32), taken from the items returned by GET /api/telemarketing/leads.
    - target: $.paths['/api/telemarketing/lead/{id}/check-status'].post
      update:
        description: Looks up the customer's activity (finding the customer by the lead's phone number if the lead is not linked yet) and writes the last deposit, last bet and conversion result back to the lead. If the lead has no valid phone number or no matching customer exists, it does nothing and still returns success. The lead's customerId can be filled in as a side effect.
        responses:
            "403":
                description: Operator lacks the ManageLeads permission.
            "404":
                description: Lead not found; check the id.
        summary: Refresh a lead's last-deposit, last-bet and conversion status from the customer's real activity.
        x-agent:
            risk: write
            whenNotToUse: 'Recording a call or its outcome: use log-call or log-call-outcome. Manually linking an account: use link-account.'
            whenToUse: Operator wants to know whether a lead has registered, deposited or bet since it was created.
    - target: $.paths['/api/telemarketing/lead/{id}/check-status'].post.parameters[?(@.name=='id')]
      update:
        description: Lead id (int32), from GET /api/telemarketing/leads.
    - target: $.paths['/api/telemarketing/lead/{id}/link-account'].post
      update:
        description: Sets the lead's customer to the given customerId and records an 'AccountLinked' activity with the customer's username as the remark. Only leads of type NewLeads (1) can be linked.
        responses:
            "400":
                description: Lead is not of type NewLeads ('Only New Leads allowed link/unlink account'); use a NewLeads lead.
            "403":
                description: Operator lacks the ManageLeads permission.
            "404":
                description: Lead not found, or customer not found; check id and customerId.
        summary: Link a lead to an existing customer account.
        x-agent:
            risk: write
            whenNotToUse: 'Removing a link: use unlink-account. Leads of type NewSignup or Retention cannot be linked, they already come with a customer.'
            whenToUse: Operator wants to attach a customer account to an uploaded lead.
    - target: $.paths['/api/telemarketing/lead/{id}/link-account'].post.parameters[?(@.name=='id')]
      update:
        description: Lead id (int32), from GET /api/telemarketing/leads.
    - target: $.paths['/api/telemarketing/lead/{id}/log-call'].post
      update:
        description: Sets the lead's last-call time to now, sets the modifier to the calling operator, and adds a 'CallLogged' activity. It does not set an outcome or change the lead status.
        responses:
            "403":
                description: Operator lacks the ManageLeads permission.
            "404":
                description: Lead not found; check the id.
        summary: Record that the operator called this lead now.
        x-agent:
            risk: write
            whenNotToUse: 'Recording how the call went (answered, no answer, rejected, etc.): use log-call-outcome, which also changes the status.'
            whenToUse: Operator says they just called a lead.
    - target: $.paths['/api/telemarketing/lead/{id}/log-call'].post.parameters[?(@.name=='id')]
      update:
        description: Lead id (int32), from GET /api/telemarketing/leads.
    - target: $.paths['/api/telemarketing/lead/{id}/log-call-outcome'].post
      update:
        description: 'Stores the outcome and sets the status: NoAnswer and CallLater give FollowUp, Done gives Converted, InvalidNumber and Reject give Closed. Adds a ''StatusUpdated'' activity and refreshes the cached lead counts.'
        responses:
            "403":
                description: Operator lacks the ManageLeads permission.
            "404":
                description: Lead not found; check the id.
        summary: Record the result of a call and move the lead to the matching status.
        x-agent:
            risk: write
            whenNotToUse: 'Only noting that a call happened, with no result: use log-call. Free-text notes: use remark.'
            whenToUse: Operator reports how a call ended, such as no answer, call back later, wrong number, rejected, or done.
    - target: $.paths['/api/telemarketing/lead/{id}/log-call-outcome'].post.parameters[?(@.name=='id')]
      update:
        description: Lead id (int32), from GET /api/telemarketing/leads.
    - target: $.paths['/api/telemarketing/lead/{id}/remark'].post
      update:
        description: Replaces the lead's remark with the given text and adds a 'RemarkMade' activity. The old remark is overwritten, not appended.
        responses:
            "400":
                description: Body missing or remark missing; send {"remark":"..."}.
            "403":
                description: Operator lacks the ManageLeads permission.
            "404":
                description: Lead not found; check the id.
        summary: Set the free-text remark on a lead.
        x-agent:
            risk: write
            whenNotToUse: 'Recording a call or its result: use log-call or log-call-outcome.'
            whenToUse: Operator wants to add or change a note on a lead.
    - target: $.paths['/api/telemarketing/lead/{id}/remark'].post.parameters[?(@.name=='id')]
      update:
        description: Lead id (int32), from GET /api/telemarketing/leads.
    - target: $.paths['/api/telemarketing/lead/{id}/unlink-account'].post
      update:
        description: Clears the customer link of a NewLeads lead and records an unlink activity with the old username. Only leads of type NewLeads (1) that are currently linked can be unlinked.
        responses:
            "400":
                description: Lead is not of type NewLeads, or the lead has no linked account ('Lead linked not found'); check the lead's type and customerId with GET /api/telemarketing/lead/{id}.
            "403":
                description: Operator lacks the ManageLeads permission.
            "404":
                description: Lead not found; check the id.
        summary: Remove the customer account link from a lead.
        x-agent:
            risk: write
            whenNotToUse: 'Attaching an account: use link-account. NewSignup and Retention leads cannot be unlinked.'
            whenToUse: Operator linked the wrong account, or wants to detach the account from a lead.
    - target: $.paths['/api/telemarketing/lead/{id}/unlink-account'].post.parameters[?(@.name=='id')]
      update:
        description: Lead id (int32), from GET /api/telemarketing/leads.
    - target: $.paths['/api/telemarketing/leads'].get
      update:
        description: Returns a page of leads and the total count. Type is required. A telesales operator, meaning one with ManageLeads but not ManageTelemarketing, only sees leads assigned to themself, whatever Assignee says. The deposit and bet filters are relative day offsets from now, not dates.
        responses:
            "400":
                description: PageSize or PageNumber missing or invalid, or an enum value out of range; send both paging values and valid enum numbers.
            "403":
                description: Operator lacks the ViewTelemarketing permission.
        summary: List telemarketing leads of one type, with filters and paging.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: 'Number of leads per type and status: use GET /api/telemarketing/leads/counts. One lead''s full history: use GET /api/telemarketing/lead/{id}.'
            whenToUse: Operator asks to find, browse or filter leads by type, status, assignee, conversion or phone/name text.
    - target: $.paths['/api/telemarketing/leads'].get.parameters[?(@.name=='Type')]
      update:
        description: 'Required. Lead type: 0 = Unknown, 1 = NewLeads (uploaded lists), 2 = NewSignup (registered, no deposit yet), 3 = Retention.'
    - target: $.paths['/api/telemarketing/leads'].get.parameters[?(@.name=='Status')]
      update:
        description: Optional. 0 = Available, 1 = Pending (assigned), 2 = FollowUp, 3 = Closed, 4 = Converted.
    - target: $.paths['/api/telemarketing/leads'].get.parameters[?(@.name=='Assignee')]
      update:
        description: Optional. Login name (string) of the assigned operator. Ignored for telesales-only operators.
    - target: $.paths['/api/telemarketing/leads'].get.parameters[?(@.name=='Conversion')]
      update:
        description: Optional. 1 = NoConversion, 2 = NewSignup, 3 = InitialDeposit, 4 = ReDeposit.
    - target: $.paths['/api/telemarketing/leads'].get.parameters[?(@.name=='Search')]
      update:
        description: Optional. Free-text search; which lead fields it matches is decided in a stored procedure I did not read.
    - target: $.paths['/api/telemarketing/leads'].get.parameters[?(@.name=='LastDepositGte')]
      update:
        description: Optional. Day offset from now (int), usually negative, e.g. -7 = 7 days ago. Start of the last-deposit window. Only used when LastDepositLt is also sent.
    - target: $.paths['/api/telemarketing/leads'].get.parameters[?(@.name=='LastDepositLt')]
      update:
        description: Optional. Day offset from now (int). End of the last-deposit window. The filter is applied only when this is sent. If LastDepositGte is missing the window has no lower bound.
    - target: $.paths['/api/telemarketing/leads'].get.parameters[?(@.name=='LastBetGte')]
      update:
        description: Optional. Same as LastDepositGte, for the last bet.
    - target: $.paths['/api/telemarketing/leads'].get.parameters[?(@.name=='LastBetLt')]
      update:
        description: Optional. Same as LastDepositLt, for the last bet.
    - target: $.paths['/api/telemarketing/leads'].get.parameters[?(@.name=='PageSize')]
      update:
        description: Required. Items per page (int).
    - target: $.paths['/api/telemarketing/leads'].get.parameters[?(@.name=='PageNumber')]
      update:
        description: Required. Page number, starting at 1.
    - target: $.paths['/api/telemarketing/leads/counts'].get
      update:
        description: Returns, for each of NewLeads, NewSignup and Retention, a total and a count for Available, Pending and FollowUp. Supervisors (ManageTelemarketing) see all leads; other operators see only their assigned leads. The response is cached and the cache is cleared when leads are uploaded, assigned, released, refetched or given an outcome.
        responses:
            "403":
                description: Operator lacks the ViewTelemarketing permission.
        summary: Count leads by type and status for the dashboard tabs.
        x-agent:
            risk: read
            whenNotToUse: 'Lead rows themselves: use GET /api/telemarketing/leads. Call and conversion statistics: use POST /api/telemarketing/performance (not in this set).'
            whenToUse: Operator asks how many leads are available, pending or in follow-up per type.
    - target: $.paths['/api/telemarketing/leads/counts'].get.parameters[?(@.name=='LastDepositGte')]
      update:
        description: Optional. Day offset from now (int), usually negative. Start of the last-deposit window. Only used when LastDepositLt is also sent.
    - target: $.paths['/api/telemarketing/leads/counts'].get.parameters[?(@.name=='LastDepositLt')]
      update:
        description: Optional. Day offset from now (int). End of the window; the filter is applied only when this is sent.
    - target: $.paths['/api/telemarketing/leads/counts'].get.parameters[?(@.name=='LastBetGte')]
      update:
        description: Optional. Same as LastDepositGte, for the last bet.
    - target: $.paths['/api/telemarketing/leads/counts'].get.parameters[?(@.name=='LastBetLt')]
      update:
        description: Optional. Same as LastDepositLt, for the last bet.
    - target: $.paths['/api/telemarketing/leads/operate'].post
      update:
        description: Applies to every lead in leadIds. Assign sets the status to Pending and the assignee to assigneeOperatorId. Release sets the status to Available and clears the assignee. Refreshes the cached lead counts. Needs the ManageTelemarketing permission.
        responses:
            "400":
                description: action is 0 (Assign) and assigneeOperatorId is missing; send it. Also returned for a missing leadIds or a bad action value.
            "403":
                description: Operator lacks the ManageTelemarketing permission.
        summary: Assign leads to one operator, or release them back to the pool.
        x-agent:
            risk: write
            whenNotToUse: 'Spreading many leads evenly across several operators by filter: use POST /api/telemarketing/leads/round-robin.'
            whenToUse: Supervisor wants to hand chosen leads to a telesales operator or take them back.
    - target: $.paths['/api/telemarketing/leads/round-robin'].post
      update:
        description: Picks leads of the given type that match the optional deposit and bet windows and assigns leadsPerTelesales leads to each listed operator in turn. If assigneeOperatorIds is empty or leadsPerTelesales is 0 it does nothing and still returns success. Refreshes the cached lead counts. Needs the ManageTelemarketing permission.
        responses:
            "403":
                description: Operator lacks the ManageTelemarketing permission.
        summary: Spread leads of one type evenly across several telesales operators.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: 'Assigning or releasing specific leads: use POST /api/telemarketing/leads/operate.'
            whenToUse: Supervisor wants to bulk-distribute available leads fairly to a team.
    - target: $.paths['/api/telemarketing/nsu-leads/refetch'].post
      update:
        description: Takes customers registered between 2 days ago and 1 day ago, keeps those with no successful deposit, a mobile phone and not in test mode, and inserts them as NewSignup leads created by 'system'. Takes no parameters, and refreshes the cached lead counts. Needs the ManageTelemarketing permission.
        responses:
            "403":
                description: Operator lacks the ManageTelemarketing permission.
        summary: Import new-signup leads from customers who registered in the last 1 to 2 days and never deposited.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: 'Uploading a phone list from a file: use the preview/upload operations (not in this set). Changing an existing lead''s status: use check-status.'
            whenToUse: Operator or supervisor says new-signup leads are missing and asks to pull them in again.
    - target: $.paths['/api/telemarketing/performance'].post
      update:
        description: Returns one summary block plus paged rows (per operator and lead type) with assigned leads, calls, reached and not-reached rates, conversions, new sign-ups, first and repeat deposits, and deposit amount. startTime and endTime are required. Operators who only have telesales rights (no ManageTelemarketing) always see only their own rows, whatever telesalesIds says.
        responses:
            "401":
                description: Not logged in or token expired; sign in again.
            "403":
                description: Operator lacks the ViewTelemarketing permission; use an operator that has it.
        summary: 'Telemarketing performance report: call, reach, conversion and deposit figures per telesales and lead type.'
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: Not for listing individual leads (use the leads list operation) or lead counts by status (use the leads counts operation). Not for finding telesales ids (use GET /api/telemarketing/telesales). This POST changes nothing.
            whenToUse: How telesales staff are doing over a period; call or conversion rates; deposits attributed to telemarketing; one telesales' results.
    - target: $.paths['/api/telemarketing/preview'].post
      update:
        description: Parses the .xlsx file (columns PhoneNumber, CustomerName, Remark), flags each row as valid, invalid format or duplicate, and returns a fileId with the rows and counts. Nothing is saved to the database, but the parsed result is kept in cache for 1 day so upload can use it. Rows with an empty PhoneNumber are dropped silently.
        responses:
            "400":
                description: Not a .xlsx file, larger than 5 MB, or content is corrupted/unreadable; send a valid .xlsx under 5 MB.
            "401":
                description: Not logged in or token expired; sign in again.
            "403":
                description: Operator lacks the ManageTelemarketing permission.
        summary: Check an Excel file of new telemarketing leads before importing it.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Does not import anything; use POST /api/telemarketing/upload with the returned fileId to import. Not for listing existing leads.
            whenToUse: Operator wants to validate or look at a lead spreadsheet before importing; first step of the lead import.
    - target: $.paths['/api/telemarketing/telesales'].get
      update:
        description: Returns id and loginName of every back-office operator holding the ViewTelemarketing or ManageLeads permission. Takes no parameters and is not paged.
        responses:
            "401":
                description: Not logged in or token expired; sign in again.
            "403":
                description: Operator lacks the ViewTelemarketing permission.
        summary: List the operators who can work telemarketing leads.
        x-agent:
            risk: read
            whenNotToUse: Not for performance numbers (use POST /api/telemarketing/performance) or for leads. Not a general operator list.
            whenToUse: Need telesales operator ids, for example to filter performance, or to pick an assignee for lead assignment.
    - target: $.paths['/api/telemarketing/upload'].post
      update:
        description: Takes the cached preview for fileId and inserts every valid row (not invalid, not duplicate, not in blackList) as a NewLeads lead created by the calling operator. The preview is then deleted, so the same fileId cannot be imported twice. Clears the cached lead counts on success.
        responses:
            "401":
                description: Not logged in or token expired; sign in again.
            "403":
                description: Operator lacks the ManageTelemarketing permission.
            "404":
                description: fileId unknown, expired or already used; run preview again and use the new fileId.
        summary: Import the leads from a previewed Excel file as new telemarketing leads.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for validating a file (use POST /api/telemarketing/preview first). Not for assigning leads to telesales (use the leads operate or round-robin operations). Not for fetching new sign-up leads.
            whenToUse: Operator confirmed the preview and wants to import the leads, optionally leaving out some phone numbers.
    - target: $.paths['/api/transfer/manual'].post
      update:
        description: Applies every entry in transferDetails to the customer's wallet in the given currency, recorded as done by the logged-in operator. It checks that all customers exist and all currencies are enabled before sending anything to accounting. A failure is returned as an error in the BaseResponse body, not necessarily as an HTTP error status.
        responses:
            "400":
                description: 'Validation failed: transferDetails missing, currency missing or unknown, amount has too many decimals for the currency, type is not TransferIn, TransferOut or ClearNegativeBalance, or remark missing. Fix the field named in the error and resend.'
            "401":
                description: No valid operator session. Log in again.
            "403":
                description: The operator lacks the ManualTransfer permission (1007). Ask an administrator to grant it.
        summary: Manually credit, debit, or zero out customer wallet balances in a batch.
        x-agent:
            risk: money
            whenNotToUse: Do not use it to read balances or transaction history. Do not use it for bonuses, which have their own manual bonus operations. Do not use it to approve deposits or withdraws; use the payment approval operations. It cannot be undone, so reverse a mistake with an opposite transfer.
            whenToUse: The operator wants to add money to a customer's wallet (TransferIn), remove money (TransferOut), or clear a negative balance (ClearNegativeBalance), for one customer or many at once.
    - target: $.paths['/api/vip/setting'].get
      update:
        description: 'Returns one entry per currency: the newest stored version, which may be a future-dated pending version and not the one live today. Each entry has id, currency name, activeDate (Unix ms), conversionRate (sports, games, liveCasino, deposit), tiers tier1..tier6 (enabled, renewalPeriod, upgradeMinimumPoint, maintainMinimumPoint, upgradeBonus, displayName, icon) and customBenefits. Takes no parameters and is not paged.'
        responses:
            "401":
                description: Not authenticated; log in and send a valid token.
            "403":
                description: Operator lacks the ViewVipSetting permission.
        summary: List the VIP program configuration (conversion rates, 6 tiers, custom benefits) for every currency.
        x-agent:
            risk: read
            whenNotToUse: Does not return any member's VIP level or points. Does not return the default tier images; use GET /api/vip/setting/defaultImages for that. Does not show past versions.
            whenToUse: Operator asks what the VIP tiers, point thresholds, upgrade bonuses, point conversion rates or custom benefits are for a currency, or wants to read the current settings before editing them.
    - target: $.paths['/api/vip/setting'].put
      update:
        description: Replaces the whole config for each currency in the body by writing a new version that takes effect at 12:00 on the next day in the customer time zone. Sending the same currency again before then overwrites that pending version; earlier versions are kept. Every tier (tier1..tier6) must be sent in full, so read the current settings first and change only what is needed.
        responses:
            "400":
                description: 'Body failed validation: a required field such as settings, currency, conversionRate, tiers, any of tier1..tier6 or displayName.default is missing. Send the complete structure.'
            "401":
                description: Not authenticated.
            "403":
                description: Operator lacks the ManageVipSetting permission.
        summary: Save new VIP settings (conversion rates, tiers, custom benefits) for one or more currencies.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: To only switch a single tier on or off, use PATCH /api/vip/setting/enabled. It does not change any member's VIP level and is not immediate; it takes effect the next day at 12:00.
            whenToUse: Operator wants to change VIP point thresholds, upgrade bonuses, renewal periods, tier names or icons, conversion rates, or the custom benefits list for one or more currencies.
    - target: $.paths['/api/vip/setting/defaultImages'].get
      update:
        description: Returns vip1..vip6, each with a full image URL built from the CDN base path plus the stored default image path. Values come from feature-toggle config (VipDefaultImage) and are empty strings if not configured. Takes no parameters.
        responses:
            "401":
                description: Not authenticated.
            "403":
                description: Operator lacks the ViewVipSetting permission.
        summary: Get the default icon image for each of the six VIP tiers.
        x-agent:
            risk: read
            whenNotToUse: Does not return the icons actually set on each tier; use GET /api/vip/setting for those.
            whenToUse: Operator asks what the default VIP tier images or icons are, or needs a default image path to put into a tier's iconPath.
    - target: $.paths['/api/vip/setting/enabled'].patch
      update:
        description: Flips the tier's enabled flag (on becomes off, off becomes on); it is a toggle, not a set-to-value. It saves a new version of that currency's settings, effective 12:00 the next day in the customer time zone, with all other values copied from the latest version. Tier 1 cannot be toggled.
        responses:
            "400":
                description: currency or tier missing, or tier outside 1-6; fix the body.
            "401":
                description: Not authenticated.
            "403":
                description: Operator lacks the ManageVipSetting permission.
        summary: Switch one VIP tier on or off for a currency.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Do not use to change thresholds, bonuses, names or other tier fields; use PUT /api/vip/setting. Not for changing a member's VIP level.
            whenToUse: Operator wants to enable or disable VIP tier 2 to 6 for a currency.
    - target: $.paths['/api/voucher/activeCampaignAndVouchers'].get
      update:
        description: Returns campaigns that are still active for the customer, each with its details (game or sports restrictions) and the customer's vouchers. The activity rule is inside a stored procedure, so it is not visible in code. Newest campaign first.
        responses:
            "400":
                description: customerId missing or not an integer; send it as an int32 query parameter.
            "403":
                description: Operator lacks the ViewVoucher permission (4001); use an account that has it.
        summary: List a customer's currently active voucher campaigns together with that customer's vouchers in each.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: 'Past, expired, used or cancelled vouchers of a customer: use GET /api/voucher/nonActiveCampaignAndVouchers. All vouchers of one campaign across customers: use GET /api/voucher/campaignAndVouchers. Looking up a customer by username: this call takes only the numeric customerId.'
            whenToUse: An operator asks which vouchers or campaigns a given customer currently has, or what is still usable for them.
    - target: $.paths['/api/voucher/activeCampaignAndVouchers'].get.parameters[?(@.name=='customerId')]
      update:
        description: Numeric customer id (int32). The API has no username lookup here; get the id from a customer search or from POST /api/voucher/checkUsers (CustomerId in the result).
    - target: $.paths['/api/voucher/campaign'].delete
      update:
        description: Cancels every voucher of the campaign that is Sent or Using and not yet expired, then marks the campaign cancelled. For game vouchers it also calls the game provider to cancel them, so this reaches outside the system. Returns lists of cancelled vouchers and of vouchers that could not be cancelled, with a reason for each.
        responses:
            "400":
                description: id missing or not an integer; send it as an int32 query parameter.
            "403":
                description: Operator lacks the CancelVoucher permission (4004).
            "500":
                description: Failure while cancelling, for example the game provider call failed; the body carries an error code and message. Check the campaign state with GET /api/voucher/campaignAndVouchers before retrying.
        summary: Cancel a voucher campaign and all of its still-usable vouchers.
        x-agent:
            needsReview: true
            risk: irreversible
            whenNotToUse: 'Cancelling only some vouchers: use DELETE /api/voucher/vouchers (not part of this list). Changing the campaign name, description or remark: use PATCH /api/voucher/campaign. Just viewing the campaign: use GET /api/voucher/campaign.'
            whenToUse: An operator wants to withdraw a whole campaign, for example it was sent by mistake.
    - target: $.paths['/api/voucher/campaign'].delete.parameters[?(@.name=='id')]
      update:
        description: Campaign id (int32). Get it from GET /api/voucher/campaignSummary, or from the POST /api/voucher/campaign response flow.
    - target: $.paths['/api/voucher/campaign'].get
      update:
        description: Returns the campaign record, its details (game code, providers, sport type, min odds), the display name and description per language and currency, and the stake options. It does not list the vouchers sent to customers.
        responses:
            "400":
                description: id missing or not an integer; send it as an int32 query parameter.
            "403":
                description: Operator lacks the ViewVoucher permission (4001).
            "500":
                description: Campaign not found (error code CampaignNotFound in the body); check the id with GET /api/voucher/campaignSummary.
        summary: 'Get the setup of one voucher campaign: names, description, restrictions and stake options.'
        x-agent:
            risk: read
            whenNotToUse: 'The vouchers and their statuses per user: use GET /api/voucher/campaignAndVouchers. Finding a campaign id: use GET /api/voucher/campaignSummary.'
            whenToUse: An operator wants to see how a campaign is configured, or needs its current values before editing.
    - target: $.paths['/api/voucher/campaign'].get.parameters[?(@.name=='id')]
      update:
        description: Campaign id (int32), from GET /api/voucher/campaignSummary.
    - target: $.paths['/api/voucher/campaign'].patch
      update:
        description: Replaces the per-language display info, the default name and description, the remark and the content id of an existing campaign, and re-links the content. It does not change vouchers, stakes, expiry or the users who received them.
        responses:
            "400":
                description: Body is not valid JSON or a required field (campaignId, contentId, displayInfo) is missing; send all three.
            "403":
                description: Operator lacks the EditVoucherAndTemplate permission (4002).
        summary: Edit a campaign's display name, description, remark and linked content.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: 'Cancelling a campaign: use DELETE /api/voucher/campaign. Changing stake, expiry, product type or recipients: not possible here; create a new campaign with POST /api/voucher/campaign.'
            whenToUse: An operator wants to rename a campaign, change its description or remark, or switch its content page.
    - target: $.paths['/api/voucher/campaign'].post
      update:
        description: Creates the campaign, then issues vouchers to the listed usernames according to the stake options (one voucher per count, matched to each user's currency). Game campaigns also create the vouchers at the game provider. Returns success and failure counts and the failed usernames; if no voucher could be issued the campaign is deleted again.
        responses:
            "400":
                description: Body is not valid JSON or a required field is missing; send all required fields.
            "403":
                description: Operator lacks the SendVoucher permission (4003).
            "500":
                description: Failure outside the per-user handling, for example the content link failed. Check GET /api/voucher/campaignSummary for a half-created campaign before retrying, so you do not send vouchers twice.
        summary: Create a voucher campaign and send vouchers to a list of users.
        x-agent:
            needsReview: true
            risk: money
            whenNotToUse: 'Checking whether the usernames can receive vouchers first: use POST /api/voucher/checkUsers. Changing an existing campaign: use PATCH /api/voucher/campaign.'
            whenToUse: An operator wants to give vouchers (free bets or free rounds) to named users.
    - target: $.paths['/api/voucher/campaignAndVouchers'].get
      update:
        description: Returns the campaign, its details with names resolved (for example game and provider names), and all vouchers with username, stake, quantity and status. A missing campaign returns a body with error code CampaignNotFound and no data.
        responses:
            "400":
                description: id missing or not an integer; send it as an int32 query parameter.
            "403":
                description: Operator lacks the ViewVoucher permission (4001).
        summary: Show one campaign with every voucher issued under it and each voucher's status and owner.
        x-agent:
            risk: read
            whenNotToUse: 'Only the configuration of the campaign: use GET /api/voucher/campaign. Vouchers of one customer across campaigns: use GET /api/voucher/activeCampaignAndVouchers or GET /api/voucher/nonActiveCampaignAndVouchers.'
            whenToUse: An operator wants to see who received a campaign and which vouchers are sent, used, expired or cancelled.
    - target: $.paths['/api/voucher/campaignAndVouchers'].get.parameters[?(@.name=='id')]
      update:
        description: Campaign id (int32), from GET /api/voucher/campaignSummary.
    - target: $.paths['/api/voucher/campaignSummary'].get
      update:
        description: Returns one summary row per campaign, built from a stored procedure and grouped by campaign id. ProductType 0 (All) means no product filter; ExpiredOn is cut to its date part (time ignored).
        responses:
            "400":
                description: ProductType missing or not 0, 1 or 3; send one of those. ExpiredOn not a valid date-time; use ISO 8601.
            "403":
                description: Operator lacks the ViewVoucher permission (4001).
        summary: List voucher campaigns with summary figures, filtered by product type and optionally by expiry date.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: 'Details or vouchers of one campaign: use GET /api/voucher/campaign or GET /api/voucher/campaignAndVouchers. Vouchers of one customer: use the activeCampaignAndVouchers or nonActiveCampaignAndVouchers operations.'
            whenToUse: An operator wants an overview of campaigns, wants to find a campaign id, or wants campaigns expiring on a given day.
    - target: $.paths['/api/voucher/campaignSummary'].get.parameters[?(@.name=='ProductType')]
      update:
        description: Required. 0 = All (no filter), 1 = Sports, 3 = Game. Other numbers are not valid.
    - target: $.paths['/api/voucher/campaignSummary'].get.parameters[?(@.name=='ExpiredOn')]
      update:
        description: Optional date-time, for example 2026-12-31; only the date part is used. Leave out for no expiry filter.
    - target: $.paths['/api/voucher/checkUsers'].post
      update:
        description: 'For each username returns the customer id, currency and a status: 0 = NotExist, 1 = Available, 2 = Unavailable (closed account). Matching ignores case. It changes nothing even though it is a POST.'
        responses:
            "400":
                description: usernames missing or empty; send at least one username.
            "403":
                description: Operator lacks the ViewVoucher permission (4001).
        summary: Check which usernames exist and can receive vouchers, and in which currency.
        x-agent:
            risk: read
            whenNotToUse: 'Sending vouchers: use POST /api/voucher/campaign. Looking at a customer''s vouchers: use the activeCampaignAndVouchers or nonActiveCampaignAndVouchers operations.'
            whenToUse: Before creating a campaign, to validate a pasted list of usernames, or to turn a username into a customerId.
    - target: $.paths['/api/voucher/game/games'].get
      update:
        description: Returns games of the given brand provider and integration provider that are Normal or Suspend. For Funky and Jili integrations it also keeps only games the provider reports as voucher-capable. Names are in English.
        responses:
            "400":
                description: A parameter is missing or not an integer; send both.
            "403":
                description: Operator lacks the ViewVoucher permission (4001).
            "500":
                description: The game info service or the provider call failed, or the ids do not match a provider; check them against GET /api/voucher/game/providers.
        summary: List the games of a provider that can be given as game vouchers.
        x-agent:
            risk: read
            whenNotToUse: 'Choosing the provider: use GET /api/voucher/game/providers. Choosing stakes for a game: use GET /api/voucher/game/stakeOptions.'
            whenToUse: Choosing the game for a game voucher campaign.
    - target: $.paths['/api/voucher/game/games'].get.parameters[?(@.name=='brandProviderId')]
      update:
        description: Brand provider id (int32), from GET /api/voucher/game/providers.
    - target: $.paths['/api/voucher/game/games'].get.parameters[?(@.name=='integrationProviderId')]
      update:
        description: Integration provider id (int32), from GET /api/voucher/game/providers.
    - target: $.paths['/api/voucher/game/providers'].get
      update:
        description: Returns providers whose status is Normal or Suspend and that support vouchers, with their brand and integration provider ids. English names. Takes no parameters.
        responses:
            "403":
                description: Operator lacks the ViewVoucher permission (4001).
            "500":
                description: The game info service failed; retry later.
        summary: List the game providers that support vouchers.
        x-agent:
            risk: read
            whenNotToUse: 'Games of a provider: use GET /api/voucher/game/games. Stake options: use GET /api/voucher/game/stakeOptions.'
            whenToUse: First step of a game voucher campaign, to find brandProviderId and integrationProviderId.
    - target: $.paths['/api/voucher/game/stakeOptions'].get
      update:
        description: Asks the game provider for the stake options of one game, for all enabled currencies, and returns the list. Returns an empty list if the provider has none for that game.
        responses:
            "400":
                description: A parameter is missing or not an integer; send both.
            "403":
                description: Operator lacks the ViewVoucher permission (4001).
            "500":
                description: The provider or game info call failed, or the ids do not match a game; check them against the games and providers operations.
        summary: List the stake options a game offers for game vouchers, with supported currencies.
        x-agent:
            risk: read
            whenNotToUse: 'Listing games: use GET /api/voucher/game/games. Stakes of a sports campaign: they are free-form and not looked up here.'
            whenToUse: Filling voucherStakeOptions when creating a game voucher campaign.
    - target: $.paths['/api/voucher/game/stakeOptions'].get.parameters[?(@.name=='integrationProviderId')]
      update:
        description: Integration provider id (int32), from GET /api/voucher/game/providers.
    - target: $.paths['/api/voucher/game/stakeOptions'].get.parameters[?(@.name=='gameCode')]
      update:
        description: Game code (int32), from GET /api/voucher/game/games.
    - target: $.paths['/api/voucher/nonActiveCampaignAndVouchers'].get
      update:
        description: Returns campaigns and the customer's vouchers that are no longer active, filtered by a date range, an optional campaign name and a voucher status. Newest first. StartDate and EndDate are both required, and the time zone offset on them is dropped.
        responses:
            "400":
                description: customerId, startDate, endDate or voucherStatus missing, or a date is not a valid date-time; send all four required ones.
            "403":
                description: Operator lacks the ViewVoucher permission (4001).
        summary: Search a customer's past voucher campaigns (used, expired, cancelled) within a date range.
        x-agent:
            needsReview: true
            risk: read
            whenNotToUse: 'Vouchers the customer can still use: use GET /api/voucher/activeCampaignAndVouchers. All vouchers in one campaign: use GET /api/voucher/campaignAndVouchers.'
            whenToUse: 'An operator wants the voucher history of a customer: used, expired or cancelled vouchers.'
    - target: $.paths['/api/voucher/nonActiveCampaignAndVouchers'].get.parameters[?(@.name=='customerId')]
      update:
        description: Numeric customer id (int32); get it from POST /api/voucher/checkUsers.
    - target: $.paths['/api/voucher/nonActiveCampaignAndVouchers'].get.parameters[?(@.name=='startDate')]
      update:
        description: Start of the range, ISO 8601 date-time, for example 2026-01-01T00:00:00. Required. Offset is ignored, only the clock time is used.
    - target: $.paths['/api/voucher/nonActiveCampaignAndVouchers'].get.parameters[?(@.name=='endDate')]
      update:
        description: End of the range, ISO 8601 date-time. Required. Offset is ignored.
    - target: $.paths['/api/voucher/nonActiveCampaignAndVouchers'].get.parameters[?(@.name=='campaignName')]
      update:
        description: Optional text to filter campaigns by name; leave out for all. Whether it is exact or partial match is decided in the database.
    - target: $.paths['/api/voucher/nonActiveCampaignAndVouchers'].get.parameters[?(@.name=='voucherStatus')]
      update:
        description: 'Required string. Voucher status name, not case sensitive: Unavailable (0), Sent (1), Using (2), Used (3) or Canceled (4). A number as text also parses. A value that does not parse is treated as no status filter.'
    - target: $.paths['/api/voucher/template'].delete
      update:
        description: Calls a stored procedure that deletes the template with the given id, and returns only a success flag. The name differs from the separate hard-delete procedure, so it is probably a soft delete, but this was not verified. The code does not check that the id exists, so an unknown id may still return success.
        responses:
            "401":
                description: Missing or invalid operator login; authenticate first.
            "403":
                description: Operator lacks the DeleteTemplate permission (4006); use an operator with that permission.
        summary: Delete a voucher template so it is no longer offered for new campaigns.
        x-agent:
            needsReview: true
            risk: irreversible
            whenNotToUse: Does not cancel vouchers or campaigns already sent to members; use DELETE /api/voucher/vouchers for vouchers. Does not edit a template; use PATCH /api/voucher/template.
            whenToUse: The operator wants to remove or retire a voucher template.
    - target: $.paths['/api/voucher/template'].delete.parameters[?(@.name=='id')]
      update:
        description: Template id (int32, greater than 0), from the 'id' field of each item returned by GET /api/voucher/templates.
    - target: $.paths['/api/voucher/template'].patch
      update:
        description: Overwrites the template identified by id with the supplied display info, sports rules (sport type and minimum odds), stake options and content link. The operator's login name is recorded as the modifier. After saving, it re-links the template to the given contentId in the content service.
        responses:
            "400":
                description: Body is missing or has missing required fields; resend the full body.
            "401":
                description: Missing or invalid operator login; authenticate first.
            "403":
                description: Operator lacks the EditVoucherAndTemplate permission (4002).
        summary: 'Edit an existing voucher template: name and description, minimum odds, sport, stake options and linked content.'
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Does not create a template; use POST /api/voucher/template. Does not change vouchers or campaigns already sent. To change a campaign, use PATCH /api/voucher/campaign.
            whenToUse: The operator wants to change an existing template's name, description, minimum odds, sport type, stake options or content.
    - target: $.paths['/api/voucher/template'].post
      update:
        description: Creates a template with status Using, saves its sports rules, stake options and localized display info, then links it to the given contentId in the content service. The operator's login name is recorded as creator. It returns only a success flag and not the new template id, so call GET /api/voucher/templates to find it.
        responses:
            "400":
                description: Body is missing or has missing required fields; resend the full body.
            "401":
                description: Missing or invalid operator login; authenticate first.
            "403":
                description: Operator lacks the AddTemplate permission (4005).
        summary: Create a new reusable voucher template (sports free-bet rules and stake options).
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Does not send vouchers to members; use POST /api/voucher/campaign. Does not modify an existing template; use PATCH /api/voucher/template.
            whenToUse: The operator wants to define a new voucher template that campaigns can later use.
    - target: $.paths['/api/voucher/templates'].get
      update:
        description: Returns every template that is valid and has status Using, with id, product type, created and modified metadata, sports rules (sport type, minimum odds), stake options, display info and content id. Deleted or unusable templates are left out. It takes no parameters and has no paging.
        responses:
            "401":
                description: Missing or invalid operator login; authenticate first.
            "403":
                description: Operator lacks the ViewVoucher permission (4001).
        summary: List the voucher templates that are currently usable.
        x-agent:
            risk: read
            whenNotToUse: Does not list campaigns or vouchers sent to members; use GET /api/voucher/campaignSummary or GET /api/voucher/campaignAndVouchers.
            whenToUse: The operator wants to see available voucher templates, or needs a template id for editing or deleting.
    - target: $.paths['/api/voucher/vouchers'].delete
      update:
        description: 'Cancels only vouchers that are in status Sent (1) or Using (2) and have not expired. Game vouchers are also cancelled at the game provider, an external call. A campaign whose vouchers are all cancelled, so none remain Sent, Using or Used, is cancelled too. The request still succeeds when some vouchers fail: read cancelledVouchers and cancelFailedVouchers in the response.'
        responses:
            "400":
                description: voucherIds is missing from the body; send it.
            "401":
                description: Missing or invalid operator login; authenticate first.
            "403":
                description: Operator lacks the CancelVoucher permission (4004).
        summary: Cancel specific vouchers that were sent to members.
        x-agent:
            needsReview: true
            risk: irreversible
            whenNotToUse: To cancel a whole campaign and all its vouchers, use DELETE /api/voucher/campaign. Does not delete templates; use DELETE /api/voucher/template.
            whenToUse: The operator wants to cancel one or more individual vouchers by id.
    - target: $.paths['/health'].get
      update:
        description: Returns the plain text "ok" with HTTP 200 and takes no parameters. It does not query the database, Redis or Kafka, so it only shows the process is alive, not that its dependencies work. It needs no login, and request logging is skipped for this path.
        responses:
            "502":
                description: A gateway or proxy in front of the service got no answer, so the service is down or restarting; retry later.
            "503":
                description: The service is starting up or overloaded; retry later.
        summary: Checks whether the Backoffice back-office service is up and answering requests.
        x-agent:
            risk: read
            whenNotToUse: Does not answer questions about the health of the database, payment providers, Kafka or other services, or about any business data. It also does not check the Vega member API, Altair, Spica (which uses /healthz) or Venus.
            whenToUse: The operator asks whether the back-office API is up, reachable or alive, or the agent wants to check connectivity before running other calls.
    - target: $.paths['/mgmt/internal/report/company'].get
      update:
        description: Splits the range by calendar month, pulls casino, game, sports, payment, promotion and third-party figures, and sums them per customer currency. Amounts are converted with each month's exchange rate. Test accounts are excluded except in UAT. It calls several downstream services, so a wide range is slow.
        responses:
            "400":
                description: startDate or endDate is missing or not a valid date-time; send both in ISO 8601.
            "500":
                description: A downstream report source failed after one retry; retry later or narrow the range.
        summary: Company-wide performance report for a date range, one row per currency plus a Total row.
        x-agent:
            risk: read
            whenNotToUse: Not for the monthly merchant Excel report (use POST /mgmt/internal/report/merchant/download). Not for per-customer detail. Not for comparing legacy and ClickHouse bet summaries (use GET /mgmt/internal/report/company/bet-summary-differences).
            whenToUse: 'Operator asks for company totals in a period: deposits, withdrawals, depositors, active players, bet count, turnover, company win/lost, margin, bonus, rebate, by currency.'
    - target: $.paths['/mgmt/internal/report/company'].get.parameters[?(@.name=='startDate')]
      update:
        description: Start of the range, ISO 8601 date-time with offset, e.g. 2026-09-01T00:00:00+08:00. The offset is used to cut month boundaries.
    - target: $.paths['/mgmt/internal/report/company'].get.parameters[?(@.name=='endDate')]
      update:
        description: End of the range, ISO 8601 date-time with offset. Must be after startDate.
    - target: $.paths['/mgmt/internal/report/company/bet-summary-differences'].get
      update:
        description: Runs both bet-summary sources over the range and returns only customers and products (Game, Sports) where bet count, turnover or player win/lost differ. An empty list means the sources match. It exists to validate ClickHouse before the feature toggle is switched on.
        responses:
            "400":
                description: startDate or endDate is missing or not a valid date-time; send both.
            "404":
                description: Route exists only in Development and Production environments (where ClickHouse exists); not available in staging or UAT.
            "500":
                description: One of the sources failed; retry or narrow the range.
        summary: Lists customers whose game or sports bet figures differ between the legacy source and ClickHouse.
        x-agent:
            risk: read
            whenNotToUse: Not for business reporting (use GET /mgmt/internal/report/company). Casino and payment figures are not compared.
            whenToUse: Operator or engineer wants to check that ClickHouse bet summaries match the legacy ones for a period.
    - target: $.paths['/mgmt/internal/report/company/bet-summary-differences'].get.parameters[?(@.name=='startDate')]
      update:
        description: Start of the range, ISO 8601 date-time with offset.
    - target: $.paths['/mgmt/internal/report/company/bet-summary-differences'].get.parameters[?(@.name=='endDate')]
      update:
        description: End of the range, ISO 8601 date-time with offset.
    - target: $.paths['/mgmt/internal/report/merchant/download'].post
      update:
        description: 'Builds the merchant report for one calendar month (per currency: bets by Sport/Games/LiveCasino, promotion costs, voucher cost, payment providers with deposit, withdraw and fees) and streams an .xlsx file. Nothing is emailed or stored. File name is [STG_|UAT_]MerchantReport_{year}_{month:D2}.xlsx.'
        responses:
            "400":
                description: Body missing, a field missing, or timezone not in TimeSpan format ("hh:mm:ss"); resend all three fields.
            "500":
                description: No data for that month ("No reports found"), invalid month/year, or a downstream failure; check the month and retry.
        summary: Generate the monthly merchant report and return it as an Excel file.
        x-agent:
            risk: read
            whenNotToUse: Not for emailing it to the configured recipients (use POST /mgmt/internal/report/merchant/send). Not for company totals as JSON (use GET /mgmt/internal/report/company).
            whenToUse: Operator wants to get or preview the merchant report file for a month.
    - target: $.paths['/mgmt/internal/report/merchant/send'].post
      update:
        description: Builds the same merchant report as the download operation and emails the Excel file to the recipients set in the feature MerchantReportEmailRecipients, with BCC from MerchantReportBCCers. If no recipients are configured it only logs and still returns success.
        responses:
            "400":
                description: Body missing, a field missing, or timezone not in TimeSpan format ("hh:mm:ss"); resend all three fields.
            "500":
                description: No data for that month, invalid month/year, or a downstream or email failure; check the inputs before retrying, since a retry may send a duplicate email if the failure came after sending.
        summary: Generate the monthly merchant report and email it to the configured recipients.
        x-agent:
            risk: irreversible
            whenNotToUse: Not for just viewing or saving the file (use POST /mgmt/internal/report/merchant/download, which sends nothing).
            whenToUse: Operator asks to send or resend the merchant report for a month to the usual recipients.
    - target: $.paths['/mgmt/internal/telemarketing/nsu-leads/fetch'].post
      update:
        description: Finds customers registered within dateRange, drops those with a successful deposit, no mobile phone, or test-mode accounts, then bulk-inserts the rest as NewSignup telemarketing leads created by 'system'. Returns only a success flag, not the leads or a count. Writes to the lead table, and the range is not capped in the code, so a wide range scans many customers.
        responses:
            "400":
                description: Body or dateRange is missing, or a date is malformed; send dateRange with valid StartTime and EndTime.
            "500":
                description: Database failure while reading customers or inserting leads. This also covers a duplicate-lead conflict if the stored procedure does not skip existing leads; check the date range and retry.
        summary: Create telemarketing leads for new sign-ups in a date range who have never made a successful deposit.
        x-agent:
            needsReview: true
            risk: write
            whenNotToUse: Not for listing or viewing leads; use the telemarketing leads list operation. Not for the operator-facing refetch of the last two days; use POST /api/telemarketing/nsu-leads/refetch, which needs no body, needs the ManageTelemarketing permission and clears the lead-count cache. Not for uploading leads from a file; use the telemarketing upload operation.
            whenToUse: Backfill or re-run the new-sign-up (NSU) lead import for a specific time window. The Spica scheduler also calls it with a window of yesterday-and-the-day-before.
